<!--
THESIS: Fleet work is a service hub first and a ledger second; every operational task is visible before a vehicle is opened.
STORY: Operators scan live risk counts, enter one service, update its record, then return to a fleet whose alerts already reflect the change.
FIRST VIEWPORT: Six service cards with live counts lead directly into the grouped fleet ledger; Vehicles is visibly positioned after Employees.
FORM: Standalone bilingual interaction mockup using the established GSSG cream, navy, paper, mono-data, and restrained semantic-state vocabulary.
FINISH: Desktop and mobile surfaces are keyboard reachable, every visible label has Arabic and English copy, and all records are fabricated.
-->

function detailHeader(v){const T=t(),needs=statusFor(v.expiry)!=='valid';return `<header class="page-head"><div><button class="btn subtle" type="button" data-back-hub><span class="back-icon">→</span>${T.backHub}</button><h2>${T.vehicleDetail} · <span class="mono">${esc(v.plate)}</span></h2><p>${T.detailDesc}</p></div><div class="head-actions"><button class="btn ${needs?'primary':''}" type="button" data-renew="${v.id}">${T.renew}</button><button class="btn" type="button" data-dialog="addFine">${T.addFine}</button><button class="btn primary" type="button" data-generate>${T.generateDocument}</button></div></header>`}
function overview(v){const T=t();return `<section class="panel detail-overview"><div class="photo-hero"><img src="${v.photo}" alt="${T.mainPhoto}"><button type="button" data-photo="main" aria-label="${T.mainPhoto}"></button><span class="photo-hero-label">${T.mainPhoto}</span></div><div class="info-grid">${infoItem(T.plate,v.plate,true)}${infoItem(T.type,local(v.type))}${infoItem(T.class,local(v.class))}${infoItem(T.trafficCode,v.traffic,true)}${infoItem(T.licenseStart,v.start,true)}${infoItem(T.licenseExpiry,v.expiry,true)}${infoItem(T.vin,v.vin,true)}${infoItem(T.site,siteById(v.site)[state.lang])}${infoItem(T.contractNote,local(v.contract))}</div></section>`}
function detailTabs(v){const T=t(),tabs=[['fines',T.tabFines,v.fines.length],['renewals',T.tabRenewals,v.licenseHistory.length],['accidents',T.tabAccidents,v.accidents.length],['maintenance',T.tabMaintenance,v.maintenance.length],['photos',T.tabPhotos,v.gallery.length+1]];return `<nav class="detail-tabs">${tabs.map(([id,label,count])=>`<button type="button" data-tab="${id}" aria-pressed="${state.tab===id}">${label} · ${count}</button>`).join('')}</nav>`}
function desktopFineRows(v){const T=t();return v.fines.map((f,i)=>{const e=getEmployee(f.employee);return `<tr><td class="seq">${i+1}</td><td>${esc(e[state.lang])}</td><td class="mono">${e.g}</td><td class="mono">${f.date}</td><td class="mono">${money(f.amount)} ${T.aed}</td><td class="mono">${f.points}</td><td><button class="btn danger icon-only" type="button" data-delete-fine="${f.id}" aria-label="${T.delete}">×</button></td></tr>`}).join('')}
function finesTab(v){const T=t();return `<section class="panel"><header class="panel-head"><div><h3>${T.tabFines}</h3><small>${v.fines.length} ${fineCountLabel(v.fines.length)} · ${money(totals(v).amount)} ${T.aed}</small></div><div class="action-row"><button class="btn" type="button" data-dialog="addFine">${T.addFine}</button><button class="btn primary" type="button" data-generate>${T.generateDocument}</button></div></header>${v.fines.length?`<div class="table-wrap desktop-only"><table><thead><tr><th>${T.sequence}</th><th>${T.employee}</th><th>${T.gNumber}</th><th>${T.date}</th><th>${T.amount}</th><th>${T.blackPoints}</th><th>${T.action}</th></tr></thead><tbody>${desktopFineRows(v)}</tbody></table></div><div class="record-cards mobile-only">${v.fines.map((f,i)=>{const e=getEmployee(f.employee);return `<article class="record-card"><div class="record-card-head"><div><h3>${i+1}. ${esc(e[state.lang])}</h3><p class="mono">${e.g}</p></div><button class="btn danger icon-only" type="button" data-delete-fine="${f.id}">×</button></div><div class="card-facts"><div class="fact"><span>${T.date}</span><strong class="mono">${f.date}</strong></div><div class="fact"><span>${T.amount}</span><strong>${money(f.amount)} ${T.aed}</strong></div></div></article>`}).join('')}</div>`:`<div class="empty">${T.noFines}</div>`}</section>`}
function renewalsTab(v){const T=t();return `<section class="panel"><header class="panel-head"><div><h3>${T.currentLicense}</h3><small class="mono">${v.start} — ${v.expiry}</small></div><div class="action-row">${statusBadge(v)}<button class="btn primary" type="button" data-renew="${v.id}">${T.renew}</button></div></header><div class="detail-overview"><div class="photo-hero"><img src="${v.thumb}" alt="${T.licenseScan}"></div><div class="info-grid">${infoItem(T.licenseStart,v.start,true)}${infoItem(T.licenseExpiry,v.expiry,true)}${infoItem(T.status,T[statusFor(v.expiry)])}</div></div></section><section class="panel"><header class="panel-head"><h3>${T.renewalHistory}</h3><small>${v.licenseHistory.length}</small></header>${v.licenseHistory.length?`<div class="timeline">${[...v.licenseHistory].reverse().map(h=>`<article class="timeline-item"><span class="timeline-dot"></span><div><h4 class="mono">${h.start} — ${h.expiry}</h4><p>${T.renewedOn}: <span class="mono">${h.renewedOn}</span> · ${T.cost}: ${money(h.cost)} ${T.aed}</p></div><img class="thumb" src="${h.scan||LICENSE_THUMB}" alt="${T.licenseScan}"></article>`).join('')}</div>`:`<div class="empty">${T.noRenewals}</div>`}</section>`}
function accidentCard(v,a){const T=t(),e=getEmployee(a.employee);return `<article class="record-card"><div class="record-card-head"><div><h3><span class="plate">${v.plate}</span> · ${esc(local(v.type))}</h3><p><span class="mono">${a.date} ${a.time}</span> · ${esc(e[state.lang])}</p></div><button class="badge ${a.status}" type="button" data-toggle-accident="${v.id}|${a.id}">${a.status==='open'?T.openStatus:T.closedStatus}</button></div><div class="card-facts"><div class="fact"><span>${T.location}</span><strong>${esc(local(a.location))}</strong></div><div class="fact"><span>${T.policeRef}</span><strong class="mono">${esc(a.policeRef)}</strong></div><div class="fact"><span>${T.damageCost}</span><strong>${money(a.cost)} ${T.aed}</strong></div><div class="fact"><span>${T.description}</span><strong>${esc(local(a.desc))}</strong></div></div><div class="photo-strip">${a.photos.map(p=>`<img src="${p}" alt="${T.photosLabel}">`).join('')}</div><div class="card-footer"><button class="btn small" type="button" data-open-accident-vehicle="${v.id}">${T.open}</button><button class="btn small primary" type="button" data-accident-letter="${v.id}|${a.id}">${T.officialLetter}</button></div></article>`}
function accidentsTab(v){const T=t();return `<section class="panel"><header class="panel-head"><div><h3>${T.tabAccidents}</h3><small>${v.accidents.length} ${T.records}</small></div><button class="btn primary" type="button" data-add-accident="${v.id}">${T.newReport}</button></header><div class="record-cards" style="padding:12px">${v.accidents.length?v.accidents.map(a=>accidentCard(v,a)).join(''):`<div class="empty">${T.noAccidents}</div>`}</div></section>`}
function maintenanceBadge(date){const s=dueState(date);return s?`<span class="badge ${s}">${t()[s]}</span>`:'—'}function maintenanceRow(v,m){const T=t();return `<tr><td><span class="plate">${v.plate}</span></td><td class="mono">${m.date}</td><td>${T[m.type]}</td><td class="mono">${money(m.odometer)} ${T.km}</td><td>${money(m.cost)} ${T.aed}</td><td>${esc(local(m.vendor))}</td><td><span class="mono">${m.nextDue||'—'}</span> ${maintenanceBadge(m.nextDue)}</td><td><img class="thumb" src="${m.receipt}" alt="${T.receipt}"></td></tr>`}
function maintenanceCard(v,m){const T=t();return `<article class="record-card"><div class="record-card-head"><div><h3><span class="plate">${v.plate}</span> · ${T[m.type]}</h3><p class="mono">${m.date}</p></div>${maintenanceBadge(m.nextDue)}</div><div class="card-facts"><div class="fact"><span>${T.odometer}</span><strong>${money(m.odometer)} ${T.km}</strong></div><div class="fact"><span>${T.cost}</span><strong>${money(m.cost)} ${T.aed}</strong></div><div class="fact"><span>${T.garage}</span><strong>${esc(local(m.vendor))}</strong></div><div class="fact"><span>${T.nextDue}</span><strong class="mono">${m.nextDue||'—'}</strong></div></div></article>`}
function maintenanceTab(v){const T=t();return `<section class="panel"><header class="panel-head"><div><h3>${T.tabMaintenance}</h3><small>${v.maintenance.length} ${T.records}</small></div><button class="btn primary" type="button" data-add-maintenance="${v.id}">${T.addMaintenance}</button></header>${v.maintenance.length?`<div class="table-wrap desktop-only"><table><thead><tr><th>${T.plate}</th><th>${T.date}</th><th>${T.maintenanceType}</th><th>${T.odometer}</th><th>${T.cost}</th><th>${T.garage}</th><th>${T.nextDue}</th><th>${T.receipt}</th></tr></thead><tbody>${v.maintenance.map(m=>maintenanceRow(v,m)).join('')}</tbody></table></div><div class="record-cards mobile-only">${v.maintenance.map(m=>maintenanceCard(v,m)).join('')}</div>`:`<div class="empty">${T.noMaintenance}</div>`}</section>`}
function photosTab(v){const T=t(),photos=[{id:'main',label:{ar:'الصورة الرئيسية',en:'Main photo'},thumb:v.photo},...v.gallery];return `<section class="panel"><header class="panel-head"><h3>${T.gallery}</h3><small>${photos.length}</small></header><div class="photos-grid">${photos.map((p,i)=>`<button class="photo-tile" type="button" data-photo="${i}"><img src="${p.thumb}" alt="${esc(local(p.label))}"><span>${esc(local(p.label))}</span></button>`).join('')}<label class="photo-tile upload"><strong>＋ ${T.addPhoto}</strong><input id="gallery-upload" type="file" accept="image/*"></label></div></section>`}
function detailView(){const v=selectedVehicle(),body=state.tab==='fines'?finesTab(v):state.tab==='renewals'?renewalsTab(v):state.tab==='accidents'?accidentsTab(v):state.tab==='maintenance'?maintenanceTab(v):photosTab(v);return `${navStrip()}${detailHeader(v)}${overview(v)}${detailTabs(v)}${body}`}
function selectionData(){const v=selectedVehicle(),fines=v.fines.filter(f=>state.selectedFineIds.has(f.id));return {fines,total:fines.reduce((s,f)=>s+f.amount,0)}}
function anonymousSwitch(key='hideNames'){const T=t(),on=state[key];return `<div class="switch-row"><span class="switch-copy"><strong>${T.hideNames}</strong><small>${T.hideNamesHint}</small></span><button class="switch-control" type="button" data-toggle-anonymous="${key}" aria-pressed="${on}" aria-label="${T.hideNames}"></button></div>`}
function fineChecklist(){const T=t(),v=selectedVehicle(),sel=selectionData();return `<section class="panel"><header class="panel-head"><h3>${T.selectedFines}</h3><small>${v.fines.length} ${fineCountLabel(v.fines.length)}</small></header><div style="padding:10px">${anonymousSwitch()}</div><div class="checklist">${v.fines.length?v.fines.map(f=>{const e=getEmployee(f.employee);return `<label class="check-row"><input type="checkbox" data-fine-check="${f.id}" ${state.selectedFineIds.has(f.id)?'checked':''}><span><strong>${esc(e[state.lang])}</strong><small>${f.date} · ${e.g} · ${f.points} ${T.points}</small></span><span class="check-amount">${money(f.amount)} ${T.aed}</span></label>`}).join(''):`<div class="empty">${T.noFines}</div>`}</div><footer class="selection-summary"><span>${T.selectedSummary(sel.fines.length,money(sel.total))}</span><strong>${money(sel.total)} ${T.aed}</strong></footer></section>`}
function paperHeader(ref){const T=t();return `<header class="paper-company"><img src="gssg-logo.png" alt="GSSG"><div><strong>${T.company}</strong><small>${T.companySub}</small></div><span class="mono">GSSG</span></header><div class="paper-meta"><div><p>${T.reference}: <strong class="mono">${ref}</strong></p></div><div class="dates"><p>${T.gregorian}: <strong class="mono">01/09/2026</strong></p><p>${T.hijri}: <strong>${state.lang==='ar'?'19 ربيع الأول، 1448 هـ':"19 Rabi al-Awwal 1448 AH"}</strong></p></div></div>`}
function paperPreview(){const T=t(),v=selectedVehicle(),sel=selectionData(),cols=state.hideNames?4:6;return `<section class="panel"><header class="panel-head"><h3>${T.paperPreview}</h3><small class="mono">VF-0231</small></header><div class="paper-shell"><article class="paper">${paperHeader('VF-0231')}<h2>${T.documentTitle}</h2><div class="plate-box"><span>${T.plate}</span><strong>${esc(v.plate)}</strong></div>${state.hideNames?`<p class="paper-note">${T.anonymousNote}</p>`:''}<table><thead><tr><th>${T.sequence}</th>${state.hideNames?'':`<th>${T.employee}</th><th>${T.gNumber}</th>`}<th>${T.date}</th><th>${T.amount}</th><th>${T.blackPoints}</th></tr></thead><tbody>${sel.fines.length?sel.fines.map((f,i)=>{const e=getEmployee(f.employee);return `<tr><td>${i+1}</td>${state.hideNames?'':`<td>${esc(e[state.lang])}</td><td class="mono">${e.g}</td>`}<td class="mono">${f.date}</td><td>${money(f.amount)} ${T.aed}</td><td>${f.points}</td></tr>`}).join(''):`<tr><td colspan="${cols}">${T.noSelected}</td></tr>`}</tbody></table><footer class="paper-footer"><span class="mono">www.gssg.app</span><span class="submitter">${T.loggedSubmitter}<small> — ${T.loggedHint}</small><strong>G7186</strong></span></footer></article></div></section>`}
function generateView(){const T=t();return `${navStrip()}<header class="page-head"><div><button class="btn subtle" type="button" data-back-detail><span class="back-icon">→</span>${T.vehicleDetail}</button><h2>${T.generateTitle}</h2><p>${T.generateDesc}</p></div></header><div class="wizard-head"><span class="step ${state.documentStep===1?'active':''}"><b>1</b>${T.stepSelect}</span><span class="step-line"></span><span class="step ${state.documentStep===2?'active':''}"><b>2</b>${T.stepPreview}</span></div>${state.documentStep===1?`${fineChecklist()}<div class="generate-actions"><span></span><button class="btn primary" type="button" data-doc-step="2">${T.previewDocument}</button></div>`:`<div class="generate-layout">${fineChecklist()}${paperPreview()}</div><div class="generate-actions"><button class="btn" type="button" data-doc-step="1">${T.previous}</button><button class="btn primary" type="button" data-save-document>${T.saveDocument}</button></div>`}`}
function reportRows(){const from=state.reportFrom,to=state.reportTo;return vehicles.map(v=>({v,fines:v.fines.filter(f=>(state.reportSite==='all'||v.site===state.reportSite)&&(!from||f.date>=from)&&(!to||f.date<=to))})).filter(x=>x.fines.length)}
function finesReportView(){const T=t(),groups=reportRows(),grand=groups.reduce((s,g)=>s+g.fines.reduce((x,f)=>x+f.amount,0),0),count=groups.reduce((s,g)=>s+g.fines.length,0),cols=state.reportHideNames?4:6,mobileCards=groups.map(g=>{const subtotal=g.fines.reduce((s,f)=>s+f.amount,0);return `<article class="record-card"><div class="record-card-head"><div><h3><span class="plate">${esc(g.v.plate)}</span> · ${esc(local(g.v.type))}</h3><p>${esc(siteById(g.v.site)[state.lang])}</p></div><strong class="mono">${money(subtotal)} ${T.aed}</strong></div>${state.reportHideNames?`<p class="paper-note">${T.anonymousNote}</p>`:''}<div class="record-cards">${g.fines.map((f,index)=>{const e=getEmployee(f.employee);return `<div class="fine-summary" style="padding:8px;border-block-end:1px solid var(--hairline)"><strong>${index+1}. ${f.date} · ${money(f.amount)} ${T.aed} · ${f.points} ${T.points}</strong>${state.reportHideNames?'':`<small>${esc(e[state.lang])} · ${e.g}</small>`}</div>`}).join('')}</div></article>`}).join('');return `${navStrip()}<header class="page-head"><div><button class="btn subtle" type="button" data-back-hub><span class="back-icon">→</span>${T.backHub}</button><h2>${T.finesReport}</h2><p>${T.finesReportDesc}</p></div><div class="head-actions"><button class="btn" type="button" data-print>${T.print}</button><button class="btn primary" type="button" data-print>${T.savePdf}</button></div></header><section class="filterbar"><label class="field-shell"><select id="report-site" aria-label="${T.site}"><option value="all">${T.allSites}</option>${activeSites().map(s=>`<option value="${s.id}" ${state.reportSite===s.id?'selected':''}>${esc(s[state.lang])}</option>`).join('')}</select></label><label class="field-shell"><span>${T.fromDate}</span><input id="report-from" type="date" value="${state.reportFrom}"></label><label class="field-shell"><span>${T.toDate}</span><input id="report-to" type="date" value="${state.reportTo}"></label>${anonymousSwitch('reportHideNames')}</section><section class="record-cards mobile-only">${mobileCards||`<div class="empty">${T.noRecords}</div>`}<div class="summary-box"><strong>${T.grandTotal}: ${money(grand)} ${T.aed}</strong><span>${count} ${T.records}</span></div></section><section class="panel desktop-only"><div class="paper-shell"><article class="paper">${paperHeader('VF-R-0231')}<h2>${T.finesReport}</h2>${state.reportHideNames?`<p class="paper-note">${T.anonymousNote}</p>`:''}<table><thead><tr><th>${T.sequence}</th>${state.reportHideNames?'':`<th>${T.employee}</th><th>${T.gNumber}</th>`}<th>${T.date}</th><th>${T.amount}</th><th>${T.blackPoints}</th></tr></thead><tbody>${groups.length?groups.map(g=>{const sub=g.fines.reduce((s,f)=>s+f.amount,0);return `<tr class="paper-group"><td colspan="${cols}">${esc(g.v.plate)} · ${esc(local(g.v.type))} · ${esc(siteById(g.v.site)[state.lang])}</td></tr>${g.fines.map((f,i)=>{const e=getEmployee(f.employee);return `<tr><td>${i+1}</td>${state.reportHideNames?'':`<td>${esc(e[state.lang])}</td><td>${e.g}</td>`}<td>${f.date}</td><td>${money(f.amount)} ${T.aed}</td><td>${f.points}</td></tr>`}).join('')}<tr class="paper-subtotal"><td colspan="${cols-1}">${T.subtotal}</td><td>${money(sub)} ${T.aed}</td></tr>`}).join(''):`<tr><td colspan="${cols}">${T.noRecords}</td></tr>`}</tbody></table><footer class="paper-footer"><strong>${T.grandTotal}: ${money(grand)} ${T.aed}</strong><span>${count} ${T.records}</span></footer></article></div></section>`}
function accidentsView(){const T=t(),records=vehicles.flatMap(v=>v.accidents.map(a=>({v,a})));return `${navStrip()}<header class="page-head"><div><button class="btn subtle" type="button" data-back-hub><span class="back-icon">→</span>${T.backHub}</button><h2>${T.accidentsTitle}</h2><p>${T.accidentsDesc}</p></div><button class="btn primary" type="button" data-add-accident="">${T.newReport}</button></header><div class="summary-row"><div class="summary-box"><span class="badge open">${T.openStatus}</span><strong>${records.filter(r=>r.a.status==='open').length}</strong></div><div class="summary-box"><span class="badge closed">${T.closedStatus}</span><strong>${records.filter(r=>r.a.status==='closed').length}</strong></div></div><section class="record-cards">${records.map(({v,a})=>accidentCard(v,a)).join('')}</section>`}
function accidentLetterView(){const T=t(),v=getVehicle(state.selectedVehicle),a=v.accidents.find(x=>x.id===state.selectedAccident),e=getEmployee(a.employee),seq=vehicles.flatMap(item=>item.accidents).findIndex(item=>item===a)+1;return `${navStrip()}<header class="page-head"><div><button class="btn subtle" type="button" data-back-accidents><span class="back-icon">→</span>${T.accidentsTitle}</button><h2>${T.accidentTitle}</h2><p>${T.accidentLetterDesc}</p></div><button class="btn primary" type="button" data-save-document>${T.saveLetter}</button></header><section class="panel"><div class="paper-shell"><article class="paper">${paperHeader(`VA-${String(seq).padStart(4,'0')}`)}<h2>${T.accidentTitle}</h2><div class="letter-grid"><p>${T.plate}: <strong class="mono">${esc(v.plate)}</strong></p><p>${T.type}: <strong>${esc(local(v.type))}</strong></p><p>${T.vin}: <strong class="mono">${v.vin}</strong></p><p>${T.site}: <strong>${esc(siteById(v.site)[state.lang])}</strong></p><p>${T.date}: <strong class="mono">${a.date} ${a.time}</strong></p><p>${T.employee}: <strong>${esc(e[state.lang])} · ${e.g}</strong></p><p>${T.location}: <strong>${esc(local(a.location))}</strong></p><p>${T.policeRef}: <strong class="mono">${esc(a.policeRef)}</strong></p><p>${T.damageCost}: <strong>${money(a.cost)} ${T.aed}</strong></p><p>${T.status}: <strong>${a.status==='open'?T.openStatus:T.closedStatus}</strong></p></div><h3>${T.description}</h3><div class="letter-desc">${esc(local(a.desc))}</div><footer class="paper-footer"><span class="mono">www.gssg.app</span><span class="submitter">${T.loggedSubmitter}<strong>G7186</strong></span></footer></article></div></section>`}

function trapDialogFocus(e){if(e.key!=='Tab'||!state.dialog)return;const dialog=$('[role="dialog"]');if(!dialog)return;const focusable=[...dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])')].filter(x=>!x.hidden);if(!focusable.length)return;const first=focusable[0],last=focusable.at(-1),active=document.activeElement;if(!dialog.contains(active)){e.preventDefault();(e.shiftKey?last:first).focus()}else if(e.shiftKey&&active===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&active===last){e.preventDefault();first.focus()}}
