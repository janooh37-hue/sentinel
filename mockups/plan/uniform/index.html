<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assets: Uniform (approval mockup)</title>
<style>
@font-face{font-family:Inter;src:url("../store-count/inter-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Noto Sans Arabic";src:url("../store-count/noto-sans-arabic-arabic-400-normal.woff2") format("woff2");font-weight:400 600;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Noto Sans Arabic";src:url("../store-count/noto-sans-arabic-arabic-700-normal.woff2") format("woff2");font-weight:700 900;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}

/* Achromatic ledger (tasteskill app style, seed 2089055445) with the GSSG brand kept:
   the app's ground, ink and navy; navy is the one data hue, on the size cells only. */
:root{
  --ground:#f5f4f1;--surface:#fff;--raised:#f0eee8;--active:#e9e7e1;
  --border:#e6e4dd;--rule:#efece5;--control:#d4d1c8;
  --text:#1c1f24;--muted:#5a6068;
  --primary:#0d2845;--on-primary:#fff;--data:#0d2845;--focus:#0d2845;
  --art:#fafaf6;
  --hero:linear-gradient(135deg,#0a1f3a 0%,#0d2845 50%,#1d3a5e 100%); /* taste-skill-ignore: the app's real Assets band, --hero-grad in frontend/src/index.css */
  --radius-card:8px;--radius-control:6px;
  --gap:24px;--pad:20px;--edge:32px;
  font-size:16px;color-scheme:light}
:root[data-theme=dark]{
  --ground:#0a0e18;--surface:#131826;--raised:#1a2034;--active:#1f263b;
  --border:#2a3148;--rule:#1f263b;--control:#3a4360;
  --text:#e6e9f2;--muted:#a3adc1;
  --primary:#e6e9f2;--on-primary:#0a0e18;--data:#a7bdf5;--focus:#a7bdf5;
  --hero:linear-gradient(135deg,#050816 0%,#0d1428 50%,#1a2540 100%);color-scheme:dark} /* taste-skill-ignore: dark --hero-grad from frontend/src/index.css */
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:14px/20px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
[lang=ar] body{font-family:"Noto Sans Arabic",Inter,system-ui,sans-serif;line-height:22px}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.skip{position:absolute;inset-inline-start:-999px}.skip:focus{inset-inline-start:1em;top:1em;z-index:9;background:var(--surface);padding:.5em}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Mockup controls: not part of the screen. */
.proto{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:6px var(--edge);background:var(--raised);font-size:13px;color:var(--muted)}
.proto .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.proto button,.proto select{height:32px;padding:0 10px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);color:var(--text);font-size:13px}

/* The app's Assets band, as StoreShell renders it. */
.hero{background:var(--hero);color:#fff;padding-block-start:16px}
.wrap{max-width:1400px;margin-inline:auto;padding-inline:var(--edge)}
.eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72)}
[lang=ar] .eyebrow{letter-spacing:normal}
.tagline{margin:2px 0 12px;font-size:13px;color:rgba(255,255,255,.82)}
.sectiontabs{display:flex;gap:4px;align-items:flex-end}
.sectiontabs a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-start-start-radius:12px;border-start-end-radius:12px;font-size:14px;font-weight:600;color:rgba(255,255,255,.72);text-decoration:none}
.sectiontabs a:hover{background:rgba(255,255,255,.1);color:#fff}
.sectiontabs a[aria-current=page]{background:var(--ground);color:var(--text)}

/* Title row */
.titlerow{padding-block:28px 20px}
h1{margin:0;font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.01em}
[lang=ar] h1{letter-spacing:normal;line-height:36px}
.finding{margin:4px 0 0;font-size:15px;color:var(--muted)}
.finding b{color:var(--text);font-weight:600}

/* One left edge from the title to the last row. The summary is one panel split by 1px
   dividers (240 + 240 + the rest); the stock table runs the full canvas below it. */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card)}
.summary{display:grid;grid-template-columns:240px 240px minmax(0,1fr);margin:0}
.sumpanel{margin-block-end:var(--gap)}
.summary>div{padding:16px var(--pad)}
.summary>div+div{border-inline-start:1px solid var(--border)}
.summary dt{font-size:13px;color:var(--muted)}
.summary dd{margin:2px 0 0}
.figure{display:block;font-size:24px;line-height:32px;font-weight:500}
.sub{display:block;font-size:13px;line-height:18px;color:var(--muted)}
.panel h2{margin:0;font-size:16px;line-height:24px;font-weight:600}
.panelhead{padding:16px var(--pad) 0}

/* Stock table */
.stock{container-type:inline-size}
table{width:100%;border-collapse:collapse}
thead th{padding:12px 12px 8px;font-size:13px;font-weight:400;color:var(--muted);text-align:start;white-space:nowrap}
th.num,td.num{text-align:end}
thead th:first-child,tbody td:first-child{padding-inline-start:var(--pad)}
thead th:last-child,tbody td:last-child{padding-inline-end:var(--pad)}
tbody.group th{padding:20px var(--pad) 6px;text-align:start;font-weight:600;font-size:14px}
tbody.group th span{margin-inline-start:8px;font-weight:400;font-size:13px;color:var(--muted)}
tbody tr.piece td{padding:12px;vertical-align:middle;border-block-start:1px solid var(--rule)}
tbody.group tr:first-child + tr.piece td{border-block-start:0}
.ident{display:flex;gap:12px;align-items:center;min-width:0}
.art{flex:none;display:block;width:56px;height:56px;border-radius:var(--radius-control);background:var(--art)}
.name{display:block;font-weight:600}
.desc{display:block;font-size:13px;line-height:18px;color:var(--muted)}
.instock{font-size:16px;font-weight:500}
.unit{font-size:12px;color:var(--muted);font-weight:400;margin-inline-start:3px}

/* The size ladder: one cell per size, shaded in the one data hue by its share of the piece's
   largest size. Zero is a dashed empty slot with a printed 0. The smallest size sits at the
   reading start, so the ladder mirrors in Arabic; each cell's own text stays upright. */
.ladder{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}
.ladder li>span{unicode-bidi:isolate}
.ladder li{display:grid;place-items:center;width:48px;height:46px;border-radius:var(--radius-control);background:color-mix(in srgb,var(--data) calc(var(--t) * 100%),var(--surface))}
.ladder li.one{width:auto;padding-inline:10px}
.ladder .sz{font-size:12px;line-height:16px;color:var(--text);opacity:.8}
.ladder .q{font-size:14px;line-height:18px;font-weight:600;font-variant-numeric:tabular-nums}
.ladder li.zero{background:transparent;outline:1px dashed var(--control);outline-offset:-1px}
.ladder li.zero .q{color:var(--muted);font-weight:400}
.ghost{height:32px;padding:0 12px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.ghost:hover{background:var(--raised)}
.ghost:active{transform:translateY(1px)}

/* Out of stock, inside the summary */
.outlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px;margin:6px 0 0;padding:0;list-style:none}
.outlist li{display:flex;align-items:center;gap:10px;min-height:40px}
.outlist .art{width:36px;height:36px}
.outlist .what{min-width:0}
.outlist .sizes{font-weight:600}
.empty{margin:6px 0 0;color:var(--muted)}
.stock{margin-block-end:48px}

/* States */
.bar{display:inline-block;height:14px;border-radius:3px;background:var(--active);vertical-align:middle}
.ladder li.skel{background:var(--active)}
.error{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:16px var(--pad) 20px}
.textbtn{border:0;background:none;padding:0 4px;min-height:32px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* Editor */
dialog{width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:0;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);color:var(--text);box-shadow:0 16px 40px rgba(10,20,40,.18)}
dialog::backdrop{background:rgba(5,10,20,.45)}
.dlg{display:grid;gap:20px;padding:var(--pad)}
.dlghead{display:flex;gap:16px;align-items:center}
.dlghead .art{width:88px;height:88px}
.dlghead h2{margin:0;font-size:18px;line-height:26px}
.sizes-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:16px 12px;margin:0;padding:0;border:0}
.sizes-form legend{padding:0;margin-block-end:10px;font-size:14px;font-weight:500}
.sizes-form label{display:grid;gap:6px;font-size:13px;font-weight:500}
.sizes-form input{height:40px;width:100%;padding:0 10px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);direction:ltr;text-align:start;font-variant-numeric:tabular-nums}
.dlgfoot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.dlgfoot .actions{display:flex;gap:8px}
.primary{height:36px;padding:0 16px;border:1px solid var(--primary);border-radius:var(--radius-control);background:var(--primary);color:var(--on-primary);font-weight:600;cursor:pointer}
.secondary{height:36px;padding:0 16px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);font-weight:500;cursor:pointer}
.toast{position:fixed;inset-block-end:16px;inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:var(--radius-control);background:var(--text);color:var(--ground);font-size:13px;box-shadow:0 8px 24px rgba(10,20,40,.2)}

/* Narrow table: each piece becomes two lines, its ladder on the second. */
@container (max-width: 760px){
  thead{display:none}
  tbody tr.piece{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"ident total action" "ladder ladder ladder";gap:10px 12px;padding:12px var(--pad);border-block-start:1px solid var(--rule)}
  tbody.group tr:first-child + tr.piece{border-block-start:0}
  tbody tr.piece td{padding:0!important;border:0}
  tbody tr.piece td:nth-child(1){grid-area:ident}
  tbody tr.piece td:nth-child(2){grid-area:total;align-self:center}
  tbody tr.piece td:nth-child(3){grid-area:ladder}
  tbody tr.piece td:nth-child(4){grid-area:action;align-self:center}
}
@media (max-width:720px){
  :root{--edge:16px;--pad:16px}
  .summary{grid-template-columns:1fr 1fr}
  .summary>div:nth-child(3){grid-column:1/-1;border-inline-start:0;border-block-start:1px solid var(--border)}
  .titlerow{padding-block:20px 16px}
  .ghost{height:44px}
}
@media (prefers-reduced-motion:reduce){.ghost:active{transform:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content / الانتقال إلى المحتوى</a>
<div id="app"></div>
<dialog id="editor" aria-labelledby="dlg-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="./data.js"></script>
<script src="./art.js"></script>
<script>
'use strict'
const params = new URLSearchParams(location.search)
const state = {
  lang: params.get('lang') === 'ar' ? 'ar' : 'en',
  theme: params.get('theme') === 'dark' ? 'dark' : 'light',
  view: ['readonly', 'loading', 'error'].includes(params.get('view')) ? params.get('view') : 'edit',
}
const { items, groups, total, pieces, suits } = window.UNIFORM

const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`
function arCount(n, forms) { // forms: [one, two, few (3-10), many (11+)]
  if (n === 1) return forms[0]
  if (n === 2) return forms[1]
  return `${n} ${n <= 10 ? forms[2] : forms[3]}`
}

const T = {
  en: {
    docTitle: 'Assets: Uniform (approval mockup)',
    proto: 'Approval mockup. Sample quantities, nothing is saved.',
    other: 'العربية', theme: s => s === 'dark' ? 'Light theme' : 'Dark theme',
    preview: 'Preview', views: { edit: 'Store manager', readonly: 'View only', loading: 'Loading', error: 'Load failed' },
    assets: 'Assets', tagline: 'Store-room stock of uniform pieces by size.',
    sections: 'Assets sections', store: 'Store', uniform: 'Uniform',
    title: 'Uniform',
    findingNone: 'Every size of every piece is on the shelf.',
    finding: (s, p) => `<b>${plural(s, 'size', 'sizes')}</b> out of stock across ${plural(p, 'piece', 'pieces')}.`,
    piece: 'Piece', inStock: 'In stock', bySize: 'Quantity by size', action: 'Action', update: 'Update',
    oneSize: 'One size',
    totals: 'Totals', totalPieces: 'Total pieces', totalPiecesSub: 'A suit counts as one piece', suits: 'Full suits', suitsSub: 'Blazer, trousers, white shirt',
    out: 'Out of stock', outNone: 'Nothing is out of stock.',
    error: 'Couldn\'t load uniform stock.', retry: 'Retry',
    sizes: 'Quantity by size', save: 'Save', cancel: 'Cancel', sum: n => `Total ${n}`,
    saved: 'Quantities changed on this page only. Nothing is saved.',
  },
  ar: {
    docTitle: 'الأصول: الملابس (نموذج للاعتماد)',
    proto: 'نموذج للاعتماد. الكميات تجريبية ولا يُحفظ شيء.',
    other: 'English', theme: s => s === 'dark' ? 'المظهر الفاتح' : 'المظهر الداكن',
    preview: 'المعاينة', views: { edit: 'مسؤول المخزن', readonly: 'عرض فقط', loading: 'جارٍ التحميل', error: 'تعذّر التحميل' },
    assets: 'الأصول', tagline: 'رصيد قطع الزي في المخزن حسب المقاس.',
    sections: 'أقسام الأصول', store: 'المخزن', uniform: 'الملابس',
    title: 'الملابس',
    findingNone: 'جميع مقاسات كل القطع متوفرة في المخزن.',
    finding: (s, p) => `نفد من المخزن <b>${arCount(s, ['مقاس واحد', 'مقاسان', 'مقاسات', 'مقاسًا'])}</b> في ${arCount(p, ['قطعة واحدة', 'قطعتين', 'قطع', 'قطعة'])}.`,
    piece: 'القطعة', inStock: 'الرصيد', bySize: 'الكمية حسب المقاس', action: 'الإجراء', update: 'تحديث',
    oneSize: 'مقاس موحد',
    totals: 'الإجماليات', totalPieces: 'إجمالي القطع', totalPiecesSub: 'تُحسب البدلة قطعة واحدة', suits: 'البدلات الكاملة', suitsSub: 'سترة وبنطال وقميص أبيض',
    out: 'نفد من المخزن', outNone: 'لا يوجد مقاس نافد.',
    error: 'تعذّر تحميل رصيد الملابس.', retry: 'إعادة المحاولة',
    sizes: 'الكمية حسب المقاس', save: 'حفظ', cancel: 'إلغاء', sum: n => `الإجمالي ${n}`,
    saved: 'تغيّرت الكميات في هذه الصفحة فقط ولم يُحفظ شيء.',
  },
}

const t = () => T[state.lang]
const fmt = n => n.toLocaleString(state.lang === 'ar' ? 'ar-AE' : 'en-GB', { numberingSystem: 'latn' })
const L = (o, k = '') => state.lang === 'ar' ? o[k ? k + 'Ar' : 'ar'] : o[k ? k + 'En' : 'en']
const nameOf = item => L(item)
const descOf = item => state.lang === 'ar' ? item.dAr : item.dEn
const sizeLabel = s => s === 'one' ? t().oneSize : s
const canEdit = () => state.view === 'edit'
const outOfStock = () => items.map(i => ({ item: i, sizes: i.sizes.filter((_, k) => i.qty[k] === 0) })).filter(o => o.sizes.length)

function ladder(item) {
  const s = t()
  if (state.view === 'loading') return `<ul class="ladder" aria-hidden="true">${item.sizes.map(() => '<li class="skel"></li>').join('')}</ul>`
  const max = Math.max(1, ...item.qty)
  return `<ul class="ladder" aria-label="${s.bySize}">${item.sizes.map((sz, k) => {
    const q = item.qty[k]
    const shade = q ? (0.07 + 0.38 * q / max).toFixed(3) : 0
    return `<li class="${q ? '' : 'zero'}${sz === 'one' ? ' one' : ''}" style="--t:${shade}"><span class="sz">${sizeLabel(sz)}</span><span class="q">${fmt(q)}</span></li>`
  }).join('')}</ul>`
}

function row(item) {
  const s = t()
  const stock = state.view === 'loading' ? '<span class="bar" style="width:32px"></span>' : `<span class="instock num">${fmt(total(item))}</span>`
  return `<tr class="piece">
    <td><div class="ident">${window.uniformArt(item.art)}<div><span class="name">${nameOf(item)}</span><span class="desc">${descOf(item)}</span></div></div></td>
    <td class="num">${stock}</td>
    <td>${ladder(item)}</td>
    ${canEdit() ? `<td class="num"><button type="button" class="ghost" data-item="${item.id}" aria-label="${s.update}: ${nameOf(item)}">${s.update}</button></td>` : '<td></td>'}
  </tr>`
}

function stockPanel() {
  const s = t()
  if (state.view === 'error') return `<section class="panel stock" aria-labelledby="stock-h"><div class="panelhead"><h2 id="stock-h">${s.bySize}</h2></div>
    <p class="error" role="alert"><span>${s.error}</span><button type="button" class="textbtn" id="retry">${s.retry}</button></p></section>`
  return `<section class="panel stock" aria-labelledby="stock-h"><h2 id="stock-h" class="sr">${s.bySize}</h2>
    <table><thead><tr><th scope="col">${s.piece}</th><th scope="col" class="num">${s.inStock}</th><th scope="col">${s.bySize}</th><th scope="col"><span class="sr">${s.action}</span></th></tr></thead>
    ${groups.map(g => `<tbody class="group"><tr><th scope="colgroup" colspan="4">${L(g)}<span>${L(g, 'note')}</span></th></tr>
      ${items.filter(i => i.group === g.id).map(row).join('')}</tbody>`).join('')}
    </table></section>`
}

function summary() {
  const s = t()
  const value = n => state.view === 'loading' ? '<span class="bar" style="width:56px;height:24px"></span>' : state.view === 'error' ? '<span style="color:var(--muted)">-</span>' : fmt(n)
  const out = outOfStock()
  let outBody
  if (state.view === 'loading') outBody = `<ul class="outlist" aria-hidden="true">${[0, 1, 2].map(() => '<li><span class="bar" style="width:36px;height:36px"></span><span class="bar" style="width:120px"></span></li>').join('')}</ul>`
  else if (state.view === 'error') outBody = '<p class="empty">-</p>'
  else if (!out.length) outBody = `<p class="empty">${s.outNone}</p>`
  else outBody = `<ul class="outlist">${out.map(o => `<li>${window.uniformArt(o.item.art)}<span class="what">${nameOf(o.item)} <span class="sizes">${o.sizes.map(sizeLabel).join(state.lang === 'ar' ? '، ' : ', ')}</span></span></li>`).join('')}</ul>`
  return `<section class="panel sumpanel" aria-label="${s.totals}"><dl class="summary">
    <div><dt>${s.totalPieces}</dt><dd><span class="figure">${value(pieces())}</span><span class="sub">${s.totalPiecesSub}</span></dd></div>
    <div><dt>${s.suits}</dt><dd><span class="figure">${value(suits())}</span><span class="sub">${s.suitsSub}</span></dd></div>
    <div><dt>${s.out}</dt><dd>${outBody}</dd></div>
  </dl></section>`
}

function finding() {
  const s = t()
  if (state.view !== 'edit' && state.view !== 'readonly') return ''
  const out = outOfStock()
  const n = out.reduce((a, o) => a + o.sizes.length, 0)
  return `<p class="finding">${n ? s.finding(n, out.length) : s.findingNone}</p>`
}

function render() {
  const s = t()
  document.title = s.docTitle
  document.documentElement.lang = state.lang
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr'
  document.documentElement.dataset.theme = state.theme
  document.getElementById('app').innerHTML = `
    <div class="proto" role="region" aria-label="Mockup controls / عناصر التحكم في النموذج"><span>${s.proto}</span><span class="controls">
      <label>${s.preview} <select id="view">${Object.entries(s.views).map(([k, v]) => `<option value="${k}"${k === state.view ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
      <button type="button" id="lang" lang="${state.lang === 'ar' ? 'en' : 'ar'}">${s.other}</button>
      <button type="button" id="theme">${s.theme(state.theme)}</button></span></div>
    <header class="hero"><div class="wrap"><p class="eyebrow">${s.assets}</p><p class="tagline">${s.tagline}</p>
      <nav class="sectiontabs" aria-label="${s.sections}"><a href="#">${s.store}</a><a href="#" aria-current="page">${s.uniform}</a></nav></div></header>
    <main id="main" class="wrap" aria-busy="${state.view === 'loading'}">
      <div class="titlerow"><h1>${s.title}</h1>${finding()}</div>
      ${summary()}${stockPanel()}
    </main>`
  document.getElementById('lang').onclick = () => { state.lang = state.lang === 'ar' ? 'en' : 'ar'; sync(); render() }
  document.getElementById('theme').onclick = () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; sync(); render() }
  document.getElementById('view').onchange = e => { state.view = e.target.value; sync(); render() }
  document.getElementById('retry')?.addEventListener('click', () => { state.view = 'edit'; sync(); render() })
  document.querySelectorAll('[data-item]').forEach(b => { b.onclick = () => openEditor(b.dataset.item, b) })
}

function sync() {
  const q = new URLSearchParams(location.search)
  q.set('lang', state.lang); q.set('theme', state.theme); q.set('view', state.view); q.delete('edit')
  history.replaceState(null, '', '?' + q)
}

function openEditor(id, opener) {
  const item = items.find(i => i.id === id)
  const s = t()
  const dlg = document.getElementById('editor')
  dlg.innerHTML = `<form method="dialog" class="dlg">
    <div class="dlghead">${window.uniformArt(item.art)}<div><h2 id="dlg-title">${nameOf(item)}</h2><span class="desc">${descOf(item)}</span></div></div>
    <fieldset class="sizes-form"><legend>${s.sizes}</legend>
      ${item.sizes.map((sz, k) => `<label>${sizeLabel(sz)}<input inputmode="numeric" pattern="[0-9]*" name="q${k}" value="${item.qty[k]}" autocomplete="off"></label>`).join('')}</fieldset>
    <div class="dlgfoot"><span class="num" id="dlg-sum">${s.sum(fmt(total(item)))}</span>
      <span class="actions"><button type="button" class="secondary" id="dlg-cancel">${s.cancel}</button><button class="primary" value="save">${s.save}</button></span></div></form>`
  const inputs = [...dlg.querySelectorAll('input')]
  const read = () => inputs.map(el => Math.max(0, Number.parseInt(el.value, 10) || 0))
  inputs.forEach(el => { el.oninput = () => { document.getElementById('dlg-sum').textContent = s.sum(fmt(read().reduce((a, b) => a + b, 0))) } })
  document.getElementById('dlg-cancel').onclick = () => dlg.close()
  dlg.onclose = () => {
    const saved = dlg.returnValue === 'save'
    dlg.returnValue = ''
    if (saved) { item.qty = read(); render(); toast(s.saved) }
    document.querySelector(`[data-item="${id}"]`)?.focus() ?? opener?.focus()
  }
  dlg.showModal()
}

function toast(msg) {
  const el = document.getElementById('toast')
  el.textContent = msg; el.hidden = false
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { el.hidden = true }, 3600)
}

render()
if (params.get('edit') && canEdit()) openEditor(params.get('edit'))
</script>
</body>
</html>
