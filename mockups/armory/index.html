<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assets: Armory (approval mockup)</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:Inter;src:url("./fonts/inter-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Noto Sans Arabic";src:url("./fonts/noto-sans-arabic-arabic-400-normal.woff2") format("woff2");font-weight:400 600;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Noto Sans Arabic";src:url("./fonts/noto-sans-arabic-arabic-700-normal.woff2") format("woff2");font-weight:700 900;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}

/* Uniform's achromatic ledger with the app's Assets band and semantic status tokens. */
:root{
  --ground:#f5f4f1;--surface:#fff;--raised:#f0eee8;--active:#e9e7e1;
  --border:#e6e4dd;--rule:#efece5;--control:#d4d1c8;--text:#1c1f24;--muted:#5a6068;
  --primary:#1c1f24;--on-primary:#fff;--data:#0d2845;--focus:#0d2845;--data-soft:#e8edf3;
  --danger:#b91c1c;--danger-soft:#fbe5e8;--warning:#92400e;--warning-soft:#fef3c7;
  --info:#1d4ed8;--info-soft:#e0e8f8;--success:#047857;--success-soft:#d6f0e4;
  --art:#fafaf6;--brand-band:#0d2845;--missing-fill:#b91c1c;--missing-ink:#fff;
  --radius-card:8px;--radius-control:6px;--gap:24px;--pad:20px;--edge:24px;
  font-size:16px;color-scheme:light
}
:root[data-theme=dark]{
  --ground:#0a0e18;--surface:#131826;--raised:#1a2034;--active:#1f263b;
  --border:#2a3148;--rule:#1f263b;--control:#3a4360;--text:#e6e9f2;--muted:#a3adc1;
  --primary:#e6e9f2;--on-primary:#0a0e18;--data:#a7bdf5;--focus:#a7bdf5;--data-soft:#1c2849;
  --danger:#fca5a5;--danger-soft:#3a1820;--warning:#fbbf24;--warning-soft:#3b2f11;
  --info:#60a5fa;--info-soft:#1c2940;--success:#34d399;--success-soft:#142d23;
  --brand-band:#101b30;--missing-fill:#a32335;--missing-ink:#fff;color-scheme:dark
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.46 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
:lang(ar){font-family:"Noto Sans Arabic",Inter,system-ui,sans-serif}
:lang(ar) h1{letter-spacing:0}
[dir=rtl] input[dir=ltr],[dir=rtl] textarea[dir=ltr]{text-align:end}
button,input,select,textarea{font:inherit;color:inherit;accent-color:var(--data)}
p{margin:0}
a{color:inherit;text-underline-offset:3px}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{color:var(--text);background:var(--data-soft)}
.skip{position:fixed;inset-inline-start:1rem;inset-block-start:1rem;z-index:4;background:var(--surface);padding:10px;clip-path:inset(50%)}
.skip:focus{clip-path:none}
.sr{position:absolute;inline-size:1px;block-size:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
bdi{unicode-bidi:isolate;overflow-wrap:anywhere}
.icon{flex:none;vertical-align:middle}
[dir=rtl] .mirror{transform:scaleX(-1)}
.muted,.desc,.dash{color:var(--muted)}
.desc{display:block;font-size:13px;line-height:1.5}
.small{font-size:12px;line-height:1.52}
.name{display:block;font-weight:600;overflow-wrap:anywhere}
.hero{color:#fff}
.hero .wrap{padding-inline:32px}
.hero :focus-visible{outline-color:rgba(255,255,255,.9)}
.wrap{max-inline-size:1400px;margin-inline:auto;padding-inline:var(--edge)}
.sectiontabs{display:flex;gap:4px;align-items:flex-end;max-inline-size:100%;overflow-x:auto}
.sectiontabs a,.sectiontabs span{display:inline-flex;align-items:center;min-block-size:44px;padding-inline:16px;border-start-start-radius:12px;border-start-end-radius:12px;font-size:14px;font-weight:600;color:rgba(255,255,255,.76);text-decoration:none;white-space:nowrap}
.sectiontabs a:hover{background:rgba(255,255,255,.1);color:#fff}
.sectiontabs [aria-current=page]{background:var(--ground);color:var(--text)}
.subtabs{border-block-end:1px solid var(--border)}
.subtabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.subtabs a{display:inline-flex;align-items:center;flex:none;min-block-size:44px;padding-inline:12px;border-block-end:2px solid transparent;font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;white-space:nowrap}
.subtabs a:hover{color:var(--text)}
.subtabs a[aria-current=page]{border-color:var(--primary);color:var(--text);font-weight:600}
.titlerow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:22px 16px}
h1,h2,h3,h4{margin:0;overflow-wrap:anywhere}
h1{font-size:24px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;line-height:1.5;font-weight:600}
h3{font-size:14px;line-height:1.45;font-weight:600}
h4{font-size:13px;font-weight:600}
.finding{margin-block-start:5px;color:var(--muted);font-size:14px}
.primary,.secondary,.ghost,.textbtn,.iconbtn{display:inline-flex;min-block-size:44px;max-inline-size:100%;align-items:center;justify-content:center;gap:7px;padding:6px 12px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);font-size:13px;font-weight:600;text-align:center;text-decoration:none}
.primary{border-color:var(--primary);background:var(--primary);color:var(--on-primary);padding-inline:16px}
.primary:disabled{background:var(--raised);border-color:var(--control);color:var(--muted)}
.secondary:hover,.ghost:hover,.iconbtn:hover,.proto button:hover{background:var(--raised)}
.ghost{font-weight:500}
.iconbtn{inline-size:44px;padding:0;flex:none}
.textbtn{background:transparent;border-color:transparent;color:var(--data);padding-inline:4px;text-decoration:underline;text-underline-offset:3px}
.textbtn:hover{text-decoration-thickness:2px}
.textbtn:disabled{text-decoration:none;color:var(--muted)}
.section{margin-block-end:18px;scroll-margin-block-start:16px}
.panel{min-inline-size:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card)}
.panel-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:14px var(--pad) 10px;border-block-end:1px solid var(--rule)}
.panel-head h2{display:flex;align-items:center;gap:8px}
.panel-head h2 .icon{color:var(--muted)}
.content{padding:14px var(--pad)}
.count-tag,.chip{display:inline-flex;align-items:center;gap:5px;max-inline-size:100%;padding:3px 8px;border-radius:4px;background:var(--raised);color:var(--text);font-size:12px;font-weight:600;line-height:1.45}
.chip.danger,.danger-tone{color:var(--danger);--tone-bg:var(--danger-soft)}
.chip.warning,.warning-tone{color:var(--warning);--tone-bg:var(--warning-soft)}
.chip.info,.info-tone{color:var(--info);--tone-bg:var(--info-soft)}
.chip.success{color:var(--success);--tone-bg:var(--success-soft)}
.chip.outline{color:var(--danger);background:transparent;border:1px solid currentColor}
.chip{background:var(--tone-bg,var(--raised))}
.chip>span{min-inline-size:0}
.chip .icon{inline-size:14px;block-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.meta{display:flex;flex-wrap:wrap;gap:3px 10px;align-items:baseline;color:var(--muted);font-size:13px}
.meta>span{min-inline-size:0}
.table-wrap{min-inline-size:0}
table{inline-size:100%;border-collapse:separate;border-spacing:0;text-align:start}
th{text-align:start}
th.num,td.num{text-align:end}
thead th{position:sticky;inset-block-start:0;z-index:1;background:var(--surface);border-block-end:1px solid var(--rule);padding:10px 12px;color:var(--muted);font-size:12px;font-weight:500;line-height:1.4;vertical-align:bottom}
tbody :is(td,th){padding:8px 12px;vertical-align:middle;border-block-end:1px solid var(--rule)}
tbody th{font-weight:inherit}
tbody:last-child tr:last-child>*{border-block-end:0}
tr>*:first-child{padding-inline-start:var(--pad)}
tr>*:last-child{padding-inline-end:var(--pad)}
tbody.group .group-head th{padding:10px var(--pad) 7px;background:var(--raised);font-weight:600;font-size:13px}
.ident{display:flex;gap:10px;align-items:center;min-inline-size:0}
.ident .copy{min-inline-size:0}
.art{flex:none;display:block;inline-size:56px;block-size:44px;border-radius:var(--radius-control);background:var(--art)}
.art .fill{fill:#e4e9e8}
.art.lg{inline-size:88px;block-size:64px}
.list-lines .art,.dense .art{inline-size:44px;block-size:36px}
.item-link{display:inline-flex;align-items:center;gap:5px;min-block-size:44px;color:var(--text);font-weight:600;text-decoration:none}
.item-link:hover,.item-link[aria-current=true]{color:var(--data);text-decoration:underline}
.row-select{display:block;min-block-size:44px;text-decoration:none;align-content:center}
.row-select:hover .name{text-decoration:underline;text-underline-offset:3px}
tr.selected>*{background:var(--data-soft)}
.mobile-key{display:none}
.master{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,405px);gap:var(--gap);align-items:start;margin-block-end:24px}
.detail{position:sticky;inset-block-start:16px;max-block-size:calc(100dvh - 32px);overflow:auto}
.dhead{display:grid;gap:8px;padding:14px var(--pad);border-block-end:1px solid var(--border)}
.dhead h2{font-size:18px}
.back{display:none;justify-self:start}
.selection-list{margin:0;padding:0;list-style:none}
.selection-list>li+li{border-block-start:1px solid var(--rule)}
.selection-list .row-select{padding:13px var(--pad)}
.selection-list .selected{background:var(--data-soft)}
.record-top{display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center;justify-content:space-between}
.list-lines,.serial-list,.safe-checks,.variance-list{margin:0;padding:0;list-style:none}
.list-lines>li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;min-block-size:46px}
.list-lines>li+li,.serial-list>li+li,.safe-checks>li+li,.variance-list>li+li{border-block-start:1px solid var(--rule)}
.serial-list li,.safe-checks li,.variance-list li{padding:11px var(--pad);overflow-wrap:anywhere}
.serial-list .meta{margin-block-start:2px}
.serial-list .record-top{min-block-size:22px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:12px var(--pad);border-block-end:1px solid var(--rule)}
.search{display:flex;align-items:center;gap:8px;min-inline-size:0;min-block-size:44px;padding-inline-start:10px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface)}
.search:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.search>.icon{color:var(--muted)}
.search input{flex:1;min-inline-size:0;min-block-size:42px;padding-inline-end:8px;border:0;background:transparent;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.search .iconbtn{border:0;background:none;min-block-size:42px}
.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.filter{min-block-size:44px;padding:5px 10px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);text-align:start;font-size:13px}
.filter[aria-pressed=true]{border-color:var(--data);background:var(--data-soft);color:var(--data);font-weight:600}
.filter:hover:enabled{background:var(--raised)}
.filter:disabled{color:var(--muted)}
.checklabel{display:flex;align-items:center;gap:10px;min-block-size:44px;min-inline-size:0;cursor:pointer}
.checklabel input{inline-size:17px;block-size:17px;flex:none;margin:0}
.checklabel span{min-inline-size:0}
.state{margin-block-end:18px}
.state .content{display:grid;gap:7px;min-block-size:98px;justify-items:start}
.bar{display:block;max-inline-size:100%;block-size:14px;border-radius:3px;background:var(--active)}
.bar.long{inline-size:180px}.bar.short{inline-size:94px}
.bare-list{list-style:none;margin:0;padding:0}
.bare-list li{border-block-end:1px solid var(--rule);display:grid;gap:6px;padding-block:9px}
.toast{position:fixed;z-index:3;inset-block-end:max(16px,env(safe-area-inset-bottom));inset-inline:0;margin-inline:auto;inline-size:max-content;max-inline-size:calc(100% - 32px);padding:12px 16px;border-radius:var(--radius-control);background:var(--text);color:var(--ground);font-size:13px;box-shadow:0 1px 2px rgba(10,20,40,.06),0 12px 32px rgba(10,20,40,.14)}

/* Native modal keeps the page inert. Only the body scrolls, including on the phone. */
dialog{inline-size:min(760px,calc(100vw - 32px));max-inline-size:calc(100vw - 32px);max-block-size:calc(100dvh - 32px);padding:0;overflow:clip;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(10,20,40,.06),0 12px 32px rgba(10,20,40,.14)}
dialog.wide{inline-size:min(880px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(5,10,20,.45)}
.giveform{display:flex;flex-direction:column;max-block-size:calc(100dvh - 34px)}
.givehead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px var(--pad);border-block-end:1px solid var(--border)}
.givehead h2{font-size:18px;line-height:1.4}
.givehead .desc{margin-block-start:3px}
.givebody{min-block-size:0;overflow:auto;overscroll-behavior:contain;padding:14px var(--pad) 18px;scrollbar-gutter:stable}
.givefoot{flex:none;display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px var(--pad);border-block-start:1px solid var(--border);background:var(--surface)}
.givefoot .actions{margin-inline-start:auto}
.reason{color:var(--muted);font-size:13px;line-height:1.5;max-inline-size:52ch}
.field{display:grid;align-content:start;gap:5px;min-inline-size:0;font-size:13px;font-weight:600}
.field :is(input,select,textarea){inline-size:100%;min-inline-size:0;min-block-size:44px;padding:7px 10px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);font-size:14px;font-weight:400}
.field :is(input,textarea)::placeholder,.search input::placeholder{color:var(--muted)}
.field textarea{resize:block;min-block-size:76px}
.field input[type=number]{appearance:textfield}
.field input[type=number]::-webkit-inner-spin-button{appearance:none}
.fieldpair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.fieldset{display:grid;gap:8px;min-inline-size:0;margin:14px 0 0;padding:0;border:0}
.fieldset legend{margin-block-end:6px;padding:0;font-weight:600}
.flow{display:grid;gap:12px}
.notice{display:grid;grid-template-columns:18px minmax(0,1fr);align-items:start;gap:8px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-control);background:var(--tone-bg,var(--raised));font-size:13px}
.notice>.icon{margin-block-start:2px}
.notice .checklabel{color:var(--text)}
.notice p+p{margin-block-start:4px}
.chosen{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:5px 12px;padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius-control);background:var(--raised)}
.results{margin:0;padding:0;list-style:none}
.results>li+li{border-block-start:1px solid var(--rule)}
.results>li{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;padding:4px 8px}
.results .result-label{min-inline-size:0}
.picker-list{margin-block-start:6px;max-block-size:265px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-control)}
.picker-list h4{padding:7px 8px;background:var(--raised);color:var(--muted)}
.picker-list .picker-none{padding:10px 8px;color:var(--muted)}
.form-line{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,260px);gap:8px 14px;align-items:center;padding-block:6px;border-block-end:1px solid var(--rule)}
.form-line:last-child{border-block-end:0}
.form-line .art{inline-size:44px;block-size:36px}
.form-line .stepper{justify-self:start}
.stepper{display:inline-flex;inline-size:max-content;align-items:center;border:1px solid var(--control);border-radius:var(--radius-control)}
.stepper button{display:grid;place-items:center;inline-size:44px;block-size:44px;padding:0;border:0;background:transparent;color:var(--text);font-size:17px}
.stepper button:hover:enabled{background:var(--raised)}
.stepper button:disabled{color:var(--muted)}
.stepper input{appearance:textfield;inline-size:52px;block-size:44px;padding:0;border:0;border-inline:1px solid var(--rule);background:transparent;text-align:center!important}
.stepper input::-webkit-inner-spin-button{appearance:none}
.clampnotice{display:block;color:var(--muted);font-size:12px}
.clampnotice:empty{display:none}
.serial-checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr));gap:4px 10px;margin:0;padding:0;list-style:none}
.serial-checks .checklabel{padding-inline:8px;border:1px solid var(--border);border-radius:var(--radius-control)}
.countgroup{border-block-end:1px solid var(--border)}
.countgroup>summary,.count-result>summary{min-block-size:44px;padding-block:10px;cursor:pointer;font-weight:600}
.countgroup .form-line>div{min-inline-size:0}
.countgroup .form-line{grid-template-columns:minmax(0,1fr) minmax(185px,340px)}
.lookup{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:8px}
.extras-panel{border-block-start:1px solid var(--rule)}
.return-meta{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px}
.return-meta .textbtn{padding-block:0}
.count-result{padding:0 var(--pad);border-block-end:1px solid var(--rule)}
.count-result:last-child{border-block-end:0}
.count-result>summary{overflow-wrap:anywhere}
.count-result .flow{padding-block-end:12px;gap:6px}
.held-list{padding-inline-start:20px;margin:0;color:var(--muted)}
.widget-demo{max-inline-size:660px}
.widget-demo .alert-count{padding:12px var(--pad);font-size:16px;font-weight:650;color:var(--danger);background:var(--danger-soft);border-block-end:1px solid var(--border);display:flex;align-items:center;gap:8px}
.widget-demo .widget-footer{display:flex;justify-content:flex-end;padding:4px var(--pad) 6px;border-block-start:1px solid var(--rule)}

/* Bilingual A4 receipt. The paper stays white in both preview themes. */
.receipt-controls{display:flex;align-items:center;flex-wrap:wrap;justify-content:space-between;gap:8px;padding-block:12px}
.paper{max-inline-size:210mm;min-block-size:297mm;margin:0 auto 28px;padding:15mm 16mm;background:#fff;color:#1c1f24;border:1px solid #ddd}
.paper img{display:block;inline-size:min(244px,100%);block-size:auto;margin:0 auto 8px}
.paper .organization{text-align:center;line-height:1.45;font-size:12px;color:#5a6068}
.paper h1{margin-block:18px 4px;text-align:center;color:#0d2845;font-size:24px}
.paper .other-title{text-align:center;color:#0d2845;font-size:17px;font-weight:700;margin-block-end:16px}
.paper-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0 0 18px;padding:12px 0;border-block:1px solid #d4d1c8}
.paper-meta dt,.paper .secondary-language{font-size:12px;color:#49515b}
.paper-meta dd{margin:2px 0 0;overflow-wrap:anywhere}
.paper-table{table-layout:fixed}
.paper-table th,.paper-table td{padding:7px 8px;border-block-end:1px solid #ddd;background:transparent;color:#1c1f24;vertical-align:top;font-size:13px}
.paper-table thead th{background:#f0eee8;position:static}
.paper-table col:first-child{inline-size:50%}.paper-table col:nth-child(2){inline-size:35%}
.paper-table .line-serials{display:flex;flex-wrap:wrap;gap:2px 10px}
.paper .condition{display:grid;gap:4px;margin-block:16px 28px;font-size:13px}
.signatures{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.signatures>div{padding-block-start:8px;border-block-start:1px solid #777}
:root[data-theme=dark] dialog,:root[data-theme=dark] .givefoot,:root[data-theme=dark] .toast{background:var(--raised)}
:root[data-theme=dark] dialog{box-shadow:none}

@media(max-width:1000px){
  .master{grid-template-columns:minmax(0,1fr)}
  .master.open>.list{display:none}
  .master:not(.open)>.detail{display:none}
  .detail{position:static;max-block-size:none}
  .back{display:inline-flex}
}
@media(max-width:799px){
  :root{--edge:16px;--pad:16px;--gap:16px}
  .hero .wrap{padding-inline:var(--edge)}
  .titlerow{padding-block:18px 13px}
  .responsive thead{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .responsive,.responsive tbody{display:block}

  .form-line{grid-template-columns:minmax(0,1fr) minmax(104px,auto);gap:6px 10px}

  .givebody{flex:1;scrollbar-gutter:auto}
  .countgroup .form-line{grid-template-columns:minmax(0,1fr)}
  .paper{min-block-size:0;padding:16px 14px}
  .paper h1{font-size:21px}
  .paper-table th,.paper-table td{padding-inline:4px;font-size:12px}
}
@media(prefers-reduced-motion:no-preference){
  :is(.primary,.secondary,.ghost,.filter,.sectiontabs a,.subtabs a,.row-select){transition:background-color 120ms cubic-bezier(.2,0,0,1),border-color 120ms cubic-bezier(.2,0,0,1),color 120ms cubic-bezier(.2,0,0,1)}

.signatures .secondary-language{display:block}
.results .actions{gap:4px}

.counted-serials .iconbtn{border:0}
.discard-panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;inline-size:100%}

.reason .textbtn{font:inherit;min-block-size:44px}

@media(max-width:799px){

}

  const choose = (_, param, alternatives) => {
    const category = plurals[lang].select(values[param])
    const forms = alternatives.split('|')
    const order = lang === 'en' ? ['one', 'other'] : ['zero', 'one', 'two', 'few', 'many', 'other']
    return forms[order.indexOf(category)] ?? forms.at(-1)
  }
  return str.replace(/\{(\w+)#((?:[^{}]|\{\w+\})+)\}/g, choose).replace(/\{(\w+)\}/g, (_, param) => {

function kitSummary(lines, omitted = null) {
  const parts = []
  for (const l of lines) {
    if (l === omitted) continue
    const units = D.units(l)
    const key = l.item.endsWith('-mag') ? 'magazineUnits'
      : D.isAmmo(l.item) ? 'roundUnits' : l.item === 'sling' ? 'slingUnits' : l.item.endsWith('-holster') ? 'holsterUnits' : null
    parts.push(key ? t(key, { n: units }) : l.serial ? `${itemName(l.item)} ${isol(l.serial)}` : t('lineQty', { n: units, item: itemName(l.item) }))
  }
  return parts.join(' · ')
}
function itemSummary(lines) {
  const main = mainLine(lines)
  if (!main) return t('holdsNone')
  const aggregate = groupedLines(lines)
  const first = aggregate.find(g => g.item.id === main.item)
  const item = first.qty === 1 && main.serial ? `${local(first.item)} ${isol(main.serial)}`
    : first.item.id === 'radio' ? t('radioUnits', { n: first.qty }) : t('lineQty', { n: first.qty, item: local(first.item) })
  return `${item}${aggregate.length > 1 ? ` ${t('moreItems', { n: aggregate.length - 1 })}` : ''}`
}
function holdingsOverview(id, inline = false) {
  const tag = inline ? 'span' : 'p', held = D.holdings(id)
  return held.length ? held.map(h => `<${tag}>${itemSummary(h.lines)} · ${t(h.kind)}${h.overdue ? ` · <b class="danger-tone">${t('overdue')}</b>` : ''}</${tag}>`).join(inline ? ' · ' : '') : `<span class="muted">${t('holdsNone')}</span>`
}

/* The catalogue is a state ledger, not a collection of safe-specific columns. */
function equipmentView() {
  const selected = D.item(state.item)
  if (selected) return equipmentDetail(selected)
  const batches = D.batches(), groups = []
  const heads = [col(t('item')), col(t('trackedBy')), col(t('inSafe'), 'num'), col(t('onShift'), 'num'), col(t('inCustody'), 'num'), col(t('inRepair'), 'num'), col(t('total'), 'num'), col(t('stockNote'))]
  for (const group of D.groups) {
    if (state.category && group.id !== state.category) continue
    const records = D.items.filter(i => i.group === group.id && rowMatches(state.query, i.en, i.ar, ...(i.serials || []).map(s => s.id))).map(item => {
      const ledger = D.rollup(item), r = ledger.bySafe[state.scopeSafe] || ledger
      const pending = state.scopeSafe ? item.unrecorded?.[state.scopeSafe] : D.unrecorded(item)
      const here = batches.filter(b => b.item === item && (!state.scopeSafe || b.stock[state.scopeSafe]))
      const expiry = here.filter(b => b.status === 'expired').reduce((n, b) => n + (state.scopeSafe ? b.stock[state.scopeSafe] : b.total), 0)
      const soon = here.some(b => b.status === 'expiring')
      const missing = ledger.states.filter(s => inScope(s) && s.state === 'missingSerial').length
      const notes = [
        missing && `<span class="danger-tone">${t('missingFirearmN', { n: missing })}</span>`,
        expiry && `<span class="warning-tone">${t('expiredUnits', { n: expiry })}</span>`,
        soon && `<span class="warning-tone">${t('batchExpiring')}</span>`,
        pending && t('unrecordedN', { n: pending }),
        r.writtenOff && t('writtenOffN', { n: r.writtenOff }),
        r.awaiting && link(t('awaitingN', { n: r.awaiting }), route({ tab: 'decisions' }), 'tab', { id: 'decisions', cls: 'textbtn' }),
        r.expended && t('expendedN', { n: r.expended }),
        r.received && t('receivedN', { n: r.received }),
      ].filter(Boolean).join(' · ')
      return { item, r, notes, attention: Boolean(missing || expiry || soon || pending || r.repair || r.awaiting) }
    }).filter(({ r, attention }) => state.stockView === 'all' || state.stockView === 'uncounted' && r.total === null || state.stockView === 'attention' && attention)
    if (records.length) groups.push(`<tbody class="group" role="rowgroup">${row(`<th class="group-title" scope="rowgroup" colspan="${heads.length}">${local(group)}</th>`, 'class="group-head"')}
      ${records.map(({ item, r, notes }) => {
        const name = link(local(item), route({ tab: 'items', item: item.id }), 'item', { id: item.id, cls: 'item-link', glyph: 'chevron' })
        const mobile = r.inSafe === null ? t('notCountedInventory') : t('stockRowSummary', { safe: r.inSafe, out: r.onShift, custody: r.custody })
        return row(rowHeader(`<div class="ident">${art(item)}<div class="copy">${name}<span class="item-meta-mobile desc">${trackingLabel(item)} · ${mobile}${r.repair ? ` · ${t('inRepair')}: ${fmtN(r.repair)}` : ''}</span></div></div>`)
          + cell(trackingLabel(item), 'desktop-stock') + [r.inSafe, r.onShift, r.custody, r.repair].map(n => cell(n === null ? dash() : fmtN(n), 'num desktop-stock')).join('')
          + cell(r.total === null ? `<span class="desc">${t('notCounted')}</span>` : fmtN(r.total), 'num stock-total')
          + cell(notes ? `<span class="small-stock-note">${notes}</span>` : dash(), 'stock-note'), `data-item-row="${item.id}"`)
      }).join('')}</tbody>`)
  }
  const filters = `<div class="item-toolbar">${searchField('scope-search', state.query, t('searchEquipment'))}
    ${select(t('category'), 'item-category', [['', t('allCategories')], ...D.groups.map(g => [g.id, local(g)])], state.category)}
    ${select(t('stockViews'), 'stock-view', [['all', t('all')], ['attention', t('needsWork')], ['uncounted', t('notCounted')]], state.stockView)}</div>`
  return `<section class="panel section" aria-label="${t('itemsTab')}">${filters}
    ${groups.length ? table(t('itemsTab'), heads, groups.join(''), 'item-table', heads.length) : `<p class="content muted">${t('noEquipment')}</p>`}</section>`
}
const batchLabel = status => t({ expired: 'batchExpired', expiring: 'batchExpiring', valid: 'batchValid' }[status])
function equipmentDetail(item) {

  } else if (state.itemPane === 'history') {

    }).join('')}</ul>

    ${item.tracking === 'serial' ? ledger.states.length ? serialTable(item, ledger.states) : `<p class="content desc">${t('noSerials')}</p>` : ''}
    ${item.batches ? item.batches.length ? `<ul class="serial-list">${D.batches().filter(b => b.item === item).sort((a, b) => a.expiry.localeCompare(b.expiry)).map(b => `<li>

      <span class="desc">${t('batchExpiry')}: ${isol(dateText(b.expiry))}</span><div class="meta"><span>${t('batchStockN', { n: b.total })}</span>
      ${D.safes.map(s => `<span>${local(s.site)}: ${fmtN(b.stock[s.id])}</span>`).join('')}</div></li>`).join('')}</ul>`

function serialTable(item, states) {
  const out = D.out()
  return D.safes.map(safe => {
    const found = states.filter(s => s.safe === safe.id).sort((a, b) => Number(a.state === 'inSafe') - Number(b.state === 'inSafe'))
    if (!found.length) return ''
    return `<section><h3 class="unit-site">${local(safe)}</h3><ul class="unit-records">
      ${found.map(s => {
        const issue = out.find(r => r.remaining.some(l => l.serial === s.id)), status = serialState(s, issue)
        return `<li data-serial-line="${keyAttr(s.id)}">${button(`<b>${isol(s.id)}</b>
          <span class="unit-state">${chip(t(status), status === 'overdue' || status === 'missingSerial' ? 'danger' : glyphs[s.state], stateGlyph[status])}</span>
          <span class="desc unit-holder">${s.holder ? `${local(s.holder)}${s.holder.id ? ` · ${isol(s.holder.id)}` : ''}` : (s.note ? readableNote(s.note) : dash())}</span>
          <span class="desc unit-since">${stamp(s.since)}</span>`, 'serial-detail', {
          cls: `unit-record${s.id === state.equipmentSerial ? ' selected' : ''}`, id: s.id, glyph: 'chevron',
          attrs: `data-serial-row="${keyAttr(s.id)}"`,
          accessible: `${item[state.lang]}, \u2066${s.id}\u2069, ${t(status)}`,
        })}</li>`
      }).join('')}</ul></section>`
  }).join('')
}

/* Custody: newest active records first, then closed records. Phone Back restores the row. */
const custodyOrder = (a, b) => Number(Boolean(a.ended)) - Number(Boolean(b.ended)) || b.since.localeCompare(a.since)
function custodyView() {
  const records = D.custodies.filter(c => (state.custodyFilter === 'all' || Boolean(c.ended) === (state.custodyFilter === 'ended'))
    && inScope(c) && rowMatches(state.query, c.id, c.holder, custodian(c).en, custodian(c).ar, ...c.lines.map(l => l.serial))).sort(custodyOrder)
  const selected = records.find(c => c.id === state.custody) || records[0]
  const filters = ['active', 'ended', 'all'].map(key => button(t(key), 'custody-filter', { id: key, cls: 'filter', attrs: `aria-pressed="${state.custodyFilter === key}"` })).join('')
  const list = `<section class="panel list" aria-label="${t('custody')}"><div class="toolbar"><div class="filters" role="group" aria-label="${t('status')}">${filters}</div>${countTag(records.length)}${searchField('scope-search', state.query, t('searchCustody'))}</div>
    ${records.length ? `<ul class="selection-list">${records.map(c => {
      const active = c === selected, lines = c.ended ? c.lines : D.remaining(c)
      const dates = c.ended ? t('period', { from: stamp(c.since), to: stamp(c.ended) }) : stamp(c.since)
      return `<li>${link(`<span class="record-top"><span class="name">${local(custodian(c))}</span>${chip(t(c.ended ? 'ended' : 'active'), c.ended ? '' : 'success')}</span>
          <span class="desc">${isol(c.id)} · ${t(c.kind === 'site' ? 'siteKind' : 'person')} · ${dates}</span><span class="desc">${itemSummary(lines)}</span>`,
        route({ tab: 'custody', custody: c.id }), 'custody', { id: c.id, cls: `row-select${active ? ' selected' : ''}`, attrs: active ? 'aria-current="true"' : '' })}</li>`
    }).join('')}</ul>` : `<p class="content muted">${t('custodyNoRows')}</p>`}
  </section>`
  return `<div class="master${state.custodyDetail && selected ? ' open' : ''}">${list}${selected ? custodyDetail(selected) : ''}</div>`
}
function groupedLines(lines) {
  const byItem = new Map()
  for (const line of lines) {
    const acc = byItem.get(line.item) || { item: D.item(line.item), qty: 0, serials: [] }
    acc.qty += D.units(line)
    if (line.serial) acc.serials.push(line.serial)
    byItem.set(line.item, acc)
  }
  return [...byItem.values()]
}
function listLines(lines) {
  return `<ul class="list-lines">${groupedLines(lines).map(l => `<li>${art(l.item)}<span><span class="name">${local(l.item)}</span>
    ${l.serials.length ? `<span class="desc">${joined(l.serials.map(isol))}</span>` : ''}</span><b>${fmtN(l.qty)}</b></li>`).join('')}</ul>`
}
function custodyDetail(record) {

        ${edit() && !record.ended ? button(t('endCustody'), 'end-custody', { id: record.id }) : ''}
      </div>
    </div></section>`
}

const pair = label => `${scoped(state.lang, lang => t(label, {}, lang))}<br><span class="secondary-language">${scoped(state.lang === 'en' ? 'ar' : 'en', lang => t(label, {}, lang))}</span>`
const pairValue = value => `${scoped(state.lang, lang => local(value, lang))}<br><span class="secondary-language">${scoped(state.lang === 'en' ? 'ar' : 'en', lang => local(value, lang))}</span>`

/* Qualified guards: filter counts track the active/former scope, not the current chip. */
function matchesPerson(person, search) {
  const q = search.trim().toLowerCase()
  return !q || [person.id, person.en, person.ar].some(value => value.toLowerCase().includes(q))
}
function searchField(name, value, placeholder, label = placeholder) {
  return `<div class="search">${icon('search')}<label class="sr" for="${name}">${label}</label>
    <input type="search" id="${name}" name="${name}" placeholder="${placeholder}" value="${escape(value)}" autocomplete="off">
    ${button(icon('close'), 'clear-search', { id: name, cls: 'iconbtn', accessible: t('clearSearch'), attrs: value ? '' : 'hidden' })}</div>`
}
function guardsView() {
  const all = (state.showFormer ? D.guards.filter(g => g.course) : D.activeGuards()).filter(g => matchesPerson(g, state.guardQuery))
  const filtered = all.filter(g => state.guardFilter === 'all' || !g.former && D.licenceStatus(g).kind === state.guardFilter)
  const order = { expiring: 0, expired: 1, missing: 2, valid: 3 }
  filtered.sort((a, b) => Number(Boolean(a.former)) - Number(Boolean(b.former)) || order[D.licenceStatus(a).kind] - order[D.licenceStatus(b).kind] || a.id.localeCompare(b.id))
  const filters = [['all', 'all'], ['missing', 'missingFilter'], ['expiring', 'expiringFilter'], ['expired', 'expired'], ['valid', 'valid']].map(([value, label]) => {
    const n = all.filter(g => value === 'all' || !g.former && D.licenceStatus(g).kind === value).length, active = state.guardFilter === value
    return button(`<span>${t(label)} ${fmtN(n)}</span>`, 'guard-filter', { id: value, cls: 'filter', attrs: `aria-pressed="${active}"${!n && !active ? ' disabled' : ''}` })
  }).join('')
  const applied = Number(state.guardFilter !== 'all') + Number(state.showFormer) + Number(Boolean(state.guardQuery))
  const toolbar = `<div class="toolbar">
    <div class="filters" role="group" aria-label="${tPlain('filters', { n: applied })}">${filters}</div>
    <label class="checklabel"><input id="show-former" type="checkbox"${state.showFormer ? ' checked' : ''}><span>${t('showFormer')}</span></label>
    <div class="actions">${searchField('guard-search', state.guardQuery, t('searchGuard'))}${applied ? button(t('clearFilters'), 'clear-guard-filters', { cls: 'textbtn' }) : ''}</div>
    <span class="desc" role="status">${t('guardCount', { n: filtered.length })}</span>
    </div>`
  const headers = [col(t('guard')), col(t('courseRound')), col(t('securityNumber')), col(t('securityExpiry')), col(t('licenceState')), col(t('holdsNow'))]
  if (edit()) headers.push(col(`<span class="sr">${t('action')}</span>`))
  const guardRow = g => {
    const holdings = holdingsOverview(g.id)
    const status = g.former ? chip(t(g.former)) : licenceChip(D.licenceStatus(g))
    const identity = button(guardIdentity(g.id), 'guard-detail', { id: g.id, cls: 'guard-name' })
    const editor = edit() && !g.former ? button(t(g.licence ? 'updateLicence' : 'addLicence'), 'licence', { id: g.id, cls: 'textbtn', accessible: `${t(g.licence ? 'updateLicence' : 'addLicence')}: ${g[state.lang]}` }) : ''
    const clearance = g.former && D.holdings(g.id).length ? `<span class="desc">${t('clearanceCustody')}</span>` : ''
    return row(rowHeader(`${identity}${g.former ? `<span class="guard-former">${status}</span>` : ''}
      <div class="guard-compact"><div class="meta">${status}${g.licence ? stamp(g.licence.expiry) : ''}</div>${holdings}${clearance}</div>`)
      + cell(round(g.course), 'guard-desktop')
      + cell(g.licence ? isol(g.licence.number) : dash(), 'guard-desktop')
      + cell(g.licence ? stamp(g.licence.expiry) : dash(), 'guard-desktop')
      + cell(g.former ? dash() : status, 'guard-desktop')
      + cell(`${holdings}${clearance}`, 'guard-desktop') + (edit() ? cell(editor, 'row-action') : ''), `data-guard-row="${g.id}"`)
  }

/* Dialog chrome: original opener, an inert page, labelled disabled-save reason. */
let overlayPreset = {}
let closeFallback = null
let toastTimer
function toast(message) {
  const node = $('#toast')
  node.textContent = message
  node.hidden = false

const focusTo = (selector, preventScroll = true) => {
  const node = selector && $(selector)
  if (node?.getClientRects().length) {
    if (!node.matches('a,button,input,select,summary,[tabindex]')) node.tabIndex = -1
    node.focus({ preventScroll })
    return true
  }
  return false
}
const attrSelector = (key, val) => `[${key}="${CSS.escape(String(val))}"]`
const actionSelector = (action, id) => `[data-action="${action}"]${id === undefined ? '' : attrSelector('data-id', id)}`
function pulse(selector) {
  const target = $(selector)
  if (target && matchMedia('(prefers-reduced-motion: no-preference)').matches) {
    target.classList.add('changed')
    target.addEventListener('animationend', () => target.classList.remove('changed'), { once: true })
  }
}
function discardDialog() {
  dialog.onclose = null
  dialog.onclick = null
  dialog.oncancel = null
  if (dialog.open) dialog.close()
  overlayPreset = {}
}
function modal({ title, subtitle = '', body, submit, opener, first, wide = false, preset = {}, variant = 'task-sheet', onCancel }) {
  discardDialog()
  overlayPreset = preset
  closeFallback = null
  dialog.classList.toggle('wide', wide)
  dialog.dataset.variant = variant
  dialog.innerHTML = `<form class="giveform" novalidate>
    <div class="givehead"><div><h2 id="dlg-title">${title}</h2>${subtitle ? `<p class="desc">${subtitle}</p>` : ''}</div>
      ${button(icon('close'), 'dismiss', { cls: 'iconbtn', accessible: t('close') })}</div>
    <div class="givebody">${body}</div>
    <div class="givefoot"><div class="reason"><p id="save-progress" aria-live="polite"></p><div id="save-reason" aria-live="polite"></div></div><div class="actions">
      ${button(t('cancel'), 'dismiss', { cls: 'secondary' })}<button type="submit" class="primary" id="submit" aria-describedby="save-reason" disabled>${submit}</button>
    </div><div class="discard-panel" hidden></div></div></form>`
  const form = $('form', dialog), save = $('#submit', dialog), why = $('#save-reason', dialog), progress = $('#save-progress', dialog)
  const refresh = result => {
    const { reason, progress: text = '' } = typeof result === 'string' ? { reason: result } : result
    save.disabled = Boolean(reason)
    if (progress.innerHTML !== text) progress.innerHTML = text
    if (why.innerHTML !== reason) why.innerHTML = reason
    return reason
  }
  const start = (validate, onSave, { dirty, discardKey, handleReason } = {}) => {
    let prior = null
    const confirmation = $('.discard-panel', dialog), normalActions = $('.givefoot .actions', dialog)
    const cancel = () => {
      if (!dirty?.()) { dialog.close(); return }
      if (!confirmation.hidden) return
      prior = document.activeElement
      why.parentElement.hidden = normalActions.hidden = true
      confirmation.hidden = false
      confirmation.innerHTML = `<p role="alert">${t(discardKey)}</p><div class="actions">${button(t('keepEditing'), 'keep', { cls: 'secondary' })}${button(t('discard'), 'discard')}</div>`
      $('[data-action="keep"]', confirmation).onclick = () => {
        confirmation.hidden = true
        why.parentElement.hidden = normalActions.hidden = false
        prior?.focus()
      }
      $('[data-action="discard"]', confirmation).onclick = () => dialog.close()
      $('[data-action="keep"]', confirmation).focus()
    }
    $$('[data-action="dismiss"]', dialog).forEach(b => { b.onclick = cancel })
    dialog.oncancel = event => { event.preventDefault(); cancel() }
    if (handleReason) why.onclick = handleReason
    form.addEventListener('input', () => refresh(validate()))
    form.addEventListener('change', () => refresh(validate()))
    form.onsubmit = event => {
      event.preventDefault()
      const reason = refresh(validate())
      if (edit() && !reason && confirmation.hidden) onSave()
    }
    dialog.onclose = () => {
      if (dialog.open) return
      overlayPreset = {}
      if (onCancel && !closeFallback) { onCancel(); return }
      sync()
      if (!closeFallback || !focusTo(closeFallback, false)) if (!focusTo(opener)) focusTo('#screen-title')
    }
    const initial = first && $(first, dialog)
    initial?.setAttribute('autofocus', '')
    refresh(validate())
    dialog.showModal()
    initial?.focus({ preventScroll: true })
    sync()
  }
  return { form, refresh, start }
}

  closeFallback = fallback
  D.assertLedger()

      ${!custody ? `<details class="countgroup">${disclosure(`${t('dueBack')}: ${isol(shiftEnd.time)} · ${t('changeDue')}`)}
        <div class="fieldpair">${dmyField(t('date'), 'due-date', shiftEnd.date)}

    submit: t(custody ? 'handover' : 'signout'), wide: true, variant: 'task-sheet', opener, first: person ? '#f-kit' : '#assignment-search',

  })
  const form = ui.form, box = $('#assignment-picker', form), eligibility = $('#eligibility', form)

  const isSite = () => custody && f('holder-kind').value === 'site'
  const weapon = () => D.kits[f('kit').value].weapon

  const blockReason = id => {
    if (!weapon()) return ''

  }
  const offDuty = () => Boolean(!custody && person && D.guard(person).duty !== f('safe').value)
  const warning = () => {
    if (!person || !weapon() || !D.guard(person).course) return null
    return D.licenceStatus(D.guard(person))
  }
  const requiresAck = () => ['missing', 'expired'].includes(warning()?.kind)
  const lineSpec = () => D.kits[f('kit').value].quantities.map(([item, qty]) => [item === 'right-holster' ? holster : item, qty])
  const excessRounds = () => lineSpec().some(([id, standard]) => D.isAmmo(id) && f(id) && stepValue(f(id)) > standard)
  const balances = id => D.rollup(D.item(id)).bySafe[f('safe').value].inSafe
  const formState = () => {
    for (const input of $$('[data-stepper] input', form)) qtyDraft[input.name] = stepValue(input)
    for (const input of $$('[data-kit-serial] select', form)) serialDraft[input.name] = input.value
  }
  const qtyControl = (id, standard) => {
    const max = balances(id), wanted = qtyDraft[id] ?? standard
    return stepper(id, `${t('quantity')}: ${D.item(id)[state.lang]}`, Math.min(max, wanted), max, wanted > max ? t('onlyLeft', { n: max }) : '')
  }
  const line = (id, control) => `<div class="form-line">${id.endsWith('-holster') ? `<div class="ident">${art(D.item(id))}</div>` : unitIdentity({ item: id })}<div class="mobile-stretch">${control}</div></div>`
  const drawKit = () => {
    const gun = weapon(), safe = f('safe').value
    if (!gun) $('#extras-panel', form).open = true
    $('#kit-controls', form).innerHTML = gun ? `<div><h3>${t('options')}</h3>
      ${line(gun, `<div data-kit-serial>${serialField(gun, 'weapon', safe, serialDraft.weapon, false)}</div>`)}
      ${lineSpec().map(([id, qty]) => line(id, `${['right-holster', 'left-holster'].includes(id) ? select(t('holster'), 'holster-side',
        ['right-holster', 'left-holster'].map(choice => [choice, itemName(choice)]), holster) : ''}${qtyControl(id, qty)}`)).join('')}</div>` : ''
    $('#extra-controls', form).innerHTML = D.extras.map(id => {
      const it = D.item(id)
      return line(id, it.tracking === 'serial' ? `<div data-kit-serial>${serialField(id, id, safe, serialDraft[id])}</div>` : qtyControl(id, 0))
    }).join('')
    const holsterInput = f('holster-side')
    if (holsterInput) holsterInput.onchange = () => {
      formState()
      if (qtyDraft[holster] !== undefined) qtyDraft[holsterInput.value] = qtyDraft[holster]
      holster = holsterInput.value
      drawKit()
      f('holster-side').focus()
    }
    wireSteppers($('#kit-controls', form))
    wireSteppers($('#extra-controls', form))
  }
  const personMeta = g => `<div class="actions">${g.course ? licenceChip(D.licenceStatus(g)) : ''}<span class="desc">${t('holding', { items: holdingsOverview(g.id, true) })}</span></div>`
  const drawEligibility = () => {
    const licence = warning(), g = person ? D.guard(person) : null, blocked = person && blockReason(person)
    const previousReason = f('off-duty')?.value
    const previousNote = f('off-duty-note')?.value
    const editLicence = g && requiresAck() && !blocked ? `<details class="countgroup">${disclosure(t(g.licence ? 'updateLicenceNow' : 'addLicenceNow'))}
      <div class="fieldpair">${field(t('securityNumber'), 'inline-number', `dir="ltr" maxlength="80" value="${keyAttr(g.licence?.number || '')}"`)}
      ${dmyField(t('securityExpiry'), 'inline-expiry', g.licence?.expiry || '')}</div>
      <p class="desc" id="inline-licence-past" hidden>${t('pastLicenceDate')}</p>
      ${button(t('save'), 'inline-licence', { attrs: 'disabled aria-describedby="inline-licence-past"' })}</details>` : ''
    eligibility.innerHTML = `${offDuty() ? notice(`<p><b>${t('offDuty')}</b></p>${select(t('offDutyReason'), 'off-duty', [['', t('chooseReason')], ...D.dutyReasons.map(key => [key, t(key)])], previousReason || '')}
        <div id="duty-other" hidden>${textarea(t('reasonDetail'), 'off-duty-note', 'maxlength="160"')}</div>`, 'warning-tone') : ''}
      ${blocked ? notice(`<b>${blocked}</b>`, 'warning-tone') : ''}
      ${!blocked && licence?.kind === 'expiring' ? notice(`<b>${t('licenceWarningDate', { warning: t('licenceExpiringWarning', { n: licence.days }).replace(/\.$/, ''), date: stamp(g.licence.expiry) })}</b>`, 'warning-tone', 'licence') : ''}
      ${!blocked && requiresAck() ? notice(`<p><b>${t(licence.kind === 'expired' ? 'licenceExpiredWarning' : 'licenceMissingWarning')}</b></p>
        ${checked('licence-ack', t(custody ? 'custodyAck' : 'licenceAck', { name: local(g) }), false, 'required')}${editLicence}`, 'warning-tone', 'licence') : ''}`
    if (previousNote && f('off-duty-note')) f('off-duty-note').value = previousNote
    const inline = $('[data-action="inline-licence"]', eligibility)
    if (inline) {
      const expiry = f('inline-expiry'), number = f('inline-number'), past = $('#inline-licence-past', eligibility)
      const refreshInline = () => {
        const parsed = parseStockDate(expiry.value)
        inline.disabled = !parsed || !number.value.trim()
        past.hidden = !parsed || parsed >= D.today
      }
      expiry.oninput = number.oninput = refreshInline
      refreshInline()
      inline.onclick = () => {
        g.licence = { number: number.value.trim(), expiry: parseStockDate(expiry.value) }
        drawPicker(); drawEligibility(); render()
        ui.refresh(validate())
        $('.chosen button', box)?.focus()
        toast(t('savedLicence'))
      }
    }
  }
  const chooseGuard = id => {
    if (blockReason(id)) return
    person = id
    query = ''
    drawPicker()
    eligibility.replaceChildren()
    drawEligibility()
    ui.refresh(validate())
    $('.chosen button', box)?.focus()
  }
  const drawPicker = (focus = false) => {
    if ($('#site-choice', form)) $('#site-choice', form).hidden = !isSite()
    if (!needsPerson()) { box.innerHTML = ''; return }
    const label = t(isSite() ? 'siteSupervisor' : 'guard')
    if (person) {
      const g = D.guard(person), duty = g.duty === f('safe').value
      box.innerHTML = `<div class="flow"><h3>${label}</h3><div class="chosen"><div>${guardIdentity(person)}${duty && !custody ? `<span class="desc small">${t('onDutyHere')}</span>` : ''}${personMeta(g)}</div>${button(t('change'), 'change-guard')}</div></div>`
      $('[data-action="change-guard"]', box).onclick = () => {
        person = ''
        drawPicker(true)
        drawEligibility()
        ui.refresh(validate())
      }
      return
    }
    box.innerHTML = `<div><h3>${label}</h3>${isSite() ? `<p class="desc">${t('supervisorHint')}</p>` : ''}
      ${searchField('assignment-search', query, t('searchGuard'))}<div class="picker-list" id="picker-list"></div></div>`
    const input = $('#assignment-search', box), results = $('#picker-list', box)
    const enabled = () => $$('[data-action="pick"]:enabled', results)
    const drawResults = () => {
      const available = D.guards.filter(g => !g.former && g.id !== D.currentUser && matchesPerson(g, query))
      results.innerHTML = !available.length ? `<p class="picker-none" role="status">${t('noGuardFound', { query: `<bdi>${escape(query)}</bdi>` })}</p>` :
        (custody ? [null] : [true, false]).map(here => {
          const group = available.filter(g => here === null || (g.duty === f('safe').value) === here)
          if (!group.length) return ''
          return `<div>${here === null ? '' : `<h4>${t(here ? 'onDutyHere' : 'otherGuards')}</h4>`}<ul class="results">${group.map(g => {
            const blocked = blockReason(g.id)
            return `<li><div class="result-label">${guardIdentity(g.id)}${personMeta(g)}${blocked ? `<span class="desc" id="blocked-${g.id}">${blocked}</span>` : ''}</div>
              ${button(t('choose'), 'pick', { id: g.id, accessible: `${t('choose')}: ${g[state.lang]}`, attrs: blocked ? `disabled aria-describedby="blocked-${g.id}"` : '' })}</li>`
          }).join('')}</ul></div>`
        }).join('')
      $('[data-action="clear-search"]', box).hidden = !query
      enabled().forEach(b => { b.onclick = () => chooseGuard(b.dataset.id) })
    }
    $('[data-action="clear-search"]', box).onclick = () => { input.value = query = ''; drawResults(); input.focus() }
    input.oninput = () => { query = input.value; drawResults() }
    input.onkeydown = e => {
      if (e.key === 'Enter' || e.key === 'ArrowDown') {
        e.preventDefault()
        if (e.key === 'Enter' && enabled().length === 1) chooseGuard(enabled()[0].dataset.id)
        else enabled()[0]?.focus()
      }
    }
    results.onkeydown = e => {
      if (!['ArrowUp', 'ArrowDown'].includes(e.key)) return
      const buttons = enabled(), current = buttons.indexOf(document.activeElement)
      if (current < 0) return
      e.preventDefault()
      if (e.key === 'ArrowUp' && current === 0) input.focus()
      else buttons[clamp(current + (e.key === 'ArrowUp' ? -1 : 1), 0, buttons.length - 1)]?.focus()
    }
    drawResults()
    if (focus) input.focus()
  }
  function lines() {
    const result = []
    if (weapon() && f('weapon')?.value) result.push({ item: weapon(), serial: f('weapon').value })
    for (const [id] of lineSpec()) {
      const qty = stepValue(f(id))
      if (qty) result.push({ item: id, qty })
    }
    for (const id of D.extras) {
      const input = f(id)
      if (D.item(id).tracking === 'serial' && input.value) result.push({ item: id, serial: input.value })
      if (D.item(id).tracking === 'quantity' && stepValue(input)) result.push({ item: id, qty: stepValue(input) })
    }
    return result
  }
  const due = () => {
    const date = parseStockDate(f('due-date').value), hm = westernDigits(f('due-time').value).trim()
    const ok = /^([01]\d|2[0-3]):[0-5]\d$/.test(hm)
    return date && ok ? D.instant(date, hm) : ''
  }
  function validate() {
    if ($('#duty-other', form)) $('#duty-other', form).hidden = f('off-duty').value !== 'other'
    $('#excess-rounds', form).hidden = !excessRounds()
    if (isSite() && !f('site').value) return t('chooseSite')
    if (needsPerson() && !person) return t('chooseGuard')
    if (needsPerson() && person && blockReason(person)) return blockReason(person)
    if (offDuty() && !valueOf('off-duty', form)) return t('needReason')
    if (offDuty() && f('off-duty').value === 'other' && valueOf('off-duty-note', form).length < 3) return t('needReasonDetail')
    if (requiresAck() && !f('licence-ack')?.checked) return t('needAck')
    if (weapon() && !f('weapon')?.value) return t('needSerial')
    if (excessRounds() && valueOf('excess-reason', form).length < 3) return t('needExcess')
    if (!lines().length) return t('needEquipment')
    if (!custody) {
      const time = Date.parse(due())
      if (!(time > Date.parse(D.now))) return t('needDue')
      if (time > Date.parse(D.nextShiftEnd())) return t('dueCap')
    }
    return ''
  }
  f('safe').onchange = () => {
    formState()
    drawKit()
    drawPicker()
    drawEligibility()
  }
  f('kit').onchange = () => {
    qtyDraft = {}; serialDraft = {}; holster = 'right-holster'
    drawKit()
    drawPicker()
    drawEligibility()
  }
  if (custody) f('holder-kind').onchange = () => { person = ''; drawPicker(); drawEligibility() }
  drawKit()
  drawPicker()
  drawEligibility()
  ui.start(validate, () => {
    const common = { safe: f('safe').value, actor: D.currentUser, lines: lines(), licenceWarning: requiresAck() }
    if (excessRounds()) common.excessReason = valueOf('excess-reason', form)
    if (custody) {
      const r = { ...common, id: D.number('CU', D.custodies), kind: isSite() ? 'site' : 'person', holder: isSite() ? f('site').value : person, since: D.today, issuedAt: D.now, note: valueOf('condition-note', form) }
      if (isSite() && weapon()) r.supervisor = person
      if (weapon()) r.licenceNumber = D.guard(person)?.licence?.number || ''
      D.custodies.push(r)
      selectCustody(r.id)
      complete('savedCustody', '#custody-detail', actionSelector('custody', r.id))
    } else {
      const r = { ...common, id: D.number('SO', D.issues), guard: person, issuedAt: D.now, due: due() }
      if (offDuty()) { r.dutyReason = f('off-duty').value; r.dutyNote = valueOf('off-duty-note', form) }
      D.issues.push(r)
      state.shiftLane = 'out'
      complete('savedIssue', '#shift-queue', attrSelector('data-record', r.id))
    }
  })
}

    body: `<div class="fieldpair">

      ${dmyField(t('securityExpiry'), 'security-expiry', g.licence?.expiry || '')}

function recordSerials(id, opener) {
  const item = D.item(id)
  if (!item || !D.unrecorded(item)) return
  const choices = safeOptions().filter(([safe]) => item.unrecorded[safe])
  const ui = modal({
    title: t('recordSerials'), subtitle: `${local(item)} · ${t('unrecordedN', { n: D.unrecorded(item) })}`,
    body: `<div class="flow">${select(t('safe'), 'safe', choices, choices[0][0])}
      ${serialPad('serial-text-serials')}
      <p id="serial-limit" class="desc"></p></div>`,
    submit: t('save'), opener, first: '#f-safe',
  })
  const serials = () => splitSerials(valueOf('serial-text-serials', ui.form))
  const existing = registeredSerials()
  const safe = () => valueOf('safe', ui.form)
  function validate() {
    const ids = serials(), limit = item.unrecorded[safe()]
    $('#serial-limit', ui.form).innerHTML = t('serialLimit', { n: limit })
    const counts = new Map()
    ids.forEach(id => counts.set(id, (counts.get(id) || 0) + 1))
    const errors = serialReview($('[data-serial-pad]', ui.form), ids, existing, counts)
    if (!ids.length) return t('needSerialEntry')
    if (errors) return t('fixSerials')
    return ids.length > limit ? t('serialLimit', { n: limit }) : ''
  }
  wireStockTools(ui.form, () => ui.refresh(validate()))
  ui.start(validate, () => {
    for (const serial of serials()) {
      item.serials.push({ id: serial, safe: safe(), since: D.today })
      item.unrecorded[safe()]--
    }
    complete('savedSerials', '#equipment-detail', attrSelector('data-item-row', id))
  })
}

/* Blind monthly count: add what was observed without revealing the safe’s book values. */
function monthlyCount(opener) {
  const startSafe = currentSafe()
  const ui = modal({
    title: t('newCount'), subtitle: stamp(D.now),
    body: `<div class="flow"><p>${t('blindHint')}</p><div class="fieldpair count-context">${state.scopeSafe ? `<div><h3>${safeName(startSafe)}</h3>${scopedSafeField(startSafe)}</div>` : select(t('safe'), 'safe', safeOptions(), startSafe)}${witnessField('witness', startSafe, [], 'countWitness')}</div>
      <div id="count-lines"></div></div>`,
    submit: t('saveCount'), opener, first: state.scopeSafe ? '#f-witness' : '#f-safe', wide: true, variant: 'stock-task', preset: { count: 'new' },
  })
  const form = ui.form, container = $('#count-lines', form), f = name => form.elements.namedItem(name)
  let observed, firstMissing
  const draw = () => {
    observed = new Map()
    container.innerHTML = D.groups.map(group => `<details class="countgroup" open>${disclosure(local(group))}
      ${D.items.filter(i => i.group === group.id).map(item => {
        observed.set(item.id, new Set())
        const quantityInput = item.tracking === 'quantity' || D.unrecorded(item) > 0
          ? field(t(item.tracking === 'quantity' ? 'blindQuantity' : 'unrecordedQty'), `q-${item.id}`, 'type="number" inputmode="numeric" dir="ltr" min="0" step="1" required') : ''
        const serialInputs = item.tracking === 'serial' ? `<div data-blind="${item.id}">
          <p class="desc">${t('blindSerials')}</p><div class="lookup">
            ${field(t('countSearch'), `s-${item.id}`, 'dir="ltr" maxlength="80" autocomplete="off"')}
            ${button(t('add'), 'add-serial')}
          </div><div class="desc" data-match aria-live="polite"></div><ul class="counted-serials" data-serials></ul>
          ${checked(`complete-${item.id}`, t('countConfirmed'))}</div>` : ''
        return `<div class="form-line">${unitIdentity({ item: item.id })}<div class="flow mobile-stretch">${serialInputs}${quantityInput}</div></div>`
      }).join('')}
    </details>`).join('')
    $$('[data-blind]', form).forEach(box => {
      const id = box.dataset.blind, input = f(`s-${id}`), added = observed.get(id)
      const match = $('[data-match]', box), list = $('[data-serials]', box)
      const show = () => {
        list.innerHTML = [...added].map(serial => `<li>${isol(serial)}${button(icon('close'), 'remove-count-serial', {
          id: serial, cls: 'iconbtn', accessible: tPlain('removeSerial', { serial }),
        })}</li>`).join('')
        for (const b of $$('button', list)) b.onclick = () => {
          added.delete(b.dataset.id)
          f(`complete-${id}`).checked = false
          show(); ui.refresh(validate()); input.focus()
        }
      }
      const add = () => {
        const serial = input.value.trim().toUpperCase()
        if (!serial) { match.textContent = t('countEnter'); return }
        const known = D.item(id).serials.find(s => s.id.toUpperCase() === serial)
        added.add(known?.id || serial)
        match.textContent = known ? '' : t('countUnknown')
        f(`complete-${id}`).checked = false
        input.value = ''
        show(); ui.refresh(validate()); input.focus()
      }
      $('[data-action="add-serial"]', box).onclick = add
      input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add() } }
    })
  }
  const goodQty = input => input.value !== '' && input.validity.valid && Number.isSafeInteger(Number(input.value))
  function validate() {
    const missing = D.items.map(item => {
      const serial = f(`complete-${item.id}`), quantity = f(`q-${item.id}`)
      return { item, field: serial && !serial.checked ? serial : quantity && !goodQty(quantity) ? quantity : null }
    }).filter(x => x.field)
    firstMissing = missing[0] || null
    const progress = t('countProgress', { counted: D.items.length - missing.length, total: D.items.length })
    const reason = [(firstMissing && button(t('needCount', { item: local(firstMissing.item) }), 'first-missing', { cls: 'textbtn' })),
      (!f('witness').value && `<span>${t('needWitness')}</span>`)].filter(Boolean).join(' ')
    return { reason, progress }
  }
  f('safe').onchange = () => {
    const witness = f('witness')
    witness.innerHTML = witnessOptions(f('safe').value, [], 'countWitness', witness.value)
    draw()
  }
  draw()
  ui.start(validate, () => {
    const safe = f('safe').value
    const record = { id: D.number('MC', D.counts), safes: [safe], at: D.now, actor: D.currentUser, witness: f('witness').value, observed: [] }
    for (const item of D.items) {
      const serials = [...observed.get(item.id)]
      const qty = Number(f(`q-${item.id}`)?.value || 0) + serials.length
      const expected = D.rollup(item).bySafe[safe].inSafe
      const expectedSerials = item.tracking === 'serial' ? D.available(item.id, safe).map(s => s.id) : []
      const missingSerials = expectedSerials.filter(s => !serials.includes(s))
      const unexpectedSerials = serials.filter(s => !expectedSerials.includes(s))
      record.observed.push({ item: item.id, qty, serials, noBaseline: expected === null })
      if (expected !== null && (expected !== qty || missingSerials.length || unexpectedSerials.length)) D.variances.push({
        id: `${record.id}-${item.id}`, kind: 'monthly', source: record.id, safe, item: item.id, expected, found: qty,
        serials: [...missingSerials, ...unexpectedSerials], missingSerials, unexpectedSerials, at: D.now, witness: record.witness, actor: D.currentUser,
      })
    }
    D.counts.push(record)
    state.lastCount = record.id
    complete('savedCount', '#monthly-counts', attrSelector('data-count-row', record.id))
  }, {
    dirty: () => f('safe').value !== startSafe || Boolean(f('witness').value)
      || $$('input', container).some(input => input.type === 'checkbox' ? input.checked : input.value.trim())
      || [...observed.values()].some(s => s.size),
    discardKey: 'discardCount',
    handleReason: e => {
      if (e.target.closest('[data-action="first-missing"]') && firstMissing) {
        firstMissing.field.closest('details').open = true
        firstMissing.field.focus()
      }
    },
  })
}
function decisionDialog(id, opener) {
  const row = D.discrepancies().find(d => d.id === id && !d.decision && d.actor !== D.currentUser)
  if (!row) return
  const item = D.item(row.item)

})
document.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.isComposing || dialog.open || state.receipt || e.target.closest('input,textarea,select,[contenteditable="true"]')) return
  if (e.code === 'Slash' && !e.altKey || e.code === 'KeyK' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault()
    finder(actionSelector('find'))
  }
})
const fromLocation = () => {
  const params = Object.fromEntries(new URLSearchParams(location.search))
  setPreset(params, true)
}
window.addEventListener('popstate', fromLocation)
fromLocation()
</script>
</body>
</html>
