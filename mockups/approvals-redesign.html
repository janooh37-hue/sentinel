<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSSG Manager — Approvals flow mockup</title>
<style>
  /* ── GSSG tokens (verbatim from DESIGN.md §1.1) ─────────────────────── */
  [data-theme="light"] {
    --bg: #f5f4f1; --surface: #ffffff; --surface-raised: #fafaf6; --surface-tinted: #f0eee8;
    --primary: #0d2845; --primary-hover: #1d3a5e; --primary-soft: #e8edf3; --on-primary: #ffffff;
    --accent: #c8102e; --accent-hover: #a30d24; --accent-soft: #fbe5e8;
    --success: #047857; --success-soft: #d6f0e4;
    --warning: #b45309; --warning-soft: #fbedd8;
    --info: #1d4ed8; --info-soft: #e0e8f8;
    --text: #1c1f24; --text-muted: #5a6068; --text-faint: #8b9098;
    --border: #e6e4dd; --border-strong: #d4d1c8; --hairline: #efece5;
    --focus-ring: #0d2845;
  }
  [data-theme="dark"] {
    --bg: #0a0e18; --surface: #131826; --surface-raised: #1a2034; --surface-tinted: #1f263b;
    --primary: #5778cf; --primary-hover: #7491db; --primary-soft: #1c2849; --on-primary: #0a0e18;
    --accent: #ef4858; --accent-hover: #f56b78; --accent-soft: #3a1820;
    --success: #34d399; --success-soft: #142d23;
    --warning: #fbbf24; --warning-soft: #3a2a10;
    --info: #60a5fa; --info-soft: #1c2940;
    --text: #e6e9f2; --text-muted: #8a93a7; --text-faint: #5f6678;
    --border: #2a3148; --border-strong: #3a4360; --hairline: #1f263b;
    --focus-ring: #7491db;
  }
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Inter", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 68px; /* leave room for the fixed demo bar */
  }
  [dir="rtl"] body { font-family: "Noto Sans Arabic", "Inter", system-ui, sans-serif; }
  a { color: inherit; }
  button, select, textarea { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .skip-link {
    position: fixed; top: -100px; inset-inline-start: 8px; z-index: 200;
    background: var(--primary); color: var(--on-primary); padding: 10px 16px; border-radius: 8px;
    font-size: 0.85em; font-weight: 700; transition: top 150ms ease;
  }
  .skip-link:focus { top: 8px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
  }

  /* ── App chrome ──────────────────────────────────────────────────────── */
  .app-shell { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
  .topbar {
    display: flex; align-items: center; gap: 20px; padding: 18px 0 16px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.02em; letter-spacing: -0.01em; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 8px; background: var(--primary); color: var(--on-primary);
    display: grid; place-items: center; font-weight: 800; font-size: 12px; flex: none;
  }
  .primary-nav { display: flex; gap: 4px; margin-inline-start: 8px; }
  .nav-link {
    appearance: none; border: 0; background: transparent; cursor: pointer; font: inherit;
    padding: 8px 14px; border-radius: 8px; font-size: 0.88em; font-weight: 600; color: var(--text-muted);
    transition: background-color 150ms ease, color 150ms ease; text-decoration: none;
  }
  .nav-link:hover { background: var(--surface-tinted); color: var(--text); }
  .nav-link[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
  .topbar-meta { margin-inline-start: auto; font-size: 0.78em; color: var(--text-muted); text-align: end; }
  .topbar-meta b { color: var(--text); font-weight: 700; }

  main.view { padding: 28px 0 48px; }
  h1 { margin: 0; font-size: 1.5em; font-weight: 700; letter-spacing: -0.01em; }
  h2 { margin: 0; font-size: 1.05em; font-weight: 700; }
  .view-sub { margin: 4px 0 0; font-size: 0.85em; color: var(--text-muted); }

  /* ── Home widget ─────────────────────────────────────────────────────── */
  .home-head { margin-bottom: 22px; }
  .home-columns { display: grid; grid-template-columns: 1fr; gap: 0; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--surface); }
  .home-columns.two-up { grid-template-columns: 1fr 1fr; }
  .home-col { padding: 22px; display: flex; flex-direction: column; gap: 16px; }
  .home-columns.two-up .home-col + .home-col { border-inline-start: 1px solid var(--hairline); }
  .home-columns:not(.two-up) .home-col + .home-col { border-top: 1px solid var(--hairline); }
  .home-col-head { font-size: 0.78em; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }
  .widget-primary { display: block; text-decoration: none; color: inherit; border-radius: 12px; padding: 14px 16px; border: 1px solid var(--border); background: var(--surface-raised); transition: border-color 150ms ease, background-color 150ms ease; }
  .widget-primary:hover { border-color: var(--primary); background: var(--surface); }
  .widget-count-row { display: flex; align-items: baseline; gap: 10px; }
  .widget-count { font-size: 2.1em; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .widget-count.zero { color: var(--text-faint); }
  .widget-label { font-size: 0.92em; font-weight: 700; }
  .widget-detail { margin-top: 8px; font-size: 0.8em; color: var(--text-muted); }
  .widget-detail .subj { color: var(--text); font-weight: 600; }
  .widget-empty { margin-top: 8px; font-size: 0.8em; color: var(--text-muted); }
  .sublink-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .sublink {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font-size: 0.8em; font-weight: 600; color: var(--primary);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px;
    background: var(--surface); transition: background-color 150ms ease, border-color 150ms ease;
  }
  .sublink:hover { background: var(--primary-soft); border-color: var(--primary); }
  .sublink .n { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .sublink.warn { color: var(--warning); }
  .quiet-link { font-size: 0.78em; color: var(--text-muted); text-decoration: underline; text-underline-offset: 2px; align-self: flex-start; }
  .quiet-link:hover { color: var(--text); }
  .neutral-access { padding: 20px; text-align: center; color: var(--text-muted); font-size: 0.85em; }

  /* ── Tabs / filters / sort (queue toolbar) ──────────────────────────── */
  .queue-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .tabs { display: inline-flex; gap: 2px; background: var(--surface-tinted); border-radius: 999px; padding: 3px; }
  .tab, .kind-btn {
    appearance: none; border: 0; cursor: pointer; border-radius: 999px; background: transparent;
    padding: 7px 14px; font: inherit; font-size: 0.8em; font-weight: 600;
    color: var(--text-muted); display: inline-flex; align-items: center; gap: 7px;
    transition: color 150ms ease, background-color 150ms ease;
  }
  .tab:hover, .kind-btn:hover { color: var(--text); }
  .tab[aria-selected="true"], .kind-btn[aria-selected="true"] { background: var(--primary); color: var(--on-primary); }
  .tab .n, .kind-btn .n { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; font-size: 0.85em; opacity: .75; }
  .kind-group { display: inline-flex; gap: 2px; background: var(--surface-tinted); border-radius: 999px; padding: 3px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    appearance: none; cursor: pointer; font: inherit; font-size: 0.75em; font-weight: 600;
    border-radius: 999px; padding: 5px 12px; display: inline-flex; gap: 6px; align-items: center;
    border: 1px solid var(--border); color: var(--text-muted); background: var(--surface);
    transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
  }
  .chip:hover { background: var(--surface-tinted); color: var(--text); }
  .chip[aria-pressed="true"] { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, transparent); color: var(--primary); }
  .sort-field { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
  .sort-field label { font-size: 0.75em; font-weight: 600; color: var(--text-muted); }
  .sort-field select {
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);
    padding: 6px 10px; font-size: 0.8em; font-weight: 600; min-height: 36px;
  }

  /* ── The ledger / rows ───────────────────────────────────────────────── */
  .ledger { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); overflow: hidden; }
  .queue-empty { padding: 40px 24px; text-align: center; color: var(--text-muted); font-size: 0.88em; }
  .divider { border: 0; border-top: 1px solid var(--hairline); margin: 0; }
  .row {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: start;
    padding: 14px 20px; cursor: pointer; position: relative; background: transparent; border: 0;
    transition: background-color 150ms ease; min-height: 44px;
  }
  .row:hover { background: var(--surface-raised); }
  .thumb {
    flex: none; width: 48px; height: 36px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: #fff;
    display: grid; place-items: center; transition: box-shadow 150ms ease, border-color 150ms ease;
  }
  [data-theme="dark"] .thumb { background: var(--surface-tinted); }
  .thumb:hover, .thumb:focus-visible { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .row-main { min-width: 0; flex: 1; }
  .row-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .ref { flex: none; font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: 0.72em; font-weight: 500; color: var(--text-muted); direction: ltr; unicode-bidi: isolate; }
  .subject { margin: 0; font-size: 0.92em; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
  .row-meta { margin-top: 3px; font-size: 0.75em; color: var(--text-muted); }
  .row-meta .who { color: var(--text); font-weight: 600; }
  .row-meta .missing { color: var(--accent); font-weight: 600; }
  .row-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 40%; }
  .pill {
    font-size: 0.65em; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    border-radius: 999px; padding: 3px 9px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .pill svg { flex: none; }
  .pill.pending   { background: var(--warning-soft); color: var(--warning); }
  .pill.approved  { background: var(--success-soft); color: var(--success); }
  .pill.rejected  { background: var(--accent-soft); color: var(--accent); }
  .pill.returned  { background: var(--info-soft); color: var(--info); }
  .rchip { font-size: 0.65em; font-weight: 700; border-radius: 999px; padding: 3px 9px; display: inline-flex; align-items: center; gap: 5px; }
  .rchip.pending { background: var(--warning-soft); color: var(--warning); }
  .rchip.reviewed { background: var(--success-soft); color: var(--success); }
  .rchip.changes_requested { background: var(--info-soft); color: var(--info); }
  .when { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: 0.68em; font-variant-numeric: tabular-nums; color: var(--text-faint); }
  .waiting { font-size: 0.7em; font-weight: 700; color: var(--warning); text-align: end; }
  .waiting.missing { color: var(--accent); }

  /* ── Document preview lightbox ──────────────────────────────────────── */
  .pv-root { position: fixed; inset: 0; z-index: 60; color: var(--text); }
  .pv-root[hidden] { display: none; }
  .pv-scrim { position: absolute; inset: 0; background: rgba(6, 9, 15, .62); }
  .pv-shell { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: clamp(8px, 2.5vh, 24px) clamp(8px, 3vw, 24px); pointer-events: none; }
  .pv-bar { pointer-events: auto; width: min(860px, 100%); display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-bottom: 0; border-radius: 12px 12px 0 0; padding: 8px 10px; }
  .pv-title { flex: 1; min-width: 0; font-size: .85em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv-title .ref { margin-inline-end: 8px; }
  .pv-btn {
    appearance: none; cursor: pointer; font: inherit; font-size: .72em; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px; min-height: 36px; flex: none;
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px;
    background: var(--surface); color: var(--text-muted);
    transition: background-color 150ms ease, color 150ms ease;
  }
  .pv-btn:hover { background: var(--surface-tinted); color: var(--text); }
  .pv-btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .pv-btn.primary:hover { background: var(--primary-hover); color: var(--on-primary); }
  .pv-zoom { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; padding: 1px; flex: none; }
  .pv-zoom .pv-btn { border: 0; }
  .pv-zoom .zval { width: 42px; text-align: center; font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: .68em; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .pv-viewport { pointer-events: auto; width: min(860px, 100%); flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; background: var(--surface-tinted); border: 1px solid var(--border); border-top: 0; border-radius: 0 0 12px 12px; touch-action: pan-x pan-y; }
  .pv-doc { width: min(600px, 100%); margin: 20px auto; background: #fff; color: #1c1f24; padding: clamp(24px, 5vw, 52px); border-radius: 3px; box-shadow: 0 12px 32px rgba(0,0,0,.28); position: relative; }
  .doc-head { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 2px solid #0d2845; }
  .doc-logo { flex: none; width: 34px; height: 34px; border-radius: 8px; background: #0d2845; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
  .doc-org b { display: block; font-size: 13px; letter-spacing: .04em; }
  .doc-org span { font-size: 10.5px; color: #5a6068; }
  .doc-refline { display: flex; justify-content: space-between; gap: 12px; margin: 14px 0 4px; font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: 10.5px; color: #5a6068; }
  .doc-title { margin: 18px 0 10px; font-size: 15px; font-weight: 700; text-align: center; }
  .doc-meta { margin: 0 0 14px; font-size: 11.5px; color: #5a6068; }
  .doc-meta b { color: #1c1f24; font-weight: 600; }
  .doc-body p { margin: 0 0 10px; font-size: 12px; line-height: 1.7; }
  .doc-sig { margin-top: 22px; display: flex; justify-content: space-between; align-items: flex-end; }
  .doc-sig .name { font-size: 12px; font-weight: 700; border-top: 1px solid #1c1f24; padding-top: 4px; margin-top: 26px; }
  .doc-stamp { flex: none; width: 74px; height: 74px; border: 2px solid rgba(13,40,69,.45); border-radius: 999px; display: grid; place-items: center; transform: rotate(-12deg); color: rgba(13,40,69,.55); font-size: 9px; font-weight: 800; letter-spacing: .1em; text-align: center; }
  .doc-signed-stamp { position: absolute; top: 30px; inset-inline-end: 30px; border: 3px solid #047857; color: #047857; border-radius: 10px; padding: 6px 14px; font-size: 11px; font-weight: 800; letter-spacing: .1em; transform: rotate(-8deg); }

  /* ── Detail (record) page ───────────────────────────────────────────── */
  .backbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .back-btn {
    appearance: none; cursor: pointer; font: inherit; font-size: .82em; font-weight: 700;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 8px; padding: 9px 14px; display: inline-flex; align-items: center; gap: 7px; min-height: 40px;
  }
  .back-btn:hover { background: var(--surface-tinted); }
  .detail-card { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); overflow: hidden; }
  .detail-header { padding: 20px 22px; border-bottom: 1px solid var(--hairline); background: var(--surface-raised); }
  .detail-subject { margin: 6px 0 0; font-size: 1.2em; font-weight: 700; }
  .detail-status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .detail-meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 14px; font-size: .82em; }
  .meta-item .k { color: var(--text-muted); font-size: .85em; margin-bottom: 2px; }
  .meta-item .v { font-weight: 600; }
  .meta-item .v.missing { color: var(--accent); font-weight: 600; }
  .detail-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 20px; }
  .banner { border-radius: 12px; padding: 14px 16px; font-size: .86em; font-weight: 600; display: flex; gap: 10px; align-items: flex-start; }
  .banner.ok { background: var(--success-soft); color: var(--success); }
  .banner.no { background: var(--accent-soft); color: var(--accent); }
  .banner.ret { background: var(--info-soft); color: var(--info); }
  .banner.err { background: var(--accent-soft); color: var(--accent); }
  .banner .msg { flex: 1; }
  .banner-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .next-empty { font-size: .82em; color: var(--text-muted); font-style: italic; }
  .doc-card {
    display: flex; align-items: center; gap: 12px; padding: 12px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
    transition: border-color 150ms ease, background-color 150ms ease; text-align: start; width: 100%;
  }
  .doc-card:hover { border-color: var(--primary); background: var(--surface-raised); }
  .doc-card .grow { flex: 1; min-width: 0; }
  .doc-card .fname { font-size: .82em; font-weight: 600; font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; direction: ltr; unicode-bidi: isolate; display: block; }
  .doc-card .fmeta { display: block; font-size: .7em; color: var(--text-muted); margin-top: 2px; }
  .action-panel { display: flex; gap: 10px; flex-wrap: wrap; }
  .act-btn {
    flex: 1; min-width: 160px; appearance: none; cursor: pointer; font: inherit; font-size: .85em; font-weight: 700;
    border-radius: 10px; padding: 12px 14px; min-height: 44px;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    transition: background-color 150ms ease, color 150ms ease;
  }
  .act-btn:disabled { opacity: .65; cursor: default; }
  .act-btn.approve { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .act-btn.approve:hover:not(:disabled) { background: var(--primary-hover); }
  .act-btn.reject { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .act-btn.reject:hover:not(:disabled) { background: var(--accent-soft); }
  .act-btn.review-ok { background: var(--success); border-color: var(--success); color: #fff; }
  .reason-form { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 8px; }
  .reason-form label { font-size: .8em; font-weight: 600; color: var(--text-muted); }
  .reason-form textarea {
    width: 100%; font: inherit; font-size: .85em; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; min-height: 84px; resize: vertical;
  }
  .field-error { font-size: .75em; color: var(--accent); font-weight: 600; }
  .reason-form-actions { display: flex; gap: 8px; }
  section.card-section { border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; background: var(--surface-raised); }
  section.card-section > h3 { margin: 0 0 4px; font-size: .82em; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }
  section.card-section > .hint { margin: 8px 0 0; font-size: .78em; color: var(--text-muted); }
  .reviewer-list { display: flex; flex-direction: column; gap: 10px; }
  .reviewer-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; flex-wrap: wrap; }
  .reviewer-row .who { font-weight: 600; font-size: .85em; }
  .reviewer-row .comment { font-size: .78em; color: var(--text-muted); margin-top: 4px; max-width: 46ch; }
  .activity-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .activity-list li { display: flex; gap: 12px; font-size: .85em; }
  .activity-list .dot { flex: none; width: 8px; height: 8px; border-radius: 999px; background: var(--primary); margin-top: 6px; }
  .activity-list .atext { flex: 1; }
  .activity-list .atime { display: block; font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: .82em; color: var(--text-faint); margin-top: 2px; }

    doc: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b9098" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
    back: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
    warn: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
  };

  /* ═══════════ App state ═══════════ */
  var state = {
    personaId: 1,
    lang: 'en',
    theme: 'light',
    scenario: 'normal',
    records: buildScenarioFixtures('normal'),
    actionErrorConsumed: false,
    errorBanner: null
  };

  function resetFixtures() {
    state.records = buildScenarioFixtures(state.scenario);
    state.actionErrorConsumed = false;
    state.errorBanner = null;
  }

  /* ═══════════ Domain queries ═══════════ */
  function findRecord(id) {
    var found = null;
    state.records.forEach(function (r) { if (r.id === id) found = r; });
    return found;
  }
  function reviewerOf(rec, personId) {
    var found = null;
    rec.reviewers.forEach(function (rv) { if (rv.userId === personId) found = rv; });
    return found;
  }
  function countSignatures(personId) {
    return state.records.filter(function (r) { return r.status === 'pending' && r.signerId === personId; }).length;
  }
  function countReview(personId) {
    return state.records.filter(function (r) {
      if (r.status !== 'pending') return false;
      var rv = reviewerOf(r, personId);
      return !!rv && rv.state === 'pending';
    }).length;
  }
  function countSentWaiting(personId) {
    return state.records.filter(function (r) { return r.status === 'pending' && r.submittedBy === personId; }).length;
  }
  function countNeedsChanges(personId) {
    return state.records.filter(function (r) { return r.status === 'returned' && r.submittedBy === personId; }).length;
  }
  function compareBySubmission(a, b, dir) {
    var am = a.submittedAt, bm = b.submittedAt;
    if (am === null && bm === null) return a.id - b.id;
    if (am === null) return 1;
    if (bm === null) return -1;
    if (am === bm) return a.id - b.id;
    return dir === 'newest' ? (bm - am) : (am - bm);
  }
  function oldestOf(list) {
    var sorted = list.slice().sort(function (a, b) { return compareBySubmission(a, b, 'oldest'); });
    return sorted[0] || null;
  }
  function queueList(ctx) {
    var personId = ctx.personaId;
    var list = state.records.filter(function (r) {
      if (ctx.tab === 'sent') return r.submittedBy === personId;
      if (ctx.kind === 'review') return !!reviewerOf(r, personId);
      return r.signerId === personId;
    });
    if (ctx.tab === 'received' && ctx.kind === 'review') {
      if (ctx.status === 'pending') {
        list = list.filter(function (r) {
          return r.status === 'pending' && reviewerOf(r, personId).state === 'pending';
        });
      }
    } else if (ctx.status !== 'all') {
      list = list.filter(function (r) { return r.status === ctx.status; });
    }
    list = list.slice().sort(function (a, b) { return compareBySubmission(a, b, ctx.sort); });
    return list;
  }

  /* ═══════════ Routing ═══════════ */
  function computeDefaultRoute(personId) {
    var c = caps(personId);
    if (c.sign && countSignatures(personId) > 0) return { tab: 'received', kind: 'sign', status: 'pending', sort: 'oldest' };
    if (c.send) return { tab: 'sent', status: 'pending', sort: 'oldest' };
    if (c.review && countReview(personId) > 0) return { tab: 'received', kind: 'review', status: 'pending', sort: 'oldest' };
    return { tab: 'received', kind: 'sign', status: 'pending', sort: 'oldest' };
  }
  function normalizeApprovalsParams(params, personId) {
    var c = caps(personId);
    var tab = params.tab === 'sent' ? 'sent' : (params.tab === 'received' ? 'received' : null);
    if (!tab) return computeDefaultRoute(personId);
    if (tab === 'sent' && !c.send) return computeDefaultRoute(personId);
    if (tab === 'received' && !c.sign && !c.review) return computeDefaultRoute(personId);
    var sort = params.sort === 'newest' ? 'newest' : 'oldest';
    if (tab === 'sent') {
      var sAllowed = ['pending', 'returned', 'approved', 'rejected', 'all'];
      var sStatus = sAllowed.indexOf(params.status) >= 0 ? params.status : 'pending';
      return { tab: 'sent', status: sStatus, sort: sort };
    }
    var kind = params.kind === 'review' ? 'review' : 'sign';
    if (kind === 'review' && !c.review) kind = c.sign ? 'sign' : null;
    if (kind === 'sign' && !c.sign) kind = c.review ? 'review' : null;
    if (!kind) return computeDefaultRoute(personId);
    var status;
    if (kind === 'review') {
      status = params.status === 'all' ? 'all' : 'pending';
    } else {
      var rAllowed = ['pending', 'returned', 'approved', 'rejected', 'all'];
      status = rAllowed.indexOf(params.status) >= 0 ? params.status : 'pending';
    }
    return { tab: 'received', kind: kind, status: status, sort: sort };
  }
  function buildApprovalsHash(ctx) {
    var qp;
    if (ctx.tab === 'sent') qp = 'tab=sent&status=' + ctx.status + '&sort=' + ctx.sort;
    else qp = 'tab=received&kind=' + ctx.kind + '&status=' + ctx.status + '&sort=' + ctx.sort;
    return '#/approvals?' + qp;
  }
  function buildRecordHash(id, ctx) {
    return '#/record/' + id + '?' + buildApprovalsHash(ctx).split('?')[1];
  }
  function inferContextOrNull(rec, personId) {
    var c = caps(personId);
    if (c.sign && rec.signerId === personId) return { tab: 'received', kind: 'sign', status: 'pending', sort: 'oldest' };
    if (c.review && reviewerOf(rec, personId)) return { tab: 'received', kind: 'review', status: 'pending', sort: 'oldest' };
    if (c.send && rec.submittedBy === personId) return { tab: 'sent', status: 'pending', sort: 'oldest' };
    return null;
  }
  function parseHash(hash) {
    hash = hash || '#/home';
    var body = hash.charAt(0) === '#' ? hash.slice(1) : hash;
    var parts = body.split('?');
    var segs = parts[0].split('/').filter(Boolean);
    var params = {};
    if (parts[1]) {
      parts[1].split('&').forEach(function (pair) {
        if (!pair) return;
        var kv = pair.split('=');
        params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
      });
    }
    if (segs[0] === 'record') return { view: 'record', id: Number(segs[1]), params: params };
    if (segs[0] === 'approvals') return { view: 'approvals', params: params };
    return { view: 'home', params: params };
  }
  function resolveRecordRoute(id, rawParams, personId) {
    var rec = findRecord(id);
    if (!rec) return { id: id, notFound: true, back: computeDefaultRoute(personId) };
    var hasParams = rawParams && (rawParams.tab || rawParams.status || rawParams.sort || rawParams.kind);
    if (hasParams) return { id: id, record: rec, back: normalizeApprovalsParams(rawParams, personId) };
    var inferred = inferContextOrNull(rec, personId);
    if (!inferred) return { id: id, notFound: true, back: computeDefaultRoute(personId) };
    return { id: id, record: rec, back: inferred };
  }

  function navigatePush(hash) { history.pushState(null, '', hash); render(); }
  function setApprovalsCtx(partial) {
    var parsed = parseHash(location.hash);
    var current = parsed.view === 'approvals' ? normalizeApprovalsParams(parsed.params, state.personaId) : computeDefaultRoute(state.personaId);
    var next;
    if (partial.tab === 'sent') next = { tab: 'sent', status: partial.status || (current.tab === 'sent' ? current.status : 'pending'), sort: partial.sort || current.sort };
    else if (partial.tab === 'received') next = { tab: 'received', kind: partial.kind || (current.kind || 'sign'), status: partial.status || 'pending', sort: partial.sort || current.sort };
    else next = Object.assign({}, current, partial);
    var hash = buildApprovalsHash(next);
    history.replaceState({ type: 'approvals', ctx: next }, '', hash);
    render();
  }
  function openRecordFromRow(rec, ctx, rowEl) {
    history.replaceState({ type: 'approvals', ctx: ctx, scrollY: window.scrollY, focusId: rec.id }, '', location.hash);
    var hash = buildRecordHash(rec.id, ctx);
    history.pushState({ type: 'record', id: rec.id, ctx: ctx }, '', hash);
    render();
  }
  function goToNextRecord(id, ctx) {
    var hash = buildRecordHash(id, ctx);
    history.pushState({ type: 'record', id: id, ctx: ctx }, '', hash);
    render();
  }

  function boot() {
    var parsed = parseHash(location.hash);
    if (parsed.view === 'record') {
      var resolved = resolveRecordRoute(parsed.id, parsed.params, state.personaId);
      var backCtx = resolved.back;
      history.replaceState({ type: 'approvals', ctx: backCtx }, '', buildApprovalsHash(backCtx));
      var fwdHash = resolved.record ? buildRecordHash(parsed.id, backCtx) : ('#/record/' + parsed.id);
      history.pushState({ type: 'record', id: parsed.id, ctx: backCtx }, '', fwdHash);
    } else if (parsed.view === 'approvals') {
      var ctx = normalizeApprovalsParams(parsed.params, state.personaId);
      history.replaceState({ type: 'approvals', ctx: ctx }, '', buildApprovalsHash(ctx));
    } else {
      history.replaceState({ type: 'home' }, '', '#/home');
    }
    render();
  }

  /* ═══════════ Rendering: shell ═══════════ */
  var elHome = document.getElementById('viewHome');

  function setActiveView(view) {

  /* ═══════════ Rendering: home ═══════════ */
  function renderHome() {
    setActiveView('home');
    var lang = state.lang, personId = state.personaId, c = caps(personId);
    var sections = [];

    if (c.sign) {
      var sigCount = countSignatures(personId);
      var sigList = state.records.filter(function (r) { return r.status === 'pending' && r.signerId === personId; });
      var oldestSig = oldestOf(sigList);
      var href = buildApprovalsHash({ tab: 'received', kind: 'sign', status: 'pending', sort: 'oldest' });
      var body = '<a class="widget-primary" href="' + href + '">' +
        '<div class="widget-count-row"><span class="widget-count' + (sigCount === 0 ? ' zero' : '') + '">' + sigCount + '</span><span class="widget-label">' + T('needsSignature', lang) + '</span></div>';

      } else {

      }

    }

    if (c.send) {

      var sentList = state.records.filter(function (r) { return r.status === 'pending' && r.submittedBy === personId; });
      var oldestSent = oldestOf(sentList);
      var hrefSent = buildApprovalsHash({ tab: 'sent', status: 'pending', sort: 'oldest' });
      var body2 = '<a class="widget-primary" href="' + hrefSent + '">' +
        '<div class="widget-count-row"><span class="widget-count' + (sentCount === 0 ? ' zero' : '') + '">' + sentCount + '</span><span class="widget-label">' + T('sentByMe', lang) + '</span></div>';
      if (oldestSent) {
        var days2 = oldestSent.submittedAt === null ? null : Math.floor((DEMO_NOW - oldestSent.submittedAt) / DAY_MS);
        var signerNm = personName(oldestSent.signerId, lang);
        var awaitTxt = signerNm ? (T('awaitingSigner', lang) + ' ' + esc(signerNm)) : T('signerUnavailable', lang);
        var ageTxt = days2 === null ? T('submissionUnavailable', lang) : (T('waitingSince', lang) + ' ' + waitingLabel(days2, lang));
        body2 += '<p class="widget-detail">' + T('oldestSubject', lang) + ' <span class="subj">' + esc(oldestSent.subject[lang]) + '</span><br>' + awaitTxt + ' &middot; ' + ageTxt + '</p>';
      } else {

      }
      body2 += '</a>';
      var needsChangesCount = countNeedsChanges(personId);
      var subRow2 = '<div class="sublink-row">' +
        '<a class="sublink' + (needsChangesCount === 0 ? '' : ' warn') + '" href="' + buildApprovalsHash({ tab: 'sent', status: 'returned', sort: 'oldest' }) + '">' + T('needsChanges', lang) + ' <span class="n">' + needsChangesCount + '</span></a>' +
        '</div>' +

      columnsHtml;
  }

  /* ═══════════ Rendering: approvals queue ═══════════ */
  function renderApprovals(ctx) {

  function renderQueueRow(r, ctx, lang, isReview) {

      }
    } else {
      if (closed) {
        sideHtml = '<span class="pill ' + r.status + '">' + ICONS[r.status] + esc(STATUS_LABEL[r.status][lang]) + '</span>' +
          '<span class="when">' + tt(lang, 'decided ', 'قرر في ') + (formatDate(r.decidedAt, lang) || '') + '</span>';
      } else {
        var subLine2 = r.submittedAt === null
          ? '<span class="waiting missing">' + T('submissionUnavailable', lang) + '</span>'
          : '<span class="waiting">' + waitingLabel(Math.floor((DEMO_NOW - r.submittedAt) / DAY_MS), lang) + '</span>';
        sideHtml = '<span class="pill pending">' + ICONS.pending + esc(STATUS_LABEL.pending[lang]) + '</span>' + subLine2;

      : (personName(r.submittedBy, lang) || T('unknownSubmitter', lang));
    var submittedTitle = formatDate(r.submittedAt, lang) || T('submissionUnavailable', lang);
    return '<div class="row" id="row-' + r.id + '" role="button" tabindex="0" data-row-id="' + r.id + '" title="' + tt(lang, 'Submitted ', 'أُرسل ') + submittedTitle + '">' +
      '<span class="thumb" data-thumb-id="' + r.id + '" role="button" tabindex="0" aria-label="' + T('previewDoc', lang) + '">' + ICONS.doc + '</span>' +
      '<span class="row-main"><span class="row-title"><span class="ref">' + esc(r.reference) + '</span><span class="subject">' + esc(r.subject[lang]) + '</span></span>' +
      '<span class="row-meta"><span class="who">' + esc(relatedName) + '</span></span></span>' +
      '<span class="row-side">' + sideHtml + '</span>' +
      '</div>';
  }

  function wireApprovalsControls(ctx) {
    document.querySelectorAll('[data-act="tab"]').forEach(function (btn) {
      btn.addEventListener('click', function () { setApprovalsCtx({ tab: btn.dataset.tab, sort: ctx.sort }); });
    });
    document.querySelectorAll('[data-act="kind"]').forEach(function (btn) {
      btn.addEventListener('click', function () { setApprovalsCtx({ tab: 'received', kind: btn.dataset.kind, status: 'pending', sort: ctx.sort }); });
    });
    document.querySelectorAll('[data-act="status"]').forEach(function (btn) {
      btn.addEventListener('click', function () { setApprovalsCtx({ status: btn.dataset.status }); });
    });
    var sortSel = document.querySelector('[data-act="sort"]');
    if (sortSel) sortSel.addEventListener('change', function () { setApprovalsCtx({ sort: sortSel.value }); });
  }
  function wireQueueRows(list, ctx) {
    list.forEach(function (r) {
      var rowEl = document.getElementById('row-' + r.id);
      if (!rowEl) return;
      rowEl.addEventListener('click', function (e) {
        if (e.target.closest('[data-thumb-id]')) return;
        openRecordFromRow(r, ctx, rowEl);
      });
      rowEl.addEventListener('keydown', function (e) {
        if (e.target.closest('[data-thumb-id]')) return;
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openRecordFromRow(r, ctx, rowEl); }
      });
      var thumb = rowEl.querySelector('[data-thumb-id]');
      thumb.addEventListener('click', function (e) { e.stopPropagation(); openPreviewModal(r, ctx); });
      thumb.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.stopPropagation(); e.preventDefault(); openPreviewModal(r, ctx); }
      });
    });
  }

  /* ═══════════ Rendering: record detail ═══════════ */
  function buildEvents(rec, lang) {
    var events = [];
    var submitterName = personName(rec.submittedBy, lang) || T('unknownSubmitter', lang);
    events.push({ ts: rec.submittedAt, text: tt(lang, 'Submitted for approval by ' + submitterName, 'أُرسل للاعتماد من ' + submitterName) });
    rec.reviewers.forEach(function (rv) {
      if (rv.decidedAt) {
        var name = personName(rv.userId, lang) || T('reviewerFallback', lang);
        var verb = rv.state === 'reviewed'
          ? tt(lang, name + ' marked the review complete', 'أنهى ' + name + ' المراجعة')
          : tt(lang, name + ' requested changes', 'طلب ' + name + ' إجراء تعديلات');
        events.push({ ts: rv.decidedAt, text: verb, note: rv.comment ? rv.comment[lang] : null });
      }
    });
    if (rec.decidedAt) {
      var signer = personName(rec.signerId, lang) || T('signerFallback', lang);
      var text;
      if (rec.status === 'approved') text = tt(lang, signer + ' signed and approved the record', 'وقّع ' + signer + ' واعتمد السجل');
      else if (rec.status === 'rejected') text = tt(lang, signer + ' rejected the record', 'رفض ' + signer + ' السجل');
      else if (rec.status === 'returned') text = tt(lang, signer + ' returned the record for correction', 'أعاد ' + signer + ' السجل للتصحيح');
      events.push({ ts: rec.decidedAt, text: text, note: rec.decisionReason ? rec.decisionReason[lang] : null });
    }
    events.sort(function (a, b) { return (a.ts === null ? Infinity : a.ts) - (b.ts === null ? Infinity : b.ts); });
    return events;
  }

  function metaItem(k, v, missing) {
    return '<div class="meta-item"><div class="k">' + esc(k) + '</div><div class="v' + (missing ? ' missing' : '') + '">' + esc(v) + '</div></div>';
  }

  function renderRecordView(routeId, rawParams) {
    setActiveView('record');
    var lang = state.lang, personId = state.personaId;
    var resolved = resolveRecordRoute(routeId, rawParams, personId);
    var backCtx = resolved.back;
    var backBtnHtml = '<button type="button" class="back-btn" id="backBtn">' + ICONS.back + T('backToApprovals', lang) + '</button>';

    if (resolved.notFound) {
      elRecord.innerHTML =
        '<div class="backbar">' + backBtnHtml + '</div>' +
        '<div class="unavailable-card"><h2>' + T('recordUnavailable', lang) + '</h2><p>' + T('recordUnavailableBody', lang) + '</p></div>';
      document.getElementById('backBtn').addEventListener('click', function () { history.back(); });
      return;
    }

    var rec = resolved.record;
    var isSigner = rec.signerId === personId && caps(personId).sign;
    var reviewerEntry = reviewerOf(rec, personId);
    var isReviewer = !!reviewerEntry && caps(personId).review;
    var isSubmitter = rec.submittedBy === personId;

    var html = '<div class="backbar">' + backBtnHtml + '</div>';
    html += '<div class="detail-card"><div class="detail-header">';
    html += '<span class="ref">' + esc(rec.reference) + '</span><h1 class="detail-subject">' + esc(rec.subject[lang]) + '</h1>';
    html += '<div class="detail-status-row"><span class="pill ' + rec.status + '">' + ICONS[rec.status] + esc(STATUS_LABEL[rec.status][lang]) + '</span></div>';
    html += '<div class="detail-meta-grid">';
    html += metaItem(T('submittedBy', lang), personName(rec.submittedBy, lang) || T('unknownSubmitter', lang));
    html += metaItem(T('assignedSigner', lang), personName(rec.signerId, lang) || T('signerUnavailable', lang), !rec.signerId);
    html += metaItem(T('submittedOn', lang), formatDate(rec.submittedAt, lang) || T('submissionUnavailable', lang), rec.submittedAt === null);
    if (rec.decidedAt) html += metaItem(T('decidedOn', lang), formatDate(rec.decidedAt, lang));
    html += '</div></div>';

    html += '<div class="detail-body">';

    if (state.errorBanner && state.errorBanner.recId === rec.id) {
      html += '<div class="banner err">' + ICONS.warn + '<span class="msg">' + esc(state.errorBanner.msg) + '</span></div>';
    }

    if (rec.status === 'approved' && rec.signerId === personId && caps(personId).sign) {
      var nextRec = queueList({ personaId: personId, tab: 'received', kind: 'sign', status: 'pending', sort: backCtx.sort }).filter(function (r) { return r.id !== rec.id; })[0];
      html += '<div class="banner ok">' + ICONS.approved + '<span class="msg">' + T('signedApproved', lang) + '</span></div>';
      html += '<div class="banner-actions">';
      if (nextRec) html += '<button type="button" class="act-btn approve" id="nextBtn" data-next-id="' + nextRec.id + '">' + T('reviewNext', lang) + '</button>';
      else html += '<span class="next-empty">' + T('noSignaturesLeft', lang) + '</span>';
      html += '</div>';
    } else if (rec.status === 'returned') {
      html += '<div class="banner ret">' + ICONS.returned + '<span class="msg">' + T('returnedForCorrection', lang) + (rec.decisionReason ? ' — ' + esc(rec.decisionReason[lang]) : '') + '</span></div>';
      if (isSubmitter) html += '<p class="hint">' + T('followUpHint', lang) + '</p>';
    } else if (rec.status === 'rejected') {
      html += '<div class="banner no">' + ICONS.rejected + '<span class="msg">' + T('rejectedStatus', lang) + (rec.decisionReason ? ' — ' + esc(rec.decisionReason[lang]) : '') + '</span></div>';
    } else if (rec.status === 'pending' && isSigner) {
      html += renderSignActions(lang);
    }

    if (rec.status === 'pending' && isReviewer && reviewerEntry.state === 'pending') {
      html += renderReviewerActions(lang);
    }

    html += '<button type="button" class="doc-card" id="openDocCard"><span class="thumb" aria-hidden="true">' + ICONS.doc + '</span>' +
      '<span class="grow"><span class="fname">' + esc(rec.reference) + '.pdf</span><span class="fmeta">' + T('openPreview', lang) + '</span></span>' +
      '<span class="pv-btn primary" tabindex="-1">' + T('previewBtn', lang) + '</span></button>';

    if (rec.reviewers.length > 0) {
      html += '<section class="card-section"><h3>' + T('advisoryHeading', lang) + '</h3>';
      html += '<div class="reviewer-list">' + rec.reviewers.map(function (rv) {
        var name = personName(rv.userId, lang) || T('reviewerFallback', lang);
        var chip = '<span class="rchip ' + rv.state + '">' + esc(REVIEWER_STATE_LABEL[rv.state][lang]) + '</span>';
        var comment = rv.comment ? '<div class="comment">' + esc(rv.comment[lang]) + '</div>' : '';
        return '<div class="reviewer-row"><div><div class="who">' + esc(name) + '</div>' + comment + '</div>' + chip + '</div>';
      }).join('') + '</div></section>';
    }

    var events = buildEvents(rec, lang);
    html += '<section class="card-section"><h3>' + T('activityHeading', lang) + '</h3><ul class="activity-list">' +
      events.map(function (ev) {
        return '<li><span class="dot" aria-hidden="true"></span><span class="atext">' + esc(ev.text) +
          '<span class="atime">' + (formatDate(ev.ts, lang) || T('submissionUnavailable', lang)) + '</span>' +
          (ev.note ? '<span class="anote">' + esc(ev.note) + '</span>' : '') + '</span></li>';
      }).join('') + '</ul></section>';

    html += '</div></div>';
    elRecord.innerHTML = html;

    document.getElementById('backBtn').addEventListener('click', function () { history.back(); });
    var nextBtn = document.getElementById('nextBtn');
    if (nextBtn) nextBtn.addEventListener('click', function () { goToNextRecord(Number(nextBtn.dataset.nextId), backCtx); });
    document.getElementById('openDocCard').addEventListener('click', function () { openPreviewModal(rec, backCtx); });
    wireSignActions(rec);
    wireReviewerActions(rec);
  }

  function renderSignActions(lang) {
    return '<div class="action-panel" id="signActionPanel">' +
      '<button type="button" class="act-btn approve" id="btnSign">' + T('signApprove', lang) + '</button>' +
      '<button type="button" class="act-btn" id="btnReturn">' + T('returnCorrection', lang) + '</button>' +
      '<button type="button" class="act-btn reject" id="btnReject">' + T('reject', lang) + '</button>' +
      '</div>';
  }
  function renderReviewerActions(lang) {
    return '<div class="action-panel" id="reviewActionPanel">' +
      '<button type="button" class="act-btn review-ok" id="btnMarkReviewed">' + T('markReviewed', lang) + '</button>' +
      '<button type="button" class="act-btn" id="btnRequestChanges">' + T('requestChanges', lang) + '</button>' +
      '</div>';
  }

  function wireSignActions(rec) {
    var lang = state.lang;
    var btnSign = document.getElementById('btnSign');
    if (btnSign) btnSign.addEventListener('click', function () {
      var panel = document.getElementById('signActionPanel');
      panel.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
      btnSign.textContent = T('saving', lang);
      setTimeout(function () {
        state.errorBanner = null;
        if (state.scenario === 'action-error' && !state.actionErrorConsumed) {
          state.actionErrorConsumed = true;
          state.errorBanner = { recId: rec.id, msg: T('signError', lang) };
          render();
          return;
        }
        rec.status = 'approved';
        rec.decidedAt = DEMO_NOW;
        render();
      }, 350);
    });
    var btnReturn = document.getElementById('btnReturn');
    if (btnReturn) btnReturn.addEventListener('click', function () { showReasonForm(rec, 'returned'); });
    var btnReject = document.getElementById('btnReject');
    if (btnReject) btnReject.addEventListener('click', function () { showReasonForm(rec, 'rejected'); });
  }
  function showReasonForm(rec, targetStatus) {
    var lang = state.lang;
    var panel = document.getElementById('signActionPanel');
    var confirmLabel = targetStatus === 'returned' ? T('confirmReturn', lang) : T('confirmReject', lang);
    var placeholder = targetStatus === 'returned' ? T('returnCorrection', lang) : T('reject', lang);
    panel.innerHTML =
      '<div class="reason-form">' +
      '<label for="reasonTxt">' + T('reasonLabel', lang) + '</label>' +
      '<textarea id="reasonTxt" aria-required="true" placeholder="' + esc(placeholder) + '"></textarea>' +
      '<div class="field-error" id="reasonErr" hidden>' + T('reasonRequired', lang) + '</div>' +
      '<div class="reason-form-actions">' +
      '<button type="button" class="act-btn ' + (targetStatus === 'rejected' ? 'reject' : '') + '" id="btnConfirmReason">' + confirmLabel + '</button>' +
      '</div></div>';
    var txt = document.getElementById('reasonTxt');
    txt.focus();
    document.getElementById('btnConfirmReason').addEventListener('click', function () {
      var val = txt.value.trim();
      if (!val) { document.getElementById('reasonErr').hidden = false; txt.focus(); return; }
      rec.status = targetStatus;
      rec.decidedAt = DEMO_NOW;
      rec.decisionReason = { en: val, ar: val };
      render();
    });
  }
  function wireReviewerActions(rec) {
    var lang = state.lang, personId = state.personaId;
    var btnMark = document.getElementById('btnMarkReviewed');
    if (btnMark) btnMark.addEventListener('click', function () {
      var rv = reviewerOf(rec, personId);
      rv.state = 'reviewed'; rv.decidedAt = DEMO_NOW; rv.comment = null;
      render();
    });
    var btnChanges = document.getElementById('btnRequestChanges');
    if (btnChanges) btnChanges.addEventListener('click', function () {
      var panel = document.getElementById('reviewActionPanel');
      panel.innerHTML =
        '<div class="reason-form">' +
        '<label for="reviewCommentTxt">' + T('reviewerCommentLabel', lang) + '</label>' +
        '<textarea id="reviewCommentTxt" aria-required="true"></textarea>' +
        '<div class="field-error" id="reviewCommentErr" hidden>' + T('reviewCommentRequired', lang) + '</div>' +
        '<div class="reason-form-actions"><button type="button" class="act-btn" id="btnConfirmChanges">' + T('confirmRequestChanges', lang) + '</button></div></div>';
      var txt = document.getElementById('reviewCommentTxt');
      txt.focus();
      document.getElementById('btnConfirmChanges').addEventListener('click', function () {
        var val = txt.value.trim();
        if (!val) { document.getElementById('reviewCommentErr').hidden = false; txt.focus(); return; }
        var rv = reviewerOf(rec, personId);
        rv.state = 'changes_requested'; rv.decidedAt = DEMO_NOW; rv.comment = { en: val, ar: val };
        render();
      });
    });
  }

  /* ═══════════ Document preview modal ═══════════ */
  var pvRoot = document.getElementById('pvRoot');
  var pvViewport = document.getElementById('pvViewport');
  var pvDoc = document.getElementById('pvDoc');
  var zVal = document.getElementById('zVal');
  var zoom = 1, pvLastFocus = null, pvRecordCtx = null, pvSourceCtx = null;

  function docMarkup(rec, lang) {
    var ar = lang === 'ar';
    var submitter = personName(rec.submittedBy, lang) || T('unknownSubmitter', lang);
    var signer = personName(rec.signerId, lang) || T('signerUnavailable', lang);
    var dateStr = formatDate(rec.submittedAt, lang) || T('submissionUnavailable', lang);
    var stamp = rec.status === 'approved' ? '<div class="doc-signed-stamp">' + (ar ? 'موقَّع' : 'SIGNED') + '</div>' : '';
    return stamp +
      '<div class="doc-head"><div class="doc-logo">GS</div><div class="doc-org"><b>GSSG MANAGER</b><span>' + (ar ? 'إدارة الموارد البشرية والوثائق' : 'Human Resources &amp; Documents') + '</span></div></div>' +
      '<div class="doc-refline"><span>' + (ar ? 'الرقم' : 'Ref') + ': ' + esc(rec.reference) + '</span><span>' + (ar ? 'التاريخ' : 'Date') + ': ' + dateStr + '</span></div>' +
      '<h3 class="doc-title">' + esc(rec.subject[lang]) + '</h3>' +
      '<p class="doc-meta">' + (ar ? 'مقدَّم من' : 'Submitted by') + ' <b>' + esc(submitter) + '</b> ' + (ar ? 'إلى' : 'to') + ' <b>' + esc(signer) + '</b></p>' +
      '<div class="doc-body"><p>' + (ar
        ? 'تشير هذه الوثيقة إلى أن الطلب المشار إليه أعلاه، المقدَّم من ' + esc(submitter) + '، قد تمت معالجته عبر نظام GSSG Manager ويُعرض الآن للمراجعة واتخاذ القرار وفق الصلاحيات المعتمدة.'
        : 'This is to certify that the request referenced above, submitted by ' + esc(submitter) + ', has been processed through the GSSG Manager document workflow and is presented for review and decision under the delegated approval authority.') + '</p>' +
      '<p>' + (ar
        ? 'هذا مستند تجريبي لأغراض العرض فقط، ولا يمثل سجلاً رسمياً حقيقياً.'
        : 'This is a synthetic demo document for illustration only; it is not a real official record.') + '</p></div>' +
      '<div class="doc-sig"><div class="name">' + esc(submitter) + '</div><div class="doc-stamp">GSSG<br>' + (ar ? 'رسمية' : 'OFFICIAL') + '</div></div>';
  }
  function setZoom(nz) {
    zoom = Math.min(3, Math.max(0.5, nz));
    pvDoc.style.zoom = zoom;
    zVal.textContent = Math.round(zoom * 100) + '%';
  }
  function syncPvChrome() {
    var lang = state.lang;
    pvRoot.lang = lang;
    pvRoot.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('pvClose').setAttribute('aria-label', T('closePreview', lang));
    document.getElementById('zOut').setAttribute('aria-label', T('zoomOut', lang));
    document.getElementById('zIn').setAttribute('aria-label', T('zoomIn', lang));
    document.getElementById('pvZoomGroup').setAttribute('aria-label', T('zoomGroup', lang));
    document.getElementById('pvPrintLbl').textContent = T('print', lang);
    document.getElementById('pvRecordLbl').textContent = T('fullRecord', lang);
    document.getElementById('pvPrint').setAttribute('aria-label', T('print', lang));
    document.getElementById('pvRecordBtn').setAttribute('aria-label', T('fullRecord', lang));
  }
  function openPreviewModal(rec, ctx) {
    pvRecordCtx = rec;
    pvSourceCtx = ctx || null;
    pvLastFocus = document.activeElement;
    syncPvChrome();
    var lang = state.lang;
    document.getElementById('pvRef').textContent = rec.reference;
    document.getElementById('pvSubject').textContent = rec.subject[lang];
    pvDoc.innerHTML = docMarkup(rec, lang);
    pvViewport.scrollTop = 0;
    setZoom(1);
    pvRoot.hidden = false;
    document.getElementById('pvClose').focus();
    document.addEventListener('keydown', trapPvFocus, true);
  }
  function closePreviewModal() {
    pvRoot.hidden = true;
    document.removeEventListener('keydown', trapPvFocus, true);
    if (pvLastFocus && document.contains(pvLastFocus)) pvLastFocus.focus();
  }
  function trapPvFocus(e) {
    if (pvRoot.hidden) return;
    if (e.key === 'Escape') { closePreviewModal(); return; }
    if (e.key !== 'Tab') return;
    var focusable = pvRoot.querySelectorAll('button, [href], select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!focusable.length) return;
    var first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  document.getElementById('pvClose').addEventListener('click', closePreviewModal);
  document.getElementById('pvScrim').addEventListener('click', closePreviewModal);
  document.getElementById('pvPrint').addEventListener('click', function () { window.print(); });
  document.getElementById('pvRecordBtn').addEventListener('click', function () {
    closePreviewModal();
    if (pvRecordCtx) {
      var ctx = pvSourceCtx || inferContextOrNull(pvRecordCtx, state.personaId) || computeDefaultRoute(state.personaId);
      openRecordFromRow(pvRecordCtx, ctx, null);
    }
  });
  document.getElementById('zIn').addEventListener('click', function () { setZoom(zoom + 0.25); });
  document.getElementById('zOut').addEventListener('click', function () { setZoom(zoom - 0.25); });
  pvViewport.addEventListener('wheel', function (e) {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    setZoom(zoom + (e.deltaY < 0 ? 0.15 : -0.15));
  }, { passive: false });
  pvViewport.addEventListener('dblclick', function () { setZoom(zoom > 1.05 ? 1 : 2); });
  var pinch = null;
  pvViewport.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
      var a = e.touches[0], b = e.touches[1];
      pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: zoom };
    } else pinch = null;
  }, { passive: true });
  pvViewport.addEventListener('touchmove', function (e) {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    var a = e.touches[0], b = e.touches[1];
    setZoom(pinch.z * (Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pinch.d));
  }, { passive: false });
  pvViewport.addEventListener('touchend', function () { pinch = null; }, { passive: true });

  /* ═══════════ Master render + event wiring ═══════════ */
  function render() {
    applyChrome();
    var parsed = parseHash(location.hash);
    if (parsed.view === 'record') {
      renderRecordView(parsed.id, parsed.params);
    } else if (parsed.view === 'approvals') {
      var ctx = normalizeApprovalsParams(parsed.params, state.personaId);
      var st = history.state;
      renderApprovals(ctx);
      if (st && st.type === 'approvals' && typeof st.scrollY === 'number') {
        window.scrollTo(0, st.scrollY);
        var focusRow = st.focusId ? document.getElementById('row-' + st.focusId) : null;
        if (focusRow) focusRow.focus();
        else { var heading = document.getElementById('queueHeading'); if (heading) heading.focus(); }
      }
    } else {
      renderHome();
    }
  }

  window.addEventListener('popstate', function () { render(); });
  window.addEventListener('hashchange', function () {
    var parsed = parseHash(location.hash);
    if (!history.state) render();
  });

  document.getElementById('navHome').addEventListener('click', function (e) {
    e.preventDefault();
    history.pushState({ type: 'home' }, '', '#/home');
    render();
  });
  document.getElementById('navApprovals').addEventListener('click', function (e) {
    e.preventDefault();
    var ctx = computeDefaultRoute(state.personaId);
    history.pushState({ type: 'approvals', ctx: ctx }, '', buildApprovalsHash(ctx));
    render();
  });

  document.getElementById('personaSelect').addEventListener('change', function (e) {
    state.personaId = Number(e.target.value);
    history.pushState({ type: 'home' }, '', '#/home');
    render();
  });
  document.getElementById('scenarioSelect').addEventListener('change', function (e) {
    state.scenario = e.target.value;
    resetFixtures();
    history.pushState({ type: 'home' }, '', '#/home');
    render();
  });
  document.getElementById('langToggleBtn').addEventListener('click', function () {
    state.lang = state.lang === 'ar' ? 'en' : 'ar';
    render();
  });
  document.getElementById('themeToggleBtn').addEventListener('click', function () {
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    render();
  });
  document.getElementById('resetDemoBtn').addEventListener('click', function () {
    resetFixtures();
    history.pushState({ type: 'home' }, '', '#/home');
    render();
  });

  boot();

  window.__approvalsDemo = {
    state: state, render: function () { render(); }
  };
})();
</script>
</body>
</html>
