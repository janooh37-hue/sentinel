<style>
/* Sentinel tokens and shell, from workforce-day-filters.html. */
:root {
  --bg: #f5f4f1;
  --surface: #ffffff;
  --surface-raised: #fafaf6;
  --surface-tinted: #f0eee8;
  --primary: #0d2845;
  --primary-hover: #1d3a5e;
  --primary-soft: #e8edf3;
  --primary-text: #0d2845;
  --on-primary: #ffffff;
  --accent: #c8102e;
  --accent-soft: #fbe5e8;
  --smart: #6b4fb0;
  --smart-soft: #f1eef8;
  --success: #047857;
  --success-soft: #d6f0e4;
  --warning: #92400e;
  --warning-soft: #fbedd8;
  --info: #1d4ed8;
  --info-soft: #e0e8f8;
  --destructive: #dc2626;
  --destructive-text: #b91c1c;
  --text: #1c1f24;
  --text-muted: #5a6068;
  --border: #e6e4dd;
  --border-strong: #d4d1c8;
  --hairline: #efece5;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-pill: 99px;
  --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
  --font-arabic: "Noto Sans Arabic", "Inter", system-ui, sans-serif;
  --motion-base: 200ms;
  --focus-ring: var(--primary);
  --tab-band: var(--primary);
  --tab-ink: color-mix(in srgb, var(--on-primary) 83%, var(--tab-band));
  --bad-wash: var(--accent-soft);
  --gutter: 32px;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0a0e18;
  --surface: #131826;
  --surface-raised: #1a2034;
  --surface-tinted: #1f263b;
  --primary: #5778cf;
  --primary-hover: #7491db;
  --primary-soft: #1c2849;
  --primary-text: #8aa4e8;
  --on-primary: #0a0e18;
  --accent: #ef4858;
  --accent-soft: #3a1820;
  --smart: #a99af0;
  --smart-soft: #221d3a;
  --success: #34d399;
  --success-soft: #142d23;
  --warning: #fbbf24;
  --warning-soft: #3a2a10;
  --info: #60a5fa;
  --info-soft: #1c2940;
  --destructive: #f87171;
  --destructive-text: #fca5a5;
  --text: #e6e9f2;
  --text-muted: #8a93a7;
  --border: #2a3148;
  --border-strong: #3a4360;
  --hairline: #1f263b;
  --tab-band: var(--primary-soft);
  --tab-ink: color-mix(in srgb, var(--text) 86%, var(--tab-band));
  /* Keep the exact accent foreground at AA contrast on the small status text. */
  --bad-wash: color-mix(in srgb, var(--accent-soft) 52%, var(--surface));
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 var(--font-sans); font-feature-settings: "ss01", "cv11"; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
:lang(ar) { font-family: var(--font-arabic); }
h1,h2,h3,p,figure,ol { margin: 0; }
h1 { font-size: 28px; line-height: 1.35; font-weight: 700; letter-spacing: -.02em; }
h1 :lang(ar) { letter-spacing: 0; }
:lang(ar) h1 { letter-spacing: 0; }
h2 { font-size: 17px; line-height: 1.45; font-weight: 700; }
h3 { font-size: 15px; line-height: 1.45; font-weight: 700; }
button,input,select { font: inherit; color: inherit; }
button { cursor: pointer; text-align: start; border: 0; background: none; }
button:disabled { cursor: not-allowed; }
a { color: var(--primary-text); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
::selection { background: var(--primary-soft); color: var(--primary-text); }
input { caret-color: var(--primary-text); }
[hidden] { display: none !important; }
.sr-only { position: absolute; inline-size: 1px; block-size: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.muted { color: var(--text-muted); }
.meta { font-size: 12px; line-height: 1.6; color: var(--text-muted); }
.nowrap, time { white-space: nowrap; }
.icon { display: inline-block; inline-size: 16px; block-size: 16px; flex: none; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-block-size: 36px; padding-block: 6px; padding-inline: 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface); font-size: 13px; font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--surface-tinted); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
.segment { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--radius-md); background: var(--surface-tinted); }
.segment button { min-block-size: 32px; padding-block: 5px; padding-inline: 11px; border: 1px solid transparent; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--text-muted); text-align: center; }
.segment button:hover { color: var(--text); }
.segment button[aria-pressed="true"] { color: var(--primary-text); background: var(--surface); font-weight: 700; }
[data-theme="dark"] .segment button[aria-pressed="true"] { color: var(--text); background: var(--primary-soft); border-color: var(--border-strong); }
.btn, .segment button, .company-card { transition: color var(--motion-base), background-color var(--motion-base), border-color var(--motion-base); }
@media (prefers-reduced-motion: reduce) { .btn, .segment button, .company-card { transition: none; } }
.demo-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 7px; padding-inline: var(--gutter); border-block-end: 1px solid var(--border); background: var(--surface-raised); font-size: 12px; }
.demo-name { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; margin-inline-end: auto; font-weight: 700; }
.demo-name .sample { color: var(--text-muted); font-weight: 400; }
.demo-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.demo-controls .segment button { min-block-size: 28px; padding-inline: 9px; font-size: 12px; }
.demo-controls .btn { min-block-size: 34px; font-size: 12px; }
.app-nav { background: var(--surface); border-block-end: 1px solid var(--border); }
.app-nav-inner { display: flex; align-items: center; gap: 28px; max-inline-size: 1400px; padding-block: 12px; padding-inline: var(--gutter); margin-inline: auto; }
.brand { display: flex; align-items: center; gap: 11px; flex: none; }
.brand-mark { inline-size: 35px; block-size: 35px; color: var(--primary-text); }
.brand-copy { font-weight: 700; font-size: 18px; line-height: 1.2; color: var(--primary-text); }
.brand-copy small { display: block; margin-block-start: 3px; font-size: 12px; color: var(--text-muted); font-weight: 400; line-height: 1.4; }
.app-links { display: flex; gap: 5px; }
.app-links span { padding-block: 8px; padding-inline: 13px; font-size: 14px; border-radius: var(--radius-sm); color: var(--text-muted); }
.app-links .current-section { background: var(--primary-soft); color: var(--primary-text); font-weight: 700; }
.nav-meta { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; }
.avatar { display: inline-grid; place-items: center; inline-size: 32px; block-size: 32px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-text); font-size: 12px; font-weight: 700; flex: none; }
.screen-strip { background: var(--tab-band); }
.screen-inner { display: flex; align-items: end; gap: 4px; max-inline-size: 1400px; margin-inline: auto; padding-block-start: 5px; padding-inline: var(--gutter); overflow-x: auto; scrollbar-width: none; }
