<style>

* { box-sizing: border-box; }

.summary-grid dt { font-size: 12px; color: var(--text-muted); }
.legend { margin-block: 0 15px; font-size: 12px; }
.legend summary { cursor: pointer; color: var(--text-muted); font-size: 12px; min-block-size: 28px; }
.legend summary::marker { color: var(--text-muted); }
.legend-list { display: flex; align-items: center; flex-wrap: wrap; gap: 9px 21px; padding-block: 5px 2px; }
.legend-item { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--text-muted); }

.dot { --tone: var(--success); --wash: var(--success-soft); display: inline-block; flex: none; inline-size: 9px; block-size: 9px; border-radius: 50%; background: var(--tone); position: relative; }

[data-state="grace"] { --tone: var(--caution); --wash: var(--caution-soft); }

.dot[data-state="pending"] { background: transparent; border: 1.5px solid var(--text-faint); }

.unit { border: 1px solid var(--hairline); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }

.posts { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); }
.post { padding-block: 10px 5px; padding-inline: 17px; border-inline-end: 1px solid var(--hairline); min-inline-size: 0; }

.row-head { display: grid; grid-template-columns: 12px minmax(0,1fr) 84px 90px 20px; align-items: center; gap: 9px; padding-block: 7px 2px; font-size: 11px; color: var(--text-muted); }

function validTime(value) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(value); }

  const ready=!!draft.reason&&!!draft.details.trim();
  const save=document.getElementById('save-correction');
  if(save)save.disabled=!ready||!timesValid;
  const hint=document.getElementById('reason-hint');
  if(hint)hint.textContent=t(ready?'reasonReady':'reasonHint');
  const error=document.getElementById('time-error');
  if(error)error.hidden=timesValid;
  return ready&&timesValid;
}
function closeCorrection(restore=true) {
  document.getElementById('correction-layer').hidden=true;
  document.getElementById('correction-layer').innerHTML='';
  document.body.style.overflow='';
  selected=null; draft=null;
  if(restore)document.querySelector(returnSelector)?.focus({preventScroll:true});
}
function saveCorrection() {
  if(!state.canCorrect||!selected||!validateDraft())return;
  const p=selected;
  const clear=draft.action==='clear';
  if(clear) {
    const base=p.date===TODAY?originals.get(p.id):monthOriginals.get(p.date);
    Object.assign(p,base,{correction:null});
  } else {
    if(draft.action==='present') {
      p.inAt=draft.inAt; p.outAt=draft.stillOnSite?'':draft.outAt; p.leave=null;
      const offset=mins(p.inAt)-mins(p.start);
      p.state=offset>GRACE?'late':offset>0?'grace':p.outAt?'left':'onsite';
      if(!p.outAt&&(p.date<TODAY||mins(p.end)<=mins(NOW)))p.state='single';
    } else {
      p.state=draft.action; p.inAt='';p.outAt='';p.leave=draft.action==='leave'?draft.leave:null;
    }
    p.correction={actor:'actor',at:TODAY+' '+NOW,reason:draft.details.trim(),reasonCode:draft.reason,note:draft.note.trim()};
  }
  closeCorrection(false);render();
  document.querySelector(returnSelector)?.focus({preventScroll:true});
  showToast(t(clear?'cleared':'saved'));
}
function showToast(message) {
  clearTimeout(toastTimer);
  const toast=document.getElementById('toast');toast.textContent=message;toast.hidden=false;
  toastTimer=setTimeout(()=>{toast.hidden=true;},3500);
}
function changeScreen(screen) {
  if(screen==='correction'&&!state.canCorrect)return;
  closeCorrection(false);state.screen=screen;render();
  window.scrollTo({top:0,behavior:'instant'});
  if(screen==='correction')openCorrection(people[5].id,TODAY);
}
document.addEventListener('click',event=>{
  const btn=event.target.closest('button,a,[data-action]'); if(!btn)return;
  if(btn.dataset.lang){state.lang=btn.dataset.lang;render();return;}
  if(btn.dataset.viewport){state.mobile=btn.dataset.viewport==='mobile';render();return;}
  if(btn.dataset.screen){event.preventDefault();changeScreen(btn.dataset.screen);return;}
  if(btn.dataset.view){state.view=btn.dataset.view;render();return;}
  if(btn.dataset.correct){openCorrection(btn.dataset.correct,btn.dataset.day,btn);return;}
  if(btn.dataset.correctionAction){draft.action=btn.dataset.correctionAction;renderCorrection();document.querySelector(`[data-correction-action="${draft.action}"]`)?.focus({preventScroll:true});return;}
  if(btn.dataset.scopeType){state.scopeType=btn.dataset.scopeType;state.scopeSearch='';render();return;}
  if(btn.dataset.removeScope){state.scopes.delete(btn.dataset.removeScope);state.scopeSaved=false;render();return;}
  if(btn.dataset.action==='theme'){state.theme=state.theme==='light'?'dark':'light';render();}
  else if(btn.dataset.action==='close-correction')closeCorrection();
  else if(btn.dataset.action==='all-punches'){event.preventDefault();state.logExpanded=!state.logExpanded;render();document.querySelector('.punch-panel').scrollIntoView({block:'start'});}
  else if(btn.dataset.action==='save-scope'){state.scopeSaved=true;render();showToast(t('scopeSaved'));}
});
document.addEventListener('input',event=>{
  const el=event.target;
  if(el.id==='people-search') { const pos=el.selectionStart;state.query=el.value;render();const next=document.getElementById('people-search');next.focus();if(next.type!=='search')next.setSelectionRange(pos,pos); }
  else if(el.id==='scope-search') {state.scopeSearch=el.value;render();document.getElementById('scope-search').focus();}
  else if(draft&&el.form?.id==='correction-form') {if(el.name)draft[el.name]=el.value;validateDraft();}
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(el.id==='can-correct'){closeCorrection(false);state.canCorrect=el.checked;if(!state.canCorrect&&state.screen==='correction')state.screen='attendance';render();}
  else if(el.name==='scope-mode'){state.scopeMode=el.value;state.scopeSaved=false;render();}
  else if(el.dataset.scopeOption){el.checked?state.scopes.add(el.dataset.scopeOption):state.scopes.delete(el.dataset.scopeOption);state.scopeSaved=false;render();}
  else if(el.id==='still-on-site'){draft.stillOnSite=el.checked;renderCorrection();}
  else if(draft&&el.form?.id==='correction-form'){if(el.name)draft[el.name]=el.value;validateDraft();}
});
document.addEventListener('submit',event=>{if(event.target.id==='correction-form'){event.preventDefault();saveCorrection();}});
document.addEventListener('keydown',event=>{
  if(!selected)return;
  if(event.key==='Escape'){event.preventDefault();closeCorrection();}
  if(event.key==='Tab'&&isMobile()) {
    const focusable=[...document.querySelectorAll('.correction button:not(:disabled),.correction input:not(:disabled),.correction select,.correction textarea')];
    const first=focusable[0],last=focusable.at(-1);
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
});
document.addEventListener('pointerdown',event=>{if(selected&&!isMobile()&&!event.target.closest('.correction')&&!event.target.closest('[data-correct]')&&!event.target.closest('#demo-controls'))closeCorrection(false);});
window.addEventListener('resize',()=>{if(selected)renderCorrection();});
render();
</script>
</body>
</html>
