<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GSSG dashboard analytics directions</title>
  <style>
    @font-face {
      font-family: "Lenos";
      src: url("../frontend/src/assets/fonts/lenos-variable.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      --bg: #f5f4f1;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --surface-tinted: #eff2f4;
      --primary: #0d2845;
      --primary-hover: #173d63;
      --primary-soft: #e8eef4;
      --accent: #c8102e;
      --accent-soft: #fae6ea;
      --success: #047857;
      --success-soft: #e5f4ee;
      --warning: #b45309;
      --warning-soft: #fff1dc;
      --info: #0d5c8a;
      --info-soft: #e4f1f7;
      --violet: #6b4fb0;
      --violet-soft: #eee9f8;
      --text: #10233a;
      --muted: #677389;
      --faint: #a0a8b4;
      --border: #dfe4e9;
      --hairline: #e9edf0;
      --shadow: 0 8px 24px rgba(13, 40, 69, 0.06);
      --font: "Lenos", Inter, system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      --hero-grad: linear-gradient(135deg, #0a1f3a 0%, #0d2845 50%, #1d3a5e 100%);
    }

    html[data-theme="dark"] {
      --bg: #0a0e18;
      --surface: #131826;
      --surface-raised: #1a2034;
      --surface-tinted: #1f263b;
      --primary: #5778cf;
      --primary-hover: #7491db;
      --primary-soft: #1c2849;
      --accent: #ef4858;
      --accent-soft: #3a1820;
      --success: #34d399;
      --success-soft: #142d23;
      --warning: #fbbf24;
      --warning-soft: #3a2a10;
      --info: #60a5fa;
      --info-soft: #1c2940;
      --violet: #a99af0;
      --violet-soft: #221d3a;
      --text: #e6e9f2;
      --muted: #8a93a7;
      --faint: #5f6678;
      --border: #2a3148;
      --hairline: #1f263b;
      --shadow: 0 8px 24px rgba(0, 0, 0, .24);
      --hero-grad: linear-gradient(135deg, #050816 0%, #0d1428 50%, #1a2540 100%);
      color-scheme: dark;
    }
    html[data-theme="dark"] .topnav { background: rgba(19, 24, 38, .96); }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
    button { font: inherit; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .page { min-height: 100vh; background: var(--bg); }

    .topnav {
      height: 82px;
      display: grid;
      grid-template-columns: 246px minmax(0, 1fr) 246px;
      align-items: stretch;
      padding: 0 34px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.96);
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand img { width: 43px; height: 43px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px var(--border); }
    .brand-name { font-size: 15px; font-weight: 780; letter-spacing: .03em; }
    .brand-sub { margin-top: 1px; color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .navlinks { display: flex; align-items: stretch; justify-content: center; min-width: 0; }
    .navlink {
      min-width: 82px;
      padding: 17px 12px 12px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 610;
      text-align: center;
    }
    .navlink b { display: block; margin-bottom: 4px; color: inherit; font-size: 17px; line-height: 1; font-weight: 500; }
    .navlink.active { border-bottom-color: var(--accent); color: var(--primary); background: var(--primary-soft); }
    .utilities { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .utility {
      width: 36px; height: 36px; display: grid; place-items: center;
      border: 1px solid var(--border); border-radius: 11px; background: var(--surface);
      color: var(--primary); font-weight: 760; font-size: 12px;
    }
    .account { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: white; font-size: 12px; font-weight: 800; }

    .content { width: 100%; padding: 22px 34px 30px; }
    .hero {
      min-height: 104px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 28px;
      padding: 22px 28px;
      border-radius: 20px;
      background: var(--primary);
      color: white;
      overflow: hidden;
      position: relative;
    }
    .hero::after { content: ""; position: absolute; top: -105px; right: 90px; width: 260px; height: 260px; border: 42px solid rgba(255,255,255,.045); border-radius: 50%; }
    .hero-copy { position: relative; z-index: 1; }
    .hero-kicker { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.56); }
    .hero h1 { margin: 4px 0 5px; font-size: 24px; line-height: 1.15; letter-spacing: -.025em; }
    .hero p { margin: 0; color: rgba(255,255,255,.72); font-size: 12px; }
    .hero-signal { position: relative; z-index: 1; display: flex; align-items: center; gap: 24px; }
    .hero-stat { min-width: 80px; padding-left: 22px; border-left: 1px solid rgba(255,255,255,.18); }
    .hero-stat:first-child { border-left: 0; padding-left: 0; }
    .hero-stat strong { display: block; font: 700 22px/1 var(--mono); }
    .hero-stat span { display: block; margin-top: 6px; color: rgba(255,255,255,.62); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }

    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 18px 1px 10px; }
    .section-head h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .section-head p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    .section-action { color: var(--primary); font-size: 11px; font-weight: 720; }

    .comparison-widgets { display: grid; grid-template-columns: 1.42fr 1fr 1fr; gap: 13px; }
    .compare-card {
      min-height: 192px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-top: 4px solid var(--tone, var(--primary));
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }
    .compare-card::after { content: ""; position: absolute; right: -28px; bottom: -34px; width: 104px; height: 104px; border: 19px solid color-mix(in srgb, var(--tone, var(--primary)) 7%, transparent); border-radius: 50%; }
    .compare-head { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .compare-title { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .compare-icon { width: 32px; height: 32px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; background: color-mix(in srgb, var(--tone) 10%, white); font-size: 16px; }
    .compare-title b { display: block; font-size: 11px; }
    .compare-title span { display: block; margin-top: 2px; color: var(--muted); font-size: 8.5px; }
    .compare-delta { padding: 4px 7px; border-radius: 7px; background: color-mix(in srgb, var(--delta-tone, var(--success)) 10%, white); color: var(--delta-tone, var(--success)); font: 750 9px var(--mono); white-space: nowrap; }
    .compare-main { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 12px; margin-top: 13px; }
    .compare-period small { display: block; color: var(--muted); font-size: 8.5px; text-transform: uppercase; letter-spacing: .06em; }
    .compare-period strong { display: block; margin-top: 3px; font: 780 29px/1 var(--mono); color: var(--primary); letter-spacing: -.04em; }
    .compare-period em { margin-left: 3px; color: var(--muted); font: normal 9px var(--font); }
    .compare-period.previous { text-align: right; }
    .compare-period.previous strong { color: var(--muted); font-size: 20px; }
    .compare-arrow { padding-bottom: 5px; color: var(--faint); font-size: 14px; }
    .compare-bars { position: relative; z-index: 1; display: grid; gap: 7px; margin-top: 12px; }
    .compare-bar { display: grid; grid-template-columns: 62px 1fr 58px; align-items: center; gap: 8px; color: var(--muted); font-size: 8.5px; }
    .compare-bar-track { height: 5px; display: flex; align-items: stretch; gap: 2px; }
    .compare-bar-track i { display: block; border-radius: 4px; }
    .compare-bar-track .current { width: var(--current); background: var(--tone); }
    .compare-bar-track .previous { width: var(--previous); background: color-mix(in srgb, var(--tone) 22%, white); }
    .compare-bar b { text-align: right; color: var(--text); font: 700 8.5px var(--mono); }
    .conduct-card .compare-main { grid-template-columns: .72fr auto .72fr; margin-top: 9px; }
    .conduct-card .compare-period strong { font-size: 25px; }
    .conduct-split { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .conduct-item { padding-top: 7px; border-top: 1px solid var(--hairline); }
    .conduct-item span { color: var(--muted); font-size: 8.5px; }
    .conduct-item b { float: right; font: 750 11px var(--mono); color: var(--tone); }
    .v2 .compare-card:nth-child(2) { background: var(--primary); border-color: var(--primary); }
    .v2 .compare-card:nth-child(2) .compare-title b,
    .v2 .compare-card:nth-child(2) .compare-period strong { color: white; }
    .v2 .compare-card:nth-child(2) .compare-title span,
    .v2 .compare-card:nth-child(2) .compare-period small,
    .v2 .compare-card:nth-child(2) .compare-period em,
    .v2 .compare-card:nth-child(2) .compare-arrow { color: rgba(255,255,255,.58); }
    .v2 .compare-card:nth-child(2) .compare-icon { background: rgba(255,255,255,.12); }
    .v2 .compare-card:nth-child(2) .compare-delta { background: rgba(255,255,255,.12); color: #9fe0c6; }
    .v2 .compare-card:nth-child(2) .compare-bar { color: rgba(255,255,255,.56); }
    .v2 .compare-card:nth-child(2) .compare-bar b { color: white; }
    .v4 .compare-card { border-top-width: 1px; border-left: 4px solid var(--tone); }
    .v5 .conduct-card { background: var(--primary); border-color: var(--primary); }
    .v5 .conduct-card .compare-title b,
    .v5 .conduct-card .compare-period strong,
    .v5 .conduct-card .compare-bar b,
    .v5 .conduct-card .conduct-item b { color: white; }
    .v5 .conduct-card .compare-title span,
    .v5 .conduct-card .compare-period small,
    .v5 .conduct-card .compare-period em,
    .v5 .conduct-card .compare-arrow,
    .v5 .conduct-card .compare-bar,
    .v5 .conduct-card .conduct-item span { color: rgba(255,255,255,.58); }
    .v5 .conduct-card .compare-icon,
    .v5 .conduct-card .compare-delta { background: rgba(255,255,255,.11); }
    .v5 .conduct-card .conduct-item { border-top-color: rgba(255,255,255,.12); }
    .v5 .conduct-card .compare-delta { color: #9fe0c6; }

    .analytics-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 13px; }
    .panel { border: 1px solid var(--border); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
    .panel-head { min-height: 61px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 18px 12px; border-bottom: 1px solid var(--hairline); }
    .panel-head h3 { margin: 0; font-size: 14px; letter-spacing: -.015em; }
    .panel-head p { margin: 3px 0 0; color: var(--muted); font-size: 10px; }
    .period { display: inline-flex; padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); background: var(--surface); font-size: 10px; }
    .chart-body { height: 240px; padding: 12px 16px 13px; }
    .chart-svg { width: 100%; height: 100%; overflow: visible; }
    .grid-line { stroke: #edf0f2; stroke-width: 1; }
    .axis-label { fill: var(--faint); font: 9px var(--font); }
    .legend { display: flex; align-items: center; gap: 15px; color: var(--muted); font-size: 10px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--legend); }

    .side-panel { padding-bottom: 8px; }
    .side-list { padding: 7px 16px 4px; }
    .side-row { padding: 10px 0; border-bottom: 1px solid var(--hairline); }
    .side-row:last-child { border-bottom: 0; }
    .side-row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 11px; }
    .side-row-head b { font: 700 13px var(--mono); color: var(--primary); }
    .bar-track { height: 5px; margin-top: 7px; border-radius: 4px; background: var(--surface-tinted); overflow: hidden; }
    .bar-fill { height: 100%; width: var(--fill); background: var(--tone); border-radius: inherit; }
    .avatar-row { display: flex; align-items: center; gap: 9px; padding: 8px 0; }
    .avatar { width: 29px; height: 29px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-size: 10px; font-weight: 800; }
    .avatar-copy { min-width: 0; flex: 1; }
    .avatar-copy b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
    .avatar-copy span { color: var(--muted); font-size: 9px; }
    .days { font: 700 10px var(--mono); color: var(--warning); }

    .quick-actions { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .quick {
      min-height: 88px;
      display: grid;
      grid-template-columns: 35px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-top: 3px solid var(--primary);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 4px 12px rgba(13,40,69,.045);
    }
    .quick-emoji { font-size: 25px; filter: saturate(.9); }
    .quick b { display: block; font-size: 10px; line-height: 1.2; }
    .quick span { display: block; margin-top: 4px; color: var(--muted); font-size: 8.5px; line-height: 1.25; }

    .variant-note {
      position: fixed; right: 18px; bottom: 18px; z-index: 20;
      display: flex; align-items: center; gap: 7px; padding: 7px;
      border: 1px solid rgba(255,255,255,.3); border-radius: 14px;
      background: rgba(13,40,69,.92); box-shadow: 0 12px 34px rgba(0,0,0,.18);
      color: white; backdrop-filter: blur(12px);
    }
    .variant-note a { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; color: rgba(255,255,255,.66); text-decoration: none; font: 700 10px var(--mono); }
    .variant-note a.on { background: white; color: var(--primary); }

    .variant-label { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
    .variant-index { font: 700 10px var(--mono); color: var(--accent); letter-spacing: .12em; }
    .variant-label b { font-size: 12px; color: var(--primary); }

    .stack-bars { height: 100%; display: grid; grid-template-columns: repeat(8, minmax(30px, 1fr)); align-items: end; gap: 18px; padding: 4px 16px 1px 28px; border-bottom: 1px solid var(--border); background: repeating-linear-gradient(to bottom, transparent 0, transparent 47px, #edf0f2 48px); }
    .stack-col { height: 100%; display: flex; flex-direction: column; justify-content: end; align-items: center; gap: 7px; }
    .stack { width: 32px; height: var(--total); display: flex; flex-direction: column-reverse; justify-content: flex-start; overflow: hidden; border-radius: 7px 7px 3px 3px; }
    .stack i { display: block; width: 100%; }
    .stack .annual { height: var(--annual); background: var(--primary); }
    .stack .sick { height: var(--sick); background: var(--accent); }
    .stack .other { flex: 1; background: var(--warning); }
    .stack-col label { color: var(--muted); font-size: 9px; }

    /* V3 — workflow flow */
    .flow-body { height: 240px; padding: 20px 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; gap: 28px; position: relative; }
    .flow-line { position: absolute; left: 12%; right: 12%; top: 50%; height: 2px; background: var(--border); }
    .flow-stage { position: relative; z-index: 1; min-height: 122px; padding: 15px 14px; border: 1px solid var(--border); border-top: 4px solid var(--tone); border-radius: 15px; background: var(--surface); box-shadow: 0 7px 18px rgba(13,40,69,.07); }
    .flow-stage::after { content: "→"; position: absolute; right: -23px; top: 43px; color: var(--faint); font-weight: 800; }
    .flow-stage:last-child::after { display: none; }
    .flow-stage small { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .07em; }
    .flow-stage strong { display: block; margin: 11px 0 5px; font: 750 27px/1 var(--mono); color: var(--primary); }
    .flow-stage span { color: var(--muted); font-size: 9px; }
    .flow-stage em { position: absolute; right: 11px; top: 11px; font: normal 700 9px var(--mono); color: var(--tone); }

    /* V4 — executive balance */
    .v4 .analytics-grid { grid-template-columns: minmax(0, 1fr) 320px; }
    .radial { width: 145px; height: 145px; margin: 10px auto 2px; position: relative; }
    .radial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .radial circle { fill: none; stroke-width: 13; }
    .radial .track { stroke: var(--surface-tinted); }
    .radial .a { stroke: var(--primary); stroke-dasharray: 160 278; stroke-linecap: round; }
    .radial .b { stroke: var(--accent); stroke-dasharray: 59 278; stroke-dashoffset: -170; stroke-linecap: round; }
    .radial .c { stroke: var(--warning); stroke-dasharray: 30 278; stroke-dashoffset: -239; stroke-linecap: round; }
    .radial-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
    .radial-center strong { font: 750 28px/1 var(--mono); color: var(--primary); }
    .radial-center span { margin-top: 5px; color: var(--muted); font-size: 9px; }
    .radial-legend { padding: 2px 20px 8px; }
    .radial-legend .side-row { padding: 7px 0; }

    /* Daily movement brief — keeps the greeting/date treatment and uses the
       open desktop area for concrete leave transitions rather than totals. */
    .movement-hero {
      min-height: 150px;
      grid-template-columns: minmax(0, 1fr) minmax(390px, 460px);
      gap: 34px;
      padding: 24px 28px;
      background: var(--hero-grad);
    }
    .movement-hero::after {
      right: auto;
      inset-inline-end: 72px;
      border-color: rgba(255, 255, 255, .04);
    }
    .movement-hero-copy { position: relative; z-index: 1; min-width: 0; max-width: 640px; }
    .movement-hero-copy h1 { margin-bottom: 8px; }
    .hero-context {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      color: rgba(255, 255, 255, .82);
      font-size: 10px;
    }
    .hero-context-date { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .hero-context-divider { width: 4px; height: 4px; border-radius: 50%; background: rgba(255, 255, 255, .28); }
    .hero-leave-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid rgba(255, 255, 255, .11);
      border-radius: 999px;
      background: rgba(255, 255, 255, .07);
      color: rgba(255, 255, 255, .9);
      font-weight: 650;
    }
    .hero-leave-chip i { width: 6px; height: 6px; border-radius: 50%; background: #fbbf24; }
    .hero-insight { margin-top: 10px; color: rgba(255, 255, 255, .68); font-size: 11px; }
    .movement-brief {
      position: relative;
      z-index: 1;
      width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 13px;
      align-items: center;
      padding: 13px 14px;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 17px;
      background: linear-gradient(115deg, rgba(255, 255, 255, .105), rgba(255, 255, 255, .045));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 12px 30px rgba(0, 0, 0, .13);
    }
    .movement-crest {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 50%;
      background: rgba(255, 255, 255, .055);
      box-shadow: 0 0 0 5px rgba(255, 255, 255, .03);
    }
    .movement-crest img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      animation: movement-crest-spin 90s linear infinite;
    }
    .movement-body { min-width: 0; }
    .movement-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }
    .movement-head strong {
      color: rgba(255, 255, 255, .9);
      font-size: 9px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .movement-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #6ee7b7;
      font-size: 8px;
      font-weight: 740;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .movement-live i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .movement-list { display: grid; gap: 2px; }
    .movement-row {
      min-width: 0;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 29px;
    }
    .movement-marker {
      position: relative;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
    }
    .movement-marker::before {
      content: "";
      width: 7px;
      height: 7px;
      border: 2px solid rgba(255, 255, 255, .46);
      border-radius: 50%;
      background: var(--event-tone);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--event-tone) 18%, transparent);
    }
    .movement-row:not(:last-child) .movement-marker::after {
      content: "";
      position: absolute;
      top: 15px;
      bottom: -14px;
      inset-inline-start: 8px;
      width: 1px;
      background: rgba(255, 255, 255, .13);
    }
    .movement-event-copy { min-width: 0; }
    .movement-event-copy b {
      display: block;
      overflow: hidden;
      color: white;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;

    .movement-event-copy span {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      color: rgba(255, 255, 255, .5);
      font-size: 8px;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;

    .movement-when {
      padding: 4px 7px;
      border: 1px solid rgba(255, 255, 255, .1);

      color: rgba(255, 255, 255, .76);
      font: 680 8px/1 var(--mono);

      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }

    @media (prefers-reduced-motion: reduce) {
      .movement-crest img { animation: none; }
    }

    /* V6 — approved hybrid: four reorderable cards + selectable comparison */
    .v6 .top-widgets-wrap { position: relative; }
    .v6 .top-widget-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 13px;
    }
    .v6 .top-widget {
      min-width: 0;
      min-height: 198px;
      padding: 16px;
      border: 1px solid var(--border);
      border-top: 4px solid var(--tone, var(--primary));
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .v6 .top-widget-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      min-height: 38px;
    }
    .v6 .top-widget-head h3 { margin: 0; font-size: 12px; letter-spacing: -.015em; }
    .v6 .top-widget-head p { margin: 3px 0 0; color: var(--muted); font-size: 9px; }
    .v6 .live-badge,
    .v6 .month-badge {

      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
      padding: 4px 7px;
      border-radius: 999px;
      background: var(--success-soft);
      color: var(--success);
      font-size: 8px;
      font-weight: 750;
      white-space: nowrap;
    }
    .v6 .month-badge { background: var(--primary-soft); color: var(--primary); }

      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 13%, transparent);
    }
    .v6 .attendance-numbers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }
    .v6 .attendance-number {
      padding: 9px 10px;
      border-radius: 11px;
      background: var(--primary-soft);
    }
    .v6 .attendance-number.leave { background: var(--accent-soft); }
    .v6 .attendance-number strong {
      display: block;
      color: var(--primary);
      font: 780 25px/1 var(--mono);
      letter-spacing: -.04em;
    }
    .v6 .attendance-number.leave strong { color: var(--accent); }
    .v6 .attendance-number span { display: block; margin-top: 5px; color: var(--muted); font-size: 9px; }
    .v6 .attendance-track {
      height: 7px;
      display: flex;
      gap: 2px;
      margin-top: 11px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surface-tinted);
    }
    .v6 .attendance-track i:first-child { width: 95.1%; background: var(--primary); }
    .v6 .attendance-track i:last-child { flex: 1; min-width: 6px; background: var(--accent); }
    .v6 .card-foot {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 8.5px;
    }
    .v6 .card-foot b { color: var(--text); font-weight: 700; }
    .v6 .queue-list { display: grid; gap: 8px; margin-top: 13px; }
    .v6 .queue-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 11px;
      background: var(--surface-tinted);
    }
    .v6 .queue-row b { display: block; font-size: 10px; }
    .v6 .queue-row span { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; }
    .v6 .queue-row strong { color: var(--tone); font: 780 22px/1 var(--mono); }
    .v6 .metric-table-head,
    .v6 .metric-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 32px 32px 49px;
      align-items: center;
      gap: 6px;
    }
    .v6 .metric-table-head {
      margin-top: 12px;
      padding-inline: 2px;
      color: var(--faint);
      font-size: 7px;
      text-align: right;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .v6 .metric-table-head span:first-child { text-align: left; }
    .v6 .metric-row {
      min-height: 48px;
      padding: 8px 2px;
      border-top: 1px solid var(--hairline);
    }
    .v6 .metric-row b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9.5px; }
    .v6 .metric-row span { display: block; margin-top: 2px; color: var(--muted); font-size: 7.5px; }
    .v6 .metric-row strong,
    .v6 .metric-row .previous {
      text-align: right;
      color: var(--primary);
      font: 750 12px var(--mono);
    }
    .v6 .metric-row .previous { color: var(--muted); }
    .v6 .metric-row em {
      justify-self: end;
      padding: 3px 5px;
      border-radius: 6px;
      background: var(--success-soft);
      color: var(--success);
      font: normal 700 7.5px var(--mono);
      white-space: nowrap;
    }
    .v6 .metric-row em.rise { background: var(--warning-soft); color: var(--warning); }
    .v6 .widget-order-button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--primary);
      font-size: 11px;
      font-weight: 720;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .v6 .widget-order-button:focus-visible,
    .v6 .metric-chip:focus-visible,
    .v6 .metric-option:focus-visible,
    .v6 .order-controls button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .v6 .widget-settings {
      position: absolute;
      top: -2px;
      right: 0;
      z-index: 12;
      width: min(330px, calc(100vw - 32px));
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 18px 48px rgba(13, 40, 69, .18);
    }
    .v6 .widget-settings[hidden],
    .v6 .metric-menu[hidden] { display: none; }
    .v6 .settings-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .v6 .settings-head h3 { margin: 0; font-size: 12px; }
    .v6 .settings-head p { margin: 3px 0 0; color: var(--muted); font-size: 8.5px; }
    .v6 .settings-close {
      align-self: flex-start;
      padding: 4px 7px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--primary);
      font-size: 8px;
      cursor: pointer;
    }
    .v6 .order-list { display: grid; gap: 6px; }
    .v6 .order-row {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 9px;
      background: var(--surface-tinted);
      font-size: 9px;
      font-weight: 650;
    }
    .v6 .order-index { color: var(--muted); font: 700 8px var(--mono); }
    .v6 .order-controls { display: flex; gap: 4px; }
    .v6 .order-controls button {
      padding: 3px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--primary);
      font-size: 7.5px;
      cursor: pointer;
    }
    .v6 .order-controls button:disabled { opacity: .35; cursor: default; }
    .v6 .analytics-grid { grid-template-columns: minmax(0, 1fr) 320px; }
    .v6 .panel-head { position: relative; min-height: 72px; }
    .v6 .chart-head-controls { display: flex; align-items: center; gap: 10px; }
    .v6 .chart-legend { display: flex; gap: 9px; color: var(--muted); font-size: 8px; }
    .v6 .chart-legend span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .v6 .chart-legend i { width: 12px; height: 3px; border-radius: 3px; background: var(--legend); }
    .v6 .chart-legend .previous-line { background: repeating-linear-gradient(90deg, var(--accent) 0 4px, transparent 4px 7px); }
    .v6 .metric-picker { position: relative; }
    .v6 .metric-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 132px;
      justify-content: space-between;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--primary);
      font-size: 9px;
      font-weight: 720;
      cursor: pointer;
    }
    .v6 .metric-menu {
      position: absolute;
      top: calc(100% + 7px);
      right: 0;
      z-index: 14;
      width: 178px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 14px 38px rgba(13, 40, 69, .16);
    }
    .v6 .metric-option {
      width: 100%;
      padding: 7px 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-size: 9px;
      text-align: left;
      cursor: pointer;
    }
    .v6 .metric-option:hover,
    .v6 .metric-option[aria-selected="true"] { background: var(--primary-soft); color: var(--primary); }
    .v6 .hybrid-chart-body { height: 258px; padding: 11px 16px 13px; }
    .v6 .chart-totals { display: flex; align-items: baseline; gap: 16px; min-height: 38px; padding-inline: 8px; }
    .v6 .chart-total small { color: var(--muted); font-size: 7.5px; text-transform: uppercase; letter-spacing: .05em; }
    .v6 .chart-total strong { margin-left: 5px; color: var(--primary); font: 760 20px/1 var(--mono); }
    .v6 .chart-total.previous strong { color: var(--muted); }
    .v6 .chart-total em {
      margin-left: 4px;
      color: var(--muted);
      font: normal 8px var(--font);
    }
    .v6 .chart-change {
      margin-left: auto;
      padding: 4px 7px;
      border-radius: 7px;
      background: var(--success-soft);
      color: var(--success);
      font: 740 8px var(--mono);
    }
    .v6 .chart-change.warning { background: var(--warning-soft); color: var(--warning); }
    .v6 .radial .a { stroke-dasharray: 157 278; }
    .v6 .radial .b { stroke-dasharray: 55 278; stroke-dashoffset: -164; }
    .v6 .radial .c { stroke-dasharray: 55 278; stroke-dashoffset: -226; }

    .v6 .hybrid-chart-canvas { height: 193px; }
    .v6 .hybrid-chart-canvas svg { width: 100%; height: 100%; overflow: visible; }

    @media (max-width: 1180px) {
      .v6 .top-widget-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .movement-hero { grid-template-columns: minmax(0, 1fr) minmax(360px, 420px); gap: 24px; }
    }
    @media (max-width: 720px) {
      .v6 .topnav { height: 68px; grid-template-columns: minmax(0, 1fr) auto; padding-inline: 14px; }
      .v6 .navlinks,
      .v6 .utility { display: none; }
      .v6 .content { padding: 14px; }
      .v6 .hero { grid-template-columns: 1fr; gap: 18px; padding: 20px; }
      .v6 .movement-hero { min-height: 0; gap: 14px; }
      .movement-brief { grid-template-columns: 44px minmax(0, 1fr); gap: 10px; padding: 11px 12px; }
      .movement-crest { width: 40px; height: 40px; }
      .movement-crest img { width: 35px; height: 35px; }
      .movement-row:last-child,
      .hero-insight { display: none; }
      .movement-row:nth-child(2) .movement-marker::after { display: none; }
      .movement-event-copy b { font-size: 9px; }
      .movement-event-copy span { font-size: 7.5px; }
      .v6 .hero-signal { justify-content: space-between; gap: 10px; }
      .v6 .hero-stat { min-width: 0; padding-left: 10px; }
      .v6 .hero-stat strong { font-size: 18px; }
      .v6 .hero-stat span { font-size: 8px; }
      .v6 .section-head { align-items: flex-start; flex-direction: column; gap: 8px; }
      .v6 .top-widget-grid,
      .v6 .analytics-grid,
      .v6 .quick-actions { grid-template-columns: 1fr; }
      .v6 .panel-head { align-items: flex-start; flex-direction: column; }
      .v6 .chart-head-controls { width: 100%; justify-content: space-between; }
      .v6 .metric-menu { right: auto; left: 0; }
      .v6 .chart-totals { gap: 8px; padding-inline: 0; }
      .v6 .chart-total strong { display: block; margin: 2px 0 0; }
      .v6 .hybrid-chart-body { height: 286px; }
      .v6 .widget-settings { top: 34px; }

    /* V5 — command matrix */
    .v5 .panel.main { background: var(--primary); border-color: var(--primary); }
    .v5 .panel.main .panel-head { border-bottom-color: rgba(255,255,255,.12); }
    .v5 .panel.main .panel-head h3 { color: white; }
    .v5 .panel.main .panel-head p { color: rgba(255,255,255,.56); }
    .v5 .panel.main .period { color: rgba(255,255,255,.72); border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.06); }
    .heatmap-wrap { height: 240px; padding: 18px 20px 13px; display: grid; grid-template-columns: 28px minmax(0,1fr); grid-template-rows: minmax(0,1fr) 18px; gap: 7px 10px; }
    .heat-y { display: grid; grid-template-rows: repeat(7,1fr); align-items: center; color: rgba(255,255,255,.46); font-size: 8px; }
    .heat-x { grid-column: 2; display: grid; grid-template-columns: repeat(12,1fr); color: rgba(255,255,255,.46); font-size: 8px; text-align: center; }
    .heatmap { display: grid; grid-template-columns: repeat(12,1fr); grid-template-rows: repeat(7,1fr); gap: 4px; }

    .v5 .side-panel { border-top: 4px solid var(--accent); }
    .alert-row { display: grid; grid-template-columns: 9px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--hairline); }
    .alert-row:last-child { border-bottom: 0; }
    .alert-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tone); }
    .alert-row b { display: block; font-size: 10px; }
    .alert-row span { color: var(--muted); font-size: 8px; }
    .alert-row strong { font: 700 10px var(--mono); color: var(--tone); }

    .overview { padding: 28px; }
    .overview-title { max-width: 1200px; margin: 0 auto 22px; }
    .overview-title h1 { margin: 0; font-size: 30px; color: var(--primary); }
    .overview-title p { margin: 7px 0 0; color: var(--muted); }
    .overview-frame { max-width: 1440px; margin: 0 auto 34px; border: 1px solid var(--border); border-radius: 22px; overflow: hidden; box-shadow: 0 20px 50px rgba(13,40,69,.1); }

    @media (max-width: 1080px) {
      .topnav { grid-template-columns: 190px 1fr 140px; padding-inline: 22px; }
      .navlink { min-width: 64px; padding-inline: 8px; }

      .comparison-widgets { grid-template-columns: 1fr; }
      .quick-actions { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const quickActions = [
      ['📘', 'General Book', 'Open a new register entry'],
      ['📝', 'Acknowledgment', 'Record an employee form'],
      ['💸', 'Salary Transfer', 'Create salary request'],
      ['🪪', 'Leave Permit', 'Issue a short permit'],
      ['⚠️', 'Violation', 'Record a violation'],
      ['📄', 'Clearance', 'Start employee clearance'],
      ['🏖️', 'Leave Application', 'Submit a leave request'],
    ];

    const comparisonWidgets = () => `
      <div class="comparison-widgets">
        <article class="compare-card conduct-card" style="--tone:#c8102e;--delta-tone:#047857">
          <div class="compare-head">
            <div class="compare-title"><span class="compare-icon">⚠️</span><div><b>Conduct activity</b><span>Violations + warning forms</span></div></div>
            <span class="compare-delta">↓ 26.7%</span>
          </div>
          <div class="compare-main">
            <div class="compare-period"><small>This month</small><strong>11<em>cases</em></strong></div>
            <span class="compare-arrow">←</span>
            <div class="compare-period previous"><small>Last month</small><strong>15<em>cases</em></strong></div>
          </div>
          <div class="conduct-split">
            <div class="conduct-item" style="--tone:#c8102e"><span>Violations</span><b>4 · <span>was 6</span></b></div>
            <div class="conduct-item" style="--tone:#b45309"><span>Warnings</span><b>7 · <span>was 9</span></b></div>
          </div>
        </article>
        <article class="compare-card" style="--tone:#0d5c8a;--delta-tone:#b45309">
          <div class="compare-head">
            <div class="compare-title"><span class="compare-icon">☀️</span><div><b>Annual leave</b><span>Approved leave days</span></div></div>
            <span class="compare-delta">↑ 14.8%</span>
          </div>
          <div class="compare-main">
            <div class="compare-period"><small>This month</small><strong>31<em>days</em></strong></div>
            <span class="compare-arrow">←</span>
            <div class="compare-period previous"><small>Last month</small><strong>27<em>days</em></strong></div>
          </div>
          <div class="compare-bars">
            <div class="compare-bar"><span>Monthly load</span><div class="compare-bar-track"><i class="current" style="--current:54%;--tone:#0d5c8a"></i><i class="previous" style="--previous:46%;--tone:#0d5c8a"></i></div><b>31 / 27</b></div>
          </div>
        </article>
        <article class="compare-card" style="--tone:#6b4fb0;--delta-tone:#047857">
          <div class="compare-head">
            <div class="compare-title"><span class="compare-icon">✚</span><div><b>Sick leave</b><span>Approved leave days</span></div></div>
            <span class="compare-delta">↓ 33.3%</span>
          </div>
          <div class="compare-main">
            <div class="compare-period"><small>This month</small><strong>08<em>days</em></strong></div>
            <span class="compare-arrow">←</span>
            <div class="compare-period previous"><small>Last month</small><strong>12<em>days</em></strong></div>
          </div>
          <div class="compare-bars">
            <div class="compare-bar"><span>Monthly load</span><div class="compare-bar-track"><i class="current" style="--current:40%;--tone:#6b4fb0"></i><i class="previous" style="--previous:60%;--tone:#6b4fb0"></i></div><b>8 / 12</b></div>
          </div>
        </article>
      </div>`;

    const actionRail = () => `
      <div class="section-head"><div><h2>Quick Actions</h2><p>Five frequent workflows in one balanced row</p></div><span class="section-action">Edit Quick Actions · 5 shown</span></div>
      <div class="quick-actions">${quickActions.slice(0, 5).map(([emoji,title,copy]) => `<div class="quick"><span class="quick-emoji">${emoji}</span><div><b>${title}</b><span>${copy}</span></div></div>`).join('')}</div>`;

    const nav = () => `
      <header class="topnav">
        <div class="brand"><img src="../frontend/public/brand/gssg-logo.png" alt=""><div><div class="brand-name">GSSG</div><div class="brand-sub">Operations Portal</div></div></div>
        <nav class="navlinks" aria-label="Primary">
          ${[['▦','Dashboard'],['♟','Employees'],['≡','Ledger'],['◫','Leaves'],['✦','Services'],['▤','Records'],['✓','Permits']].map(([i,n],idx)=>`<div class="navlink ${idx===0?'active':''}"><b>${i}</b>${n}</div>`).join('')}
        </nav>
        <div class="utilities"><div class="utility">A−</div><div class="utility">A+</div><div class="utility">◐</div><div class="utility">⌕</div><div class="account">AM</div></div>
      </header>`;

    const hero = (message='Operations are steady. 6 employees are on leave today.') => `
      <section class="hero">
        <div class="hero-copy"><span class="hero-kicker">Good morning · Saturday, 15 Aug</span><h1>Welcome back, Ahmed</h1><p>${message}</p></div>
        <div class="hero-signal"><div class="hero-stat"><strong>116</strong><span>staff on site</span></div><div class="hero-stat"><strong>06</strong><span>on leave</span></div><div class="hero-stat"><strong>03</strong><span>return this week</span></div></div>
      </section>`;

    const movementHero = () => `
      <section class="hero movement-hero">
        <div class="movement-hero-copy">
          <span class="hero-kicker">Good morning</span>
          <h1>Welcome back, Ahmed</h1>
          <div class="hero-context">
            <span class="hero-context-date">Sun, 16 Aug · 04 Rabi I 1448</span>
            <span class="hero-context-divider" aria-hidden="true"></span>
            <span class="hero-leave-chip"><i aria-hidden="true"></i><b>6</b> on leave today</span>
          </div>
          <p class="hero-insight">Operations are steady. 3 employees return before Thursday.</p>
        </div>
        <aside class="movement-brief" aria-label="Daily employee movement brief">
          <div class="movement-crest">
            <img src="../frontend/public/brand/gssg-logo.png" alt="" aria-hidden="true">
          </div>
          <div class="movement-body">
            <div class="movement-head">

        const previous = points[index - 1];
        const current = points[index];
        const middleX = Number(((previous.x + current.x) / 2).toFixed(1));

      const maximum = Math.max(scaleStep, Math.ceil(rawMax / scaleStep) * scaleStep);
      const plotTop = 25;

      const plotHeight = plotBottom - plotTop;
      const xFor = (index) => Number((70 + index * (740 / 3)).toFixed(1));
      const yFor = (value) => Number((plotBottom - (value / maximum) * plotHeight).toFixed(1));
      const currentPoints = metric.current.map((value, index) => ({ x: xFor(index), y: yFor(value) }));
      const previousPoints = metric.previous.map((value, index) => ({ x: xFor(index), y: yFor(value) }));
      const levels = [0, .25, .5, .75, 1];

      chart.setAttribute('aria-label', `${metric.label}: ${currentTotal} ${metric.unit} this month compared with ${previousTotal} last month`);
      chart.innerHTML = `
        ${levels.map((level) => {
          const y = Number((plotBottom - level * plotHeight).toFixed(1));
          return `<line class="grid-line" x1="42" y1="${y}" x2="842" y2="${y}"/><text class="axis-label" x="4" y="${y + 3}">${Math.round(maximum * level)}</text>`;
        }).join('')}
        ${['W1','W2','W3','W4'].map((week, index) => `<text class="axis-label" x="${xFor(index)}" y="201" text-anchor="middle">${week}</text>`).join('')}
        <path d="${hybridSmoothPath(previousPoints)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>
        <path d="${hybridSmoothPath(currentPoints)}" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round"/>
        ${currentPoints.map((point) => `<circle cx="${point.x}" cy="${point.y}" r="4.5" fill="var(--surface)" stroke="var(--primary)" stroke-width="3"/>`).join('')}
      `;

      document.getElementById('hybrid-chart-description').textContent = metric.description;
      document.getElementById('hybrid-metric-label').textContent = metric.label;
      document.getElementById('hybrid-current-total').textContent = String(currentTotal);
      document.getElementById('hybrid-previous-total').textContent = String(previousTotal);
      document.getElementById('hybrid-current-unit').textContent = metric.unit;
      document.getElementById('hybrid-previous-unit').textContent = metric.unit;

      const delta = previousTotal === 0 ? 0 : ((currentTotal - previousTotal) / previousTotal) * 100;
      const change = document.getElementById('hybrid-change');
      change.textContent = `${delta >= 0 ? '+' : '−'}${Math.abs(delta).toFixed(1)}%`;
      change.classList.toggle('warning', (delta >= 0) !== metric.upIsGood);

      document.querySelectorAll('.metric-option').forEach((option) => {
        option.setAttribute('aria-selected', String(option.dataset.metric === key));
      });
    };

    const initVariant6 = () => {
      const metricChip = document.getElementById('metric-chip');
      const metricMenu = document.getElementById('metric-menu');
      const editWidgets = document.getElementById('edit-top-widgets');
      const widgetSettings = document.getElementById('widget-settings');
      const closeSettings = document.getElementById('settings-close');
      const orderList = document.getElementById('order-list');
      const orderStatus = document.getElementById('order-status');
      const widgetGrid = document.getElementById('top-widget-grid');
      if (!metricChip || !metricMenu || !editWidgets || !widgetSettings || !orderList || !widgetGrid) return;

      metricChip.addEventListener('click', () => {
        const opening = metricMenu.hidden;
        metricMenu.hidden = !opening;
        metricChip.setAttribute('aria-expanded', String(opening));
      });
      metricMenu.addEventListener('click', (event) => {
        const option = event.target.closest('[data-metric]');
        if (!option) return;
        renderHybridChart(option.dataset.metric);
        metricMenu.hidden = true;
        metricChip.setAttribute('aria-expanded', 'false');
        metricChip.focus();
      });

      const widgetNames = {
        attendance: 'Attendance now',
        workflow: 'Workflow queue',
        leave: 'Leave activity',
        conduct: 'Conduct activity',
      };
      const widgetOrder = ['attendance', 'workflow', 'leave', 'conduct'];
      const renderOrderList = () => {
        orderList.innerHTML = widgetOrder.map((id, index) => `
          <div class="order-row">
            <span class="order-index">${index + 1}</span>
            <span>${widgetNames[id]}</span>
            <span class="order-controls">
              <button type="button" data-order-index="${index}" data-move="-1" ${index === 0 ? 'disabled' : ''}>Earlier</button>
              <button type="button" data-order-index="${index}" data-move="1" ${index === widgetOrder.length - 1 ? 'disabled' : ''}>Later</button>
            </span>
          </div>`).join('');
      };
      const setSettingsOpen = (open) => {
        widgetSettings.hidden = !open;
        editWidgets.setAttribute('aria-expanded', String(open));
      };
      editWidgets.addEventListener('click', () => setSettingsOpen(widgetSettings.hidden));
      closeSettings.addEventListener('click', () => {
        setSettingsOpen(false);
        editWidgets.focus();
      });
      orderList.addEventListener('click', (event) => {
        const control = event.target.closest('[data-move]');
        if (!control) return;
        const from = Number(control.dataset.orderIndex);
        const to = from + Number(control.dataset.move);
        if (to < 0 || to >= widgetOrder.length) return;
        [widgetOrder[from], widgetOrder[to]] = [widgetOrder[to], widgetOrder[from]];
        widgetOrder.forEach((id) => widgetGrid.append(document.querySelector(`[data-widget-id="${id}"]`)));
        renderOrderList();
        orderStatus.textContent = `Widget order updated. ${widgetNames[widgetOrder[to]]} is now position ${to + 1}.`;
      });

      document.addEventListener('click', (event) => {
        if (!metricMenu.hidden && !event.target.closest('.metric-picker')) {
          metricMenu.hidden = true;
          metricChip.setAttribute('aria-expanded', 'false');
        }
      });
      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        if (!metricMenu.hidden) {
          metricMenu.hidden = true;
          metricChip.setAttribute('aria-expanded', 'false');
          metricChip.focus();
        } else if (!widgetSettings.hidden) {
          setSettingsOpen(false);
          editWidgets.focus();
        }
      });

      renderOrderList();
      renderHybridChart('total');
    };

    const variants = [variant1, variant2, variant3, variant4, variant5, variant6];
    const params = new URLSearchParams(location.search);
    const selected = Number(params.get('v'));
    document.documentElement.dataset.theme = params.get('theme') === 'dark' ? 'dark' : 'light';
    document.documentElement.dir = params.get('dir') === 'rtl' ? 'rtl' : 'ltr';
    const app = document.getElementById('app');
    if (selected >= 1 && selected <= variants.length) {
      app.innerHTML = variants[selected - 1]();
      document.body.insertAdjacentHTML('beforeend', `<div class="variant-note">${variants.map((_,i)=>`<a class="${i+1===selected?'on':''}" href="?v=${i+1}">${i+1}</a>`).join('')}</div>`);
    } else {
      app.className = 'overview';
      app.innerHTML = `<div class="overview-title"><h1>GSSG dashboard analytics directions</h1><p>Six dashboard structures using the current Sentinel language. Direction 6 is the approved hybrid with four reorderable top widgets, a selectable month comparison, and the absence ring.</p></div>${variants.map((render,i)=>`<section class="overview-frame" id="v${i+1}">${render()}</section>`).join('')}`;
    }
    if (document.querySelector('.v6')) initVariant6();
  </script>
</body>
</html>
