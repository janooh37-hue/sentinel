<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — Record page v2 (throwaway)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  THROWAWAY PROTOTYPE. Merges mockups/plan/record-polish/{layout,preview,clarity}.md
  into one interactive mock of /books/:id and the /books list pane.
  No persistence, no backend. Open the file directly in a browser.
-->
<style>
:root{
  --bg:#f5f4f1;--surface:#fff;--raised:#fafaf6;--tint:#f0eee8;
  --primary:#0d2845;--primary-hover:#1d3a5e;--primary-soft:#e8edf3;
  --accent:#c8102e;--accent-soft:#fbe5e8;
  --success:#047857;--success-soft:#d6f0e4;--warning:#b45309;--warning-soft:#fbedd8;
  --info:#1d4ed8;--info-soft:#e0e8f8;
  --text:#1c1f24;--muted:#5a6068;--faint:#8b9098;--border:#e6e4dd;--border-strong:#d4d1c8;--hair:#efece5;
  --sans:Inter,ui-sans-serif,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--ar:"Noto Sans Arabic",Inter,system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--sans);background:#dcd9d1;color:var(--text);overflow:hidden}
button{font:inherit;color:inherit}
kbd{font:600 10.5px/1 var(--mono);padding:2px 5px;border-radius:5px;border:1px solid var(--border-strong);border-bottom-width:2px;background:var(--surface);color:var(--muted)}

/* ---------- stage (outside the device) ---------- */
.stage{position:fixed;inset:0 0 58px 0;display:flex}
.viewport{flex:1;position:relative;overflow:hidden}
.device-wrap{position:absolute;left:50%;top:50%}
.device{position:relative;background:var(--bg);border-radius:14px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 30px 80px rgba(20,20,10,.25);overflow:hidden}
.device.phone{border-radius:34px;box-shadow:0 0 0 10px #15171c,0 30px 80px rgba(20,20,10,.35)}
.notes{width:360px;flex:none;background:#f8f7f3;border-inline-start:1px solid var(--border);overflow:auto;padding:18px 18px 40px;font-size:12.5px}
.notes.hidden{display:none}
.notes h2{font-size:13px;margin:0 0 4px;font-weight:800}
.notes .sub{color:var(--muted);margin:0 0 14px}
.notes h3{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:18px 0 8px}
.note{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:default;transition:border-color .15s}
.note:hover{border-color:var(--primary)}
.note.dim{opacity:.45}
.note b{display:block;font-size:12.5px;margin-bottom:2px}
.note p{margin:0;color:var(--muted)}
.note .src{font:500 10px var(--mono);color:var(--faint);margin-top:4px}
.ctag{display:inline-block;font:700 9.5px/1 var(--mono);padding:3px 6px;border-radius:6px;background:var(--primary-soft);color:var(--primary);margin-inline-end:4px;vertical-align:1px}
.ctag.c1{background:var(--accent-soft);color:var(--accent)}.ctag.c5{background:var(--success-soft);color:var(--success)}.ctag.c4{background:var(--info-soft);color:var(--info)}.ctag.c2{background:var(--warning-soft);color:var(--warning)}
.q{border-inline-start:3px solid var(--warning);padding:6px 10px;background:var(--surface);border-radius:0 10px 10px 0;margin-bottom:8px}
[dir=rtl] .q{border-radius:10px 0 0 10px}
.q b{display:block}
.q span{color:var(--muted)}
.hl-target{outline:2.5px solid #f59e0b !important;outline-offset:2px;border-radius:8px}

.bar{position:fixed;left:0;right:0;bottom:0;height:58px;background:#14171d;color:#cfd3dc;display:flex;align-items:center;gap:14px;padding:0 14px;font-size:12px;z-index:1000;overflow-x:auto;white-space:nowrap}
.bar .grp{display:flex;align-items:center;gap:4px}
.bar .lbl{color:#7d8597;font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-inline-end:4px}
.bar button{background:#232833;border:1px solid #2e3442;color:#cfd3dc;height:30px;padding:0 10px;border-radius:8px;cursor:pointer;font-size:12px}
.bar button.on{background:#e8edf3;color:#0d2845;border-color:#e8edf3;font-weight:700}
.bar select{background:#232833;border:1px solid #2e3442;color:#cfd3dc;height:30px;border-radius:8px;padding:0 8px;font-size:12px}
.bar .sep{width:1px;height:28px;background:#2e3442}
.bar .tagp{font:700 10px var(--mono);color:#f59e0b;letter-spacing:.08em}

/* ---------- app (inside the device) ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.app[dir=rtl]{font-family:var(--ar)}
.app svg{flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.topnav{height:52px;flex:none;display:flex;align-items:center;gap:22px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--hair)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--primary)}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font:800 10px var(--sans);font-style:normal}
.navl{display:flex;gap:4px}
.navl a{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:12px;color:var(--muted);font-weight:500;font-size:13px;text-decoration:none}
.navl a.on{background:var(--primary-soft);color:var(--primary);font-weight:700}
.navl a svg{width:15px;height:15px}
.w-tablet .navl a span,.w-laptop .navl a span{display:none}
.topnav .me{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:99px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:11px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:12px;font-weight:600;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--tint)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--primary);color:#fff;border-color:transparent}
.btn.primary:hover{background:var(--primary-hover)}
.btn.sign{background:var(--success);color:#fff;border-color:transparent}
.btn.sign:hover{background:#036148}
.btn.danger{color:var(--accent);border-color:#efc3ca}
.btn.danger:hover{background:var(--accent-soft)}
.btn.warn{color:var(--warning);border-color:#efd6b4}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--tint)}
.btn.icon{width:36px;padding:0}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:10px}
.btn.sm.icon{width:30px}
.btn.sm svg{width:14px;height:14px}
.btn.on{background:var(--primary-soft);border-color:#c7d3e3;color:var(--primary)}
.btn[aria-disabled=true]{opacity:.48;cursor:not-allowed}
.btn .spin{width:14px;height:14px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:99px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mobile .btn{height:46px;border-radius:14px;font-size:14px}
.mobile .btn.sm{height:36px;font-size:13px}
.rtl-flip{}
[dir=rtl] .rtl-flip{transform:scaleX(-1)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:99px;background:currentColor}
.t-neutral{background:var(--tint);color:var(--muted)}
.t-warning{background:var(--warning-soft);color:var(--warning)}
.t-success{background:var(--success-soft);color:var(--success)}
.t-accent{background:var(--accent-soft);color:var(--accent)}
.t-info{background:var(--info-soft);color:var(--info)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--border);color:var(--muted);background:var(--surface);white-space:nowrap}

/* ref copy chip */
.ref{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--mono);color:var(--primary);background:transparent;border:1px solid transparent;border-radius:8px;padding:2px 6px;margin-inline-start:-6px;cursor:pointer}
.ref:hover{background:var(--primary-soft);border-color:#c7d3e3}
.ref svg{width:12px;height:12px;opacity:.55}
.ref:hover svg{opacity:1}

/* ---------- record header (≥768) ---------- */
.rhdr{flex:none;background:var(--surface);border-bottom:1px solid var(--hair);position:relative}
.rowA{display:flex;align-items:center;gap:12px;padding:12px 20px 10px;flex-wrap:wrap}
.qnav{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:12px;padding:2px;height:36px}
.qnav .btn{height:30px;width:30px;border:0;border-radius:9px}
.qnav span{font:600 11.5px var(--mono);color:var(--muted);padding:0 6px;white-space:nowrap}
.ident{flex:1 1 14rem;min-width:14rem}
.ident h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:1px 0 1px}
.ident .meta{font-size:12px;color:var(--muted)}
.refline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.refline .pill{padding:2px 9px;font-size:11px}
.refline .chip{padding:1px 8px}
.utils{display:flex;gap:6px;align-items:center;margin-inline-start:auto}
.rowB{display:flex;align-items:center;gap:10px;padding:10px 20px;border-top:1px solid var(--hair);background:linear-gradient(180deg,var(--raised),var(--surface));flex-wrap:wrap}
.status{display:flex;align-items:center;gap:9px;flex:1 1 280px;min-width:0;font-size:13px}
.status .si{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;flex:none}
.status .si svg{width:15px;height:15px}
.status b{font-weight:650}
.status q{color:var(--muted);font-style:italic}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.reason{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.reason svg{width:13px;height:13px}

/* banners */
.banner{flex:none;display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;border-bottom:1px solid var(--hair)}
.banner svg{width:16px;height:16px}
.banner .grow{flex:1;min-width:0}
.banner.warn{background:var(--warning-soft);color:#7a3a06}
.banner.ok{background:var(--success-soft);color:#05543d}
.mobile .banner{padding:10px 14px;align-items:flex-start;flex-wrap:wrap}

/* body: desk + rail (physically pinned LTR, children re-assert dir) */
.rbody{flex:1;min-height:0;display:flex;direction:ltr;position:relative}
.desk{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.dtool{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(255,255,255,.82);backdrop-filter:blur(6px);border-bottom:1px solid var(--hair);flex-wrap:wrap;z-index:3}
.seg{display:inline-flex;background:var(--tint);border-radius:11px;padding:3px;gap:2px}
.seg button{height:28px;padding:0 11px;border:0;border-radius:8px;background:transparent;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button svg{width:13px;height:13px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button.on.signed{color:var(--success)}
.cap{font-size:11.5px;color:var(--muted);white-space:nowrap}
.cap.ok{color:var(--success);font-weight:600}
.dtool .sp{flex:1}
.zoom{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:10px;height:30px;background:var(--surface)}
.zoom button{height:28px;min-width:28px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:8px;font-size:11.5px;font-weight:600;padding:0 6px}
.zoom button:hover{background:var(--tint)}
.zoom button svg{width:14px;height:14px}
.zoom .pct{font:600 11px var(--mono);min-width:44px;color:var(--muted)}
.pgc{font:600 11.5px var(--mono);color:var(--muted);padding:0 4px;white-space:nowrap}
.marks{display:inline-flex;align-items:center;gap:4px;padding:2px 3px 2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:650}
[dir=rtl] .marks{padding:2px 10px 2px 3px}
.marks button{width:24px;height:24px;border:0;border-radius:99px;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer}
.marks button:hover{background:rgba(200,16,46,.12)}
.marks svg{width:13px;height:13px}
.armedtools{display:inline-flex;gap:4px;align-items:center;padding:2px 4px 2px 10px;border-radius:11px;background:var(--primary-soft);color:var(--primary);font-size:11.5px;font-weight:600}

.dscroll{flex:1;min-height:0;overflow:auto;padding:22px 24px 40px;background:radial-gradient(150% 100% at 40% -10%,var(--surface) 0%,var(--tint) 70%,var(--bg) 100%)}
.mobile .dscroll{padding:12px 12px 120px}
.pages{margin:0 auto;display:flex;flex-direction:column;gap:16px;align-items:center}
.page{position:relative;width:100%;aspect-ratio:1/1.4142;background:#fff;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 28px rgba(20,20,10,.10);padding:7% 8%;overflow:hidden;font-size:clamp(7px,1.35cqw,13px);container-type:inline-size}
.pages{container-type:inline-size}
.page .lh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--primary);padding-bottom:3%;margin-bottom:5%}
.page .crest{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--primary);font-size:1.15em}
.page .crest i{width:2.6em;height:2.6em;border-radius:99px;background:var(--primary);color:#fff;display:grid;place-items:center;font-style:normal;font-size:.7em}
.page .lhm{text-align:end;font:500 .85em var(--mono);color:var(--muted);line-height:1.6}
.page h4{font-size:1.25em;margin:0 0 4%;color:var(--text)}
.page .ln{height:.55em;border-radius:3px;background:#e9e7e2;margin:0 0 1.15em}
.page .lbl2{font-size:.85em;color:var(--muted);margin-bottom:.6em}
.sigblk{position:absolute;inset-inline-end:8%;bottom:8%;width:38%;text-align:center}
.sigbox{height:5.5em;border:1.5px dashed #c9c5bb;border-radius:6px;display:grid;place-items:center;color:#a8a49b;font-size:.85em}
.sigline{border-top:1px solid #333;margin-top:.4em;padding-top:.3em;font-size:.8em;color:var(--muted)}
.stamp{position:absolute;inset-inline-start:8%;bottom:9%;transform:rotate(-8deg);border:2.5px solid var(--success);color:var(--success);border-radius:8px;padding:.4em .8em;font-weight:800;font-size:.95em;letter-spacing:.08em;text-align:center;opacity:.85}
.stamp small{display:block;font:600 .7em var(--mono);letter-spacing:0}
.page.scan{background:#f4f2ec;filter:contrast(.95);transform:rotate(-.35deg)}
.page.scan::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 2px,transparent 2px 4px);pointer-events:none}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.wm span{transform:rotate(-28deg);font-weight:800;font-size:3.4em;letter-spacing:.12em;color:rgba(180,83,9,.13);border:4px solid rgba(180,83,9,.13);padding:.1em .5em;border-radius:12px}
.pin{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:99px 99px 99px 0;transform:rotate(-45deg);background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25);font-size:10.5px;font-weight:800;cursor:pointer}
.pin b{transform:rotate(45deg)}
.pin.cur{outline:3px solid rgba(200,16,46,.3);width:30px;height:30px;margin:-15px 0 0 -15px}
.pin.mine{background:var(--primary)}
.pinnote{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:8px 10px;font-size:11.5px;width:200px;z-index:2}
.pinnote b{display:block;font-size:11px;color:var(--accent)}
.armed .page{cursor:crosshair}

.empty{max-width:420px;margin:60px auto;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px 24px}
.empty .ic{width:44px;height:44px;border-radius:99px;margin:0 auto 10px;display:grid;place-items:center}
.empty .ic svg{width:20px;height:20px}
.empty b{display:block;font-size:14.5px;margin-bottom:4px}
.empty p{margin:0 0 14px;color:var(--muted);font-size:12.5px}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.skel{width:100%;aspect-ratio:1/1.4142;border-radius:4px;background:linear-gradient(90deg,#efede8 0%,#f7f6f2 50%,#efede8 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* rail */
.rail{flex:none;background:var(--surface);border-left:1px solid var(--hair);overflow:auto;transition:width .22s var(--ease)}
.rail.open{width:15rem;padding:16px 18px}
.rail.closed{width:52px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer}
.rail.closed:hover{background:var(--raised)}
.rail .rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rail .rh b{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.vlabel{writing-mode:vertical-rl;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.dots{display:flex;flex-direction:column;gap:8px;align-items:center}
.dots i{width:10px;height:10px;border-radius:99px;background:var(--border)}
.dots i.done{background:var(--success)}.dots i.live{background:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}.dots i.bad{background:var(--accent)}
.tl{display:flex;flex-direction:column;font-size:12.5px}
.tl .st{display:flex;gap:10px;padding:8px 0;position:relative}
.tl .st:not(:last-child)::before{content:"";position:absolute;inset-inline-start:11px;top:30px;bottom:-8px;width:1.5px;background:var(--border)}
.tl .ic{width:23px;height:23px;border-radius:99px;background:var(--tint);color:var(--faint);display:grid;place-items:center;flex:none;z-index:1}
.tl .ic svg{width:12px;height:12px}
.tl .done .ic{background:var(--success-soft);color:var(--success)}
.tl .live .ic{background:var(--primary-soft);color:var(--primary)}
.tl .bad .ic{background:var(--accent-soft);color:var(--accent)}
.tl .l{font-weight:600}
.tl .m{color:var(--faint);font-size:11px}
.raildrawer{position:absolute;top:0;bottom:0;right:0;width:290px;background:var(--surface);box-shadow:-12px 0 32px rgba(20,20,10,.16);padding:16px 18px;z-index:6;animation:slin .22s var(--ease)}
@keyframes slin{from{transform:translateX(30px);opacity:0}}

/* focus mode */
.fbar{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--hair)}
.fbar .grow{flex:1;min-width:0}

/* menu / dropdown */
.menu{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 40px rgba(20,20,10,.16);padding:6px;width:290px;animation:pop .14s var(--ease)}
@keyframes pop{from{transform:translateY(-4px);opacity:0}}
.menu h5{margin:6px 10px 4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.menu hr{border:0;border-top:1px solid var(--hair);margin:6px 4px}
.mi{display:flex;align-items:flex-start;gap:10px;width:100%;padding:8px 10px;border-radius:9px;border:0;background:transparent;cursor:pointer;text-align:start}
.mi:hover{background:var(--tint)}
.mi svg{width:16px;height:16px;color:var(--muted);margin-top:1px}
.mi span{flex:1;min-width:0}
.mi b{display:block;font-weight:550;font-size:13px}
.mi small{display:block;color:var(--faint);font-size:11.5px;line-height:1.35;margin-top:1px}
.mi.danger b,.mi.danger svg{color:var(--accent)}
.mi.dis{cursor:not-allowed}
.mi.dis b,.mi.dis svg{color:var(--faint)}
.mi.dis small{color:var(--muted)}

/* phone */
.mhdr{flex:none;background:var(--surface);border-bottom:1px solid var(--hair);padding:10px 12px 10px}
.mrow{display:flex;align-items:center;gap:8px}
.mhdr h1{font-size:15.5px;margin:2px 0 0;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mhdr .stl{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px}
.mprog{flex:none;background:var(--surface);border-bottom:1px solid var(--hair);padding:9px 14px;font-size:12.5px}
.mprog summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}
.mprog summary::-webkit-details-marker{display:none}
.mprog .tl{padding-top:8px;max-height:40%;overflow:auto}
.mscroll{flex:1;min-height:0;overflow:auto}
.mchips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 0;scrollbar-width:none}
.mchips button{height:36px;padding:0 13px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:12.5px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.mchips button svg{width:13px;height:13px}
.mchips button.on{background:var(--primary);color:#fff;border-color:transparent}
.mchips button.on.signed{background:var(--success)}
.pcard{position:relative;margin:10px 12px 0}
.pcard .xp{position:absolute;top:8px;inset-inline-end:8px;z-index:2;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pcard .xp svg{width:17px;height:17px}
.dock{position:absolute;left:0;right:0;bottom:60px;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid var(--hair);padding:8px 10px;display:flex;gap:8px;align-items:stretch}
.dock .btn{flex:none;padding:0 12px}
.dock .grow{flex:1}
.dock .more{width:54px;flex-direction:column;gap:1px;padding:0;font-size:10px;font-weight:600}
.dock .more svg{width:18px;height:18px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:60px;background:var(--surface);border-top:1px solid var(--hair);display:flex;z-index:21;padding-bottom:6px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--faint);font-weight:600}
.tabbar a svg{width:20px;height:20px}
.tabbar a.on{color:var(--primary)}
.scrim{position:absolute;inset:0;background:rgba(10,14,24,.38);z-index:60;animation:fd .18s}
@keyframes fd{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:22px 22px 0 0;max-height:82%;overflow:auto;padding:8px 10px 24px;animation:up .24s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--border-strong);margin:4px auto 10px}
.sheet .mi{padding:12px 10px;min-height:52px}
.sheet .mi svg{width:19px;height:19px}
.sheet .mi b{font-size:14.5px}
.sheet .mi small{font-size:12px}
.sheet .shd{display:flex;align-items:center;gap:10px;padding:2px 10px 10px;border-bottom:1px solid var(--hair);margin-bottom:6px}
.fsv{position:absolute;inset:0;z-index:70;background:#0f131b;display:flex;flex-direction:column;animation:fd .18s}
.fsv .top,.fsv .bot{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;color:#e6e9f2}
.fsv .mid{flex:1;overflow:auto;padding:10px}
.fsv .btn{background:#1f2533;border-color:#2e3442;color:#e6e9f2}
.fsv .mchips{padding:0}
.fsv .mchips button{background:#1f2533;border-color:#2e3442;color:#e6e9f2}
.fsv .mchips button.on{background:#e6e9f2;color:#0f131b}

/* dialogs & toasts */
.dlg{position:absolute;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 28px));background:var(--surface);border-radius:18px;box-shadow:0 30px 80px rgba(10,14,24,.3);padding:20px;animation:pop .16s var(--ease)}
.dlg h3{margin:0 0 6px;font-size:16px}
.dlg p{margin:0 0 14px;color:var(--muted);font-size:13px}
.dlg .docchip{display:flex;gap:10px;align-items:center;background:var(--tint);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:12.5px}
.dlg .docchip svg{width:18px;height:18px;color:var(--muted)}
.dlg textarea{width:100%;min-height:76px;border:1px solid var(--border);border-radius:12px;padding:10px;font:inherit;margin-bottom:14px;resize:vertical}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mobile .dlg{top:auto;bottom:0;transform:translateX(-50%);width:100%;border-radius:22px 22px 0 0;padding:22px 16px 26px}
.mobile .dlg .row{flex-direction:column-reverse}
.mobile .dlg .row .btn{width:100%}
.toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 24px)}
.mobile .toasts{bottom:136px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:#14171d;color:#eef0f4;border-radius:12px;padding:10px 12px 10px 14px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.25);position:relative;overflow:hidden;animation:up .2s var(--ease)}
.toast svg{width:16px;height:16px}
.toast button{background:transparent;border:1px solid #3a4152;color:#fff;border-radius:8px;height:28px;padding:0 10px;font-weight:700;cursor:pointer}
.toast .tbar{position:absolute;left:0;bottom:0;height:2px;background:#f59e0b;animation:tb linear forwards}
@keyframes tb{from{width:100%}to{width:0}}
.tip{position:absolute;z-index:90;pointer-events:none;background:#14171d;color:#eef0f4;font-size:12px;font-weight:500;padding:6px 9px;border-radius:8px;white-space:nowrap;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.tip kbd{background:#2a303d;border-color:#3a4152;color:#cfd3dc}
.help{width:min(520px,calc(100% - 28px))}
.help table{width:100%;border-collapse:collapse;font-size:13px}
.help td{padding:7px 4px;border-bottom:1px solid var(--hair)}
.help td:last-child{text-align:end}

/* ---------- list page ---------- */
.lwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 20px 0}
.spine{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;flex:none}
.spine button{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;display:inline-flex;gap:7px;align-items:center;color:var(--muted)}
.spine button b{font:600 11px var(--mono);color:var(--faint)}
.spine button.on{background:var(--primary);color:#fff;border-color:transparent}
.spine button.on b{color:#c7d3e3}
.lgrid{flex:1;min-height:0;display:grid;gap:14px;padding-bottom:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.srail{overflow:auto;padding:8px}
.srail a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:13px;font-weight:550;color:var(--text);cursor:pointer;text-decoration:none}
.tip[hidden]{display:none}
.srail a:hover{background:var(--tint)}
.srail a.on{background:var(--primary-soft);color:var(--primary)}
.srail a .g{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:13px}
.srail a .n{margin-inline-start:auto;font:600 11px var(--mono);color:var(--faint)}
.srail.icons{padding:8px 6px}
.srail.icons a{justify-content:center;padding:8px 0;position:relative}
.srail.icons a .n{position:absolute;top:2px;inset-inline-end:2px;margin:0;background:var(--surface);border-radius:99px;font-size:9px;padding:0 4px;border:1px solid var(--border)}
.ltool{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--hair);flex:none}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--border);border-radius:12px;padding:0 10px;background:var(--raised);color:var(--faint)}
.search svg{width:15px;height:15px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;font:inherit;color:var(--text)}
.rows{overflow:auto;flex:1;min-height:0;container-type:inline-size}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--hair);cursor:pointer;position:relative}
.lrow:hover{background:var(--raised)}
.lrow.sel{background:var(--primary-soft)}
.lrow.sel::before{content:"";position:absolute;inset-inline-start:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--primary)}
.lrow input{width:16px;height:16px;flex:none;accent-color:var(--primary)}
.lrow .g{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:13px}
.lrow .rf{font:600 11.5px var(--mono);color:var(--primary);width:4.8rem;flex:none;text-decoration:none}
.lrow .rf:hover{text-decoration:underline}
.lrow .sb{flex:1;min-width:0}
.lrow .sb b{display:block;font-weight:550;font-size:13px}
.lrow .sb small{color:var(--faint);font-size:11.5px}
.lrow .dt{font:500 11px var(--mono);color:var(--faint);flex:none}
@container (max-width:480px){.lrow .g,.lrow .dt{display:none}}
@container (max-width:380px){.lrow{flex-wrap:wrap;row-gap:2px}.lrow .rf{width:auto}.lrow .sb{flex-basis:100%;order:5;padding-inline-start:26px}}
.pane .ph{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--hair);flex:none}
.pane .pb{flex:1;min-height:0;overflow:auto;padding:12px 14px}
.pane .pf{flex:none;display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--hair);flex-wrap:wrap;position:relative}
.pane .pf .sp{flex:1}
.pane.collapsed{align-items:center;padding:10px 0;gap:12px;cursor:pointer}
.pane.collapsed:hover{background:var(--raised)}
.pane.drawer{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(27rem,92%);z-index:30;border-radius:0;border-width:0;border-inline-start-width:1px;box-shadow:-16px 0 40px rgba(20,20,10,.16);animation:slin .22s var(--ease)}
[dir=rtl] .pane.drawer{box-shadow:16px 0 40px rgba(20,20,10,.16)}
.minipages .page{font-size:clamp(5px,1.35cqw,10px)}
.lempty{padding:40px 20px;text-align:center;color:var(--muted)}
/* phone list */
.mlist{flex:1;min-height:0;overflow:auto;padding:0 12px 150px}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;cursor:pointer}
.mcard input{width:20px;height:20px;accent-color:var(--primary);margin-top:2px}
.mcard .b{flex:1;min-width:0}
.mcard .t{display:flex;align-items:center;gap:8px;justify-content:space-between}
.mcard h4{margin:6px 0 4px;font-size:14px;font-weight:600;line-height:1.35}
.mcard small{color:var(--faint);font-size:12px}
.bulk{position:absolute;left:0;right:0;bottom:60px;z-index:22;background:var(--surface);border-top:1px solid var(--hair);padding:10px 12px;display:flex;gap:8px;align-items:center;box-shadow:0 -8px 24px rgba(0,0,0,.06)}
.bulk .grow{flex:1;font-size:13px;font-weight:600}
.bulk small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
</style>
</head>

function papersOf(r){
  if(!r.doc) return [];
  const p=[];
  if(r.signed) p.push({k:'signed'});
  p.push({k:'original'});
  for(let i=1;i<=(r.scans||0);i++) p.push({k:'scan',n:i});
  return p;
}
/* PV-01: the state decides the default paper; order stays stable */
function defaultPaper(r){const p=papersOf(r);if(r.st==='approved'&&p.some(x=>x.k==='signed'))return 'signed';return p[0]?p[0].k+(p[0].n||''):null}
const paperKey=p=>p.k+(p.n||'');
function curPaper(r){const ps=papersOf(r);const k=S.paper||defaultPaper(r);return ps.find(p=>paperKey(p)===k)||ps[0]}
const paperLabel=p=>p.k==='signed'?t('p_signed'):p.k==='original'?t('p_original'):t('p_scan',{n:p.n});
function caption(r,p){
  if(S.live) return {txt:t('p_live'),ok:false};
  if(!p) return {txt:'',ok:false};
  if(p.k==='signed') return {txt:t('c_signed',{d:bdi(r.signedAt)}),ok:true};
  if(r.st==='awaiting_scan') return {txt:t('c_scanFirst'),ok:false};
  if(r.st==='pending') return {txt:t('c_unsigned'),ok:false};
  if(r.st==='draft'||r.st==='word') return {txt:t('c_draft'),ok:false};
  return {txt:'',ok:false};
}

      ? {icon:'sign',tone:'warning',status:t('st_me'),primary:A('sign','sign'),secondary:[A('return','warn'),A('reject','danger')],decide:true}

let scale=1;
function render(){
  const dev=document.getElementById('dev');
  const ds=document.getElementById('ds');const keep=ds?{top:ds.scrollTop,left:ds.scrollLeft}:null;
  const rows=dev.querySelector('.rows, #ml');const keepRows=rows?rows.scrollTop:0;
  const [w,h]=WIDTHS[S.width];
  dev.style.width=w+'px';dev.style.height=h+'px';dev.className='device '+(S.width==='phone'?'phone':'');
  document.documentElement.lang=S.lang;
  const r=byId(S.recId);
  const m=isMobile();
  let body='';
  if(S.page==='record'&&r) body=m?recordPhone(r):recordDesktop(r);
  else body=listPage();
  dev.innerHTML=`<div class="app w-${S.width} ${m?'mobile':''}" id="app" dir="${S.lang==='ar'?'rtl':'ltr'}">${m?'':topnav()}${body}${m?tabbar():''}${overlays()}<div class="tip" id="tip" hidden></div></div>`;
  const nds=document.getElementById('ds');if(nds&&keep&&S._keepScroll){nds.scrollTop=keep.top;nds.scrollLeft=keep.left}
  S._keepScroll=true;
  const nrows=dev.querySelector('.rows, #ml');if(nrows)nrows.scrollTop=keepRows;
  if(nds) nds.addEventListener('scroll',onDeskScroll,{passive:true});
  const qi=document.getElementById('q');if(qi){qi.addEventListener('input',e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)})}
  fit();renderBar();renderNotes();
  document.title=(S.page==='record'&&r?r.ref+' · ':'')+'PROTOTYPE record page v2';
}
function fit(){
  const vp=document.getElementById('vp');const [w,h]=WIDTHS[S.width];
  const pad=S.width==='phone'?60:36;
  scale=Math.min(1,(vp.clientWidth-pad)/w,(vp.clientHeight-pad)/h);
  const dw=document.getElementById('dw');
  dw.style.transform=`translate(-50%,-50%) scale(${scale})`;
}
function onDeskScroll(e){
  const el=e.currentTarget;const pages=el.querySelectorAll('.page');const pgc=document.getElementById('pgc');if(!pgc||!pages.length)return;
  const mid=el.getBoundingClientRect().top+el.clientHeight*scale/2;let cur=1;
  pages.forEach(p=>{if(p.getBoundingClientRect().top<mid)cur=+p.dataset.page});
  pgc.innerHTML=bdi(cur+' / '+pages.length);
}

/* ======================= actions ======================= */
let tid=0;
function toast(msg,opts={}){const id=++tid;const ms=opts.ms||(opts.undo?6000:2600);S.toasts.push({id,msg,ms,...opts});render();setTimeout(()=>{const x=S.toasts.find(z=>z.id===id);if(!x)return;S.toasts=S.toasts.filter(z=>z.id!==id);if(x.onExpire)x.onExpire();render()},ms);return id}
function openRecord(id){S.recId=id;S.page='record';S.paper=null;S.live=false;S.armed=false;S.markIdx=0;S.signedNext=null;S.menu=null;S.sheet=false;S.railDrawer=false;S._keepScroll=false;S.subjOpen=false;render()}
function nav(d){const q=queue();const i=q.findIndex(x=>x.id===S.recId);const n=q[(i+d+q.length)%q.length];if(n)openRecord(n.id)}
function back(){S.page='list';S.focus=false;S.sel=S.recId;S.menu=null;S.sheet=false;render()}
function copyRef(){const r=S.page==='record'?byId(S.recId):byId(S.sel);if(!r)return;try{navigator.clipboard&&navigator.clipboard.writeText(r.ref)}catch(e){};toast(t('copied',{r:bdi(r.ref)}),{icon:'copy'})}
function closeAll(){S.menu=null;S.sheet=false;S.dlg=null;S.help=false;S.railDrawer=false}
function deleteRecs(ids){
  const before=visible().findIndex(r=>r.id===ids[0]);
  ids.forEach(id=>S.pending.add(id));
  const one=ids.length===1?byId(ids[0]):null;
  if(S.page==='record'){S.page='list';const v=visible();S.sel=v.length?v[Math.min(Math.max(before,0),v.length-1)].id:null;S.drawer=false}
  S.picked=new Set();S.selectMode=false;closeAll();
  const msg=one?t('tDeleted',{r:bdi(one.ref)}):t('tDeletedN',{n:ids.length});
  toast(msg,{icon:'trash',undo:true,ids,onExpire:()=>{ids.forEach(id=>{S.pending.delete(id);const r=byId(id);if(r)r.gone=true})}});
}
function doAction(a){
  const r=byId(S.page==='record'?S.recId:S.sel);if(!r)return;const ns=nextStep(r);
  if(ns.disabled&&ns.disabled[a]){toast(ns.disabled[a],{icon:'lock'});return}
  switch(a){
    case 'sign':S.dlg={kind:'sign',id:r.id};break;
    case 'return':S.dlg={kind:'return',id:r.id};break;
    case 'reject':S.dlg={kind:'reject',id:r.id};break;
    case 'discard':S.dlg={kind:'discard',id:r.id};break;
    case 'send':r.st='pending';r.me=false;r.approver='ahmed';S.paper=null;toast(t('tSent',{n:pn('ahmed')}),{icon:'send'});return;
    case 'continue':toast(t('tProto',{x:S.lang==='ar'?'نموذج الخدمة':'the service form'}),{icon:'word'});return;
    case 'revise':toast(t('tProto',{x:S.lang==='ar'?'النموذج مع بيانات الإصدار السابق':'the form pre-filled from v1'}),{icon:'revise'});return;
    case 'scan':r.st='approved';r.signed=true;r.signedBy='ahmed';r.signedAt='2026-10-05';r.scans=1;S.paper=null;toast(t('tScan'),{icon:'badge'});return;
    case 'finish':r.st='draft';S.live=false;toast(t('tFinish'),{icon:'check'});return;
    case 'download':toast(t('tDl',{p:t('p_signed')}),{icon:'dl'});return;
    case 'reroute':toast(t('tProto',{x:S.lang==='ar'?'اختيار المعتمِد':'the approver picker'}),{icon:'user'});return;
  }
  render();
}
function confirmDlg(){
  const d=S.dlg;const r=byId(d.id);S.dlg=null;
  if(d.kind==='sign'){
    S.signing=true;render();
    setTimeout(()=>{S.signing=false;r.st='approved';r.signed=true;r.signedBy='you';r.signedAt='2026-10-05';S.paper=null;S.armed=false;
      const q=R.filter(x=>!x.gone&&x.st==='pending'&&x.id!==r.id);S.signedNext=q[0]?q[0].id:null;toast(t('signedOk'),{icon:'badge'})},1200);
    return;
  }
  if(d.kind==='delete'){deleteRecs([r.id]);return}
  if(d.kind==='return'){r.st='returned';r.returner='you';r.reason=['Please see the marks.','يرجى مراجعة الملاحظات.'];toast(t('tReturned',{n:pn(r.by)}),{icon:'ret'});return}
  if(d.kind==='reject'){r.st='rejected';r.returner='you';r.reason=['Not eligible this cycle.','غير مؤهل في هذه الدورة.'];toast(t('tRejected'),{icon:'rej'});return}
  if(d.kind==='discard'){r.st='nodoc';r.gone=true;S.page='list';toast(t('tVoided'),{icon:'trash'});return}
  if(d.kind==='unfile'){r.st='awaiting_scan';r.signed=false;r.scans=0;S.paper=null;toast(t('tUnfiled'),{icon:'trash'});return}
  render();
}
function tool(id){
  const r=byId(S.page==='record'?S.recId:S.sel);const item=toolGroups(r).flatMap(g=>g[1]).find(x=>x.id===id);
  if(item&&item.dis){toast(item.dis,{icon:'lock'});return}
  S.menu=null;S.sheet=false;
  switch(id){
    case 'delete':S.dlg={kind:'delete',id:r.id};break;
    case 'unfile':S.dlg={kind:'unfile',id:r.id};break;
    case 'print':toast(t('tPrint'),{icon:'print'});return;
    case 'download':toast(t('tDl',{p:t('p_signed')}),{icon:'dl'});return;
    case 'basket':toast(t('tBasket'),{icon:'inbox'});return;
    case 'mark':S.armed=!S.armed;break;
    case 'reroute':doAction('reroute');return;
    default:toast(t('tProto',{x:t({email:'m_email',pdf:'m_pdf',word:'m_word',adjust:'m_adjust',replace:'m_replace',state:'m_state',access:'m_access'}[id]||'more')}),{icon:'ext'});return;
  }
  render();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-bar]');
  if(b){const k=b.dataset.bar,v=b.dataset.v;
    if(k==='width'){S.width=v;S.rail=null;S.railDrawer=false;S.drawer=false;S.fsv=false}
    if(k==='lang')S.lang=v;
    if(k==='page')S.page=v;
    if(k==='notes')S.notes=!S.notes;
    if(k==='reset'){R=seed();Object.assign(S,{paper:null,signedNext:null,pending:new Set(),picked:new Set(),toasts:[],err:{},pins:{},focus:false,armed:false,live:false})}
    closeAll();S._keepScroll=false;render();setTimeout(fit);return}
  const el=e.target.closest('[data-act]');if(!el||!document.getElementById('dev').contains(el))return;
  const act=el.dataset.act,arg=el.dataset.arg;
  if(act===''||act==='noop'){if(act==='noop')e.stopPropagation();if(act==='')return;return}
  if(el.getAttribute('aria-disabled')==='true'&&act!=='tool'&&act!=='do'){toast(el.dataset.tip||'',{icon:'lock'});return}
  e.preventDefault();
  switch(act){
    case 'do':doAction(arg);break;
    case 'tool':tool(arg);break;
    case 'confirm':confirmDlg();break;
    case 'closeall':closeAll();render();break;
    case 'menu':S.menu=S.menu===arg?null:arg;render();break;
    case 'sheet':S.sheet=true;render();break;
    case 'back':back();break;
    case 'tolist':S.page='list';closeAll();render();break;
    case 'nav':nav(+arg);break;
    case 'goto':openRecord(+arg);break;
    case 'copy':copyRef();break;
    case 'paper':S.paper=arg;S.live=false;render();break;
    case 'zoom':{const z=S.zoom==='fit'?1:S.zoom;S.zoom=+arg===0?'fit':Math.min(2.4,Math.max(.5,+(z+(+arg)*.2).toFixed(2)));render();break}
    case 'focus':S.focus=!S.focus;closeAll();S._keepScroll=false;render();break;
    case 'rail':if(W()<1280){S.railDrawer=!S.railDrawer}else{S.rail=(S.rail||railDefault())==='open'?'closed':'open'}render();break;
    case 'raildrawer':S.railDrawer=false;render();break;
    case 'armtoggle':S.armed=!S.armed;render();break;
    case 'addpin':{const rect=el.getBoundingClientRect();const x=(e.clientX-rect.left)/rect.width*100,y=(e.clientY-rect.top)/rect.height*100;(S.pins[S.recId]=S.pins[S.recId]||[]).push({x,y});render();break}
    case 'mark':{const r=byId(S.recId)||byId(S.sel);if(r&&r.marks){S.markIdx=(S.markIdx+(+arg)+r.marks.length)%r.marks.length;render()}break}
    case 'markto':S.markIdx=+arg;render();break;
    case 'live':S.live=!S.live;render();break;
    case 'retry':{const id=S.recId;S.loading=true;render();setTimeout(()=>{S.loading=false;S.err[id]=true;const r=byId(id);r.doc=true;r.st='draft';render()},900);break}
    case 'docx':toast(t('tDl',{p:'DOCX'}),{icon:'dl'});break;
    case 'dl':{const r=byId(S.page==='record'?S.recId:S.sel);toast(t('tDl',{p:paperLabel(curPaper(r))}),{icon:'dl'});break}
    case 'newtab':toast(t('tOpen'),{icon:'ext'});break;
    case 'fsv':S.fsv=!S.fsv;render();break;
    case 'subj':S.subjOpen=!S.subjOpen;render();break;
    case 'help':S.help=true;render();break;
    case 'undo':{const x=S.toasts.find(z=>z.id===+arg);if(x){x.ids.forEach(id=>S.pending.delete(id));S.toasts=S.toasts.filter(z=>z.id!==x.id);toast(x.ids.length===1?t('tRestored',{r:bdi(byId(x.ids[0]).ref)}):t('tRestored',{r:x.ids.length}),{icon:'revise'})}break}
    // list
    case 'filter':S.filter=arg;render();break;
    case 'svc':S.svc=arg;render();break;
    case 'clearf':S.filter='all';S.svc='all';S.q='';render();break;
    case 'row':S.sel=+arg;S.paper=null;S.menu=null;if(W()<1072)S.drawer=true;render();break;
    case 'openrow':if(e.ctrlKey||e.metaKey||e.button===1){toast(t('tOpen'),{icon:'ext'});break}S.from='list';openRecord(+arg);break;
    case 'closedrawer':S.drawer=false;render();break;
    case 'panesize':S.paneSize=arg;render();break;
    case 'selmode':S.selectMode=!S.selectMode;S.picked=new Set();render();break;
    case 'pick':{const id=+arg;S.picked.has(id)?S.picked.delete(id):S.picked.add(id);render();break}
    case 'bulkdel':{const ok=[...S.picked].filter(id=>DELETABLE.has(byId(id).st));if(ok.length)deleteRecs(ok);break}
    case 'bulkbasket':toast(t('tBasket'),{icon:'inbox'});S.selectMode=false;S.picked=new Set();render();break;
  }
});
document.addEventListener('change',e=>{if(e.target.matches('[data-bar=rec]')){S.page='record';openRecord(+e.target.value)}});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  const c=e.code;
  if(c==='Escape'){if(S.dlg||S.menu||S.sheet||S.help||S.railDrawer||S.fsv){closeAll();S.fsv=false;render()}else if(S.focus){S.focus=false;render()}else if(S.drawer){S.drawer=false;render()}else if(S.page==='record')back();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='?'||(c==='Slash'&&e.shiftKey)){S.help=true;render();return}
  if(S.dlg||S.help)return;
  if(c==='KeyJ'||c==='KeyK'){const d=c==='KeyJ'?1:-1;if(S.page==='record')nav(d);else{const v=visible();const i=v.findIndex(x=>x.id===S.sel);const n=v[Math.max(0,Math.min(v.length-1,i+d))];if(n){S.sel=n.id;S.paper=null;render()}}return}
  if(c==='Enter'&&S.page==='list'&&S.sel){S.from='list';openRecord(S.sel);return}
  if(c==='KeyC'){copyRef();return}
  if(S.page!=='record')return;
  const r=byId(S.recId);const ns=nextStep(r);
  if(c==='KeyF'){if(isMobile())S.fsv=!S.fsv;else S.focus=!S.focus;S._keepScroll=false;render()}
  else if(c==='KeyS'&&ns.decide){S.dlg={kind:'sign',id:r.id};render()}
  else if(c==='KeyM'&&ns.decide){S.armed=!S.armed;render()}
  else if(c==='Equal'||c==='NumpadAdd'){const z=S.zoom==='fit'?1:S.zoom;S.zoom=Math.min(2.4,+(z+.2).toFixed(2));render()}
  else if(c==='Minus'||c==='NumpadSubtract'){const z=S.zoom==='fit'?1:S.zoom;S.zoom=Math.max(.5,+(z-.2).toFixed(2));render()}
  else if(c==='Digit0'){S.zoom='fit';render()}
});
/* tooltip (Radix-like: hover + keyboard focus, label + key cap) */
function showTip(el){
  const tip=document.getElementById('tip');if(!tip||!el.dataset.tip||isMobile())return;
  tip.innerHTML=`<span>${el.dataset.tip}</span>${el.dataset.kbd?`<kbd>${el.dataset.kbd}</kbd>`:''}`;tip.hidden=false;
  const app=document.getElementById('app').getBoundingClientRect();const b=el.getBoundingClientRect();
  const tw=tip.offsetWidth,th=tip.offsetHeight;
  let x=(b.left+b.width/2-app.left)/scale-tw/2;let y=(b.bottom-app.top)/scale+8;
  const aw=app.width/scale,ah=app.height/scale;
  if(y+th>ah-4)y=(b.top-app.top)/scale-th-8;
  x=Math.max(6,Math.min(aw-tw-6,x));
  tip.style.left=x+'px';tip.style.top=y+'px';
}
const hideTip=()=>{const tip=document.getElementById('tip');if(tip)tip.hidden=true};
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(el&&document.getElementById('dev').contains(el))showTip(el);else hideTip()});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el)});
document.addEventListener('focusout',hideTip);
/* notes ↔ device highlight */
document.addEventListener('mouseover',e=>{const n=e.target.closest('.note[data-hl]');document.querySelectorAll('.hl-target').forEach(x=>x.classList.remove('hl-target'));if(n)document.querySelectorAll(`#dev [data-note="${n.dataset.hl}"]`).forEach(x=>x.classList.add('hl-target'))});
window.addEventListener('resize',fit);
/* ?w=phone&lang=ar&page=list&rec=45 deep links for review */
const U=new URLSearchParams(location.search);
if(U.get('w')&&WIDTHS[U.get('w')])S.width=U.get('w');if(U.get('lang'))S.lang=U.get('lang');if(U.get('page'))S.page=U.get('page');if(U.get('rec'))S.recId=+U.get('rec');if(U.get('notes')==='0')S.notes=false;
S._keepScroll=false;render();
</script>
