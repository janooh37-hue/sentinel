<title>Pantry Store Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Store dashboard redesign for GSSG Manager (Assets → Store). Two views:
   Dashboard = store room (category shelves, hand-out flow), In & out = movement records.
   Tokens mirror frontend/src/index.css. */
:root {
  --bg: #f5f4f1; --surface: #ffffff; --raised: #fafaf6; --tinted: #f0eee8;
  --primary: #0d2845; --primary-hover: #1d3a5e; --primary-soft: #e8edf3; --on-primary: #ffffff;
  --accent: #c8102e; --accent-soft: #fbe5e8;
  --success: #047857; --success-soft: #d6f0e4;
  --warning: #b45309; --warning-soft: #fbedd8;
  --caution: #a16207; --caution-soft: #fef3c7;
  --text: #1c1f24; --muted: #5a6068; --faint: #8b9098;
  --border: #e6e4dd; --border-strong: #d4d1c8; --hairline: #efece5;
  --shelf: #c9c3b4;
  --hero-grad: linear-gradient(135deg, #0a1f3a 0%, #0d2845 50%, #1d3a5e 100%);
  --focus: 0 0 0 3px color-mix(in oklab, var(--primary) 35%, transparent);
  --shadow: 0 1px 2px rgba(13,40,69,.06), 0 8px 24px -12px rgba(13,40,69,.18);
  --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
  --font-ar: "Noto Sans Arabic", "Inter", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0e18; --surface: #131826; --raised: #1a2034; --tinted: #1f263b;
  --primary: #5778cf; --primary-hover: #7491db; --primary-soft: #1c2849; --on-primary: #0a0e18;
  --accent: #ef4858; --accent-soft: #3a1820;
  --success: #34d399; --success-soft: #142d23;
  --warning: #fbbf24; --warning-soft: #3a2a10;
  --caution: #facc15; --caution-soft: #3b2f11;
  --text: #e6e9f2; --muted: #8a93a7; --faint: #5f6678;
  --border: #2a3148; --border-strong: #3a4360; --hairline: #1f263b;
  --shelf: #4a5370;
  --hero-grad: linear-gradient(135deg, #050816 0%, #0d1428 50%, #1a2540 100%);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -12px rgba(0,0,0,.6);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0a0e18; --surface: #131826; --raised: #1a2034; --tinted: #1f263b;
  --primary: #5778cf; --primary-hover: #7491db; --primary-soft: #1c2849; --on-primary: #0a0e18;
  --accent: #ef4858; --accent-soft: #3a1820;
  --success: #34d399; --success-soft: #142d23;
  --warning: #fbbf24; --warning-soft: #3a2a10;
  --caution: #facc15; --caution-soft: #3b2f11;
  --text: #e6e9f2; --muted: #8a93a7; --faint: #5f6678;
  --border: #2a3148; --border-strong: #3a4360; --hairline: #1f263b;
  --shelf: #4a5370;
  --hero-grad: linear-gradient(135deg, #050816 0%, #0d1428 50%, #1a2540 100%);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; font-feature-settings: "ss01", "cv11"; }
[dir="rtl"] body, [dir="rtl"] button, [dir="rtl"] input { font-family: var(--font-ar); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--focus); }
::selection { background: color-mix(in oklab, var(--primary) 22%, transparent); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.in { max-width: 1240px; margin-inline: auto; }

/* ---------- app chrome (existing StoreShell) ---------- */
.band { background: var(--hero-grad); color: #fff; padding-block: 16px 0; }
.band .in { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 20px; align-items: flex-start; }
.band .t { font-size: .74rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.7); }
[dir="rtl"] .band .t { letter-spacing: 0; }
.band .tag { font-size: .84rem; color: rgba(255,255,255,.82); margin-top: 2px; }
.band .sec-tabs { margin-top: 12px; display: flex; gap: 4px; }
.band .sec-tabs span { padding: 8px 12px; font-size: .86rem; font-weight: 600; border-bottom: 2px solid #fff; }
.mockctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mockctl .lbl { font-size: .7rem; color: rgba(255,255,255,.6); }
.seg { display: inline-flex; background: rgba(255,255,255,.12); border-radius: 99px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 99px; font-size: .78rem; font-weight: 500; color: rgba(255,255,255,.8); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: #fff; color: #0d2845; font-weight: 600; }
.subtabs { border-bottom: 1px solid var(--border); background: var(--bg); }
.subtabs .in { display: flex; gap: 4px; overflow-x: auto; }
.subtabs button { flex: none; min-height: 44px; border: 0; border-bottom: 2px solid transparent; background: none; padding: 0 12px; font-size: .86rem; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.subtabs button:hover { color: var(--text); }
.subtabs button[aria-current="page"] { border-color: var(--primary); color: var(--primary); font-weight: 600; }
.subtabs .new { font-size: .62rem; font-weight: 700; padding: 1px 6px; border-radius: 99px; background: var(--accent); color: #fff; letter-spacing: .02em; }
.subtabs .same { color: var(--faint); }

.page { padding-block: 18px 56px; }
.page .in { display: flex; flex-direction: column; gap: 16px; }
.phead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
.phead h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
[dir="rtl"] .phead h1 { letter-spacing: 0; }
.phead p { margin: 4px 0 0; color: var(--muted); font-size: .88rem; max-width: 62ch; }
.phead .acts { display: flex; flex-wrap: wrap; gap: 8px; }

.btn { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); border-radius: 12px; min-height: 40px; padding: 7px 13px; font-size: .86rem; font-weight: 600; display: inline-flex; gap: 7px; align-items: center; justify-content: center; }
.btn:hover { background: var(--tinted); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.primary:hover { background: var(--primary-hover); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }
.link { border: 0; background: none; padding: 0; color: var(--primary); font-weight: 600; font-size: .84rem; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- month cycle ---------- */
.cycle { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: hidden; }
.step { padding: 13px 15px; display: flex; gap: 11px; align-items: flex-start; min-width: 0; }
.step + .step { border-inline-start: 1px solid var(--hairline); }
.step .mark { flex: none; width: 26px; height: 26px; border-radius: 99px; display: grid; place-items: center; border: 1.5px solid var(--border-strong); color: var(--faint); }
.step .mark svg { width: 14px; height: 14px; }
.step.done .mark { background: var(--success); border-color: var(--success); color: var(--surface); }
.step.next { background: color-mix(in oklab, var(--primary-soft) 55%, var(--surface)); }
.step.next .mark { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.step.blocked .mark { border-style: dashed; }
.step .k { font-size: .76rem; color: var(--muted); font-weight: 500; }
.step .v { font-size: .94rem; font-weight: 600; }
.step .s { font-size: .74rem; color: var(--muted); margin-top: 1px; }

/* ---------- status chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 5px 11px; font-size: .8rem; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.chip svg { width: 14px; height: 14px; }
.chip .n { font-weight: 700; }
.chip.zero { color: var(--faint); }
.chip.t-expired:not(.zero) { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.chip.t-expiring:not(.zero) { color: var(--warning); background: var(--warning-soft); border-color: transparent; }
.chip.t-low:not(.zero) { color: var(--caution); background: var(--caution-soft); border-color: transparent; }
.chip[aria-pressed="true"] { border-color: currentColor; box-shadow: inset 0 0 0 1px currentColor; }
.chips .note { font-size: .76rem; color: var(--muted); }

/* ---------- drawings + badges ---------- */
.pic { position: relative; aspect-ratio: 1; width: 100%; max-width: 100%; }
.pic > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pic.tile { background: #ebe9e3; border-radius: 10px; overflow: hidden; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .7rem; font-weight: 600; padding: 2px 7px; border-radius: 99px; white-space: nowrap; line-height: 1.4; }
.badge svg { width: 12px; height: 12px; flex: none; }
.b-expired { background: var(--accent); color: var(--surface); }
.b-expiring { background: var(--warning-soft); color: var(--warning); }
.b-low { background: var(--caution-soft); color: var(--caution); }
.b-ok { background: var(--success-soft); color: var(--success); }
.meter { position: relative; height: 6px; border-radius: 99px; background: var(--tinted); }
.meter i { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 99px; background: var(--primary); }
.meter.low i { background: var(--caution); }
.meter b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .55; border-radius: 1px; }

/* ---------- store room ---------- */
.pickbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; border: 1px solid var(--primary); background: var(--primary-soft); border-radius: 14px; padding: 10px 14px; font-size: .84rem; font-weight: 500; }
.unit { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 14px 16px 16px; }
.unit header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.unit h2 { margin: 0; font-size: 1rem; font-weight: 700; }
.unit header .meta { font-size: .76rem; color: var(--muted); }
.plank { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); row-gap: 22px; padding-top: 24px; }
.on-shelf { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; padding: 0 8px 10px; border-bottom: 7px solid var(--shelf); transition: background .15s; }
.on-shelf .pic { width: 100%; max-width: 104px; transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.on-shelf:hover .pic { transform: translateY(-4px); }
.on-shelf .flag { position: absolute; top: -14px; inset-inline-start: 50%; transform: translateX(-50%); z-index: 1; }
[dir="rtl"] .on-shelf .flag { transform: translateX(50%); }
.on-shelf .lbl { font-size: .74rem; font-weight: 600; text-align: center; line-height: 1.22; max-width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.44em; }
.on-shelf .q { font-size: .72rem; color: var(--muted); }
.on-shelf .q .num { color: var(--text); font-weight: 600; font-size: .86rem; }
.on-shelf.dim { opacity: .22; }
.picking .on-shelf:hover { background: var(--primary-soft); }
.picking .on-shelf.nogive { opacity: .32; cursor: not-allowed; }
.on-shelf .pc { position: absolute; top: 0; inset-inline-end: 8px; z-index: 2; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 99px; display: grid; place-items: center; font-weight: 700; font-size: .8rem; background: var(--surface); color: var(--primary); border: 1.5px dashed color-mix(in oklab, var(--primary) 55%, transparent); }
.on-shelf .pc.has { background: var(--primary); color: var(--on-primary); border: 1.5px solid var(--primary); animation: pop .22s ease-out; }
@keyframes pop { from { transform: scale(.7); } to { transform: scale(1); } }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 14px 16px; }
.panel > header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; margin-bottom: 6px; }
.panel h2 { margin: 0; font-size: 1rem; font-weight: 700; }
.panel header p { margin: 2px 0 0; font-size: .78rem; color: var(--muted); }
.empty { font-size: .84rem; color: var(--muted); padding: 12px; border: 1px dashed var(--border-strong); border-radius: 12px; margin: 6px 0 0; }
.tbl-wrap { overflow-x: auto; }
table.usage { border-collapse: collapse; width: 100%; font-size: .84rem; }
table.usage th { text-align: start; font-size: .72rem; color: var(--faint); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
table.usage td { padding: 8px 10px; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
table.usage td.it { display: flex; gap: 10px; align-items: center; white-space: normal; min-width: 200px; }
table.usage td.it .pic { width: 30px; flex: none; }
table.usage .sug { font-weight: 700; color: var(--primary); }

/* ---------- records (In & out) ---------- */
.rtools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.search { width: min(300px, 100%); border: 1px solid var(--border-strong); background: var(--surface); border-radius: 10px; padding: 8px 11px; font-size: .88rem; min-height: 38px; }
.search::placeholder, .field input::placeholder { color: var(--faint); }
.month { font-size: .78rem; font-weight: 700; color: var(--muted); margin: 10px 2px 6px; }
.recs { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.rec { width: 100%; border: 0; background: none; text-align: start; display: grid; grid-template-columns: 36px 64px 52px minmax(0, 1fr) auto 18px; gap: 12px; align-items: center; padding: 11px 14px; }
.rec + .rec { border-top: 1px solid var(--hairline); }
.rec:hover { background: var(--raised); }
.rec.fresh { animation: fresh 1.6s ease-out; }
@keyframes fresh { from { background: var(--primary-soft); } to { background: transparent; } }
.kind { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.kind svg { width: 17px; height: 17px; }
.k-in { background: var(--success-soft); color: var(--success); }
.k-out { background: var(--primary-soft); color: var(--primary); }
.k-disposed { background: var(--accent-soft); color: var(--accent); }
.rec .date { font-size: .74rem; color: var(--muted); line-height: 1.25; }
.rec .date strong { display: block; color: var(--text); font-size: .9rem; }
.stack { position: relative; width: 48px; height: 44px; }
.stack .pic { position: absolute; width: 32px; background: #ebe9e3; border: 2px solid var(--surface); border-radius: 8px; overflow: hidden; }
.stack .pic:nth-child(1) { top: 0; inset-inline-start: 0; }
.stack .pic:nth-child(2) { top: 6px; inset-inline-start: 8px; }
.stack .pic:nth-child(3) { top: 12px; inset-inline-start: 16px; }
.rec .body { min-width: 0; }
.rec .what { font-size: .86rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec .what .x { color: var(--muted); font-weight: 500; }
.rec .who { font-size: .76rem; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec .who strong { color: var(--text); font-weight: 600; }
.rec .tot { text-align: end; font-size: .74rem; color: var(--muted); white-space: nowrap; }
.rec .tot .num { display: block; font-size: .88rem; font-weight: 700; color: var(--text); }
.rec .chev { color: var(--faint); display: grid; }
[dir="rtl"] .rec .chev { transform: scaleX(-1); }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(5,10,20,.42); z-index: 30; opacity: 0; transition: opacity .2s; }
.scrim.open { opacity: 1; }
.drawer { position: fixed; z-index: 31; top: 0; bottom: 0; inset-inline-end: 0; width: min(440px, 100%); background: var(--bg); padding: max(14px, env(safe-area-inset-top, 0px)) 14px max(14px, env(safe-area-inset-bottom, 0px)); overflow-y: auto; transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
[dir="rtl"] .drawer { transform: translateX(-100%); }
.drawer.open, [dir="rtl"] .drawer.open { transform: none; }
.drawer .close { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.hero { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; align-items: start; }
.card h3 { margin: 0; font-size: 1.08rem; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.code { font-size: .74rem; color: var(--muted); margin-top: 3px; }
.big { display: flex; align-items: baseline; gap: 6px; margin-top: 10px; }
.big .num { font-size: 2.1rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
.big span:last-child { color: var(--muted); font-size: .85rem; }
.sec { border-top: 1px solid var(--hairline); padding-top: 12px; }
.sec h4 { margin: 0 0 8px; font-size: .78rem; font-weight: 600; color: var(--muted); }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: .84rem; padding: 3px 0; }
.kv > span:first-child { color: var(--muted); }
.kv strong { font-weight: 600; text-align: end; }
.why { font-size: .76rem; color: var(--muted); margin: 6px 0 0; line-height: 1.4; }
.runway { position: relative; height: 54px; margin: 4px 0 2px; }
.runway .track { position: absolute; inset-inline: 0; top: 26px; height: 4px; background: var(--tinted); border-radius: 99px; }
.runway .zone { position: absolute; top: 26px; height: 4px; inset-inline-start: 0; background: var(--warning); opacity: .5; border-radius: 99px; }
.runway .tick { position: absolute; top: 34px; font-size: .64rem; color: var(--faint); transform: translateX(-50%); white-space: nowrap; }
[dir="rtl"] .runway .tick { transform: translateX(50%); }
.runway .pin { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; }
[dir="rtl"] .runway .pin { transform: translateX(50%); }
.runway .pin .q { font-size: .68rem; font-weight: 700; padding: 1px 6px; border-radius: 99px; background: var(--primary); color: var(--on-primary); white-space: nowrap; }
.runway .pin .dot { width: 10px; height: 10px; border-radius: 99px; background: var(--primary); border: 2px solid var(--surface); margin-top: 3px; }
.runway .pin.w .q, .runway .pin.w .dot { background: var(--warning); color: var(--surface); }
.batches { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.batch { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: .8rem; padding: 6px 8px; border-radius: 8px; background: var(--raised); }
.batch .when { color: var(--muted); }
.lines { display: flex; flex-direction: column; }
.line { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; }
.line + .line { border-top: 1px solid var(--hairline); }
.line .pic { background: #ebe9e3; border-radius: 8px; overflow: hidden; }
.line .n { font-size: .84rem; font-weight: 600; }
.line .e { font-size: .72rem; color: var(--muted); }
.line .qq { font-weight: 700; font-size: .9rem; white-space: nowrap; }
.file { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; color: var(--primary); border: 1px solid var(--border-strong); border-radius: 10px; padding: 5px 10px; background: var(--surface); }
.file svg { width: 15px; height: 15px; }

/* forms */
.give { display: flex; flex-direction: column; gap: 10px; }
.give h4 { color: var(--text); font-size: .9rem; font-weight: 700; margin: 0; }
.row2 { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: end; }
.field { min-width: 0; }
.field label { display: block; font-size: .74rem; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
.field input[type="text"] { width: 100%; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); border-radius: 10px; padding: 7px 10px; font-size: .88rem; min-height: 36px; }
.field input:focus-visible { border-color: var(--primary); }
.field input[aria-invalid="true"] { border-color: var(--accent); }
.err { color: var(--accent); font-size: .74rem; margin-top: 4px; }
.byline { display: flex; align-items: center; gap: 8px; font-size: .76rem; color: var(--muted); }
.av { width: 22px; height: 22px; border-radius: 99px; background: var(--primary-soft); color: var(--primary); font-weight: 700; font-size: .64rem; display: grid; place-items: center; flex: none; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden; background: var(--surface); }
.stepper button { border: 0; background: transparent; width: 34px; height: 34px; font-size: 1.05rem; color: var(--primary); font-weight: 600; }
.stepper button:hover { background: var(--tinted); }
.stepper output { min-width: 32px; text-align: center; font-weight: 700; font-size: .95rem; }
.hist { display: flex; flex-direction: column; gap: 4px; }
.hist button { border: 0; background: var(--raised); border-radius: 8px; padding: 6px 8px; font-size: .78rem; display: flex; justify-content: space-between; gap: 10px; text-align: start; }
.hist button:hover { background: var(--tinted); }
.hist span:last-child { color: var(--muted); white-space: nowrap; }

/* multi-item tray */
body.picking .page { padding-bottom: 300px; }
#tray { position: fixed; z-index: 25; inset-inline: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -12px 32px -14px rgba(13,40,69,.3); padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.tray-in { max-width: 1240px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 400px); gap: 10px 22px; align-items: end; }
.tray-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.tray-head strong { font-size: .95rem; }
.tray-head span { font-size: .76rem; color: var(--muted); }
.tray-items { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; min-height: 58px; align-items: stretch; }
.tray-empty { font-size: .82rem; color: var(--muted); align-self: center; }
.bitem { flex: none; display: grid; grid-template-columns: 40px auto; gap: 3px 8px; align-items: center; border: 1px solid var(--border); border-radius: 12px; padding: 6px 8px; background: var(--raised); }
.bitem .pic { grid-row: span 2; width: 40px; }
.bitem .nm { font-size: .74rem; font-weight: 600; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bitem .stepper button { width: 26px; height: 24px; font-size: .95rem; }
.bitem .stepper output { min-width: 24px; font-size: .82rem; }
.tray-form { display: flex; flex-direction: column; gap: 8px; }
.tray-form .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.tray-form .go { display: flex; gap: 8px; }
.tray-form .go .primary { flex: 1; }

.toast { position: fixed; z-index: 40; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); inset-inline-start: 50%; transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: .84rem; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); }
[dir="rtl"] .toast { transform: translate(50%, 20px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
[dir="rtl"] .toast.show { transform: translate(50%, 0); }
body.picking .toast { bottom: calc(320px + env(safe-area-inset-bottom, 0px)); }
.foot { font-size: .74rem; color: var(--faint); }

@media (max-width: 760px) {

  .step:nth-child(3) { border-inline-start: 0; }

  .hero { grid-template-columns: 96px minmax(0, 1fr); }

      <div class="acts"><button type="button" class="btn primary" id="pickStart">${ic.outbox}${t.handOut}</button></div></div>
    <div class="rtools"><div class="chips">${[['all', t.fAll], ['in', t.fIn], ['out', t.fOut], ['disposed', t.fDisposed]].map(([k, lbl]) =>
      `<button type="button" class="chip" data-rfilter="${k}" aria-pressed="${S.rFilter === k}">${k === 'all' ? '' : KIND[k][1]}<span class="n num">${n(k)}</span>${lbl}</button>`).join('')}</div>
      <input type="text" class="search" id="rQ" placeholder="${t.search}" aria-label="${t.search}" value="${esc(S.rQ)}" autocomplete="off"></div>
    <div id="recList">${groups.length ? groups.map(g => `<div class="month">${g.m}</div><div class="recs">${g.rows.map(recRow).join('')}</div>`).join('') : `<p class="empty">${t.noRecords}</p>`}</div>
    <p class="foot">${t.foot}</p>`;
}
function recDetail(r) {
  const t = L(); const kindLabel = r.kind === 'in' ? t.kIn : r.kind === 'out' ? t.kOut : t.kDisposed;
  const kv = (k, v) => v ? `<div class="kv"><span>${k}</span><strong>${v}</strong></div>` : '';
  const facts = [
    kv(r.kind === 'in' ? t.dReceived : t.dWhen, `${fmtD(r.at)} · <span class="num">${fmtTime(r.at)}</span>`),
    r.kind === 'out' ? kv(t.dTakenBy, esc(loc(r.to))) : '',
    r.kind === 'disposed' ? kv(t.dReason, r.reason === 'expired' ? t.reasonExpired : t.reasonDamaged) : '',
    kv(t.dRecordedBy, `<span class="byline" style="display:inline-flex;color:var(--text)"><span class="av">${USERS[r.by].ini}</span>${USERS[r.by][S.lang]}</span>`),
    kv(t.dNote, esc(loc(r.note))),
  ].join('');
  return `<article class="card">
    <div style="display:flex;gap:12px;align-items:center"><span class="kind ${KIND[r.kind][0]}">${KIND[r.kind][1]}</span>
      <div><h3>${kindLabel}</h3><div class="code">${t.itemsN(new Set(r.lines.map(l => l.id)).size)} · ${t.unitsN(lineTotal(r))}</div></div></div>
    <div class="sec">${facts}${r.file ? `<div class="kv" style="align-items:center"><span>${t.dFile}</span><button type="button" class="file" data-mock>${ic.file}${r.file}</button></div>` : ''}</div>
    <div class="sec"><h4>${t.dItems}</h4><div class="lines">${r.lines.map(l => { const it = item(l.id); return `
      <div class="line">${pic(it)}<div style="min-width:0"><div class="n">${esc(name(it))}</div><div class="e"><span class="num">${it.id}</span> · ${l.exp ? t.batchExp(fmtD(l.exp)) : t.undated}</div></div>
      <span class="qq"><bdi dir="ltr" class="num">${r.kind === 'in' ? '+' : '−'}${l.q}</bdi> ${unitWord(it, l.q)}</span></div>`; }).join('')}</div></div>
  </article>`;
}

/* ---------------- item card ---------------- */
function fefo(it) { return it.b.map(([q, exp]) => ({ q, exp, d: exp ? daysTo(exp) : 1e9 })).filter(b => b.q > 0 && b.d >= 0).sort((a, b) => a.d - b.d)[0]; }
function runway(x) {
  const SPAN = 180; const pos = d => Math.min(100, Math.max(0, d / SPAN * 100));
  const pins = [];
  x.batches.filter(b => b.d != null && b.d >= 0).sort((a, b) => a.d - b.d).forEach(b => {
    const p = b.d > SPAN ? 100 : pos(b.d); const last = pins[pins.length - 1];
    if (last && p - last.p < 7) { last.q += b.q; last.w = last.w || b.d <= WINDOW; } else pins.push({ p, q: b.q, w: b.d <= WINDOW });
  });
  if (!pins.length) return '';
  return `<div class="runway" aria-hidden="true"><div class="track"></div><div class="zone" style="width:${pos(WINDOW)}%"></div>
    <span class="tick" style="inset-inline-start:0%">${S.lang === 'ar' ? 'اليوم' : 'Today'}</span><span class="tick" style="inset-inline-start:${pos(WINDOW)}%">${WINDOW}</span><span class="tick" style="inset-inline-start:${pos(120)}%">120</span><span class="tick" style="inset-inline-start:96%">180+</span>
    ${pins.map(p => `<span class="pin ${p.w ? 'w' : ''}" style="inset-inline-start:${Math.min(p.p, 95)}%"><span class="q num">${p.q}</span><span class="dot"></span></span>`).join('')}</div>`;
}
function itemCard(id) {
  const t = L(); const it = item(id); const x = I[id]; const cat = CATS.find(c => c.id === it.cat);
  const giveable = x.onHand - x.expired; S.give = Math.min(Math.max(1, S.give), Math.max(1, giveable));
  const first = fefo(it); const names = [...new Set(records().filter(r => r.kind === 'out').map(r => loc(r.to)))];
  const dated = x.batches.filter(b => b.d != null).sort((a, b) => a.d - b.d);
  const all = records();
  const hist = all.filter(r => r.kind === 'out' && r.lines.some(l => l.id === id)).slice(0, 3);
  return `<article class="card">
    <div class="hero">${pic(it, 'tile')}<div style="min-width:0">
      <h3>${esc(name(it))}</h3><div class="code"><span class="num">${it.id}</span> · ${cat[S.lang]}</div>
      <div class="big"><span class="num">${x.onHand}</span><span>${unitWord(it, x.onHand)}</span></div>
      <div style="margin-top:8px">${meter(it)}</div>
      <div class="kv"><span>${t.minLevel}</span><strong class="num">${it.min != null ? qtyStr(it, it.min) : '—'}</strong></div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:6px">${(x.flags.length ? x.flags : ['ok']).map(f => badge(f)).join('')}</div></div></div>
    <form class="sec give" data-give="${id}" novalidate><h4>${t.give}</h4>
      ${giveable ? `<div class="row2">
        <div class="field"><label for="gq">${t.qty}</label><span class="stepper"><button type="button" data-gstep="-1" aria-label="−">−</button><output class="num" id="gq">${S.give}</output><button type="button" data-gstep="1" aria-label="+">+</button></span></div>
        <div class="field"><label for="gTo">${t.takenBy}</label><input type="text" id="gTo" name="to" list="people" placeholder="${t.takenByPh}" autocomplete="off"><div class="err" id="gErr" hidden>${t.nameErr}</div></div></div>
        <div class="field"><label for="gNote">${t.note}</label><input type="text" id="gNote" name="note" placeholder="${t.notePh}" autocomplete="off"></div>
        <datalist id="people">${names.map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist>
        ${first && first.exp ? `<p class="why" style="margin:0">${t.giveFrom(fmtD(first.exp))}</p>` : ''}
        <div class="byline"><span class="av">${USERS.me.ini}</span>${t.recordedBy(`<strong style="color:var(--text)">${USERS.me[S.lang]}</strong> (${t.you})`)}</div>
        <button type="submit" class="btn primary">${ic.outbox}${t.giveBtn}</button>
        <button type="button" class="btn" data-addmulti="${id}">+ ${t.addMulti}</button>` : `<p class="why" style="margin:0">${t.giveNone}</p>`}
    </form>
    <div class="sec"><h4>${t.batches}</h4>${runway(x)}${dated.length ? `<div class="batches">${dated.map(b => `<div class="batch"><span class="num" style="font-weight:600">${qtyStr(it, b.q)}</span><span class="when">${fmtD(b.exp)}</span>${b.d <= WINDOW ? badge('expiring', t.daysLeft(b.d)) : `<span class="when">${t.daysLeft(b.d)}</span>`}</div>`).join('')}</div>` : `<p class="why" style="margin:0">${t.noExpiry}</p>`}</div>
    <div class="sec"><div class="kv"><span>${t.usage}</span><strong class="${x.usage != null ? 'num' : ''}" style="${x.usage != null ? '' : 'color:var(--muted);font-weight:500'}">${x.usage != null ? qtyStr(it, x.usage) : t.usageNone}</strong></div>
      ${x.usage != null ? `<div class="kv"><span>${t.suggested}</span><strong>${x.suggest ? qtyStr(it, x.suggest) : t.nothing}</strong></div>` : ''}</div>
    <div class="sec"><h4>${t.recentFor}</h4>${hist.length ? `<div class="hist">${hist.map(r => `<button type="button" data-rec="${all.indexOf(r)}"><span>${qtyStr(it, r.lines.filter(l => l.id === id).reduce((s, l) => s + l.q, 0))} · ${t.toWho(esc(loc(r.to)))}</span><span>${fmtDay(r.at)} · ${fmtTime(r.at)}</span></button>`).join('')}</div>` : `<p class="why" style="margin:0">${t.noneGiven}</p>`}</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><button type="button" class="btn" data-mock>${ic.clip}${t.count}</button><button type="button" class="btn" data-mock>${ic.trash}${t.disposal}</button></div>
  </article>`;
}

/* ---------------- recording ---------------- */
// First-expiring batch goes out first; undated stock after dated. Returns per-batch lines.
function deduct(id, q) {
  const it = item(id); let left = q; const taken = [];
  const order = it.b.map((b, i) => ({ i, d: b[1] ? daysTo(b[1]) : 1e9 })).filter(o => o.d >= 0).sort((a, b) => a.d - b.d);
  for (const o of order) { const n = Math.min(left, it.b[o.i][0]); if (n) { it.b[o.i][0] -= n; taken.push({ id, q: n, exp: it.b[o.i][1] }); left -= n; } if (!left) break; }
  return taken;
}
function record(list, to, note) {
  const lines = list.flatMap(l => deduct(l.id, l.q));
  const now = new Date(); const at = `2026-10-31T${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  const r = { kind: 'out', at, lines, to, by: 'me', note: note || null };
  S.log.unshift(r); S.fresh = r; recompute();
}

/* ---------------- tray ---------------- */
function renderTray() {
  let tr = $('#tray'); document.body.classList.toggle('picking', S.pick);
  if (!S.pick) { if (tr) tr.remove(); return; }
  const t = L(); const ids = Object.keys(S.basket); const units = ids.reduce((a, id) => a + S.basket[id], 0);
  const kept = tr ? { to: tr.querySelector('#bTo')?.value || '', note: tr.querySelector('#bNote')?.value || '' } : { to: '', note: '' };
  const names = [...new Set(records().filter(r => r.kind === 'out').map(r => loc(r.to)))];
  const html = `<div class="tray-in"><div style="min-width:0">
      <div class="tray-head"><strong>${t.trayTitle}</strong><span>${ids.length ? `${t.itemsN(ids.length)} · ${t.unitsN(units)}` : ''}</span></div>
      <div class="tray-items">${ids.length ? ids.map(id => { const it = item(id); return `<div class="bitem">${pic(it, 'tile')}<span class="nm" title="${esc(name(it))}">${esc(name(it))}</span>
        <span class="stepper"><button type="button" data-bstep="-1" data-bid="${id}" aria-label="−">−</button><output class="num">${S.basket[id]}</output><button type="button" data-bstep="1" data-bid="${id}" aria-label="+">+</button></span></div>`; }).join('') : `<span class="tray-empty">${t.trayEmpty}</span>`}</div></div>
    <form class="tray-form" data-tray novalidate>
      <div class="two"><div class="field"><label for="bTo">${t.takenBy}</label><input type="text" id="bTo" name="to" list="bPeople" placeholder="${t.takenByPh}" autocomplete="off" value="${esc(kept.to)}"><datalist id="bPeople">${names.map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist></div>
        <div class="field"><label for="bNote">${t.note}</label><input type="text" id="bNote" name="note" placeholder="${t.notePh}" autocomplete="off" value="${esc(kept.note)}"></div></div>
      <div class="err" id="bErr" hidden>${t.nameErr}</div>
      <div class="byline"><span class="av">${USERS.me.ini}</span>${t.recordedBy(`<strong style="color:var(--text)">${USERS.me[S.lang]}</strong> (${t.you})`)}</div>
      <div class="go"><button type="button" class="btn" id="trayCancel">${t.cancel}</button><button type="submit" class="btn primary" ${ids.length ? '' : 'disabled'}>${ic.outbox}${t.recordAll(ids.length)}</button></div>
    </form></div>`;
  if (!tr) { tr = document.createElement('div'); tr.id = 'tray'; tr.className = 'gut'; tr.setAttribute('role', 'region'); document.body.appendChild(tr); }
  tr.setAttribute('aria-label', t.trayTitle);
  const f = document.activeElement && tr.contains(document.activeElement) ? document.activeElement.id : null;
  tr.innerHTML = html; if (f && document.getElementById(f)) document.getElementById(f).focus();
}
function addToBasket(id, n = 1) {
  const x = I[id]; const max = x.onHand - x.expired; const have = S.basket[id] || 0;
  if (have >= max) { toast(L().maxReached); return false; }
  S.basket[id] = Math.min(max, have + n); return true;
}
function refreshPick() {
  document.querySelectorAll('.on-shelf').forEach(el => { const pc = el.querySelector('.pc'); if (!pc) return; const n = S.basket[el.dataset.item] || 0; pc.textContent = n || '+'; pc.classList.toggle('has', !!n); pc.classList.toggle('num', !!n); });
  renderTray();
}

/* ---------------- render + drawer ---------------- */
let drawer = null, lastFocus = null;
const drawerHtml = d => d.type === 'item' ? itemCard(d.id) : recDetail(records()[d.i]);
function render() {
  renderChrome();
  $('#view').innerHTML = S.view === 'moves' ? viewMoves() : viewRoom();
  if (drawer) $('#drawerBody').innerHTML = drawerHtml(drawer);
  renderTray();
}
function openDrawer(d) {
  if (!drawer) lastFocus = document.activeElement;
  drawer = d; $('#drawerBody').innerHTML = drawerHtml(d);
  const sc = $('#scrim'), dr = $('#drawer'); sc.hidden = false; dr.hidden = false; dr.scrollTop = 0;
  requestAnimationFrame(() => { sc.classList.add('open'); dr.classList.add('open'); $('#drawerClose').focus(); });
}
function closeDrawer() {
  if (!drawer) return; drawer = null;
  const sc = $('#scrim'), dr = $('#drawer'); sc.classList.remove('open'); dr.classList.remove('open');
  setTimeout(() => { if (!drawer) { sc.hidden = true; dr.hidden = true; } }, 280);
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function setView(v) { S.view = v; try { history.replaceState(null, '', v === 'moves' ? '#moves' : '#'); } catch {} closeDrawer(); render(); window.scrollTo({ top: 0 }); }

document.addEventListener('click', e => {
  const el = e.target.closest('button'); if (!el) return;
  const t = L();
  if (el.dataset.lang) { S.lang = el.dataset.lang; keep.set('lang', S.lang); render(); return; }
  if (el.dataset.state) { S.data = el.dataset.state; keep.set('data', S.data); recompute(); render(); return; }
  if (el.dataset.view) { setView(el.dataset.view); return; }
  if (el.hasAttribute('data-existing')) { toast(t.existing); return; }
  if (el.hasAttribute('data-mock')) { toast(t.mock); return; }
  if (el.dataset.filter) { S.filter = S.filter === el.dataset.filter ? 'all' : el.dataset.filter; render(); return; }
  if (el.dataset.rfilter) { S.rFilter = el.dataset.rfilter; render(); return; }
  if (el.id === 'pickStart') { S.view = 'room'; S.pick = true; closeDrawer(); render(); return; }
  if (el.id === 'trayCancel') { S.pick = false; S.basket = {}; render(); return; }
  if (el.id === 'drawerClose') { closeDrawer(); return; }
  if (el.dataset.bstep) { const id = el.dataset.bid; const n = (S.basket[id] || 0) + Number(el.dataset.bstep); const x = I[id];
    if (n > x.onHand - x.expired) { toast(t.maxReached); return; } if (n <= 0) delete S.basket[id]; else S.basket[id] = n; refreshPick(); return; }
  if (el.dataset.addmulti) { const id = el.dataset.addmulti; S.view = 'room'; S.pick = true; if (addToBasket(id, S.give)) { closeDrawer(); render(); } return; }
  if (el.dataset.gstep) { const id = el.closest('form').dataset.give; const x = I[id]; S.give = Math.min(x.onHand - x.expired, Math.max(1, S.give + Number(el.dataset.gstep))); $('#gq').textContent = S.give; return; }
  if (el.dataset.item) { if (S.pick) { if (!el.classList.contains('nogive') && addToBasket(el.dataset.item)) refreshPick(); } else { S.give = 1; openDrawer({ type: 'item', id: el.dataset.item }); } return; }
  if (el.dataset.rec != null) { openDrawer({ type: 'rec', i: Number(el.dataset.rec) }); return; }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target; const t = L();
  const to = f.elements.to.value.trim(); const note = f.elements.note.value.trim();
  const err = f.matches('[data-tray]') ? $('#bErr') : $('#gErr');
  if (!to) { f.elements.to.setAttribute('aria-invalid', 'true'); err.hidden = false; f.elements.to.focus(); return; }
  if (f.matches('[data-tray]')) {
    const list = Object.keys(S.basket).map(id => ({ id, q: S.basket[id] })); if (!list.length) return;
    record(list, to, note); S.basket = {}; S.pick = false;
    toast(list.length === 1 ? t.given(qtyStr(item(list[0].id), list[0].q), to) : t.givenMany(list.length, to));
    render(); return;
  }
  const id = f.dataset.give; const q = S.give; record([{ id, q }], to, note); S.give = 1;
  toast(t.given(qtyStr(item(id), q), to)); render();
});
document.addEventListener('input', e => {
  if (e.target.id === 'rQ') { S.rQ = e.target.value; const box = document.createElement('div'); box.innerHTML = viewMoves(); $('#recList').replaceWith(box.querySelector('#recList')); }
  if (e.target.matches('#gTo, #bTo') && e.target.value.trim()) { e.target.removeAttribute('aria-invalid'); const er = e.target.id === 'gTo' ? $('#gErr') : $('#bErr'); if (er) er.hidden = true; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
$('#scrim').addEventListener('click', closeDrawer);
window.addEventListener('hashchange', () => { const v = location.hash === '#moves' ? 'moves' : 'room'; if (v !== S.view) setView(v); });

recompute(); render();
})();
</script>
