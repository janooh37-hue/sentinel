<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workforce attendance · Global Security Services Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Semantic values are copied verbatim from frontend/src/index.css, in both themes. */
:root {
  --bg: #f5f4f1;
  --surface: #ffffff;
  --shelf: #c9c3b4;
  --surface-raised: #fafaf6;
  --surface-tinted: #f0eee8;
  --primary: #0d2845;
  --primary-hover: #1d3a5e;
  --primary-soft: #e8edf3;
  --primary-on-soft: #0d2845;
  --primary-text: #0d2845;
  --on-primary: #ffffff;
  --accent: #c8102e;
  --accent-hover: #a30d24;
  --accent-soft: #fbe5e8;
  --smart: #6b4fb0;
  --smart-soft: #f1eef8;
  --success: #047857;
  --success-soft: #d6f0e4;
  --warning: #92400e;
  --warning-foreground: #ffffff;
  --warning-soft: #fbedd8;
  --caution: #ca8a04;
  --caution-soft: #fef3c7;
  --info: #1d4ed8;
  --info-soft: #e0e8f8;
  --destructive: #dc2626;
  --destructive-foreground: #ffffff;
  --destructive-text: #b91c1c;
  --text: #1c1f24;
  --text-muted: #5a6068;
  --text-faint: #8b9098;
  --border: #e6e4dd;
  --border-strong: #d4d1c8;
  --hairline: #efece5;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 99px;
  --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, "Noto Sans Arabic", monospace;
  --font-arabic: "Noto Sans Arabic", "Inter", system-ui, sans-serif;
  --motion-base: 200ms;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0a0e18;
  --surface: #131826;
  --shelf: #4a5370;
  --surface-raised: #1a2034;
  --surface-tinted: #1f263b;
  --primary: #5778cf;
  --primary-hover: #7491db;
  --primary-soft: #1c2849;
  --primary-on-soft: #7491db;
  --primary-text: #8aa4e8;
  --on-primary: #0a0e18;
  --accent: #ef4858;
  --accent-hover: #f56b78;
  --accent-soft: #3a1820;
  --smart: #a99af0;
  --smart-soft: #221d3a;
  --success: #34d399;
  --success-soft: #142d23;
  --warning: #fbbf24;
  --warning-foreground: #1c1f24;
  --warning-soft: #3a2a10;
  --caution: #facc15;
  --caution-soft: #3b2f11;
  --info: #60a5fa;
  --info-soft: #1c2940;
  --destructive: #f87171;
  --destructive-foreground: #1c1f24;
  --destructive-text: #fca5a5;
  --text: #e6e9f2;
  --text-muted: #8a93a7;
  --text-faint: #5f6678;
  --border: #2a3148;
  --border-strong: #3a4360;
  --hairline: #1f263b;
  color-scheme: dark;
}
:root { --focus-ring: var(--primary); }
* { box-sizing: border-box; scrollbar-color: var(--border-strong) var(--surface); scrollbar-width: thin; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font-sans); font-feature-settings: "ss01", "cv11"; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
:lang(ar) { font-family: var(--font-arabic); }
h1,h2,h3,p,dl,dd { margin: 0; }
h1 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.5; }
:lang(ar) h1 { letter-spacing: 0; }
h2 { font-size: 16px; font-weight: 600; }
h3 { font-size: 14px; font-weight: 600; }
button,input,select { font: inherit; color: inherit; }
button { cursor: pointer; text-align: start; border: 0; background: none; }
a { color: var(--primary-text); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
::selection { background: var(--primary-soft); color: var(--primary-text); }
input { caret-color: var(--primary-text); }
[hidden] { display: none !important; }
.mono,.time,.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; unicode-bidi: isolate; }
.mono bdi { font-family: inherit; }
.time { direction: ltr; display: inline-block; white-space: nowrap; }
.missing-time { font-family: var(--font-sans); font-weight: 400; }
.muted { color: var(--text-muted); }
.small { font-size: 12px; }
.sr-only { position: absolute; inline-size: 1px; block-size: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.icon { display: inline-block; inline-size: 16px; block-size: 16px; flex: none; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
[dir="rtl"] .directional { transform: scaleX(-1); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-block-size: 36px; padding-block: 6px; padding-inline: 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface); font-size: 13px; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-tinted); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-hover); }
.icon-btn { display: inline-grid; place-items: center; inline-size: 36px; block-size: 36px; border-radius: var(--radius-sm); flex: none; color: var(--text-muted); }
.icon-btn:hover { background: var(--surface-tinted); color: var(--text); }
.segment { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--radius-md); background: var(--surface-tinted); }
.segment button { min-block-size: 32px; padding-block: 5px; padding-inline: 12px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--text-muted); }
.segment button[aria-pressed="true"] { color: var(--primary-text); background: var(--surface); font-weight: 600; }
.segment button:hover { color: var(--text); }
.demo-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-block: 9px; padding-inline: 28px; border-block-end: 1px solid var(--border); background: var(--surface-raised); font-size: 12px; }
.demo-name { display: flex; align-items: center; gap: 8px; margin-inline-end: auto; font-weight: 600; }
.demo-name .sample { color: var(--text-muted); font-weight: 400; }
.demo-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.demo-bar .segment button { font-size: 12px; min-block-size: 30px; padding-inline: 9px; }
.check-label { display: inline-flex; align-items: center; gap: 8px; min-block-size: 36px; cursor: pointer; }
input[type="checkbox"] { accent-color: var(--primary); inline-size: 16px; block-size: 16px; margin: 0; flex: none; }
.preview { margin-inline: auto; inline-size: 100%; }
body.mobile-mode .preview { inline-size: 390px; max-inline-size: 100%; border-inline: 1px solid var(--border); }
.app-shell { container: app / inline-size; }
.app-nav { background: var(--surface); border-block-end: 1px solid var(--border); }
.app-nav-inner { display: flex; align-items: center; gap: 28px; max-inline-size: 1400px; padding-block: 13px; padding-inline: 32px; margin-inline: auto; }
.brand { display: flex; align-items: center; gap: 11px; flex: none; }
.brand-mark { inline-size: 35px; block-size: 35px; color: var(--primary-text); }
.brand-copy { font-weight: 700; font-size: 18px; line-height: 1.2; color: var(--primary-text); }
.brand-copy small { display: block; margin-block-start: 3px; font-size: 11px; color: var(--text-muted); font-weight: 400; }
.app-links { display: flex; gap: 5px; }
.app-links span { padding-block: 8px; padding-inline: 13px; font-size: 14px; border-radius: var(--radius-sm); color: var(--text-muted); }
.app-links [aria-current="page"] { background: var(--primary-soft); color: var(--primary-text); font-weight: 600; }
.nav-meta { margin-inline-start: auto; display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--text-muted); }
.avatar { display: inline-grid; place-items: center; inline-size: 34px; block-size: 34px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-text); font-size: 12px; font-weight: 600; flex: none; }
.screen-strip { background: var(--surface); border-block-end: 1px solid var(--border); }
.screen-inner { display: flex; gap: 22px; max-inline-size: 1400px; padding-inline: 32px; margin-inline: auto; }
.screen-inner span { position: relative; min-block-size: 42px; padding-block: 10px; color: var(--primary-text); font-size: 13px; font-weight: 600; }
.screen-inner span::after { content: ""; position: absolute; inset-block-end: 0; inset-inline: 0; block-size: 2px; background: var(--primary); }
.address-strip { border-block-end: 1px solid var(--border); background: var(--surface-raised); padding-block: 5px; padding-inline: max(32px,calc((100% - 1336px)/2)); font-size: 10px; color: var(--text-muted); overflow-wrap: anywhere; }
.address-strip code { font-family: var(--font-mono); direction: ltr; unicode-bidi: isolate; }
.page { max-inline-size: 1400px; margin-inline: auto; padding-block: 22px 40px; padding-inline: 32px; }
.page-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-block-end: 18px; }
.page-heading p { color: var(--text-muted); font-size: 13px; margin-block-start: 3px; }
.scope-context { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-block-end: 16px; }
.date-label { display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; margin-inline-end: 4px; }
.toolbar .views { margin-inline-start: auto; }
.search { display: flex; align-items: center; gap: 7px; min-inline-size: 150px; max-inline-size: 230px; flex: 1; border: 1px solid var(--border-strong); border-radius: var(--radius-md); min-block-size: 38px; padding-inline: 10px; background: var(--surface); color: var(--text-muted); }
.search input { inline-size: 100%; min-inline-size: 0; border: 0; background: transparent; font-size: 12px; padding-block: 8px; }
input::placeholder { color: var(--text-muted); opacity: 1; }
.company { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
.company select { min-block-size: 38px; max-inline-size: 182px; padding-block: 6px; padding-inline: 9px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--radius-md); color: var(--text); font-size: 12px; }
.shift-chips { gap: 1px; }
.shift-chips button { padding-inline: 10px; }
.shift-chips .shift-count { margin-inline-start: 5px; font-size: 10px; }
/* 1336px inner canvas = 992px register + 24px gutter + 320px queue. Both grids share these tracks. */
.summary,.main-grid { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 24px; }
.summary { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-block-end: 18px; gap: 24px; }
.summary-main { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,2fr); gap: 22px; min-inline-size: 0; padding: 20px; }
.summary-identity { align-self: center; }
.summary-identity h2 { font-size: 15px; margin-block-end: 7px; }
.summary-meta { display: flex; flex-wrap: wrap; gap: 3px 14px; color: var(--text-muted); font-size: 12px; }
.residual-wrap { position: relative; min-inline-size: 0; margin-block-start: 12px; }
.residual { display: inline-flex; gap: 7px; align-items: center; padding: 0; font-size: 11px; color: var(--text-muted); }
.residual i { display: inline-block; inline-size: 9px; block-size: 9px; flex: none; border: 1px solid var(--text-faint); border-radius: 50%; }
.residual-tooltip { position: absolute; inset-block-end: calc(100% + 8px); inset-inline-start: 0; z-index: 10; inline-size: 240px; padding-block: 8px; padding-inline: 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 12px; box-shadow: 0 6px 18px -8px rgb(0 0 0 / .25); visibility: hidden; opacity: 0; }
.residual-wrap:hover .residual-tooltip,.residual-wrap:focus-within .residual-tooltip { visibility: visible; opacity: 1; }
.residual-mobile-hint { display: none; color: var(--text-muted); font-size: 11px; }
.summary-visual { min-inline-size: 0; padding-block-start: 7px; }
.summary-bar { display: flex; gap: 2px; block-size: 15px; align-items: stretch; }
.bar-segment { display: flex; flex-basis: 0; min-inline-size: 8px; position: relative; border-radius: 2px; background: var(--bucket-tone); transition: opacity 150ms; }
[data-bucket="onSite"] { --bucket-tone: var(--success); }
[data-bucket="left"] { --bucket-tone: var(--primary); }
[data-bucket="notArrived"] { --bucket-tone: var(--accent); }
[data-bucket="leave"] { --bucket-tone: var(--info); }
[data-bucket="nationalService"] { --bucket-tone: var(--smart); }
.bar-segment[data-bucket="onSite"] { box-shadow: 0 0 0 2px var(--success-soft); }
.bar-segment[data-bucket="left"] { background: var(--primary-soft); border: 1px solid var(--primary); }
.bar-segment[data-bucket="notArrived"] { background: var(--surface); overflow: hidden; }
.absent-part { background: var(--accent); }
.awaited-part { display: block; block-size: 100%; min-inline-size: 0; }
.awaited-part svg { display: block; inline-size: 100%; block-size: 100%; }
.bar-segment.dimmed { opacity: .22; }
.leaders { display: block; inline-size: 100%; block-size: 36px; overflow: visible; pointer-events: none; }
.leaders path { fill: none; stroke: var(--border-strong); stroke-width: 1; vector-effect: non-scaling-stroke; }
.leaders path.dimmed { opacity: .35; }
.leaders path.pressed { stroke: var(--primary); stroke-width: 1.25; opacity: 1; }
.tier-caption { color: var(--text); font-size: 12px; font-weight: 600; margin-block-end: 12px; }
.bucket-keys { display: grid; grid-template-columns: repeat(var(--key-count),minmax(0,1fr)); gap: 4px; }
.bucket-key { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding-block: 6px; padding-inline: 7px; border: 1px solid transparent; border-radius: var(--radius-sm); min-inline-size: 0; }
.bucket-key:hover { background: var(--surface-raised); }
.bucket-key[aria-pressed="true"] { border-color: var(--primary); background: var(--surface-raised); }
.bucket-key[aria-disabled="true"] { color: var(--text-muted); opacity: .55; cursor: default; }
.key-value { display: flex; align-items: center; gap: 9px; font-size: 22px; font-weight: 500; line-height: 1.15; }
.key-label { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
.key-split { font-size: 11px; line-height: 1.7; color: var(--text-muted); white-space: nowrap; }
.swatch { display: inline-block; inline-size: 8px; block-size: 8px; flex: none; border-radius: 2px; background: var(--bucket-tone); }
.swatch[data-bucket="onSite"] { box-shadow: 0 0 0 2px var(--success-soft); }
.swatch[data-bucket="left"] { background: var(--primary-soft); border: 1px solid var(--primary); }
.summary-decision { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 9px; padding: 20px; border-inline-start: 1px solid var(--hairline); }
.decision-anchor { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; text-decoration: none; }
.decision-anchor.has-decisions { color: var(--accent); }
.decision-anchor:hover { text-decoration: underline; }
.summary-decision p { font-size: 11px; line-height: 1.8; color: var(--text-muted); max-inline-size: 27ch; }
.main-grid { align-items: start; }
.main-results { min-inline-size: 0; }
.filter-panel { margin-block-end: 16px; }
.filter-heading { display: flex; align-items: center; justify-content: space-between; margin-block-end: 8px; }
.filter-heading h2 { font-size: 12px; font-weight: 600; }
.state-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.filter-chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); border-radius: var(--radius-sm); min-block-size: 33px; padding-block: 5px; padding-inline: 9px; font-size: 11px; background: var(--surface); }
.filter-chip:hover { border-color: var(--border-strong); background: var(--surface-raised); }
.filter-chip[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-text); }
.filter-chip[aria-disabled="true"] { color: var(--text-muted); border-style: dashed; opacity: .55; cursor: default; }
.chip-count { font-size: 11px; margin-inline-start: 1px; }
.corrected-group { display: inline-flex; flex-basis: 100%; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-block-start: 2px; }
.notch-glyph { inline-size: 9px; block-size: 9px; display: inline-block; border: 1px solid var(--border-strong); border-radius: 50%; position: relative; }
.notch-glyph::after { content: ""; position: absolute; inline-size: 5px; block-size: 5px; background: var(--primary); border: 1px solid var(--surface); border-radius: 1px; inset-block-start: -3px; inset-inline-end: -3px; }
.filter-hint { margin: 0; color: var(--text-muted); font-size: 11px; }
.active-filters { display: none; }
.active-token { display: inline-flex; align-items: center; gap: 7px; padding-block: 5px; padding-inline: 9px; border: 1px solid var(--primary); border-radius: var(--radius-sm); background: var(--primary-soft); color: var(--primary-text); min-block-size: 44px; font-size: 11px; }
.active-token .icon { inline-size: 13px; block-size: 13px; }
.mobile-filter-button { display: none; }
.result-line { min-block-size: 30px; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-block-end: 8px; color: var(--text-muted); font-size: 12px; }
.clear-filters { color: var(--primary-text); text-decoration: underline; text-underline-offset: 3px; font-size: 12px; min-block-size: 30px; padding-inline: 3px; }
.dot { --tone: var(--success); --wash: var(--success-soft); display: inline-block; flex: none; inline-size: 9px; block-size: 9px; border-radius: 50%; background: var(--tone); position: relative; }
.dot.live { box-shadow: 0 0 0 2px var(--wash); }
.dot.corrected::after { content: ""; position: absolute; inline-size: 5px; block-size: 5px; box-sizing: content-box; background: var(--primary); border: 1.5px solid var(--surface); border-radius: 1px; inset-block-start: -3px; inset-inline-end: -3px; }
[data-state="grace"] { --tone: var(--caution); --wash: var(--caution-soft); }
[data-state="late"] { --tone: var(--warning); --wash: var(--warning-soft); }
[data-state="unpaired"] { --tone: var(--destructive); --wash: var(--accent-soft); }
[data-state="absent"] { --tone: var(--accent); --wash: var(--accent-soft); }
[data-state="pending"] { --tone: var(--text-faint); --wash: var(--surface-raised); }
[data-state="leave"] { --tone: var(--info); --wash: var(--info-soft); }
[data-state="national_service"] { --tone: var(--smart); --wash: var(--smart-soft); }
.dot[data-state="pending"] { background: transparent; border: 1.5px solid var(--text-faint); }
.register-stack { display: grid; gap: 15px; }
.unit { border: 1px solid var(--hairline); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
.unit-header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-block: 12px; padding-inline: 17px; border-block-end: 2px solid var(--primary); }
.unit-header p { font-size: 11px; color: var(--text-muted); margin-block-start: 2px; }
.unit-meta { margin-inline-start: auto; display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--text-muted); }
.unit-meta b { color: var(--text); font-size: 13px; margin-inline-start: 4px; font-weight: 500; }
.posts { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); }
.post { padding-block: 10px 5px; padding-inline: 17px; border-inline-end: 1px solid var(--hairline); min-inline-size: 0; }
.post:last-child { border-inline-end: 0; }
.post-heading { display: flex; align-items: center; gap: 10px; padding-block-end: 7px; border-block-end: 1px solid var(--border); }
.post-heading h3 { font-size: 12px; }
.post-heading > span { margin-inline-start: auto; font-size: 10px; color: var(--text-muted); }
.row-head,.person-row { display: grid; grid-template-columns: 10px minmax(0,1fr) 53px 64px; align-items: center; gap: 8px; }
.row-head { padding-block: 7px 2px; font-size: 10px; color: var(--text-muted); }
.row-head .end { text-align: end; }
.person-row { inline-size: 100%; padding-block: 10px; padding-inline: 0; border-block-end: 1px solid var(--hairline); min-block-size: 66px; }
.person-row:last-child { border-block-end: 0; }
.person-name { display: block; color: var(--text); font-size: 12px; font-weight: 600; line-height: 1.6; overflow-wrap: anywhere; }
.person-detail { display: flex; flex-wrap: wrap; gap: 0 5px; align-items: center; font-size: 10px; color: var(--text-muted); margin-block-start: 2px; line-height: 1.8; }
.person-detail .mono { font-size: 10px; }
.state-text[data-state="leave"] { color: var(--info); }
.state-text[data-state="national_service"] { color: var(--smart); }
.state-text[data-state="late"] { color: var(--warning); }
.state-text[data-state="absent"] { color: var(--accent); }
.state-text[data-state="unpaired"] { color: var(--destructive-text); }
.row-time { text-align: end; font-size: 11px; }
.row-time small { display: block; color: var(--warning); font-size: 10px; line-height: 1.7; }
.on-site-marker { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 10px; font-weight: 500; color: var(--success); white-space: nowrap; }
