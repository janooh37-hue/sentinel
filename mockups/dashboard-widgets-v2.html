<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSSG · Dashboard widgets v2 (proposal for approval)</title>
<!--
  Proposal mockup. Single self-contained file, tokens copied from DESIGN.md §1.1.
  Every region carries data-od-id so review comments can point at it
  ("change w-my_documents", "move catalog-records").
  Tabs: Dashboard (view + Customize mode) · Widget catalog · Findings · Critique.
-->
<style>
:root{
  --bg:#f5f4f1;--surface:#fff;--surface-raised:#fafaf6;--surface-tinted:#f0eee8;
  --primary:#0d2845;--primary-hover:#1d3a5e;--primary-soft:#e8edf3;--on-primary:#fff;
  --accent:#c8102e;--accent-soft:#fbe5e8;
  --success:#047857;--success-soft:#d6f0e4;--warning:#b45309;--warning-soft:#fbedd8;
  --info:#1d4ed8;--info-soft:#e0e8f8;
  --text:#1c1f24;--text-muted:#5a6068;--text-faint:#8b9098;
  --border:#e6e4dd;--border-strong:#d4d1c8;--hairline:#efece5;
  --hero-grad:linear-gradient(135deg,#0a1f3a 0%,#0d2845 50%,#1d3a5e 100%);
  --row:9.25rem;--gap:.875rem;
}
[data-theme=dark]{
  --bg:#0a0e18;--surface:#131826;--surface-raised:#1a2034;--surface-tinted:#1f263b;
  --primary:#5778cf;--primary-hover:#7491db;--primary-soft:#1c2849;--on-primary:#0a0e18;
  --accent:#ef4858;--accent-soft:#3a1820;--success:#34d399;--success-soft:#142d23;
  --warning:#fbbf24;--warning-soft:#3a2a10;--info:#60a5fa;--info-soft:#1c2940;
  --text:#e6e9f2;--text-muted:#8a93a7;--text-faint:#5f6678;
  --border:#2a3148;--border-strong:#3a4360;--hairline:#1f263b;
  --hero-grad:linear-gradient(135deg,#050816 0%,#0d1428 50%,#1a2540 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.4}
[dir=rtl] body,[dir=rtl] button{font-family:"Noto Sans Arabic","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.mono{font-family:"IBM Plex Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---------- review chrome (not part of the design) ---------- */
.review{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;padding:.55rem 1rem;background:#1c1f24;color:#e6e9f2;font-size:.8rem}
.review b{font-weight:600;letter-spacing:.02em}
.review .grp{display:inline-flex;border:1px solid #3a4360;border-radius:99px;overflow:hidden}
.review .grp button{padding:.3rem .75rem;color:#cfd5e2}
.review .grp button[aria-pressed=true]{background:#e6e9f2;color:#1c1f24;font-weight:600}
.review .sp{flex:1}

/* ---------- app frame ---------- */
.frame{margin-inline:auto;transition:max-width .2s}
.frame.mobile{max-width:390px;border-inline:1px solid var(--border);min-height:100vh}
.topnav{display:flex;align-items:center;gap:1.5rem;padding:.8rem 1.75rem;background:var(--surface);border-bottom:1px solid var(--hairline)}
.topnav .logo{display:flex;align-items:center;gap:.55rem;font-weight:700;color:var(--primary)}
.topnav .logo i{width:1.6rem;height:1.6rem;border-radius:50%;background:var(--primary);display:inline-block}
.topnav nav{display:flex;gap:1.1rem;font-size:.88rem;color:var(--text-muted)}
.topnav nav span:first-child{color:var(--text);font-weight:600}
.mobile .topnav nav{display:none}
.page{padding:1.5rem 1.75rem 3rem;margin-inline:auto}
.page.compact{max-width:1180px}
.mobile .page{padding:1rem}

.hero{position:relative;overflow:hidden;border-radius:1rem;background:var(--hero-grad);color:#fff;padding:1.4rem 2rem;margin-bottom:1.5rem;display:flex;justify-content:space-between;gap:1rem}
.hero small{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.hero h1{font-size:1.45rem;font-weight:600;margin:.25rem 0 .5rem;letter-spacing:-.01em}
.hero .strip{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;font-size:.75rem;opacity:.9}
.hero .chip{background:rgba(255,255,255,.1);border-radius:99px;padding:.2rem .65rem}
.hero .crest{width:4.5rem;height:4.5rem;border-radius:50%;background:rgba(255,255,255,.12);box-shadow:0 0 0 1px rgba(255,255,255,.2);flex-shrink:0;align-self:center}
.mobile .hero{padding:1rem}.mobile .hero .crest{width:2.75rem;height:2.75rem;align-self:flex-start}

.strap{display:flex;align-items:center;justify-content:space-between;margin-bottom:.875rem;gap:1rem}
.strap h2{font-size:1.1rem;font-weight:600;letter-spacing:-.01em}
.linkbtn{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;font-weight:500;color:var(--primary);border-radius:6px;padding:.2rem .3rem}
.linkbtn:hover{text-decoration:underline}

/* ---------- edit banner ---------- */
.editbar{display:none;align-items:center;gap:.75rem 1rem;flex-wrap:wrap;margin-bottom:.875rem;padding:.7rem 1rem;border:1px solid var(--border);border-radius:.85rem;background:var(--surface)}
.editing .editbar{display:flex}
.editbar p{font-size:.82rem;color:var(--text-muted);flex:1;min-width:14rem}
.editbar p b{color:var(--text);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:99px;overflow:hidden;font-size:.78rem}
.seg button{padding:.32rem .8rem;color:var(--text-muted)}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--on-primary);font-weight:600}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:.35rem;border-radius:99px;padding:.42rem 1rem;font-size:.82rem;font-weight:500}
.pill.primary{background:var(--primary);color:var(--on-primary)}
.pill.primary:hover{background:var(--primary-hover)}
.pill.outline{border:1px solid var(--border);background:var(--surface)}
.toggle{display:inline-flex;align-items:center;gap:.45rem;font-size:.8rem;color:var(--text-muted)}
.toggle input{accent-color:var(--primary);width:1rem;height:1rem}

/* ---------- the grid ---------- */
.layout{display:flex;gap:1rem;align-items:flex-start}
.board{flex:1;min-width:0;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:var(--row);gap:var(--gap);position:relative}
.hole{border:1.5px dashed var(--border-strong);border-radius:1rem;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:.78rem;gap:.35rem}
.hole.warn{border-color:var(--accent);color:var(--accent);background:color-mix(in oklab,var(--accent) 5%,transparent)}
.board:not(.editing-board) .hole.warn{background:repeating-linear-gradient(45deg,transparent 0 8px,color-mix(in oklab,var(--accent) 7%,transparent) 8px 16px)}

.w{position:relative;background:var(--surface);border:1px solid var(--hairline);border-radius:1rem;padding:1rem 1.15rem;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;transition:box-shadow .2s,transform .2s}
.w:hover{box-shadow:0 6px 18px rgba(13,40,69,.08)}
.w.grown{outline:1.5px dashed color-mix(in oklab,var(--success) 70%,transparent);outline-offset:-1.5px}
.wh{display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:1.4rem}
.wl{font-size:.82rem;font-weight:500;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa{font-size:.75rem;font-weight:500;color:var(--primary);white-space:nowrap;display:inline-flex;gap:.2rem;align-items:center;border-radius:4px}
.wa:hover{text-decoration:underline}
.wa .chev{display:inline-block}
[dir=rtl] .wa .chev{transform:scaleX(-1)}
.big{font-size:2.15rem;font-weight:700;letter-spacing:-.02em;line-height:1;margin-top:.55rem;font-variant-numeric:tabular-nums}
.big small{font-size:.8rem;font-weight:500;color:var(--text-muted);letter-spacing:0;margin-inline-start:.35rem}
.sub{font-size:.76rem;color:var(--text-muted);margin-top:auto;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.dot{width:.42rem;height:.42rem;border-radius:50%;display:inline-block;flex-shrink:0}
.ok{color:var(--success)}.warnc{color:var(--warning)}.bad{color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:.25rem;border-radius:99px;padding:.1rem .5rem;font-size:.7rem;font-weight:600;white-space:nowrap}
.tag.warn{background:var(--warning-soft);color:var(--warning)}
.tag.bad{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--success-soft);color:var(--success)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.neutral{background:var(--surface-tinted);color:var(--text-muted)}
.cnt{font-size:.72rem;font-weight:600;background:var(--surface-tinted);color:var(--text-muted);border-radius:99px;padding:.05rem .5rem;margin-inline-start:.35rem}

.segbar{display:flex;height:.42rem;border-radius:99px;overflow:hidden;background:var(--surface-tinted);margin-top:.75rem;gap:2px}
.segbar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:.35rem .9rem;margin-top:.6rem;font-size:.74rem;color:var(--text-muted)}
.legend a{display:inline-flex;align-items:center;gap:.35rem;border-radius:4px}
.legend a:hover{color:var(--text)}
.legend b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

.split{display:flex;gap:1.25rem;align-items:flex-end;margin-top:.4rem}
.split > div{display:flex;flex-direction:column}
.split .k{font-size:.72rem;color:var(--text-muted)}

.rows{list-style:none;margin-top:.5rem;display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
.rows li a{display:flex;align-items:center;gap:.6rem;padding:.38rem .35rem;border-radius:.5rem;font-size:.8rem;min-width:0}
.rows li a:hover{background:var(--surface-tinted)}
.rows .av{width:1.75rem;height:1.75rem;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:600;flex-shrink:0;font-family:"IBM Plex Mono",monospace}
.rows .ic{width:1.75rem;height:1.75rem;border-radius:.45rem;background:var(--surface-tinted);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.8rem}
.rows .t{flex:1;min-width:0;display:flex;flex-direction:column}
.rows .t span:first-child{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .t span:last-child{font-size:.7rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .m{font-size:.7rem;color:var(--text-muted);white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:.15rem}
.more{font-size:.74rem;color:var(--primary);font-weight:500;padding-top:.35rem;border-top:1px solid var(--hairline);display:flex;justify-content:space-between}
.more:hover{text-decoration:underline}

.qa{display:grid;gap:.6rem;flex:1;margin-top:.55rem;min-height:0}
.qa a{display:flex;flex-direction:column;justify-content:space-between;border-radius:.8rem;background:var(--surface-raised);border:1px solid var(--hairline);padding:.6rem .7rem;font-size:.8rem;font-weight:500;min-height:0}
.qa a:hover{border-color:var(--border-strong);background:var(--surface-tinted)}
.qa a em{font-style:normal;font-size:1.3rem;line-height:1}
.pulse{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.5rem}
.pulse div{background:var(--surface-raised);border-radius:.6rem;padding:.45rem .6rem}
.pulse b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.pulse span{font-size:.7rem;color:var(--text-muted)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem .9rem;margin-top:.55rem;font-size:.76rem;color:var(--text-muted)}
.chips a{display:inline-flex;align-items:center;gap:.35rem;border-radius:4px}
.chips a:hover{color:var(--text);text-decoration:underline}
.chips b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin-top:.55rem}
.tiles a{background:var(--surface-raised);border-radius:.6rem;padding:.4rem .55rem;font-size:.7rem;color:var(--text-muted)}
.tiles a b{display:block;font-size:1.05rem;color:var(--text)}
.tiles a:hover{background:var(--surface-tinted)}

/* edit affordances */
.wtools{display:none}
.editing .w{cursor:grab;border-color:var(--border-strong)}
.w{container-type:inline-size}
.editing .w .wtools{display:flex;position:absolute;inset-inline:0;top:0;height:2.6rem;padding:0 .45rem;gap:.3rem;align-items:center;justify-content:space-between;background:var(--surface-raised);border-bottom:1px solid var(--hairline);z-index:2}
.editing .w .wbody{opacity:.55;pointer-events:none}
.wtools .grip{font-size:.85rem;color:var(--text-faint);padding:0 .2rem;letter-spacing:-.15em}
@container (max-width: 17rem){.wtools .nm,.wtools .grip{display:none}.wtools{justify-content:flex-end}}
[dir=rtl] .wtools [data-move]{transform:scaleX(-1)}
.wtools .sz{display:inline-flex;border:1px solid var(--border);border-radius:99px;overflow:hidden}
.wtools .sz button{font-size:.66rem;font-weight:600;padding:.12rem .42rem;color:var(--text-muted)}
.wtools .sz button[aria-pressed=true]{background:var(--primary);color:var(--on-primary)}
.wtools .sz button:disabled{opacity:.3;cursor:not-allowed}
.wtools .ib{width:1.4rem;height:1.4rem;border-radius:.4rem;display:inline-flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:.8rem}
.wtools .ib:hover{background:var(--surface-tinted);color:var(--text)}
.wtools .nm{font-size:.7rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:.2rem}
.w.dragover{box-shadow:0 0 0 2px var(--primary)}
.w.dragging{opacity:.4}
.wbody{display:flex;flex-direction:column;flex:1;min-height:0}

/* add-widgets drawer */
.drawer{display:none;width:19rem;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:1rem;padding:1rem;position:sticky;top:3.4rem;max-height:calc(100vh - 4.5rem);overflow:auto}
.editing .drawer{display:block}
.drawer h3{font-size:.95rem;font-weight:600}
.drawer > p{font-size:.74rem;color:var(--text-muted);margin:.25rem 0 .75rem}
.drawer h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin:.9rem 0 .4rem;font-weight:600}
.cat{display:flex;align-items:center;gap:.6rem;padding:.5rem .55rem;border:1px solid var(--hairline);border-radius:.7rem;margin-bottom:.4rem;background:var(--surface-raised)}
.cat .ci{flex:1;min-width:0}
.cat .ci b{display:block;font-size:.8rem;font-weight:600}
.cat .ci span{font-size:.7rem;color:var(--text-muted)}
.cat button{font-size:.72rem;font-weight:600;color:var(--primary);padding:.25rem .55rem;border-radius:99px;border:1px solid var(--border)}
.cat button:hover{background:var(--primary-soft)}
.cat.on{opacity:.55}
.cat.on button{color:var(--text-muted)}
.mobile .layout{flex-direction:column}.mobile .drawer{width:100%;position:static;max-height:none}

/* ---------- other tabs ---------- */
.tabpage{display:none}.tabpage.on{display:block}
.doc{max-width:1180px;margin:0 auto;padding:1.5rem 1.75rem 4rem}
.doc h2{font-size:1.25rem;font-weight:600;margin-bottom:.35rem}
.doc .lede{color:var(--text-muted);font-size:.88rem;margin-bottom:1.25rem;max-width:75ch}
table{width:100%;border-collapse:collapse;font-size:.8rem;background:var(--surface);border:1px solid var(--hairline);border-radius:.8rem;overflow:hidden}
th,td{text-align:start;padding:.55rem .7rem;border-bottom:1px solid var(--hairline);vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:600;background:var(--surface-raised)}
td code{font-family:"IBM Plex Mono",monospace;font-size:.72rem;background:var(--surface-tinted);padding:.05rem .3rem;border-radius:4px;word-break:break-all}
.catalog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:var(--row);gap:var(--gap);margin-bottom:.6rem}
.cathead{display:flex;align-items:baseline;gap:.75rem;margin:1.6rem 0 .6rem;flex-wrap:wrap}
.cathead h3{font-size:1rem;font-weight:600}
.cathead .to{font-size:.74rem;color:var(--text-muted)}
.critique{display:grid;grid-template-columns:22rem 1fr;gap:1.5rem;align-items:start}
.dims{display:grid;gap:.6rem}
.dim{background:var(--surface);border:1px solid var(--hairline);border-radius:.8rem;padding:.75rem .9rem;font-size:.8rem}
.dim header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.3rem}
.dim header b{font-size:.88rem}
.dim header span{font-size:.78rem;color:var(--text-muted)}
.dim p{color:var(--text-muted)}
.lists{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.25rem}
.lists section{background:var(--surface);border:1px solid var(--hairline);border-radius:.8rem;padding:.8rem 1rem;font-size:.8rem}
.lists h4{font-size:.85rem;margin-bottom:.4rem}
.lists li{margin-inline-start:1rem;margin-bottom:.3rem;color:var(--text-muted)}
.toast{position:fixed;bottom:1rem;inset-inline-start:50%;transform:translateX(-50%);background:#1c1f24;color:#fff;font-size:.78rem;padding:.55rem .9rem;border-radius:.6rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:90vw}
[dir=rtl] .toast{transform:translateX(50%)}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="review" data-od-id="review-bar">
  <b>Dashboard widgets v2 · proposal</b>
  <span class="grp" role="group" aria-label="Tab">
    <button data-tab="dash" aria-pressed="true">Dashboard</button>

    <button data-tab="critique" aria-pressed="false">Critique</button>
  </span>
  <span class="sp"></span>
  <span class="grp" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="ar" aria-pressed="false">ع</button></span>
  <span class="grp" role="group" aria-label="Theme"><button data-theme-btn="light" aria-pressed="true">Light</button><button data-theme-btn="dark" aria-pressed="false">Dark</button></span>
  <span class="grp" role="group" aria-label="Viewport"><button data-vp="desk" aria-pressed="true">Desktop</button><button data-vp="mobile" aria-pressed="false">Phone</button></span>

<!-- ======================= DASHBOARD ======================= -->
<div class="tabpage on" id="tab-dash">
<div class="frame" id="frame">
  <div class="topnav" data-od-id="topnav"><span class="logo"><i></i>GSSG</span><nav><span data-t="navHome"></span><span data-t="navEmployees"></span><span data-t="navRecords"></span><span data-t="navLeaves"></span><span data-t="navLedger"></span></nav></div>
  <div class="page compact" id="page">
    <section class="hero" data-od-id="hero">
      <div><small data-t="greeting"></small><h1 data-t="welcome"></h1>

    <div class="layout">
      <div class="board" id="board" data-od-id="board"></div>
      <aside class="drawer" id="drawer" data-od-id="drawer" aria-label="Add widgets"></aside>
    </div>
  </div>
</div>
</div>

<div class="tabpage" id="tab-catalog"><div class="doc" id="catalogDoc"></div></div>

<div class="tabpage" id="tab-findings"><div class="doc" id="findingsDoc"></div></div>

<script>
/* ---------------- i18n ---------------- */
const I = {
en:{navHome:'Home',navEmployees:'Employees',navRecords:'Records',navLeaves:'Leaves',navLedger:'Ledger',
greeting:'Good morning',welcome:'Welcome back, Ahmed Saeed Al Ali',onLeaveChip:'on leave today',
myWidgets:'My widgets',customize:'Customize ✎',compact:'Compact',wide:'Wide',autofit:'Fill gaps automatically',

/* link helper: links are real routes the target pages read today (see Findings) */
const A=(to,label,cls='wa')=>`<a href="#" class="${cls}" data-to="${to}">${label}</a>`;
const go=label=>`${label} <span class="chev" aria-hidden="true">›</span>`;
const head=(label,to,count)=>`<div class="wh"><span class="wl">${label}${count!=null?`<span class="cnt">${count}</span>`:''}</span>${to?A(to,go(t('viewAll'))):''}</div>`;
const rowsFit=(h)=>h>=2?(h>=3?7:4):0;
function list(items,h,moreTo,total){
  const n=rowsFit(h);const shown=items.slice(0,n);const rest=(total??items.length)-shown.length;
  return `<ul class="rows">${shown.join('')}</ul>${rest>0?`<a href="#" class="more" data-to="${moreTo}"><span>+${rest} ${t('more')}</span><span class="chev">›</span></a>`:''}`;
}
const row=(to,lead,title,meta,right)=>`<li><a href="#" data-to="${to}">${lead}<span class="t"><span>${title}</span><span>${meta}</span></span>${right?`<span class="m">${right}</span>`:''}</a></li>`;

const SIZES={S:[1,1],M:[2,1],W:['full',1],L:[2,2],T:[1,2],XL:['full',2]};
const SIZE_LABEL={S:'S',M:'M',W:'W',L:'L',T:'T',XL:'XL'};
const DEFAULTS={
admin:[['approvals','L'],['my_documents','M'],['sent_approvals','S'],['inbox','S'],['mail','M'],['workforce','M'],['quick_actions','W'],['on_leave','L'],['returning','S'],['drafts','S'],['expiring','S'],['report_months','S']],
clerk:[['my_documents','L'],['inbox','M'],['sent_approvals','S'],['drafts','S'],['quick_actions','W'],['on_leave','M'],['returning','M'],['report_months','S'],['permits','L']],
};

const allowed=id=>!(preset==='clerk'&&W[id].clerkHidden);

/* ---------------- packer ----------------
   1. Drop anything the user cannot see BEFORE layout (no empty wrappers).
   2. First-fit dense placement on a fixed row height (no auto-rows-fr).
   3. Auto-fit: absorb leftover holes by growing a neighbour sideways, then down.
   Content adapts to the final box (tier), so growth never looks stretched. */
function cols(){return vp==='mobile'?2:(canvas==='wide'?6:4)}
function pack(list){
  const C=cols(), grid=[]; const free=(r,c,w,h)=>{for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++){if(x>=C||(grid[y]&&grid[y][x]))return false}return true};
  const mark=(it)=>{for(let y=it.r;y<it.r+it.h;y++){grid[y]=grid[y]||[];for(let x=it.c;x<it.c+it.w;x++)grid[y][x]=it}};
  const placed=[];
  for(const [id,size] of list){
    if(!allowed(id))continue;
    let [w,h]=SIZES[size]; w=w==='full'?C:Math.min(w,C);
    // Phone: anything wider than one column takes the full width, and a full-width strip gets a second row so its content still fits.
    if(vp==='mobile'&&w>1){w=C;if(size==='W')h=2}
    let done=false;
    for(let r=0;!done;r++)for(let c=0;c<=C-w&&!done;c++)if(free(r,c,w,h)){const it={id,size,r,c,w,h,grown:false};mark(it);placed.push(it);done=true}
  }
  const rowsUsed=Math.max(0,...placed.map(p=>p.r+p.h));
  const holes=()=>{const out=[];for(let r=0;r<rowsUsed;r++)for(let c=0;c<C;c++)if(!(grid[r]&&grid[r][c]))out.push([r,c]);return out};
  if(autofit){
    let changed=true,guard=0;
    while(changed&&guard++<50){changed=false;
      for(const [r,c] of holes()){
        if(grid[r]&&grid[r][c])continue;
        // inline-start neighbour grows toward the hole
        const left=grid[r]&&grid[r][c-1];
        if(left&&left.c+left.w===c&&left.r===r&&Array.from({length:left.h},(_,k)=>!(grid[r+k]&&grid[r+k][c])).every(Boolean)){
          for(let k=0;k<left.h;k++){grid[r+k]=grid[r+k]||[];grid[r+k][c]=left}left.w++;left.grown=true;changed=true;continue}
        // inline-end neighbour grows back toward the hole
        const right=grid[r]&&grid[r][c+1];
        if(right&&right.c===c+1&&right.r===r&&Array.from({length:right.h},(_,k)=>!(grid[r+k]&&grid[r+k][c])).every(Boolean)){
          for(let k=0;k<right.h;k++){grid[r+k]=grid[r+k]||[];grid[r+k][c]=right}right.c--;right.w++;right.grown=true;changed=true;continue}
        // widget above grows down when the full row strip under it is empty
        const up=grid[r-1]&&grid[r-1][c];
        if(up&&up.r+up.h===r&&Array.from({length:up.w},(_,k)=>!(grid[r]&&grid[r][up.c+k])).every(Boolean)){
          grid[r]=grid[r]||[];for(let k=0;k<up.w;k++)grid[r][up.c+k]=up;up.h++;up.grown=true;changed=true}
      }
    }
  }
  return {placed,holes:holes(),C};
}
function tierOf(w,h){return h>=2?(w>=2?'list':'tall'):(w>=2?'summary':'glance')}
