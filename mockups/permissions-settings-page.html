const users=[['OA','Omar Al Hashmi','عمر الهاشمي','operator',3],['SA','Sara Al Ahli','سارة الأهلي','operator',1],['KM','Khalid Al Mansouri','خالد المنصوري','manager',0],['FA','Fatima Al Shamsi','فاطمة الشامسي','manager',2],['RA','Rashid Al Dhaheri','راشد الظاهري','operator',0],['NA','Noura Al Mazrouei','نورة المزروعي','admin',0]];
let lang='en',variant=Number(new URLSearchParams(location.search).get('v'))||1,selected=0,q='',effects=new Map([['employees.view','deny'],['books.service.General Book','deny'],['books.category.2','deny']]),changes=new Map();const $=s=>document.querySelector(s),tr=()=>S[lang],txt=(en,ar)=>lang==='ar'?ar:en;const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const roleLabel=()=>lang==='ar'?`مسموح به حسب الدور: ${S.ar[users[selected][3]]}`:`Allowed by role: ${S.en[users[selected][3]]}`;const roleHas=id=>users[selected][3]==='admin'||users[selected][3]==='manager'||['employees.view','books.view','ledger.view','leaves.view','documents.generate','permits.view','timesheet.view','workforce.people.view'].includes(id);
function rail(){const T=tr();return `<div class="rail-group"><p>${T.personal}</p><button class="rail-link"><span class="dot"></span>${T.profile}</button><button class="rail-link"><span class="dot"></span>${T.signing}</button></div><div class="rail-group"><p>${T.operations}</p><button class="rail-link"><span class="dot"></span>${T.defaults}</button><button class="rail-link"><span class="dot"></span>${T.submitters}</button><button class="rail-link"><span class="dot"></span>${T.email}</button></div><div class="rail-group"><p>${T.administration}</p><button class="rail-link"><span class="dot"></span>${T.access}</button><button class="rail-link active"><span class="dot"></span>${T.permissionsPanel}</button><button class="rail-link"><span class="dot"></span>${T.system}</button></div>`}
function userStrip(){const T=tr();return `<div class="user-strip">${users.map((u,i)=>`<button class="user ${i===selected?'active':''}" data-user="${i}" ${u[3]==='admin'?'disabled title="'+T.admin+'"':''}><span class="avatar">${u[0]}</span><b>${txt(u[1],u[2])}</b><small>${u[3]==='admin'?`<span class="badge role">${T.adminRole}</span><span class="admin-note">${T.admin}</span>`:`<span class="badge role">${T[u[3]]}</span> ${u[4]?`<span class="badge deny">${u[4]} ${T.hidden}</span>`:''}`}</small></button>`).join('')}</div>`}
function tri(id,value='default',lock=false){const T=tr();return `<div class="tri">${['default','grant','deny'].map(x=>`<button ${lock?'disabled':''} data-effect="${id}" data-value="${x}" class="${value===x?'on-'+x:''}">${T[x]}</button>`).join('')}</div>`}
function group(id,label,rows,kind){const T=tr();const filtered=rows.filter(r=>(r.join(' ')+' '+id).toLowerCase().includes(q.toLowerCase()));if(q&&!filtered.length)return '';return `<section class="group" id="${id}"><header class="group-head"><button class="toggle" data-collapse="${id}" aria-expanded="true"><span>⌄</span><h3>${label}</h3><span class="count">${filtered.length}</span></button><div class="bulk"><button data-bulk="${id}" data-value="default">${T.default}</button><button data-bulk="${id}" data-value="grant">${T.grant}</button><button data-bulk="${id}" data-value="deny">${T.deny}</button></div></header><div class="rows">${filtered.map(r=>row(r,kind)).join('')}</div></section>`}
function row(r,kind){const T=tr();let id,label,ar,caption='',locked=false;if(kind==='page'){[id,label,ar,locked]=r;caption=locked==='always'?'':(roleHas(id)?roleLabel():T.notRole)}else if(kind==='service'){label=r[0];ar=r[1];id='books.service.'+label;caption=effects.get(id)==='deny'?T.consequence:T.allowedEveryone}else if(kind==='category'){id='books.category.'+r[0];label=r[1];ar=r[2];caption=effects.get(id)==='deny'?T.consequence:T.allowedEveryone}else{[,id,label,ar]=r;caption=roleHas(id)?roleLabel():T.notRole}const value=effects.get(id)||'default',pending=id==='employees.view'&&selected===0;return `<article class="row"><div class="row-main"><b>${esc(txt(label,ar))}</b><p>${caption}</p><div class="meta"><span class="cap">${esc(id)}</span>${locked==='always'?`<span class="locked"><span class="lock">LOCK</span>${T.always}</span>`:''}${value==='deny'?`<span class="badge deny">${T.hidden}</span>`:''}${pending?`<span class="badge pending">${T.request}</span><span class="request-actions"><button class="mini">${T.approve}</button><button class="mini refuse">${T.refuse}</button></span>`:''}</div></div>${tri(id,value,locked==='always')}</article>`}
function consoleView(){const T=tr(),actGroups=[['employees',T.employeesActions,caps.filter(c=>c[0]==='employees')],['leaves',T.leavesActions,caps.filter(c=>c[0]==='leaves')],['records-actions',T.recordsActions,caps.filter(c=>c[0]==='books')],['ledger',T.ledgerActions,caps.filter(c=>c[0]==='ledger')],['workforce',T.workforceActions,caps.filter(c=>c[0]==='workforce')],['administration',T.administration,caps.filter(c=>c[0]==='administration')]];return editorShell(`<div class="section-index" id="index">${[["pages",T.pages],["services",T.services],["categories",T.categories],...actGroups.map(x=>[x[0],x[1]])].map(x=>`<button data-scroll="${x[0]}">${x[1]}</button>`).join('')}</div><div class="groups">${group('pages',T.pages,pages,'page')}${group('services',T.services,services,'service')}${group('categories',T.categories,categories,'category')}${actGroups.map(x=>group(x[0],x[1],x[2],'cap')).join('')}</div>`) }
function editorShell(body){const T=tr(),u=users[selected],denies=u[4];return `<div class="page-head"><div><h1>${T.permissions}</h1><p>${T.permDesc}</p></div><span class="scope-note"><i></i>${T.apply}</span></div><section class="panel">${userStrip()}<div class="editor-head"><div><div class="editor-title"><span class="avatar">${u[0]}</span><div><h2>${txt(u[1],u[2])}</h2><p>${T[u[3]]} · ${52-denies} / 52 ${T.effective.toLowerCase()} · ${denies} ${T.hidden.toLowerCase()}</p></div></div></div><label class="search">⌕<input id="search" value="${q}" placeholder="${T.search}"></label></div>${body}</section>`}
function previewView(){const T=tr();const serviceTiles=[...services.slice(0,8),services.find(x=>x[0]==='General Book')];const tiles=[...pages.slice(0,8).map(x=>[x[0],txt(x[1],x[2])]),...serviceTiles.map(x=>['books.service.'+x[0],txt(x[0],x[1])]),...categories.slice(0,6).map(x=>['books.category.'+x[0],txt(x[1],x[2])])];const visible=tiles.filter(x=>effects.get(x[0])!=='deny'),pageIds=new Set(pages.map(p=>p[0]));return editorShell(`<div class="preview-layout"><div class="panel"><div class="group-head"><h3>${T.previewControls}</h3><span class="count">${tiles.length}</span></div><div class="tile-grid">${tiles.map(x=>`<button class="access-tile ${effects.get(x[0])==='deny'?'denied':''}" data-preview-effect="${x[0]}" ${x[0]==='dashboard'?'aria-disabled="true" title="'+T.always+'"':''}><b>${x[1]}</b><small>${x[0]==='dashboard'?T.always:(effects.get(x[0])==='deny'?T.hidden:(pageIds.has(x[0])?(roleHas(x[0])?T.inherited:T.notRole):T.allowedEveryone))}</small></button>`).join('')}</div></div><aside class="mini-app"><h3>${T.live}</h3><div class="mini-nav">${visible.filter(x=>pages.some(p=>p[0]===x[0])).slice(0,7).map(x=>`<span>${x[1]}</span>`).join('')}</div><div class="mini-service">${visible.filter(x=>x[0].startsWith('books.service')).slice(0,12).map(x=>`<span>${x[1]}</span>`).join('')}</div></aside></div><div class="groups">${group('actions',T.actions,caps.filter(c=>['books','ledger','workforce'].includes(c[0])),'cap')}</div>`) }
function reviewView(){const T=tr();const rows=[...pages.slice(1,10).map(x=>[x[0],txt(x[1],x[2])]),...services.slice(0,7).map(x=>['books.service.'+x[0],txt(x[0],x[1])]),...categories.slice(0,5).map(x=>['books.category.'+x[0],txt(x[1],x[2])])];return editorShell(`<div class="matrix-summary"><span class="badge role">49 ${T.grant}</span><span class="badge deny">3 ${T.deny}</span><span class="badge pending">1 ${T.request}</span></div><div class="matrix"><div class="matrix-row"><b>${T.effective}</b><span>${T.default}</span><span>${T.grant}</span><span>${T.deny}</span></div>${rows.map(r=>`<div class="matrix-row"><span>${r[1]}<small class="cap"> ${r[0]}</small></span>${['default','grant','deny'].map(x=>`<button data-matrix="${r[0]}" data-value="${x}" class="${(changes.get(r[0])||effects.get(r[0])||'default')===x?'selected':''}">${T[x]}</button>`).join('')}</div>`).join('')}<div class="change-tray"><div><b>${T.review(changes.size+3)}</b><button class="apply" data-toast="${T.reviewed}">${T.reviewed}</button></div><p>Employees: ${T.grant} → ${T.deny} · General Book: ${T.default} → ${T.deny} · Logistics: ${T.default} → ${T.deny}</p></div></div>`) }
function effectsView(){const T=tr();const e=(en,ar)=>txt(en,ar);return `<div class="page-head"><div><h1>${T.effects}</h1><p>${T.permDesc}</p></div></div><div class="story"><section class="panel story-step"><h2>1. ${T.pages}</h2><p>${e('Employees is denied. The navigation removes it, but a direct URL offers the existing request route.','تم رفض صفحة الموظفين. تختفي من التنقل، لكن يبقى الرابط المباشر مع طريق طلب الوصول.')}</p><div class="compare"><div class="sample"><small>${T.before}</small><div class="nav-sample"><span>${e('Dashboard','لوحة المعلومات')}</span><span>${e('Employees','الموظفون')}</span><span>${e('Records','السجلات')}</span><span>${e('Services','الخدمات')}</span></div></div><div class="sample"><small>${T.after}</small><div class="nav-sample"><span>${e('Dashboard','لوحة المعلومات')}</span><span>${e('Records','السجلات')}</span><span>${e('Services','الخدمات')}</span></div></div></div></section><section class="panel story-step"><h2>2. /employees</h2><p>${e('Blocked URLs keep their address and use the established access-request card.','تحتفظ الروابط المحظورة بعنوانها وتستخدم بطاقة طلب الوصول المعتمدة.')}</p><div class="no-access"><div class="no-card"><span class="lock">LOCK</span><p>${T.noAccess}</p><button class="request">${T.requestAccess}</button></div></div></section><section class="panel story-step"><h2>3. ${T.services}</h2><p>${e('General Book is absent for Omar; the admin comparison retains a ghost of the original tile.','السجل العام غير ظاهر لعمر؛ وتُبقي مقارنة المسؤول أثر البطاقة الأصلية.')}</p><div class="compare"><div class="sample"><small>${T.before}</small><div class="mini-service"><span>${e('General Book','السجل العام')}</span><span>${e('Leave application','طلب إجازة')}</span></div></div><div class="sample"><small>${T.after}</small><div class="mini-service"><span class="ghost">${e('General Book','السجل العام')}</span><span>${e('Leave application','طلب إجازة')}</span></div></div></div></section><section class="panel story-step"><h2>4. ${T.categories}</h2><p>${e('Creation, form rail and filters agree; direct detail access gets a clear 403 state.','يتوافق الإنشاء وشريط النماذج والفلاتر؛ ويعرض الوصول المباشر حالة 403 واضحة.')}</p><div class="filters"><span>${e('Employee Staff','شؤون الموظفين')}</span><span class="ghost">${e('Logistics','اللوجستيك')}</span><span>${e('Training','التدريب')}</span></div><div class="record403">${T.recordDenied}</div></section><section class="panel story-step"><h2>5. ${T.dashboard}</h2><p>${e('Quick actions and their editor both omit General Book, preventing a dead launch point.','تحذف الإجراءات السريعة ومحررها السجل العام معًا لمنع نقطة تشغيل معطلة.')}</p><div class="quick"><span>${e('Leave application','طلب إجازة')}</span><span>${e('Material request','طلب مواد')}</span><span>${e('Report','تقرير')}</span></div></section></div>`}
function dashView(){const T=tr();return `<div class="page-head"><div><h1>${T.personalDash}</h1><p>${T.onlyYou}</p></div><span class="scope-note"><i></i>${T.scope}</span></div><section class="dashboards"><article class="panel dashboard"><h3>Noura Al Mazrouei</h3><p>${T.adminRole} · copied from the former shared layout</p><div class="dash-widgets"><div class="widget dark">Pending records</div><div class="widget">Workspace</div><div class="widget">Approvals</div><div class="widget">Expiry</div></div><div class="quick"><span>General Book</span><span>Salary transfer</span><span>Report</span></div></article><article class="panel dashboard"><h3>Omar Al Hashmi</h3><p>${T.operator} · arranged a personal starting layout</p><div class="dash-widgets"><div class="widget dark">My tasks</div><div class="widget">Leave balance</div><div class="widget">Attendance</div><div class="widget">Recent records</div></div><div class="quick"><span>Leave application</span><span>Material request</span><span>Report</span></div></article></section><section class="panel dashboard-editor"><h2>Edit my quick actions</h2><p>${T.onlyYou}</p>${['Leave Application Form','General Book','Material Request Form','Report'].filter(x=>x!=='General Book').map((x,i)=>`<div class="choice"><span>${x}</span><span class="switch ${x==='General Book'?'off':''}"></span></div>`).join('')}<button class="request" data-toast="${T.saved}" style="margin-top:12px">Save my layout</button></section>`}
function render(){document.documentElement.lang=lang;document.documentElement.dir=tr().dir;$('#rail').innerHTML=rail();document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr()[e.dataset.t]);document.querySelector('.settings-rail').style.display=variant===5?'none':'';document.querySelector('.shell').style.gridTemplateColumns=variant===5?'1fr':'';$('#variants').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.v)===variant));$('.langs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));$('#content').innerHTML=[consoleView,previewView,reviewView,effectsView,dashView][variant-1]();document.querySelector(`[data-v="${variant}"]`)?.scrollIntoView({block:'nearest',inline:'center'});bind()}
function tell(msg){const e=$('#toast');e.querySelector('span').textContent=msg;e.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.remove('show'),1800)}
function bind(){document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.user);effects=new Map(selected===0?[['employees.view','deny'],['books.service.General Book','deny'],['books.category.2','deny']]:selected===1?[['books.category.2','deny']]:selected===3?[['employees.view','deny'],['books.category.2','deny']]:[]);render()});$('#search')?.addEventListener('input',e=>{q=e.target.value;render()});document.querySelectorAll('[data-effect]').forEach(b=>b.onclick=()=>{effects.set(b.dataset.effect,b.dataset.value);tell(tr().apply);render()});document.querySelectorAll('[data-preview-effect]').forEach(b=>b.onclick=()=>{const id=b.dataset.previewEffect;if(id==='dashboard')return;effects.set(id,effects.get(id)==='deny'?'default':'deny');render()});document.querySelectorAll('[data-matrix]').forEach(b=>b.onclick=()=>{changes.set(b.dataset.matrix,b.dataset.value);render()});document.querySelectorAll('[data-collapse]').forEach(b=>b.onclick=()=>{const g=$('#'+b.dataset.collapse);g.classList.toggle('closed');b.setAttribute('aria-expanded',!g.classList.contains('closed'))});document.querySelectorAll('[data-scroll]').forEach(b=>b.onclick=()=>$('#'+b.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'}));document.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>tell(b.dataset.toast))}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{variant=Number(b.dataset.v);history.replaceState(null,'','?v='+variant);render()});document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});render();
