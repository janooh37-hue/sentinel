<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BioTime subpage under Employees — 5 approaches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Tokens copied verbatim from frontend/src/index.css :root so every variant
     is judged in the real palette, not an invented one. */
  :root{
    --font-sans:"Inter",ui-sans-serif,system-ui,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
    --bg:#f5f4f1; --surface:#fff; --surface-raised:#fafaf6; --surface-tinted:#f0eee8;
    --primary:#0d2845; --primary-hover:#1d3a5e; --primary-soft:#e8edf3;
    --accent:#c8102e; --accent-soft:#fbe5e8;
    --success:#047857; --success-soft:#d6f0e4;
    --warning:#92400e; --warning-soft:#fbedd8;
    --info:#1d4ed8; --info-soft:#e0e8f8;
    --destructive:#dc2626; --smart:#6b4fb0; --smart-soft:#f1eef8;
    --text:#1c1f24; --text-muted:#5a6068; --text-faint:#8b9098;
    --border:#e6e4dd; --border-strong:#d4d1c8; --hairline:#efece5;
    --hero-grad:linear-gradient(135deg,#0a1f3a 0%,#0d2845 50%,#1d3a5e 100%);
    --rail:#16243a; --rail-2:#1d3150; --rail-3:#243c5f; --rail-text:#c5d2e4;
    --rail-faint:#7e93b3; --rail-line:#2c405f; --rail-success:#34d399; --rail-warning:#fbbf24;
    /* Shift identity — invented for these mockups only. */
    --sh-morning:#1d4ed8; --sh-noon:#b45309; --sh-night:#4c1d95; --sh-office:#0f766e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  a{color:inherit;text-decoration:none}

  /* ---------- variant caption ---------- */
  .vcap{background:var(--rail);color:#fff;padding:16px 32px;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
  .vcap .num{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;
    background:var(--accent);font-weight:800;font-size:15px}
  .vcap h2{font-size:16px;font-weight:800;letter-spacing:-0.01em}
  .vcap p{margin-top:3px;font-size:12.5px;color:var(--rail-text);max-width:96ch;line-height:1.55}
  .vcap .route{margin-top:7px;font-family:var(--font-mono);font-size:11px;color:var(--rail-warning)}
  .vcap .tags{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap;max-width:340px}
  .vcap .tags span{border:1px solid var(--rail-line);border-radius:99px;padding:3px 9px;font-size:10.5px;
    color:var(--rail-text);white-space:nowrap}

  /* ---------- app chrome (replica of TopNav.tsx) ---------- */
  .app{border-top:1px solid var(--border)}
  .topnav{display:flex;flex-wrap:nowrap;align-items:center;gap:28px;border-bottom:1px solid var(--border);
    background:var(--surface);padding:14px 32px}
  .topnav .brand{display:flex;align-items:center;gap:28px}
  .topnav .logo{width:40px;height:40px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px var(--border)}
  .topnav .bcopy{font-size:18px;font-weight:700;line-height:1.15;letter-spacing:-0.01em;color:var(--primary)}
  .topnav .bcopy small{display:block;margin-top:2px;font-size:11.5px;font-weight:400;letter-spacing:.08em;color:var(--text-muted)}
  .topnav nav{display:flex;gap:4px;margin-inline-start:20px;font-size:15px}
  .topnav nav a{position:relative;padding:8px 14px;border-radius:8px;font-weight:500}
  .topnav nav a.on{font-weight:600;color:var(--primary)}
  .topnav nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:3px;border-radius:3px;background:var(--primary)}
  .topnav .utils{margin-inline-start:auto;display:flex;align-items:center;gap:14px;color:var(--text-muted);font-size:13px}
  .topnav .aa{display:inline-flex;align-items:center;gap:8px;border-radius:99px;background:var(--surface-tinted);padding:6px 12px}
  .topnav .aa i{width:88px;height:4px;border-radius:99px;background:var(--border-strong);display:block}
  .topnav .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:grid;
    place-items:center;font-size:12px;font-weight:700}

  /* section band + subnav */
  .band{background:var(--hero-grad);color:#fff;padding:20px 32px 0;position:relative;overflow:hidden}
  .band .deco{position:absolute;top:-120px;right:-70px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.045)}
  .band .inner{position:relative;max-width:1400px;margin:0 auto}
  .band .crumb{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;opacity:.62}
  .band h1{margin-top:7px;font-size:24px;font-weight:700;letter-spacing:-0.01em}
  .band .sub{margin-top:4px;font-size:13px;opacity:.76}
  .band .subnav{margin-top:16px;display:flex;gap:4px}
  .band .subnav a{padding:10px 16px;border-radius:10px 10px 0 0;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.72)}
  .band .subnav a.on{background:var(--bg);color:var(--primary)}
  .band .right{position:absolute;top:0;right:0;display:flex;gap:8px;align-items:center}
  .band .gpill{border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:6px 13px;font-size:12px;color:#fff}
  .band .gpill.solid{background:var(--accent);border-color:transparent;font-weight:700}

  .page{max-width:1400px;margin:0 auto;padding:22px 32px 44px}
  .card{background:var(--surface);border:1px solid var(--hairline);border-radius:16px}
  .card>header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--hairline)}
  .card>header h3{font-size:13.5px;font-weight:700}
  .card>header .hint{margin-inline-start:auto;font-size:11.5px;color:var(--text-faint)}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}

  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:600}
  .chip.morning{background:#e0e8f8;color:var(--sh-morning)}
  .chip.noon{background:#fbedd8;color:var(--sh-noon)}
  .chip.night{background:#ece7fa;color:var(--sh-night)}
  .chip.office{background:#d8f0ec;color:var(--sh-office)}
  .chip.ok{background:var(--success-soft);color:var(--success)}
  .chip.late{background:var(--warning-soft);color:var(--warning)}
  .chip.bad{background:var(--accent-soft);color:var(--accent)}
  .chip.info{background:var(--info-soft);color:var(--info)}
  .chip.mut{background:var(--surface-tinted);color:var(--text-muted)}
  .chip.smart{background:var(--smart-soft);color:var(--smart)}

  .dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
  .dot.ok{background:var(--success)} .dot.late{background:#b45309}
  .dot.bad{background:var(--accent)} .dot.mut{background:var(--text-faint)}
  .dot.leave{background:var(--info)}

  .stale{background:repeating-linear-gradient(45deg,var(--surface-tinted) 0 6px,transparent 6px 12px)}
  .btn{border:1px solid var(--border);border-radius:10px;padding:7px 13px;font-size:12.5px;font-weight:600;
    background:var(--surface);color:var(--primary)}
  .btn.p{background:var(--primary);color:#fff;border-color:transparent}
  .btn.a{background:var(--accent);color:#fff;border-color:transparent}
  .btn.s{padding:5px 10px;font-size:11.5px}

  table{width:100%;border-collapse:collapse}
  th{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);
    text-align:left;padding:9px 12px;border-bottom:1px solid var(--border)}
  td{padding:10px 12px;border-bottom:1px solid var(--hairline);font-size:13px;vertical-align:middle}
  tbody tr:hover{background:var(--surface-raised)}
  .nm{font-weight:600}
  .gid{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted)}

  /* freshness strip */
  .fresh{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--hairline);
    background:var(--surface);border-radius:14px;padding:11px 15px;font-size:12.5px;color:var(--text-muted)}
  .fresh .src{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--primary);font-size:13px}
  .fresh .live{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px var(--success-soft)}
  .fresh b{color:var(--text)}

  /* stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .tile{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;padding:14px 16px}
  .tile .v{margin-top:6px;font-size:28px;font-weight:800;letter-spacing:-0.02em;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .tile .d{margin-top:3px;font-size:11.5px;color:var(--text-faint)}
  .tile.warn .v{color:var(--warning)} .tile.bad .v{color:var(--accent)} .tile.good .v{color:var(--success)}

  /* ---- V1 ---- */
  .v1{display:grid;grid-template-columns:236px minmax(0,1fr);gap:18px;margin-top:14px}
  .rail{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;padding:14px}
  .rail h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin:14px 0 8px}
  .rail h4:first-child{margin-top:0}
  .rail .opt{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;color:var(--text-muted)}
  .rail .box{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border-strong)}
  .rail .box.on{background:var(--primary);border-color:var(--primary)}
  .rail .seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:12px}
  .rail .seg span{flex:1;text-align:center;padding:6px 0;color:var(--text-muted)}
  .rail .seg span.on{background:var(--primary-soft);color:var(--primary);font-weight:700}
  .raw{background:var(--surface-raised);border-top:1px dashed var(--border-strong)}
  .raw td{border-bottom:1px solid var(--hairline)}
  .punch{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);
    border-radius:10px;padding:5px 9px;margin:0 6px 6px 0;font-size:12px}
  .punch .t{font-family:var(--font-mono);font-weight:700}
  .punch .d{color:var(--text-faint);font-size:11px}
  .deriv{margin-top:8px;font-size:12px;color:var(--text-muted);line-height:1.6}
  .deriv code{font-family:var(--font-mono);font-size:11.5px;background:var(--surface-tinted);padding:1px 5px;border-radius:5px}

  /* ---- V2 ---- */
  .cycle{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
  .cyc{background:var(--surface);border:1px solid var(--hairline);border-radius:14px;padding:11px 13px}
  .cyc.today{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .cyc .d{font-size:12px;font-weight:700}
  .cyc .d span{color:var(--text-faint);font-weight:500}
  .cyc .row{display:flex;align-items:center;justify-content:space-between;margin-top:7px;font-size:11.5px;color:var(--text-muted)}
  .cyc .row b{font-family:var(--font-mono)}
  .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}
  .col{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;overflow:hidden}
  .col>.h{padding:13px 15px;border-bottom:1px solid var(--hairline)}
  .col>.h .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .col>.h .win{margin-top:4px;font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted)}
  .col.run{border-color:var(--sh-noon)}
  .col.run>.h{background:#fdf6ec}
  .meter{margin-top:10px;height:8px;border-radius:99px;background:var(--surface-tinted);overflow:hidden;display:flex}
  .meter i{display:block;height:100%}
  .meter i.ok{background:var(--success)} .meter i.late{background:#b45309} .meter i.bad{background:var(--accent)}
  .meter+.mlab{margin-top:6px;display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint)}
  .people{padding:10px 12px;display:grid;gap:6px}
  .pers{display:flex;align-items:center;gap:9px;border-radius:10px;padding:6px 8px;background:var(--surface-raised);font-size:12.5px}
  .pers .t{margin-inline-start:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted)}
  .pers.miss{background:var(--accent-soft)}
  .pers.late{background:var(--warning-soft)}
  .offduty{margin-top:14px;background:var(--surface);border:1px solid var(--hairline);border-radius:16px;padding:14px 16px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-muted)}

  /* ---- V3 ---- */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chips button{border-radius:99px;padding:8px 16px;font-size:12.5px;font-weight:600;border:1px solid var(--border);
    background:var(--surface);color:var(--text-muted)}
  .chips button.on{background:var(--primary);color:#fff;border-color:transparent}
  .v3{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px}
  .idc{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;padding:16px}
  .idc .who{display:flex;gap:12px;align-items:center}
  .idc .ph{width:52px;height:52px;border-radius:14px;background:var(--primary);color:#fff;display:grid;place-items:center;
    font-weight:800;font-size:17px}
  .idc dl{margin-top:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;font-size:12.5px}
  .idc dt{color:var(--text-faint)} .idc dd{font-weight:600;text-align:right}
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
  .cal{margin-top:14px}
  .cal .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:12px}
  .cal .hd{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);text-align:center;padding-bottom:2px}
  .cel{border:1px solid var(--hairline);border-radius:10px;padding:6px 7px;min-height:60px;background:var(--surface-raised)}
  .cel .n{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted)}
  .cel .s{margin-top:4px;font-size:10.5px;font-weight:700}
  .cel.off{background:transparent;border-style:dashed;color:var(--text-faint)}
  .cel.ok{background:var(--success-soft);border-color:#bfe5d4}
  .cel.late{background:var(--warning-soft);border-color:#f0dcbd}
  .cel.bad{background:var(--accent-soft);border-color:#f3ccd3}
  .cel.leave{background:var(--info-soft);border-color:#ccdaf3}
  .cel.sel{outline:2px solid var(--primary);outline-offset:1px}
  .cel.void{border:0;background:none}
  .tlwrap{padding:6px 52px 0}
  .tl{position:relative;height:104px}
  .tl .axis{position:absolute;left:0;right:0;top:52px;height:12px;border-radius:99px;background:var(--surface-tinted)}
  .tl .sched{position:absolute;top:52px;height:12px;border-radius:99px;background:#dbe4f7}
  .tl .grace{position:absolute;top:52px;height:12px;background:repeating-linear-gradient(45deg,#f0dcbd 0 4px,transparent 4px 8px)}
  .tl .span{position:absolute;top:56px;height:4px;border-radius:99px;background:var(--success)}
  .tl .mk{position:absolute;top:0;width:96px;margin-inline-start:-48px;text-align:center}
  .tl .mk i{display:block;width:2px;height:20px;margin:0 auto;background:var(--primary)}
  .tl .mk b{display:block;font-family:var(--font-mono);font-size:11px;font-weight:700}
  .tl .mk s{display:block;text-decoration:none;font-size:10px;color:var(--text-faint);margin-bottom:3px}
  .tl .tick{position:absolute;top:70px;width:70px;margin-inline-start:-35px;text-align:center;
    font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}
  .tl .tick::before{content:"";display:block;width:1px;height:6px;margin:0 auto 3px;background:var(--border-strong)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 14px 14px;font-size:11.5px;color:var(--text-muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:12px;height:12px;border-radius:4px;display:block}

  /* ---- V4 ---- */
  .ops{background:var(--rail);border-radius:18px;padding:18px;color:#fff;margin-top:14px}
  .ops .head{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
  .ops .clock{font-family:var(--font-mono);font-size:52px;font-weight:700;letter-spacing:-0.02em;line-height:1}
  .ops .clock small{font-size:16px;color:var(--rail-faint)}
  .ops .kv{display:flex;gap:26px;margin-inline-start:auto;flex-wrap:wrap}
  .ops .kv div{text-align:right}
  .ops .kv .v{font-family:var(--font-mono);font-size:26px;font-weight:700}
  .ops .kv .l{font-size:11px;color:var(--rail-faint);letter-spacing:.08em;text-transform:uppercase}
  .ops .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 320px;gap:14px;margin-top:18px;align-items:start}
  .term{background:var(--rail-2);border:1px solid var(--rail-line);border-radius:14px;overflow:hidden}
  .term .h{padding:12px 14px;border-bottom:1px solid var(--rail-line);display:flex;align-items:center;gap:9px}
  .term .h b{font-size:13px}
  .term .h .sn{font-family:var(--font-mono);font-size:10.5px;color:var(--rail-faint);margin-inline-start:auto}
  .term .evs{padding:10px 14px;display:grid;gap:8px}
  .term .evs div{display:flex;align-items:center;gap:10px;font-size:12.5px}
  .term .evs .t{font-family:var(--font-mono);font-weight:700;color:#fff}
  .term .evs .g{font-family:var(--font-mono);font-size:11px;color:var(--rail-faint);margin-inline-start:auto}
  .term .evs .n{color:var(--rail-text)}
  .term .f{padding:9px 14px;border-top:1px solid var(--rail-line);font-size:11px;color:var(--rail-faint)}
  .unacc{background:#2a1620;border:1px solid #5c2733;border-radius:14px;overflow:hidden}
  .unacc .h{padding:12px 14px;border-bottom:1px solid #5c2733;font-size:13px;font-weight:700;color:#ffb3bf}
  .unacc .r{padding:10px 14px;border-bottom:1px solid rgba(92,39,51,.6);font-size:12.5px}
  .unacc .r .top{display:flex;align-items:center;gap:8px}
  .unacc .r .m{margin-inline-start:auto;font-family:var(--font-mono);font-weight:700;color:#ff8fa0}
  .unacc .r .sub{margin-top:3px;font-size:11px;color:var(--rail-faint)}
  .ops .note{margin-top:14px;font-size:11.5px;color:var(--rail-faint)}
  .ticker{margin-top:14px;display:flex;gap:8px;overflow:hidden;align-items:center}
  .ticker .tk{flex:none;background:var(--rail-3);border:1px solid var(--rail-line);border-radius:99px;padding:5px 12px;
    font-size:11.5px;color:var(--rail-text)}
  .ticker .tk b{font-family:var(--font-mono);color:var(--rail-success)}

  /* ---- V5 ---- */
  .rings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
  .ring{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center}
  .ring .g{flex:none;position:relative;width:64px;height:64px}
  .ring .g svg{transform:rotate(-90deg)}
  .ring .g b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-mono);font-size:14px;font-weight:700}
  .ring .m .l{font-size:12px;font-weight:700}
  .ring .m .s{margin-top:3px;font-size:11.5px;color:var(--text-faint);line-height:1.5}
  .trend{display:flex;align-items:flex-end;gap:8px;height:132px;padding:16px 16px 10px}
  .trend .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
  .trend .b i{display:block;border-radius:2px}
  .trend .b i.l{background:#d8a860} .trend .b i.a{background:var(--accent)} .trend .b i.s{background:var(--smart)}
  .trend .b span{text-align:center;font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);margin-top:5px;
    padding-top:4px;border-top:1px solid var(--border)}
  .v5{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;margin-top:14px}
  .ev{border:1px solid var(--hairline);border-radius:12px;padding:11px 13px;background:var(--surface-raised);font-size:12px;
    color:var(--text-muted);line-height:1.6}
  .ev b{color:var(--text);font-family:var(--font-mono)}
  .hrow{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--hairline);font-size:12.5px}
  .hrow:last-child{border-bottom:0}
  .hrow .k{color:var(--text-muted)} .hrow .v{margin-inline-start:auto;font-family:var(--font-mono);font-weight:700}
  .mapr{display:flex;align-items:center;gap:10px;padding:10px 15px;border-bottom:1px solid var(--hairline);font-size:12.5px}
  .mapr:last-child{border-bottom:0}
  .mapr .btn{margin-inline-start:auto}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ------------------------------------------------------------------ *
 * Static data. Every field name mirrors something that actually
 * exists: BioTime rows expose punch_time / terminal_alias /
 * terminal_sn / area_alias / punch_state (always 255 on this build,
 * i.e. no in/out direction), and Sentinel derives shift, grace,
 * lateness and exceptions on top of them.
 * ------------------------------------------------------------------ */
const TODAY = { iso: '2026-08-19', label: 'Wed 19 Aug 2026', now: '14:07' };

const SHIFTS = {
  morning: { key: 'morning', name: 'Morning', win: '05:00 – 13:00', short: 'M' },
  noon:    { key: 'noon',    name: 'Noon',    win: '13:00 – 21:00', short: 'N' },
  night:   { key: 'night',   name: 'Night',   win: '21:00 – 05:00', short: 'L' },
  office:  { key: 'office',  name: 'Office',  win: '07:00 – 15:00', short: 'O' },
};

const DEVICES = [
  { alias: 'Main Gate Turnstile', sn: 'CGT2-0192837', area: 'Main Gate' },
  { alias: 'Admin Block Reader',  sn: 'CGT2-0192901', area: 'Admin Block' },
  { alias: 'Workshop Reader',     sn: 'CGT2-0193045', area: 'Workshop' },
];

// crew: rotation crew 1..5, or 'office' with group A/B for the Friday split.
const PEOPLE = [
  { id: 'G-1042', name: 'Ahmed Ali Al Ali',            post: 'Main Gate · Post 1',  crew: 2, bt: '1042' },
  { id: 'G-1155', name: 'Mohammed Saeed Al Mazrouei',  post: 'Main Gate · Post 2',  crew: 2, bt: '1155' },
  { id: 'G-1301', name: 'Salem Obaid Al Ameri',        post: 'Workshop Gate',       crew: 2, bt: '1301' },
  { id: 'G-1344', name: 'Faisal Hamad Al Dhaheri',     post: 'Control Room',        crew: 2, bt: '1344' },
  { id: 'G-1207', name: 'Yousef Ibrahim Khalfan',      post: 'Perimeter Patrol',    crew: 3, bt: '1207' },
  { id: 'G-1288', name: 'Khalid Rashid Al Nuaimi',     post: 'Admin Block Desk',    crew: 3, bt: '1288' },
  { id: 'G-1402', name: 'Rashed Ali Al Shamsi',        post: 'Main Gate · Post 3',  crew: 3, bt: null  },
  { id: 'G-1466', name: 'Omar Juma Al Balushi',        post: 'Store Yard',          crew: 3, bt: '1466' },
  { id: 'G-1510', name: 'Hassan Abdullah Al Marri',    post: 'Admin · Registry',    crew: 'office', group: 'A', bt: '1510' },
  { id: 'G-1533', name: 'Tariq Nasser Al Kaabi',       post: 'Admin · Personnel',   crew: 'office', group: 'B', bt: '1533' },
];
const byId = (id) => PEOPLE.find((p) => p.id === id);
const initials = (n) => n.split(' ').filter(Boolean).slice(0, 2).map((w) => w[0]).join('');

/* Rotation: 5-day cycle, noon crew advances by day, and the crew that worked
   noon yesterday works BOTH morning and night today. Anchor: crew 2 on noon,
   18 Aug 2026. */
const noonCrew = (day) => ((((day - 18) % 5) + 5) % 5 + 1) % 5 + 1;
const dayCrews = (day) => ({ noon: noonCrew(day), morning: noonCrew(day - 1), night: noonCrew(day - 1) });

/* Today's derived day-rows (what Sentinel computes from the punch stream). */
const ROWS = [
  { id: 'G-1042', shift: 'morning', first: '04:52', last: '13:06', span: '8h 14m', late: 0,  state: 'ok',
    dev: 'Main Gate Turnstile', punches: ['04:52', '08:31', '13:06'], flags: [] },
  { id: 'G-1155', shift: 'morning', first: '05:41', last: '13:02', span: '7h 21m', late: 11, state: 'late',
    dev: 'Main Gate Turnstile', punches: ['05:41', '13:02'], flags: ['late'] },
  { id: 'G-1301', shift: 'morning', first: '06:14', last: null,    span: '—',      late: 44, state: 'bad',
    dev: 'Workshop Reader', punches: ['06:14'], flags: ['late', 'single_punch'] },
  { id: 'G-1344', shift: 'morning', first: null,   last: null,     span: '—',      late: null, state: 'bad',
    dev: null, punches: [], flags: ['no_punch'] },
  { id: 'G-1207', shift: 'noon',    first: '12:47', last: null,    span: 'open',   late: 0,  state: 'ok',
    dev: 'Main Gate Turnstile', punches: ['12:47'], flags: ['open_shift'] },
  { id: 'G-1288', shift: 'noon',    first: '13:22', last: null,    span: 'open',   late: 0,  state: 'ok',
    dev: 'Admin Block Reader', punches: ['13:22'], flags: ['open_shift'] },
  { id: 'G-1402', shift: 'noon',    first: '13:58', last: null,    span: 'open',   late: 28, state: 'late',
    dev: 'Main Gate Turnstile', punches: ['13:58'], flags: ['late', 'unmapped'] },
  { id: 'G-1466', shift: 'noon',    first: null,   last: null,     span: '—',      late: null, state: 'leave',
    dev: null, punches: [], flags: ['on_leave'] },
  { id: 'G-1510', shift: 'office',  first: '06:58', last: null,    span: 'open',   late: 0,  state: 'ok',
    dev: 'Admin Block Reader', punches: ['06:58', '11:12'], flags: [] },
  { id: 'G-1533', shift: 'office',  first: '07:36', last: null,    span: 'open',   late: 36, state: 'bad',
    dev: 'Admin Block Reader', punches: ['07:36'], flags: ['late', 'past_grace'] },
];
const FLAG_LABEL = {
  late: 'Late', single_punch: 'Single punch', no_punch: 'No punch', on_leave: 'On leave',
  unmapped: 'Unmapped person', open_shift: 'Shift running', past_grace: 'Past grace',
};
const FLAG_TONE = {
  late: 'late', single_punch: 'bad', no_punch: 'bad', on_leave: 'info',
  unmapped: 'smart', open_shift: 'mut', past_grace: 'bad',
};

const stateChip = (s) => ({ ok: 'ok', late: 'late', bad: 'bad', leave: 'info' }[s] || 'mut');
const stateWord = (s) => ({ ok: 'Verified', late: 'Late', bad: 'Exception', leave: 'On leave' }[s] || '—');

/* Month grid for the single-employee view (G-1042, crew 2). */
function monthCells(personCrew) {
  const cells = [];
  for (let d = 1; d <= 31; d += 1) {
    const c = dayCrews(d);
    const worked = [];
    if (c.morning === personCrew) worked.push('morning');
    if (c.noon === personCrew) worked.push('noon');
    if (c.night === personCrew) worked.push('night');
    cells.push({ day: d, worked });
  }
  // Deterministic exception sprinkling, so screenshots never move.
  const marks = { 4: 'late', 9: 'bad', 13: 'late', 18: 'ok', 19: 'sel', 24: 'leave', 28: 'leave', 29: 'leave' };
  return cells.map((c) => ({ ...c, mark: marks[c.day] || (c.worked.length ? 'ok' : 'off') }));
}

/* ------------------------------------------------------------------ *
 * Shared chrome
 * ------------------------------------------------------------------ */
function topnav() {
  const items = [['Dashboard', 0], ['Employees', 1], ['Records', 0], ['Leaves', 0], ['Ledger', 0]];
  return `
  <header class="topnav">
    <a class="brand">
      <img class="logo" src="gssg-logo.png" alt="GSSG">
      <div class="bcopy">GSSG<small>General Security Services Group</small></div>
    </a>
    <nav>${items.map(([l, on]) => `<a class="${on ? 'on' : ''}">${l}</a>`).join('')}</nav>
    <div class="utils">
      <span class="aa">A<i></i>A</span>
      <span>🌐 English</span><span>☀</span><span>⤓</span><span>✉</span><span>🔔</span><span>⚙</span>
      <span class="avatar">AA</span>
    </div>
  </header>`;
}

/** Section-level placement: a sibling tab of the employee directory. */
function sectionBand(activeTitle, sub, right) {
  const tabs = [['Directory', 0], ['Attendance', 1], ['Duty locations', 0]];
  return `
  <section class="band">
    <div class="deco"></div>
    <div class="inner">
      <div class="crumb">Operations · Employees</div>
      <h1>${activeTitle}</h1>
      <p class="sub">${sub}</p>
      <div class="right">${right || ''}</div>
      <div class="subnav">${tabs.map(([l, on]) => `<a class="${on ? 'on' : ''}">${l}</a>`).join('')}</div>
    </div>
  </section>`;
}

/** Employee-file placement: a new chip inside one employee's file. */
function fileBand(p) {
  return `
  <section class="band">
    <div class="deco"></div>
    <div class="inner">
      <div class="crumb">Employees · Employee file</div>
      <h1>${p.name}</h1>
      <p class="sub">${p.id} · ${p.post} · Crew ${p.crew}</p>
      <div class="right">
        <span class="gpill">Search another file ⌘K</span>
        <span class="gpill solid">Actions</span>
      </div>
      <div class="subnav"><a>Back to directory</a></div>
    </div>
  </section>`;
}

function freshStrip(extra) {
  return `
  <div class="fresh">
    <span class="src"><i class="live"></i>BioTime mirror</span>
    <span>read-only · JWT</span>
    <span>synced <b>2 min ago</b></span>
    <span>fresh through <b class="mono">19 Aug 14:20</b></span>
    <span>punches today <b class="mono">214</b></span>
    ${extra || ''}
    <button class="btn s" style="margin-inline-start:auto">Sync now</button>
    <button class="btn s">Integration</button>
  </div>`;
}

const tile = (label, value, detail, tone) =>
  `<div class="tile ${tone || ''}"><div class="lbl">${label}</div><div class="v">${value}</div><div class="d">${detail}</div></div>`;

/* ------------------------------------------------------------------ *
 * Variant 1 — Punch ledger (raw truth beside the derivation)
 * ------------------------------------------------------------------ */
function v1() {
  const row = (r) => {
    const p = byId(r.id);
    const sh = SHIFTS[r.shift];
    return `
    <tr>
      <td><div class="nm">${p.name}</div><div class="gid">${p.id}</div></td>
      <td>${p.crew === 'office' ? `<span class="chip office">Office ${p.group}</span>` : `<span class="chip mut">Crew ${p.crew}</span>`}</td>
      <td><span class="chip ${sh.key}">${sh.name}</span></td>
      <td class="mono" style="color:var(--text-muted)">${sh.win}</td>
      <td class="mono">${r.first ?? '—'}</td>
      <td class="mono">${r.last ?? '—'}</td>
      <td class="mono">${r.span}</td>
      <td class="mono" style="color:${r.late ? 'var(--warning)' : 'var(--text-faint)'}">${r.late == null ? '—' : r.late ? '+' + r.late + 'm' : '0'}</td>
      <td>${r.flags.length ? r.flags.map((f) => `<span class="chip ${FLAG_TONE[f]}">${FLAG_LABEL[f]}</span>`).join(' ') : `<span class="chip ok">Clean</span>`}</td>
      <td style="color:var(--text-muted)">${r.dev ?? '—'}</td>
    </tr>`;
  };
  const expanded = ROWS[2];
  const ep = byId(expanded.id);
  return `
  ${freshStrip()}
  <div class="tiles" style="margin-top:14px">
    ${tile('People seen', '38', 'of 41 expected today')}
    ${tile('Derived rows', '41', 'one per person · per shift')}
    ${tile('Exceptions', '6', '4 late · 1 single punch · 1 no punch', 'warn')}
    ${tile('Unmapped', '2', 'provider people with no G-number', 'bad')}
  </div>
  <div class="v1">
    <aside class="rail">
      <h4>Day</h4>
      <div class="seg"><span class="on">Today</span><span>Yesterday</span><span>Range</span></div>
      <h4>Shift</h4>
      <div class="opt"><i class="box on"></i>Morning 05:00–13:00</div>
      <div class="opt"><i class="box on"></i>Noon 13:00–21:00</div>
      <div class="opt"><i class="box on"></i>Night 21:00–05:00</div>
      <div class="opt"><i class="box on"></i>Office 07:00–15:00</div>
      <h4>Crew</h4>
      ${[1, 2, 3, 4, 5].map((c) => `<div class="opt"><i class="box ${c === 2 || c === 3 ? 'on' : ''}"></i>Crew ${c}${c === 2 ? ' · morning + night' : c === 3 ? ' · noon' : ' · off'}</div>`).join('')}
      <h4>Exception</h4>
      <div class="opt"><i class="box"></i>Late past grace</div>
      <div class="opt"><i class="box"></i>Single punch</div>
      <div class="opt"><i class="box"></i>No punch</div>
      <div class="opt"><i class="box"></i>Unmapped person</div>
      <h4>Device</h4>
      ${DEVICES.map((d) => `<div class="opt"><i class="box on"></i>${d.alias}</div>`).join('')}
    </aside>
    <div class="card">
      <header>
        <h3>Attendance day rows · ${TODAY.label}</h3>
        <span class="chip mut">10 of 41</span>
        <span class="hint">Click a row to see the provider punches it was derived from</span>
      </header>
      <table>
        <thead><tr><th>Employee</th><th>Crew</th><th>Shift</th><th>Window</th><th>First</th><th>Last</th><th>Span</th><th>Late</th><th>Flags</th><th>Device</th></tr></thead>
        <tbody>
          ${ROWS.slice(0, 2).map(row).join('')}
          ${row(expanded)}
          <tr class="raw"><td colspan="10">
            <div class="lbl">Provider punches · ${ep.name} · BioTime #${ep.bt}</div>
            <div style="margin-top:9px">
              ${expanded.punches.map((t) => `<span class="punch"><span class="t">${t}</span><span class="d">Workshop Reader · CGT2-0193045 · punch_state 255</span></span>`).join('')}
              <span class="punch stale"><span class="d">13:00 – 14:20 not yet imported</span></span>
            </div>
            <div class="deriv">
              Direction is unknown on this build — <code>punch_state = 255</code> for every row — so the single event is
              allocated by shift midpoint, not trusted as a check-in.<br>
              Morning window <code>05:00–13:00</code>, grace <code>30m</code> → arrival <code>06:14</code> is
              <b>44 minutes past grace</b>; one punch means present with a <b>single punch</b> flag rather than a computed span.
            </div>
            <div style="margin-top:11px;display:flex;gap:8px">
              <button class="btn p s">Add adjustment</button>
              <button class="btn s">Link to leave</button>
              <button class="btn s">Open employee file</button>
            </div>
          </td></tr>
          ${ROWS.slice(3).map(row).join('')}
        </tbody>
      </table>
      <div style="padding:12px 16px;font-size:11.5px;color:var(--text-faint)">
        Provider punches are never edited. Corrections are stored as adjustments against the derived row and keep the original visible.
      </div>
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ *
 * Variant 2 — Rotation board (schedule first)
 * ------------------------------------------------------------------ */
function v2() {
  const cyc = [18, 19, 20, 21, 22].map((d) => {
    const c = dayCrews(d);
    const names = { 18: 'Tue 18', 19: 'Wed 19', 20: 'Thu 20', 21: 'Fri 21', 22: 'Sat 22' };
    return `
    <div class="cyc ${d === 19 ? 'today' : ''}">
      <div class="d">${names[d]} <span>${d === 19 ? '· today' : ''}</span></div>
      <div class="row"><span><span class="chip morning">M</span> 05–13</span><b>Crew ${c.morning}</b></div>
      <div class="row"><span><span class="chip noon">N</span> 13–21</span><b>Crew ${c.noon}</b></div>
      <div class="row"><span><span class="chip night">L</span> 21–05</span><b>Crew ${c.night}</b></div>
    </div>`;
  }).join('');

  const column = (shiftKey, crewLabel, opts, present, scheduled, minimum, ids) => {
    const sh = SHIFTS[shiftKey];
    const pending = opts.pending === true;
    const rows = ids.map((id) => {
      const r = ROWS.find((x) => x.id === id);
      const p = byId(id);
      const short = p.name.split(' ').slice(0, 2).join(' ');
      if (pending) {
        return `<div class="pers"><i class="dot mut"></i><span>${short}</span><span class="t">due ${sh.win.slice(0, 5)}</span></div>`;
      }
      const cls = r.state === 'bad' ? 'miss' : r.state === 'late' ? 'late' : '';
      return `<div class="pers ${cls}">
        <i class="dot ${r.state === 'leave' ? 'leave' : r.state === 'ok' ? 'ok' : r.state === 'late' ? 'late' : 'bad'}"></i>
        <span>${short}</span>
        <span class="t">${r.first ?? (r.state === 'leave' ? 'leave' : 'no punch')}</span>
      </div>`;
    }).join('');
    const okW = Math.round((present.ok / scheduled) * 100);
    const lateW = Math.round((present.late / scheduled) * 100);
    const badW = 100 - okW - lateW;
    const meter = pending
      ? `<div class="meter stale"></div><div class="mlab"><span>not started · ${scheduled} scheduled</span><span>min ${minimum}</span></div>`
      : `<div class="meter"><i class="ok" style="width:${okW}%"></i><i class="late" style="width:${lateW}%"></i><i class="bad" style="width:${badW}%"></i></div>
         <div class="mlab"><span>${present.ok + present.late} verified of ${scheduled} scheduled</span><span>min ${minimum}</span></div>`;
    return `
    <div class="col ${opts.progress ? 'run' : ''}">
      <div class="h">
        <div class="top">
          <span class="chip ${sh.key}">${sh.name}</span>
          ${opts.progress
            ? `<span class="chip late">running · ${opts.progress}</span>`
            : pending
              ? `<span class="chip mut">starts in ${opts.startsIn}</span>`
              : `<span class="chip ok">closed</span>`}
        </div>
        <div class="win">${sh.win} · ${crewLabel}</div>
        ${meter}
      </div>
      <div class="people">${rows}</div>
    </div>`;
  };

  return `
  ${freshStrip('<span>rotation anchor <b class="mono">crew 2 · noon · 18 Aug</b></span>')}
  ${`<div class="cycle">${cyc}</div>`}
  <div class="board">
    ${column('morning', 'Crew 2', {}, { ok: 1, late: 1 }, 4, 3, ['G-1042', 'G-1155', 'G-1301', 'G-1344'])}
    ${column('noon', 'Crew 3', { progress: '1h 07m in' }, { ok: 2, late: 1 }, 4, 3, ['G-1207', 'G-1288', 'G-1402', 'G-1466'])}
    ${column('night', 'Crew 2', { pending: true, startsIn: '6h 53m' }, { ok: 0, late: 0 }, 4, 3, ['G-1042', 'G-1155', 'G-1301', 'G-1344'])}
    ${column('office', 'Group A + B', { progress: '7h 07m in' }, { ok: 1, late: 1 }, 2, 2, ['G-1510', 'G-1533'])}
  </div>
  <div class="offduty">
    <span class="lbl">Off cycle</span>
    <span class="chip mut">Crew 1 · day 3 of 3 off</span>
    <span class="chip mut">Crew 4 · day 1 of 3 off</span>
    <span class="chip mut">Crew 5 · day 2 of 3 off</span>
    <span style="margin-inline-start:auto">Crew 2 works morning <b>and</b> night today, then rests three days.</span>
    <button class="btn s">Override a shift</button>
    <button class="btn s">Swap two people</button>
  </div>
  <div class="card" style="margin-top:14px;padding:13px 16px;font-size:12px;color:var(--text-muted)">
    Night belongs to the day it starts on. A night row stays open until 05:00 tomorrow, so its verified count is provisional
    until the window closes — the meter shows it hatched rather than counting absences early.
  </div>`;
}

/* ------------------------------------------------------------------ *
 * Variant 3 — Employee timecard (single file, month grid)
 * ------------------------------------------------------------------ */
function v3() {
  const p = byId('G-1042');
  const cells = monthCells(2);
  const HD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  // 1 Aug 2026 is a Saturday → six leading blanks in a Sunday-first grid.
  const lead = Array.from({ length: 6 }, () => '<div class="cel void"></div>').join('');
  const cel = (c) => {
    const mark = c.mark === 'sel' ? 'late sel' : c.mark;
    const label = c.worked.length
      ? c.worked.map((w) => `<span class="chip ${w}" style="padding:1px 6px;font-size:10px">${SHIFTS[w].short}</span>`).join(' ')
      : '<span style="font-size:10.5px;color:var(--text-faint)">off</span>';
    return `<div class="cel ${mark}"><div class="n">${c.day}</div><div class="s">${label}</div></div>`;
  };
  // Axis spans 04:30 – 13:30 so a punch just outside the window still lands on it.
  const AX0 = 4 * 60 + 30, AXSPAN = 9 * 60;
  const pctAt = (hhmm) => {
    const [h, m] = hhmm.split(':').map(Number);
    return ((h * 60 + m - AX0) / AXSPAN) * 100;
  };
  const tlMark = (time, dev) => `<div class="mk" style="left:${pctAt(time).toFixed(2)}%"><b>${time}</b><s>${dev}</s><i></i></div>`;
  return `
  <div class="chips">
    ${['Profile', 'Documents', 'Leaves', 'Messages', 'Activity', 'Violations'].map((c) => `<button>${c}</button>`).join('')}
    <button class="on">Attendance <span style="opacity:.7">الحضور</span> <span style="opacity:.7">3</span></button>
  </div>
  <div class="v3">
    <div>
      <div class="idc">
        <div class="who">
          <div class="ph">${initials(p.name)}</div>
          <div>
            <div style="font-weight:700;font-size:14px">${p.name}</div>
            <div class="gid">${p.id}</div>
          </div>
        </div>
        <dl>
          <dt>Duty post</dt><dd>${p.post}</dd>
          <dt>Crew</dt><dd>Crew ${p.crew}</dd>
          <dt>Pattern</dt><dd>Noon → M + N → 3 off</dd>
          <dt>Provider</dt><dd>BioTime #${p.bt}</dd>
          <dt>Mapping</dt><dd><span class="chip ok">Matched by G-number</span></dd>
          <dt>Last punch</dt><dd class="mono">19 Aug 13:06</dd>
        </dl>
      </div>
      <div class="card" style="margin-top:14px">
        <header><h3>Open exceptions</h3><span class="hint">3</span></header>
        ${[['09 Aug', 'No punch', 'bad', 'Night 21:00 – 05:00'],
           ['13 Aug', 'Late 18m', 'late', 'Morning 05:00 – 13:00'],
           ['04 Aug', 'Single punch', 'bad', 'Noon 13:00 – 21:00']]
          .map(([d, f, tone, w]) => `
          <div class="mapr">
            <div><div style="font-weight:600">${d} · <span class="chip ${tone}">${f}</span></div>
              <div class="gid">${w}</div></div>
            <button class="btn s">Review</button>
          </div>`).join('')}
      </div>
    </div>
    <div>
      <div class="kpis">
        ${tile('Punctuality', '92%', '22 of 24 shifts on time', 'good')}
        ${tile('Late minutes', '46', 'August to date', 'warn')}
        ${tile('Missing punches', '3', '1 no punch · 2 single', 'bad')}
        ${tile('Shifts worked', '24', '18 of 24 double days')}

/* ------------------------------------------------------------------ *
 * Variant 5 — Exception triage + integration health
 * ------------------------------------------------------------------ */
function v5() {
  const ring = (pct, label, sub, color) => {
    const r = 26, c = 2 * Math.PI * r;
    return `
    <div class="ring">
      <div class="g">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--surface-tinted)" stroke-width="7"></circle>
          <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="${(c * pct / 100).toFixed(1)} ${c.toFixed(1)}"></circle>
        </svg>
        <b>${pct}%</b>
      </div>
      <div class="m"><div class="l">${label}</div><div class="s">${sub}</div></div>
    </div>`;
  };
  const bars = [3, 5, 2, 4, 6, 3, 2, 7, 4, 3, 5, 4, 6, 6].map((v, i) => {
    const late = v, abs = i % 4 === 1 ? 2 : i % 7 === 3 ? 1 : 0, single = i % 3 === 0 ? 2 : 1;
    const day = 6 + i;
    return `<div class="b">
      ${abs ? `<i class="a" style="height:${abs * 9}px"></i>` : ''}
      <i class="s" style="height:${single * 9}px"></i>
      <i class="l" style="height:${late * 9}px"></i>
      <span>${day}</span>
    </div>`;
  }).join('');
  const queue = [
    ['G-1344', 'Faisal Hamad Al Dhaheri', '19 Aug', 'no_punch', 'Morning 05:00–13:00', 'No punch anywhere in the window; the Workshop reader was live throughout, so absence is the honest reading.', 'Absent'],
    ['G-1301', 'Salem Obaid Al Ameri', '19 Aug', 'single_punch', 'Morning 05:00–13:00', 'One punch at 06:14, 44m past grace. Direction unknown, so it is placed by shift midpoint: present, late, no span.', 'Present · late 44m'],
    ['G-1533', 'Tariq Nasser Al Kaabi', '19 Aug', 'past_grace', 'Office 07:00–15:00', 'Arrived 07:36 against a 07:00 start and 30m grace.', 'Present · late 36m'],
    ['G-1466', 'Omar Juma Al Balushi', '19 Aug', 'on_leave', 'Noon 13:00–21:00', 'Annual leave approved 17–21 Aug in Sentinel, so the missing punches are excused automatically.', 'Excused · leave'],
  ].map(([id, name, day, flag, win, why, verdict]) => `
    <div style="padding:14px 16px;border-bottom:1px solid var(--hairline)">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div><div class="nm">${name}</div><div class="gid">${id} · ${day} · ${win}</div></div>
        <span class="chip ${FLAG_TONE[flag]}">${FLAG_LABEL[flag]}</span>
        <span class="chip mut">${verdict}</span>
        <div style="margin-inline-start:auto;display:flex;gap:8px">
          ${flag === 'on_leave' ? '<button class="btn s">Undo excuse</button>' : '<button class="btn p s">Accept</button><button class="btn s">Adjust</button><button class="btn s">Excuse</button>'}
        </div>
      </div>
      <div class="ev" style="margin-top:10px">${why}</div>
    </div>`).join('');
  return `
  ${freshStrip()}
  <div class="rings">
    ${ring(94, 'Attendance rate', 'verified against scheduled · 30 days', 'var(--success)')}
    ${ring(88, 'Punctuality', 'inside grace on arrival · 30 days', 'var(--info)')}
    ${ring(63, 'Punch pairing', '37% of days rely on a single punch', 'var(--warning)')}
    ${ring(99, 'Mirror freshness', 'windows imported without a gap', 'var(--primary)')}
  </div>
  <div class="v5">
    <div>
      <div class="card">
        <header><h3>Exception trend · last 14 days</h3>
          <span class="chip late">late</span><span class="chip smart">single punch</span><span class="chip bad">absent</span>
          <span class="hint">August</span>
        </header>
        <div class="trend">${bars}</div>
      </div>
      <div class="card" style="margin-top:14px">
        <header><h3>Triage queue</h3><span class="chip bad">6 open</span>
          <span class="hint">Evidence first, verdict second — an adjustment never rewrites a punch</span></header>
        ${queue}
      </div>
    </div>
    <div>
      <div class="card">
        <header><h3>Integration health</h3><span class="chip ok">OK</span></header>
        <div class="hrow"><span class="k">Provider</span><span class="v">BioTime · JWT</span></div>
        <div class="hrow"><span class="k">Last sync</span><span class="v">14:05</span></div>
        <div class="hrow"><span class="k">Fresh through</span><span class="v">14:20</span></div>
        <div class="hrow"><span class="k">Punches imported</span><span class="v">214</span></div>
        <div class="hrow"><span class="k">Failed evaluations</span><span class="v" style="color:var(--accent)">1</span></div>
        <div style="padding:12px 15px;display:flex;gap:8px">
          <button class="btn p s">Sync now</button><button class="btn s">Retry failed</button>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <header><h3>Unmapped provider people</h3><span class="chip smart">2</span></header>
        <div class="mapr"><div><div class="nm">AHMED A.</div><div class="gid">BioTime #2210 · first seen 12 Aug</div></div><button class="btn s">Map</button></div>
        <div class="mapr"><div><div class="nm">M. SAEED</div><div class="gid">BioTime #2244 · first seen 05 Aug</div></div><button class="btn s">Map</button></div>
        <div style="padding:12px 15px;font-size:11.5px;color:var(--text-faint)">
          Their punches are stored but excluded from every count until a G-number is attached, so coverage is never inflated
          by a stranger and never deflated by a missing match.
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <header><h3>Policy in force</h3><span class="hint">approved 12 Aug</span></header>
        <div class="hrow"><span class="k">Grace</span><span class="v">30m</span></div>
        <div class="hrow"><span class="k">Absent after</span><span class="v">grace</span></div>
        <div class="hrow"><span class="k">Single punch</span><span class="v">present + flag</span></div>
        <div class="hrow"><span class="k">Allocation</span><span class="v">shift midpoint</span></div>
      </div>
    </div>
  </div>`;
}
