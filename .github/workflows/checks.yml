name: checks

# pull_request runs on GitHub's merge ref, so a branch cut from a stale main is
# checked as it would land (migration/ADR number clashes included).
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels that PR's older run; each push to main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.6
      - name: Single Alembic head, unique ADR numbers
        run: python scripts/check_numbering.py
      - name: Claude Code skill pointers match .agents/skills
        run: python scripts/sync_claude_skills.py --check
      - name: ruff check
        run: ruff check --output-format github .
      # ponytail: main still has ~190 unformatted files, so only files the PR
      # touches are format-checked. Repo-wide once main gets a format commit.
      - name: ruff format (changed files)
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.py')
          if [ -n "$files" ]; then ruff format --check $files; fi

  # Whole backend suite, no paths filter: a required check must always report.
  # GSSG_DATA_DIR keeps app.config from creating a repo data/; no secrets, .env
  # or network are needed (the gateways are blocked by autouse fixtures).
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: pytest
        env:
          GSSG_DATA_DIR: ${{ runner.temp }}/gssg-data
        run: pytest -n auto
      - name: No repo data/ created
        run: test ! -e data

  # The deploy runs `tsc -b && vite build`; type-check here so a broken
  # frontend fails the PR instead of aborting `mng deploy`.
  frontend-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: tsc
        run: pnpm exec tsc -b --noEmit
