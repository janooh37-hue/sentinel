name: checks

# pull_request runs on GitHub's merge ref, so a branch cut from a stale main is
# checked as it would land (migration/ADR number clashes included).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.6
      - name: Single Alembic head, unique ADR numbers
        run: python scripts/check_numbering.py
      - name: ruff check
        run: ruff check --output-format github .
      # ponytail: main still has ~190 unformatted files, so only files the PR
      # touches are format-checked. Repo-wide once main gets a format commit.
      - name: ruff format (changed files)
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.py')
          if [ -n "$files" ]; then ruff format --check $files; fi
