name: checks

# pull_request runs on GitHub's merge ref, so a branch cut from a stale main is
# checked as it would land (migration/ADR number clashes included).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.6
      - name: Single Alembic head, unique ADR numbers
        run: python scripts/check_numbering.py
      - name: Claude Code skill pointers match .agents/skills
        run: python scripts/sync_claude_skills.py --check
      - name: ruff check
        run: ruff check --output-format github .
      # ponytail: main still has ~190 unformatted files, so only files the PR
      # touches are format-checked. Repo-wide once main gets a format commit.
      - name: ruff format (changed files)
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.py')
          if [ -n "$files" ]; then ruff format --check $files; fi

  # Alembic upgrade/downgrade round trips and head pins. A migration runs once
  # against the live database on `mng update`, so it is checked before merge,
  # on the merge ref. The full suite stays local (about 25 minutes, and a few
  # known failures on main); this is the ~1-minute slice that guards the schema.
  backend-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Migration tests
        run: python -m pytest -q -p no:cacheprovider -k migration

  # The deploy runs `tsc -b && vite build`; type-check here so a broken
  # frontend fails the PR instead of aborting `mng deploy`.
  frontend-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: tsc
        run: pnpm exec tsc -b --noEmit
