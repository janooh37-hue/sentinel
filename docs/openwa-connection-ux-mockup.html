<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenWA Connection UX — mockup</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --indigo:#4f46e5; --indigo-050:#eef2ff; --emerald:#059669; --emerald-050:#ecfdf5;
    --amber:#d97706; --amber-050:#fffbeb; --slate-050:#f8fafc; --red:#dc2626;
    --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap}
  h1{font-size:20px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 0}
  .toggle{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
  .toggle button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--muted)}
  .toggle button.on{background:var(--indigo);color:#fff}
  .grid{display:grid;grid-template-columns:1fr;gap:22px;margin-top:22px}
  .sectlabel{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .card .hd{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .card .hd .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--emerald-050);color:var(--emerald);font-size:18px}
  .card .hd h3{margin:0;font-size:15px}
  .card .hd .hint{font-size:12px;color:var(--muted);margin-top:1px}
  .card .bd{padding:18px}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 11px;line-height:1}
  .pill .dot{width:8px;height:8px;border-radius:50%}
  .pill.ok{background:var(--emerald-050);color:var(--emerald)} .pill.ok .dot{background:var(--emerald)}
  .pill.down{background:var(--amber-050);color:var(--amber)} .pill.down .dot{background:var(--amber)}
  .pill.off{background:var(--slate-050);color:var(--muted)} .pill.off .dot{background:#94a3b8}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13.5px;margin-top:14px}
  .kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
  .btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .btn.ghost{background:transparent}
  .btn.small{padding:6px 10px;font-size:12.5px}
  .muted{color:var(--muted);font-size:13px}
  /* connection states side-by-side */
  .states{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:820px){.states{grid-template-columns:1fr}}
  .state{border:1px solid var(--line);border-radius:12px;padding:14px}
  .state h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
  /* QR dialog */
  .dialog{max-width:420px;margin:0 auto}
  .qr{width:200px;height:200px;margin:6px auto 0;border-radius:12px;background:
      conic-gradient(#000 0 25%,#fff 0 50%,#000 0 75%,#fff 0) 0 0/20px 20px,
      repeating-linear-gradient(#000 0 6px,#fff 0 12px);
      border:8px solid #fff;box-shadow:inset 0 0 0 1px var(--line);position:relative}
  .qr::after{content:"";position:absolute;inset:38%;background:#fff;border:6px solid #000;border-radius:6px}
  .steps{counter-reset:s;margin:14px 0 0;padding:0;list-style:none;font-size:13.5px}
  .steps li{counter-increment:s;display:flex;gap:10px;padding:5px 0}
  .steps li::before{content:counter(s);flex:0 0 22px;height:22px;border-radius:50%;background:var(--indigo-050);color:var(--indigo);display:grid;place-items:center;font-size:12px;font-weight:700}
  .waiting{display:flex;gap:9px;align-items:center;justify-content:center;margin-top:14px;color:var(--muted);font-size:13px}
  .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--indigo);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* banner + send page */
  .banner{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:12px;background:var(--amber-050);border:1px solid #fde68a}
  .banner.off{background:var(--slate-050);border-color:var(--line)}
  .banner .bic{font-size:18px;line-height:1.2}
  .banner b{font-size:14px}
  .banner p{margin:2px 0 0;font-size:13px;color:#78716c}
  .banner .cta{margin-inline-start:auto;align-self:center}
  .grouplist{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .grouplist .empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:13.5px}
  .grouprow{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .grouprow:last-child{border-bottom:0}
  .grouprow input{width:16px;height:16px}
  .grouprow .nm{font-size:14px} .grouprow .mt{font-size:12px;color:var(--muted)}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
  .cap{font-size:12px;color:var(--muted);margin-top:6px}
  [dir=rtl] .banner .cta{margin-inline-start:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>WhatsApp Gateway — connection UX <span class="muted">(mockup)</span></h1>
      <p class="sub">Proposes the missing pieces: a live status card, an in‑app QR connect flow, and a real Send‑to‑Group empty/blocked state. Toggle EN/AR to check RTL.</p>
    </div>
    <div class="toggle">
      <button id="en" class="on" onclick="setDir('ltr','en')">English</button>
      <button id="ar" onclick="setDir('rtl','ar')">عربي</button>
    </div>
  </div>

  <!-- ============ STATUS CARD — 3 states ============ -->
  <div class="sectlabel" data-en="A · Settings › WhatsApp Gateway (status card)" data-ar="أ · الإعدادات › بوابة واتساب (بطاقة الحالة)"></div>
  <div class="states">
    <!-- CONNECTED -->
    <div class="state">
      <h4 data-en="Connected" data-ar="متصل"></h4>
      <div class="card">
        <div class="hd">
          <div class="ic">🟢</div>
          <div>
            <h3 data-en="WhatsApp Gateway" data-ar="بوابة واتساب"></h3>
            <div class="hint" data-en="OpenWA · session “gssg”" data-ar="OpenWA · جلسة «gssg»"></div>
          </div>
          <span class="pill ok" style="margin-inline-start:auto"><span class="dot"></span><span data-en="Connected" data-ar="متصل"></span></span>
        </div>
        <div class="bd">
          <dl class="kv">
            <dt data-en="Number" data-ar="الرقم"></dt><dd dir="ltr">+971 5X XXX 4488</dd>
            <dt data-en="Last checked" data-ar="آخر فحص"></dt><dd data-en="12s ago" data-ar="قبل 12 ثانية"></dd>
          </dl>
          <div class="row">
            <button class="btn small ghost" data-en="Refresh" data-ar="تحديث"></button>
            <button class="btn small ghost" data-en="Re‑scan QR" data-ar="إعادة مسح الرمز"></button>
          </div>
        </div>
      </div>
    </div>
    <!-- SESSION DOWN -->
    <div class="state">
      <h4 data-en="Session down" data-ar="الجلسة متوقفة"></h4>
      <div class="card">
        <div class="hd">
          <div class="ic" style="background:var(--amber-050);color:var(--amber)">🟠</div>
          <div>
            <h3 data-en="WhatsApp Gateway" data-ar="بوابة واتساب"></h3>
            <div class="hint" data-en="OpenWA · session “gssg”" data-ar="OpenWA · جلسة «gssg»"></div>
          </div>
          <span class="pill down" style="margin-inline-start:auto"><span class="dot"></span><span data-en="Session down" data-ar="متوقفة"></span></span>
        </div>
        <div class="bd">
          <p class="muted" data-en="The linked phone dropped its session. Messages fall back to SMS until you re‑scan the QR." data-ar="فقد الهاتف المرتبط الجلسة. سيتم الإرسال عبر SMS حتى تعيد مسح الرمز."></p>
          <div class="row">
            <button class="btn primary small" onclick="scrollToQR()" data-en="Re‑scan QR" data-ar="إعادة مسح الرمز"></button>
            <button class="btn small ghost" data-en="Refresh" data-ar="تحديث"></button>
          </div>
        </div>
      </div>
    </div>
    <!-- NOT CONFIGURED -->
    <div class="state">
      <h4 data-en="Not configured" data-ar="غير مُهيّأ"></h4>
      <div class="card">
        <div class="hd">
          <div class="ic" style="background:var(--slate-050);color:var(--muted)">○</div>
          <div>
            <h3 data-en="WhatsApp Gateway" data-ar="بوابة واتساب"></h3>
            <div class="hint" data-en="Not enabled" data-ar="غير مُفعّل"></div>
          </div>
          <span class="pill off" style="margin-inline-start:auto"><span class="dot"></span><span data-en="Off" data-ar="متوقف"></span></span>
        </div>
        <div class="bd">
          <p class="muted" data-en="OpenWA isn’t enabled on the server. An admin sets GSSG_OPENWA_ENABLED=1 and links the office number." data-ar="لم يتم تفعيل OpenWA على الخادم. يقوم المشرف بتعيين GSSG_OPENWA_ENABLED=1 وربط رقم المكتب."></p>
          <div class="row"><button class="btn small ghost" data-en="Setup guide" data-ar="دليل الإعداد"></button></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ QR CONNECT DIALOG ============ -->
  <div class="sectlabel" id="qrsect" data-en="B · Connect / Re‑scan (dialog)" data-ar="ب · الاتصال / إعادة المسح (نافذة)"></div>
  <div class="card dialog">
    <div class="hd">
      <div class="ic" style="background:var(--indigo-050);color:var(--indigo)">🔗</div>
      <div><h3 data-en="Link the office WhatsApp" data-ar="ربط واتساب المكتب"></h3>
        <div class="hint" data-en="One‑time, then it stays linked" data-ar="لمرة واحدة، ثم يبقى مرتبطًا"></div></div>
    </div>
    <div class="bd">
      <div class="qr" aria-hidden="true"></div>
      <ol class="steps">
        <li data-en="Open WhatsApp on the office phone" data-ar="افتح واتساب على هاتف المكتب"></li>
        <li data-en="Settings → Linked devices → Link a device" data-ar="الإعدادات → الأجهزة المرتبطة → ربط جهاز"></li>
        <li data-en="Scan this code" data-ar="امسح هذا الرمز"></li>
      </ol>
      <div class="waiting"><span class="spin"></span><span data-en="Waiting for scan…" data-ar="بانتظار المسح…"></span></div>
    </div>
  </div>

  <!-- ============ SEND-TO-GROUP: BLOCKED STATES ============ -->
  <div class="sectlabel" data-en="C · Send to Group — when the gateway isn’t ready" data-ar="ج · الإرسال إلى مجموعة — عندما لا تكون البوابة جاهزة"></div>
  <div class="card">
    <div class="hd">
      <div class="ic" style="background:var(--indigo-050);color:var(--indigo)">📣</div>
      <div><h3 data-en="Send to Group" data-ar="الإرسال إلى مجموعة"></h3>
        <div class="hint" data-en="Post a message or a book to your WhatsApp groups" data-ar="أرسل رسالة أو كتابًا إلى مجموعات واتساب"></div></div>
    </div>
    <div class="bd">
      <!-- down banner -->
      <div class="banner">
        <div class="bic">⚠️</div>
        <div>
          <b data-en="WhatsApp isn’t connected" data-ar="واتساب غير متصل"></b>
          <p data-en="Groups can’t load until the gateway session is up. Re‑scan the QR to reconnect." data-ar="لا يمكن تحميل المجموعات حتى تعمل جلسة البوابة. أعد مسح الرمز لإعادة الاتصال."></p>
        </div>
        <button class="btn primary small cta" data-en="Reconnect" data-ar="إعادة الاتصال"></button>
      </div>

      <div class="grouplist">
        <div class="empty" data-en="No groups to show — connect the gateway to load your WhatsApp groups." data-ar="لا توجد مجموعات — اتصل بالبوابة لتحميل مجموعات واتساب."></div>
      </div>
      <p class="cap" data-en="(Today the page shows only a bare empty list here — no reason, no way to act. This banner + reason is the fix.)" data-ar="(حاليًا تعرض الصفحة قائمة فارغة فقط هنا — بلا سبب ولا إجراء. هذه اللافتة والسبب هما الإصلاح.)"></p>

      <div class="sectlabel" style="margin-top:22px" data-en="…and when connected" data-ar="…وعند الاتصال"></div>
      <div class="grouplist">
        <label class="grouprow"><input type="checkbox" checked><span class="nm">السرية الأولى</span><span class="mt" style="margin-inline-start:auto">42 <span data-en="members" data-ar="عضو"></span></span></label>
        <label class="grouprow"><input type="checkbox"><span class="nm">الدوام الرسمي</span><span class="mt" style="margin-inline-start:auto">18 <span data-en="members" data-ar="عضو"></span></span></label>
        <label class="grouprow"><input type="checkbox"><span class="nm">دعم العمليات</span><span class="mt" style="margin-inline-start:auto">27 <span data-en="members" data-ar="عضو"></span></span></label>
      </div>
    </div>
  </div>

  <p class="note" data-en="Backend already exists: openwa_client.health() (status), the gateway’s /api/sessions/{s}/qr (QR) and list_groups(). This mockup only proposes surfacing them." data-ar="الواجهة الخلفية موجودة بالفعل: openwa_client.health()‎ (الحالة)، و /api/sessions/{s}/qr للرمز، و list_groups(). هذه النماذج تقترح فقط إظهارها."></p>
</div>

<script>
  function setDir(dir,lang){
    document.documentElement.dir=dir; document.documentElement.lang=lang;
    document.getElementById('en').classList.toggle('on',lang==='en');
    document.getElementById('ar').classList.toggle('on',lang==='ar');
    document.querySelectorAll('[data-en]').forEach(function(el){
      el.textContent = el.getAttribute('data-'+lang);
    });
  }
  function scrollToQR(){document.getElementById('qrsect').scrollIntoView({behavior:'smooth'});}
  setDir('ltr','en');
</script>
</body>
</html>
