<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GSSG Manager — Error screen concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f5f4f1; --surface: #ffffff; --surface-tinted: #f0eee8;
    --primary: #0d2845; --primary-hover: #1d3a5e; --accent: #c8102e;
    --text: #1c1f24; --text-muted: #5a6068; --text-faint: #8b9098;
    --border: #e6e4dd; --border-strong: #d4d1c8; --hairline: #efece5;
    --radius-sm: 8px;
    --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    display: flex; align-items: center; justify-content: center; padding: 40px 20px;
  }
  .stage { width: 100%; max-width: 470px; display: flex; flex-direction: column; align-items: center; text-align: center; }

  .scene { position: relative; width: 400px; height: 340px; margin-bottom: 14px; animation: scene-in 800ms var(--ease-out-expo) both; }
  @keyframes scene-in { from { opacity: 0; transform: scale(0.965); } to { opacity: 1; transform: scale(1); } }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .layer { will-change: transform; transition: transform 340ms var(--ease-out-expo); }

  /* one slow, small drift — floaty, calm */
  .astro { transform-box: fill-box; transform-origin: center; animation: float 12s ease-in-out infinite; }
  @keyframes float { 0% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-7px) rotate(0.6deg); } 100% { transform: translateY(0) rotate(0deg); } }
  /* the globe drifts slowly away + out of reach */
  .globe { transform-box: fill-box; transform-origin: center; animation: adrift 15s ease-in-out infinite; }
  @keyframes adrift { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(10px,-9px) rotate(4deg); } 100% { transform: translate(0,0) rotate(0deg); } }
  /* the two cable halves breathe apart — the connection slipping */
  .conn-male, .conn-female, .spark { transform-box: fill-box; transform-origin: center; }
  .conn-male { animation: pull-l 4.5s ease-in-out infinite; }
  .conn-female { animation: pull-r 4.5s ease-in-out infinite; }
  .spark { animation: spark-pulse 4.5s ease-in-out infinite; }
  @keyframes pull-l { 0%,100% { transform: translateX(-9px); } 50% { transform: translateX(-19px); } }
  @keyframes pull-r { 0%,100% { transform: translateX(9px); } 50% { transform: translateX(19px); } }
  @keyframes spark-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .tw { animation: tw 5s ease-in-out infinite; } .tw.b { animation-delay: 2s; }
  @keyframes tw { 0%,100% { opacity: 0.25; } 50% { opacity: 0.9; } }

  h1 { margin: 0; font-size: 25px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); animation: up 500ms var(--ease-out-expo) 140ms both; }
  .sub { margin: 10px 0 0; max-width: 344px; font-size: 15px; line-height: 1.5; color: var(--text-muted); animation: up 500ms var(--ease-out-expo) 210ms both; }
  .sub b { color: var(--text); font-weight: 600; }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .diag { margin-top: 22px; width: 100%; display: flex; align-items: flex-start; gap: 8px; padding: 11px 13px; background: var(--surface-tinted); border: 1px solid var(--hairline); border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 12px; line-height: 1.45; color: var(--text-muted); text-align: left; animation: up 500ms var(--ease-out-expo) 280ms both; }
  .diag .tag { flex: none; color: var(--accent); font-weight: 600; letter-spacing: 0.02em; }
  .diag code { word-break: break-word; }

  .actions { margin-top: 20px; display: flex; gap: 10px; animation: up 500ms var(--ease-out-expo) 350ms both; }
  .btn { font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 18px; border-radius: var(--radius-sm); cursor: pointer; transition: transform 120ms var(--ease-out-expo), background 140ms, box-shadow 140ms, border-color 140ms; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--primary); color: #fff; border: 1px solid var(--primary); box-shadow: 0 1px 2px rgba(10,31,58,0.18); }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); box-shadow: 0 4px 12px rgba(10,31,58,0.22); }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); }
  .btn-secondary:hover { background: var(--surface-tinted); border-color: var(--text-faint); }
  .btn.copied { color: #047857; border-color: #047857; background: #d6f0e4; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .foot { margin-top: 26px; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.02em; color: var(--text-faint); animation: up 500ms var(--ease-out-expo) 420ms both; }
  .foot .hint { display: block; margin-top: 5px; font-family: var(--font-sans); font-size: 12px; color: var(--text-faint); }

  @media (max-width: 440px) {
    .scene { width: 320px; height: 272px; }
    h1 { font-size: 22px; }
    .actions { width: 100%; flex-direction: column-reverse; }
    .btn { width: 100%; padding: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scene, h1, .sub, .diag, .actions, .foot, .astro, .globe, .tw, .conn-male, .conn-female, .spark { animation: none; }
    .layer { transition: none; }
  }
</style>
</head>
<body>
  <main class="stage" role="alert" aria-live="polite">

    <div class="scene" id="scene" aria-hidden="true">
      <svg id="svg" viewBox="-300 -255 600 510" role="img" aria-label="A cable pulled apart — the male and female connectors disconnected, showing the connection was lost">
        <defs>
          <linearGradient id="suit" x1="0.25" y1="0" x2="0.7" y2="1">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="52%" stop-color="#eaeef4"/><stop offset="100%" stop-color="#c2cad8"/>
          </linearGradient>
          <linearGradient id="limb" x1="0.1" y1="0" x2="0.95" y2="1">
            <stop offset="0%" stop-color="#f8fafc"/><stop offset="55%" stop-color="#e0e5ee"/><stop offset="100%" stop-color="#bcc4d3"/>
          </linearGradient>
          <radialGradient id="helmet" cx="34%" cy="26%" r="82%">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#edf0f5"/><stop offset="100%" stop-color="#c6cdd9"/>
          </radialGradient>
          <radialGradient id="visor" cx="40%" cy="30%" r="88%">
            <stop offset="0%" stop-color="#2b4f7b"/><stop offset="42%" stop-color="#132c4b"/><stop offset="100%" stop-color="#050f1d"/>
          </radialGradient>
          <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f2f4f7"/><stop offset="50%" stop-color="#d3d8e0"/><stop offset="100%" stop-color="#aab2c0"/>
          </linearGradient>
          <linearGradient id="pack" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#cdd3df"/><stop offset="100%" stop-color="#8f98ab"/>
          </linearGradient>
          <radialGradient id="globe" cx="36%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#4a90cc"/><stop offset="45%" stop-color="#2166a1"/><stop offset="100%" stop-color="#123a63"/>
          </radialGradient>
          <!-- flat-illustration suit palette -->
          <linearGradient id="fsuit" x1="0.2" y1="0" x2="0.5" y2="1">
            <stop offset="0%" stop-color="#fdfbf7"/><stop offset="100%" stop-color="#efe9dd"/>
          </linearGradient>
          <linearGradient id="fplum" x1="0.1" y1="0" x2="0.4" y2="1">
            <stop offset="0%" stop-color="#8a76a1"/><stop offset="100%" stop-color="#574569"/>
          </linearGradient>
          <linearGradient id="forange" x1="0.1" y1="0" x2="0.4" y2="1">
            <stop offset="0%" stop-color="#f6ac63"/><stop offset="100%" stop-color="#dd772a"/>
          </linearGradient>
          <radialGradient id="fhelmet" cx="38%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="60%" stop-color="#f4efe6"/><stop offset="100%" stop-color="#ddd5c6"/>
          </radialGradient>
          <radialGradient id="fvisor" cx="42%" cy="32%" r="82%">
            <stop offset="0%" stop-color="#5a4a6f"/><stop offset="45%" stop-color="#463758"/><stop offset="100%" stop-color="#2f2440"/>
          </radialGradient>
          <!-- bold-outline mascot palette -->
          <linearGradient id="csuit" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0%" stop-color="#f6f1e6"/><stop offset="100%" stop-color="#e6ddca"/>
          </linearGradient>
          <linearGradient id="cvisor" x1="0.2" y1="0.1" x2="0.8" y2="1">
            <stop offset="0%" stop-color="#3a3b58"/><stop offset="45%" stop-color="#22233c"/><stop offset="100%" stop-color="#14152a"/>
          </linearGradient>
          <!-- connector housing -->
          <linearGradient id="conn" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2a4e79"/><stop offset="100%" stop-color="#0d2845"/>
          </linearGradient>
          <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fbfcfd"/><stop offset="48%" stop-color="#dfe4ea"/><stop offset="100%" stop-color="#b3bcc9"/>
          </linearGradient>
          <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f4dca0"/><stop offset="55%" stop-color="#d9ad5b"/><stop offset="100%" stop-color="#a97d2f"/>
          </linearGradient>
          <filter id="blend" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
          <filter id="lift" x="-45%" y="-45%" width="190%" height="190%">
            <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#0a1f3a" flood-opacity="0.22"/>
          </filter>
          <filter id="softsh" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
          <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0a1f3a" flood-opacity="0.2"/>
          </filter>
        </defs>

        <!-- layered hole (4 rings) + inner stars, built procedurally -->
        <g id="hole" filter="url(#lift)"></g>
        <g class="layer" data-depth="0.25" id="stars"></g>

        <!-- NEAR: the disconnected cable — connection lost -->
        <g class="layer" data-depth="0.5">
          <g transform="translate(0 -8) scale(1.02)" stroke="#16233c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">

            <!-- ══════════ MALE PLUG (left half) ══════════ -->
            <g class="conn-male">
              <!-- cable -->
              <path d="M-168 52 Q -150 6 -96 3" fill="none" stroke="#16233c" stroke-width="21"/>
              <path d="M-168 52 Q -150 6 -96 3" fill="none" stroke="url(#conn)" stroke-width="14"/>
              <path d="M-166 46 Q -150 10 -100 6" fill="none" stroke="#4f77aa" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
              <!-- back grip -->
              <rect x="-98" y="-25" width="46" height="50" rx="14" fill="url(#steel)"/>
              <rect x="-93" y="-22" width="36" height="8" rx="4" fill="#ffffff" opacity="0.6" stroke="none"/>
              <g stroke="#8792a6" stroke-width="2.4" opacity="0.7">
                <path d="M-86 -14 L -86 14"/><path d="M-78 -14 L -78 14"/><path d="M-70 -14 L -70 14"/>
              </g>
              <!-- metallic collar -->
              <rect x="-54" y="-18" width="14" height="36" rx="5" fill="url(#brass)"/>
              <!-- barrel / nose -->
              <rect x="-42" y="-15" width="20" height="30" rx="6" fill="url(#steel)"/>
              <!-- two pins sticking out -->
              <rect x="-24" y="-12" width="24" height="7" rx="3.5" fill="url(#brass)"/>
              <rect x="-24" y="5" width="24" height="7" rx="3.5" fill="url(#brass)"/>
            </g>

            <!-- ══════════ FEMALE SOCKET (right half) ══════════ -->
            <g class="conn-female">
              <!-- cable -->
              <path d="M168 52 Q 150 6 96 3" fill="none" stroke="#16233c" stroke-width="21"/>
              <path d="M168 52 Q 150 6 96 3" fill="none" stroke="url(#conn)" stroke-width="14"/>
              <path d="M166 46 Q 150 10 100 6" fill="none" stroke="#4f77aa" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
              <!-- housing -->
              <rect x="52" y="-27" width="46" height="54" rx="15" fill="url(#steel)"/>
              <rect x="57" y="-24" width="36" height="8" rx="4" fill="#ffffff" opacity="0.6" stroke="none"/>
              <g stroke="#8792a6" stroke-width="2.4" opacity="0.7">
                <path d="M66 -15 L 66 15"/><path d="M74 -15 L 74 15"/><path d="M82 -15 L 82 15"/>
              </g>
              <!-- metallic collar -->
              <rect x="46" y="-20" width="12" height="40" rx="5" fill="url(#brass)"/>
              <!-- socket faceplate with two holes -->
              <rect x="28" y="-20" width="20" height="40" rx="7" fill="url(#steel)"/>
              <rect x="30" y="-16" width="6" height="32" rx="3" fill="#ffffff" opacity="0.5" stroke="none"/>
              <ellipse cx="37" cy="-8.5" rx="5" ry="5.5" fill="#0a1524" stroke="none"/>
              <ellipse cx="37" cy="8.5" rx="5" ry="5.5" fill="#0a1524" stroke="none"/>
            </g>

            <!-- ══════════ THE BREAK — red spark in the gap ══════════ -->
            <g class="spark">
              <path d="M14 -20 L 3 -2 L 12 -1 L 2 20 L 24 -3 L 14 -4 Z" fill="var(--accent)" stroke="none"/>
              <path d="M-2 -14 l-7 -5" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M-2 14 l-7 5" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M30 -15 l7 -5" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M30 15 l7 5" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round"/>
            </g>

          </g>
        </g>

        <!-- IN FRONT: the GSSG globe slipping out of reach -->
        <g class="layer" data-depth="0.62">
          <g class="globe" transform="translate(152 -128)">
            <!-- broken signal rings (echo the logo's radar rings) -->
            <g fill="none" stroke="var(--accent)" stroke-linecap="round">
              <circle cx="0" cy="0" r="39" stroke-width="3.4" stroke-dasharray="26 20" opacity="0.85"/>
              <circle cx="0" cy="0" r="47" stroke-width="2.4" stroke-dasharray="12 24" opacity="0.5"/>
              <circle cx="0" cy="0" r="33" stroke-width="1.8" stroke-dasharray="7 15" opacity="0.4"/>
            </g>
            <!-- sphere -->
            <circle cx="0" cy="0" r="30" fill="url(#globe)"/>
            <!-- continents (Africa / Europe / Mideast, as in the mark) -->
            <g fill="#eef1ee" opacity="0.92">
              <path d="M-6 -22 q10 -3 16 3 q3 6 -2 9 q4 6 0 12 q-3 8 -9 13 q-6 5 -9 -2 q-5 -8 -2 -16 q-4 -7 1 -14 q3 -6 6 -8z"/>
              <path d="M-16 -14 q5 -2 7 2 q-1 4 -6 4 q-4 -1 -1 -6z"/>
              <path d="M12 -14 q6 0 6 5 q-3 4 -7 1 q-3 -4 1 -6z"/>
            </g>
            <!-- meridian sheen + highlight -->
            <ellipse cx="-11" cy="-11" rx="10" ry="7" fill="#bfe0ff" opacity="0.35"/>
            <circle cx="0" cy="0" r="30" fill="none" stroke="#0d2845" stroke-width="1.4" opacity="0.5"/>
            <path d="M0 -30 a30 30 0 0 1 0 60" fill="none" stroke="#0d2845" stroke-width="1" opacity="0.18"/>
          </g>
        </g>
      </svg>
    </div>

    <h1>Something went wrong</h1>
    <p class="sub">This screen lost its connection. <b>Nothing you did is lost</b> — reload to reconnect and pick up where you left off.</p>

    <div class="diag">
      <span class="tag">ERR</span>
      <code id="err-msg">TypeError: Cannot read properties of undefined (reading 'status')</code>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" id="copy-btn" type="button">Copy diagnostic</button>
      <button class="btn btn-primary" id="reload-btn" type="button">Reload</button>
    </div>

    <div class="foot">
      GSSG Manager v2.14.0
      <span class="hint">If it keeps happening, send the diagnostic to the admin office.</span>
    </div>
  </main>

<script>
  const NS = 'http://www.w3.org/2000/svg';
  const el = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const mul = (s) => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const rnd = mul(20260701); const rr = (a, b) => a + (b - a) * rnd();

  function smooth(pts) {
    const n = pts.length; let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)} `;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += `C ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)} `;
    }
    return d + 'Z';
  }
  const R = [188, 150, 176, 150, 184, 148, 180, 152, 178, 150, 182, 150];
  const base = R.map((r, i) => { const a = i * 30 * Math.PI / 180; return [Math.cos(a) * r, Math.sin(a) * r]; });
  const blob = (scale, dy) => smooth(base.map(p => [p[0] * scale, p[1] * scale + dy]));

  const hole = document.getElementById('hole');
  hole.appendChild(el('path', { d: blob(1.12, 0), fill: '#eef2ec', filter: 'url(#blend)', opacity: '0.9' }));
  // exactly 4 rings, cream-edge → deep void
  const cols = ['#dcebe6', '#84c3c8', '#2f74a6', '#0b2038'];
  const scales = [1.0, 0.75, 0.52, 0.32];
  scales.forEach((s, i) => hole.appendChild(el('path', { d: blob(s, -i * 5), fill: cols[i] })));

  // a few subtle stars, inside the void only
  const stars = document.getElementById('stars');
  for (let i = 0; i < 16; i++) {
    const a = rnd() * Math.PI * 2, rad = Math.sqrt(rnd()) * 120;
    const x = Math.cos(a) * rad, y = Math.sin(a) * rad - 14;
    const c = el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: rr(0.8, 2).toFixed(1), fill: '#dfeaf9', opacity: rr(0.35, 0.85).toFixed(2) });
    if (i % 5 === 0) c.setAttribute('class', 'tw' + (i % 10 === 0 ? ' b' : ''));
    stars.appendChild(c);
  }

  // gentle pointer parallax
  const scene = document.getElementById('scene');
  const layers = [...scene.querySelectorAll('.layer')];
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    scene.addEventListener('pointermove', (e) => {
      const r = scene.getBoundingClientRect();
      const dx = (e.clientX - (r.left + r.width / 2)) / r.width, dy = (e.clientY - (r.top + r.height / 2)) / r.height;
      layers.forEach((l) => { const d = +l.dataset.depth || 0; l.style.transform = `translate(${(-dx * 12 * d).toFixed(1)}px, ${(-dy * 10 * d).toFixed(1)}px)`; });
    });
    scene.addEventListener('pointerleave', () => layers.forEach((l) => { l.style.transform = 'translate(0,0)'; }));
  }

  const copyBtn = document.getElementById('copy-btn'), original = copyBtn.textContent;
  copyBtn.addEventListener('click', async () => {
    const b = { version: 'v2.14.0', timestamp: new Date().toISOString(), browser: navigator.userAgent, error: document.getElementById('err-msg').textContent };
    try { await navigator.clipboard.writeText(JSON.stringify(b, null, 2)); } catch (e) {}
    copyBtn.textContent = 'Copied ✓'; copyBtn.classList.add('copied');
    setTimeout(() => { copyBtn.textContent = original; copyBtn.classList.remove('copied'); }, 1800);
  });
  document.getElementById('reload-btn').addEventListener('click', () => location.reload());
</script>
</body>
</html>
